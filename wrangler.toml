name = "chalk-talk-proxy"
main = "worker_entry.js"   # exports both the fetch handler and the Workflow class
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGINS = "https://tangjennii.github.io,https://tangjennii-wq.github.io,http://localhost:8000,http://127.0.0.1:8000"
DAILY_LIMIT_PER_IP = "10"
FREE_TALKS = "10"
FREE_IMAGES = "5"
MAX_MONTHLY_SPEND_USD = "250"

# Background (server-side) generation job store.
#
# ⚠ THE PREMISE OF THIS FEATURE IS WRONG (2026-07-29). This comment used to say the Paid plan buys "the
# longer ctx.waitUntil budget". There is no such thing. Cloudflare's limits page states three separate
# times that `waitUntil()` "can extend execution for up to 30 seconds after the response is sent or the
# client disconnects", with NO plan qualifier and no config lever:
#   https://developers.cloudflare.com/workers/platform/limits/
#
# What Paid actually raises is CPU time (30s default -> 5 min via `cpu_ms`). That is a DIFFERENT limit
# that happens to share the number 30. Chalk Talk's generation is almost entirely spent WAITING on
# Anthropic, which consumes no CPU time at all — so raising cpu_ms does nothing for this.
#
# Consequence: runGeneration() is handed to ctx.waitUntil after the job id is returned, and a 50–100s
# draft+critique can be terminated at ~30s. The job then stays at `running`/`critique` forever, never
# writes `done`, and never reaches its refund path — so the user loses a talk AND gets nothing.
# Independently confirmed by Codex, 2026-07-29. Tracked as the top item in RELEASE.md.
#
# Durable alternatives, from Cloudflare's own table: Workflows (unlimited wall time per step — the best
# semantic fit for a multi-step draft/review job), Queue consumers (15 min), Durable Object alarms
# (15 min). Until one is in place, JOBS_KV makes background generation *look* reliable rather than be it.
#
# To turn it on:
#   1) wrangler kv namespace create JOBS_KV
#   2) uncomment the block below and paste the printed id
#   3) wrangler deploy
# App falls back to synchronous generation whenever JOBS_KV is absent (Worker returns 503
# async_unconfigured), so this is safe to keep enabled.
[[kv_namespaces]]
binding = "JOBS_KV"
id = "3c522ea175134ad0aba27e96bdfce2c1"

# ── DURABLE BACKGROUND GENERATION (2026-07-29) ───────────────────────────────────────────────────────
# Replaces ctx.waitUntil(runGeneration(...)), which Cloudflare terminates ~30s after the response on
# EITHER plan while a draft+critique needs 50-100s. A Workflow gets unlimited wall time per step, keeps
# state between steps, and never re-buys the draft when the critique fails.
#
# The class is exported from worker_entry.js; the step logic lives in generation_workflow.js with no
# Cloudflare imports so it can be executed under Node. Requires compatibility_date >= 2024-10-22.
#
# Until this binding exists the Worker falls back to the legacy waitUntil path and reports
# durable:false on /generate-async, so which one ran is never a guess.
[[workflows]]
name = "chalk-talk-generation"
binding = "GEN_WORKFLOW"
class_name = "ChalkTalkGeneration"
