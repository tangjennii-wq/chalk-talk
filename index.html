function bindMain(){
  // ─── Compose form ───────────────────────────────────────────────────────
  var ta=document.getElementById("topicTA");if(ta)ta.oninput=function(e){
    S.topic=e.target.value;
    var gb2=document.getElementById("genBtn");
    if(gb2){
      var disabled=S.loading||!S.topic.trim();
      gb2.disabled=disabled;
      gb2.style.opacity=disabled?"0.4":"1";
      // Live label update: empty → "Enter a topic to generate"; populated → "Generate Chalk Talk"
      var spans=gb2.querySelectorAll("span");
      // spans[0] = ✨, spans[2] = → (we want the text node between them, which is the button's middle textNode)
      var nodes=Array.prototype.filter.call(gb2.childNodes,function(n){return n.nodeType===3});
      if(nodes.length){
        var _liveLabel = S.topic.trim()
          ? (S.style === "boards" ? "Generate Question" : "Generate Chalk Talk")
          : "Enter a topic to generate";
        nodes[0].nodeValue = S.loading ? "Generating…" : _liveLabel;
      }
    }
  };
  var bb=document.getElementById("browseBtn");if(bb)bb.onclick=function(){S.showLib=true;S.expCat=null;render()};
  // chatInput/chatSend handlers deleted — those IDs are no longer rendered. The
  // sendChat() function is still reachable via the reviseIn/reviseSend bindings below.
  document.querySelectorAll(".styleBtn").forEach(function(b){b.onclick=function(){if(S.style!==b.dataset.s){S.style=b.dataset.s;S.talk=null;S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;S.showAns=false;S.userPick="";S.error="";speechSynthesis.cancel()}render()}});
  // Un-gated 2026-07-03 (Jenni): Detailed is a first-class pre-generation choice now — the detailed
  // prompt is standalone (no dependency on a concise talk existing). Concise stays "recommended"
  // for speed, but users who know they want full depth shouldn't be blocked.
  // Generation provider toggle (Jenni 2026-07-03). Claude = free tier + BYOK; ChatGPT/Gemini = BYOK,
  // so switching to one without a key opens the key modal for it.
  var mpt=document.getElementById("modelPickerToggle");if(mpt)mpt.onclick=function(){S.modelPickerOpen=true;render();};
  document.querySelectorAll(".genProvBtn").forEach(function(b){b.onclick=function(){
    var p=b.dataset.p||"claude";
    S.genProvider=p; try{ localStorage.setItem("ct_gen_provider", p); }catch(_){}
    if(p==="openai" && !getOpenAIKeyRaw()){ openKeyModal("openai"); return; }
    if(p==="gemini" && !getGeminiKeyRaw()){ openKeyModal("gemini"); return; }
    render();
  }});
  document.querySelectorAll(".depthBtn").forEach(function(b){b.onclick=function(){if(b.disabled)return;if(S.depth!==b.dataset.d){S.depth=b.dataset.d;S.talk=null;S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;S.showAns=false;S.userPick="";S.error="";speechSynthesis.cancel()}render()}});
  var dz=document.getElementById("dropZone");if(dz)dz.onclick=function(){document.getElementById("fileInput").click()};
  var fi=document.getElementById("fileInput");if(fi)fi.onchange=function(e){ addUploadedFiles(e.target.files); try{ e.target.value=""; }catch(_){} };
  document.querySelectorAll(".rmFile").forEach(function(b){b.onclick=function(){S.files.splice(+b.dataset.i,1);render()}});
  // podCheck handler removed (2026-06-08) — toggle was deleted from compose form + drawer.
  var wc=document.getElementById("webCheck");if(wc)wc.onchange=function(e){S.wantWebSearch=e.target.checked};
  var cot=document.getElementById("composeOptionsToggle");if(cot)cot.onclick=function(){ S.composeOptionsOpen=!S.composeOptionsOpen; try{ localStorage.setItem("ct_compose_options", S.composeOptionsOpen?"1":"0"); }catch(_){} render(); };
  var gb=document.getElementById("genBtn");if(gb)gb.onclick=generate;
  var cgb=document.getElementById("cancelGenBtn");if(cgb)cgb.onclick=cancelGen;
  // Live depth + verify controls inside the loading panel — changing restarts generation cleanly.
  // Audio toggle just sets a flag (no restart) — fires after the current generation completes.
  document.querySelectorAll(".loadingDepthBtn").forEach(function(b){
    b.onclick=function(){
      if(b.disabled) return;
      var d=b.dataset.d;
      // Un-gated 2026-07-03: detailed-from-scratch is supported; switching restarts generation.
      if(!d || S.depth===d) return;
      S.depth=d;
      restartGen();
    };
  });
  var lvc=document.getElementById("loadingVerifyCheck");
  if(lvc) lvc.onchange=function(e){
    S.wantWebSearch=e.target.checked;
    restartGen();
  };
  var lat=document.getElementById("loadingAudioToggle");
  if(lat) lat.onchange=function(e){
    S.queueAudio=e.target.checked;
    // No restart — flag is read on generation completion. Light render so UI matches state.
  };

  // ─── Generated-talk view ────────────────────────────────────────────────
  var rb=document.getElementById("resetBtn");if(rb)rb.onclick=safeResetAll;
  // One-tap depth flip in the capsule header. Concise ⇄ Detailed.
  // For samples: swap to the other CACHED version (no API call). For fresh generations: rebuild.
  // Depth toggle — both buttons (Concise + Detailed) share the same flip handler.
  // For samples with the other depth cached: swap instantly (no API). For user talks: triggers regen.
  function _flipDepthTo(newDepth){
    if(S.style==="boards")return;
    if(newDepth === S.depth) return; // no-op on active button
    if(S.isSampleTalk && S.sampleSlug){
      var s=null; for(var i=0;i<SAMPLES.length;i++){if(SAMPLES[i].slug===S.sampleSlug){s=SAMPLES[i];break}}
      var otherTalk = s && (newDepth==="detailed" ? s.talk_detailed : s.talk_concise);
      if(otherTalk){ loadSample(S.sampleSlug, newDepth); return; }
      // Sample doesn't have the other depth cached — silently no-op (don't burn API on a sample).
      return;
    }
    // Option B (Jenni 2026-06-08): saved cloud talks may already have both depths cached in
    // depth_variants. If the variant exists, instant swap — no API call. If not, generate, and
    // on completion merge the new variant into the same row.
    if(S.depthVariantsCache && S.depthVariantsCache[newDepth]){
      S.depth = newDepth;
      S.talk = S.depthVariantsCache[newDepth];
      S.sec = 0;
      render();
      return;
    }
    S.depth = newDepth;
    // Flag generate() to merge the result into the existing row instead of creating a new row.
    S._pendingDepthMerge = !!(S.loadedTalkId && !String(S.loadedTalkId).startsWith("t_"));
    generate();
  }
  var dtbC=document.getElementById("depthToggleBtnConcise");if(dtbC)dtbC.onclick=function(){_flipDepthTo("concise")};
  var dtbD=document.getElementById("depthToggleBtnDetailed");if(dtbD)dtbD.onclick=function(){_flipDepthTo("detailed")};
  // Legacy capsule depth toggle (if it ever renders) — same handler
  var dtb=document.getElementById("depthToggleBtn");if(dtb)dtb.onclick=function(){_flipDepthTo(S.depth==="detailed"?"concise":"detailed")};
  document.querySelectorAll(".secBtn").forEach(function(b){b.onclick=function(){var idx=+b.dataset.i;S.activeSection=(S.activeSection===idx?-1:idx);S.sec=idx;render()}});
  // Tab switching (top + bottom nav)
  document.querySelectorAll(".tk-tab,.bntab").forEach(function(b){b.onclick=function(){if(b.dataset.tab&&S.tab!==b.dataset.tab){S.tab=b.dataset.tab;render()}}});
  // Guideline collapsible
  var gtg=document.getElementById("gldToggle");if(gtg)gtg.onclick=function(){S.gldOpen=!S.gldOpen;render()};
  // "How this works" — native <details> toggle; mirror state so it survives unrelated render()
  var hwt=document.getElementById("howitDetails");if(hwt)hwt.ontoggle=function(){S.howitOpen=hwt.open};
  // gldToggle2 handler deleted — ID no longer rendered.
  // Lightbox
  var lo1=document.getElementById("lightboxOpenBtn");if(lo1)lo1.onclick=function(){S.lightbox=true;render()};
  var lo2=document.getElementById("lightboxOpenBtn2");if(lo2)lo2.onclick=function(){S.lightbox=true;render()};
  var lc=document.getElementById("lightboxClose");if(lc)lc.onclick=function(e){if(e.target===lc||e.target.id==="lightboxCloseX"){S.lightbox=false;render()}};
  // Save/share variants from new header + action row
  // saveTalkBtn2/shareTalkBtn2 handlers deleted — those IDs no longer rendered (leftover from a prior header layout).
  var stwt=document.getElementById("shareTwitterBtn");if(stwt)stwt.onclick=function(){var btn=document.getElementById("shareTalkBtn");if(btn)btn.click()};
  // Add has-talk class for bottom-nav padding
  if(S.talk){document.querySelector(".app").classList.add("has-talk")}else{document.querySelector(".app").classList.remove("has-talk")}
  // === Two-state UX bindings ===
  var rtad=document.getElementById("refineTAd");if(rtad)rtad.oninput=function(e){S.refineContext=e.target.value};
  var ttad=document.getElementById("topicTAd");if(ttad)ttad.oninput=function(e){S.topic=e.target.value};
  document.querySelectorAll(".mode-card").forEach(function(b){b.onclick=function(){if(b.dataset.tab&&S.tab!==b.dataset.tab){S.tab=b.dataset.tab;render()}}});
  var esb=document.getElementById("editSettingsBtn");if(esb)esb.onclick=function(){S.editSettings=true;S.overflowOpen=false;render()};
  // === EXPAND ALL TOGGLE handler (June 2026 per Jenni) ===
  var eab=document.getElementById("expandAllBtn");if(eab)eab.onclick=function(){S.allExpanded=!S.allExpanded;render()};
  var rb1=document.getElementById("rebuildBtn");if(rb1)rb1.onclick=function(){S.editSettings=false;S.overflowOpen=false;generate()};
  var rb2=document.getElementById("rebuildBtn2");if(rb2)rb2.onclick=function(){S.editSettings=false;generate()};
  var ofb=document.getElementById("overflowBtn");if(ofb)ofb.onclick=function(e){e.stopPropagation();S.overflowOpen=!S.overflowOpen;render()};
  if(S.overflowOpen){document.body.onclick=function(e){if(!e.target.closest(".overflow-menu")&&!e.target.closest("#overflowBtn")){S.overflowOpen=false;render()}}}else{document.body.onclick=null}
  var nbt=document.getElementById("newTalkBtn");if(nbt)nbt.onclick=function(){S.overflowOpen=false;safeResetAll()};
  var dcb=document.getElementById("drawerCloseBtn");if(dcb)dcb.onclick=function(){S.editSettings=false;render()};
  var dbk=document.getElementById("drawerBackdrop");if(dbk)dbk.onclick=function(){S.editSettings=false;render()};
  // Floating bubble open/close
  var cob=document.getElementById("composerOpenBtn");if(cob)cob.onclick=function(){S._composerOpen=true;render();setTimeout(function(){var r=document.getElementById("reviseIn");if(r)r.focus()},50)};
  var ccb=document.getElementById("composerCloseBtn");if(ccb)ccb.onclick=function(){S._composerOpen=false;S.proofreadArmed=false;render()};
  var prt=document.getElementById("proofreadToggle");if(prt)prt.onchange=function(){S.proofreadArmed=prt.checked;render()};
  var crb=document.getElementById("composerRefBtn");if(crb)crb.onclick=function(){var fi=document.getElementById("composerFileInput")||document.getElementById("fileInput");if(fi)fi.click()};
  var cfi=document.getElementById("composerFileInput");if(cfi)cfi.onchange=function(e){ addUploadedFiles(e.target.files); try{ e.target.value=""; }catch(_){} };
  // Send: ⌘/Ctrl+Enter only. Plain Enter inserts a newline (we always have room — fixed-height textarea with internal scroll).
  var rin=document.getElementById("reviseIn");if(rin){
    rin.oninput=function(e){
      S.reviseIn=e.target.value;
      var has=!!e.target.value.trim();
      var sb=document.getElementById("reviseSend");if(sb)sb.disabled=!has;
      // Also refresh the Apply-proofread button live (Jenni 2026-07-03 bug fix — typing updated only
      // the send arrow, so the proofread button stayed greyed until an unrelated re-render).
      var ps=document.getElementById("proofreadSuggest");if(ps){ps.style.display=(e.target.value.trim().length>600 && !S.proofreadArmed)?"block":"none";}
    };
    rin.onkeydown=function(e){
      var modSend=(e.metaKey||e.ctrlKey)&&e.key==="Enter";
      if(modSend && String(S.reviseIn||"").trim()){
        e.preventDefault();
        if(S.proofreadArmed){ S._applyProofreadMode = true; S.proofreadArmed = false; }
        S.chatIn=S.reviseIn;S.reviseIn="";
        if(typeof sendChat==="function")sendChat();
      }
    };
  }
  // Send-arrow fix (Jenni 2026-07-03): the old per-render onclick was unreliable — render() rebuilds
  // the DOM wholesale, and any background tick (regen counter, citation audit, free-tier poll) that
  // fires between mousedown and mouseup replaces the button mid-click, so the click event never
  // dispatches. ⌘/Ctrl+Enter worked because keydown fires instantly on the textarea. Fix: ONE
  // document-level pointerdown listener (bound once, survives every re-render). The empty-input
  // guard also makes accidental double-fires no-ops.
  if(!window.__reviseSendBound){
    window.__reviseSendBound = true;
    document.addEventListener("pointerdown", function(e){
      if(!e.target || !e.target.closest) return;
      // Apply-proofread button: same delegated pattern; sets the one-shot flag so sendChat routes
      // to applyProofreadFeedback. (Jenni 2026-07-03)
      var b = e.target.closest("#reviseSend");

      e.preventDefault(); // keep focus state stable; we're handling the action now
      if(!String(S.reviseIn||"").trim()) return;
      if(S.proofreadArmed){ S._applyProofreadMode = true; S.proofreadArmed = false; }

  // ─── Auth (sign-in modal + Google + account menu + profile editor) ─────

  var sicb=document.getElementById("signInCloseBtn");if(sicb)sicb.onclick=function(){S.signInOpen=false;render()};
  var sibd=document.getElementById("signInBackdrop");if(sibd)sibd.onclick=function(){S.signInOpen=false;render()};
  var aei=document.getElementById("authEmailInput");if(aei)aei.oninput=function(e){S.authEmail=e.target.value};
  var mlf=document.getElementById("magicLinkForm");if(mlf)mlf.onsubmit=async function(e){e.preventDefault();var em=(S.authEmail||"").trim();if(!em){S.authMsg="Enter your email";render();return}S.authBusy=true;S.authMsg="";render();try{await signInWithMagicLink(em);S.authMsg="Check "+em+" — we emailed you a one-time sign-in link.";S.authBusy=false;render()}catch(err){S.authMsg=err.message||"Could not send the sign-in link";S.authBusy=false;render()}};
  // Don't render() before initiating OAuth (Jenni 2026-07-03 mobile fix) — rebuilding the DOM in the
  // tap handler breaks Safari's user-activation and the redirect silently fails. Kick off directly;

    setTimeout(function(){var ts=document.querySelectorAll(".secEditBulletTA");if(ts.length)ts[ts.length-1].focus()},50);
  };

  document.querySelectorAll(".copySecBtn").forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      if(!S.talk||!S.talk.sections)return;
      var idx=parseInt(b.dataset.i,10);var sec=S.talk.sections[idx];if(!sec)return;
      var lines=[(idx+1)+". "+(sec.heading||"")+(sec.minutes?" ("+sec.minutes+")":"")];
      lines.push("");
      (sec.points||[]).forEach(function(p){lines.push("• "+p)});
      if(sec.teaching_pearl){lines.push("");lines.push("💡 Teaching Pearl: "+sec.teaching_pearl)}
      if(sec.board_tip){lines.push("");lines.push("🎯 Board Tip: "+sec.board_tip)}
      copyTextToClipboard(lines.join("\n"),"Section copied");
    };
  });
  // Copy ALL sections at once — full lesson outline as plain text (Jenni 2026-06-09).
  function _copyAllSections(){
    if(!S.talk||!S.talk.sections)return;
    var t = S.talk;
    var lines = [];
    if(t.title) lines.push(t.title);
    if(t.subtitle) lines.push(t.subtitle);
    if(lines.length) lines.push("");
    (t.sections||[]).forEach(function(sec, i){
      lines.push((i+1)+". "+(sec.heading||"")+(sec.minutes?" ("+sec.minutes+")":""));
      lines.push("");
      (sec.points||[]).forEach(function(p){lines.push("• "+p)});
      if(sec.teaching_pearl){lines.push(""); lines.push("💡 Teaching Pearl: "+sec.teaching_pearl)}
      if(sec.board_tip){lines.push(""); lines.push("🎯 Board Tip: "+sec.board_tip)}
      if(sec.mechanism){lines.push(""); lines.push("⚙ Why this works: "+sec.mechanism)}
      lines.push(""); lines.push("");
    });
    if(t.summary_points && t.summary_points.length){
      lines.push("KEY TAKEAWAYS");
      lines.push("");
      t.summary_points.forEach(function(p, i){ lines.push((i+1)+". "+p); });
      lines.push("");
    }
    if(t.references && t.references.length){
      lines.push("REFERENCES");
      lines.push("");
      t.references.forEach(function(r){
        var bits=[r.source||("Reference "+r.id)];
        if(r.year) bits.push(String(r.year));
        if(r.society) bits.push(r.society);
        if(r.url) bits.push(r.url);
        lines.push("["+r.id+"] "+bits.join(" · "));
      });
    }
    copyTextToClipboard(lines.join("\n"),"Full lesson copied to clipboard");
  }
  var cas=document.getElementById("copyAllSectionsBtn");if(cas)cas.onclick=function(e){e.stopPropagation();_copyAllSections()};
  var caso=document.getElementById("copyAllTalkBtn");if(caso)caso.onclick=function(){_copyAllSections();S.overflowOpen=false;render()};
  // "See all N →" on the landing samples row now jumps into Library (samples merged in).
  var lmb=document.getElementById("landingMoreBtn");if(lmb)lmb.onclick=function(){S.showSaved=true;S.libTab="lectures";render();refreshLibraryShowcaseSamples()};
  // modeToggleBtn handler deleted — ID no longer rendered.
  // ─── Save / export / share current talk ────────────────────────────────
  // Note: overflow-menu buttons use the unsuffixed IDs (saveTalkBtn, pdfTalkBtn, ...).
  // The Export tab uses *Export-suffixed IDs to avoid duplicate-ID collisions when both
  // are in the DOM simultaneously (getElementById only attaches to the first).
  var stb=document.getElementById("saveTalkBtn");if(stb)stb.onclick=saveCurrentTalk;
  // Save button in capsule header (top of page) — same handler.
  var stbTop=document.getElementById("saveTalkBtnTop");if(stbTop)stbTop.onclick=saveCurrentTalk;
  // Save copy — Phase 5 (Jenni 2026-06-08). Clones the publicly-viewed talk into the viewer's library.
  var scbTop=document.getElementById("saveCopyBtnTop");if(scbTop)scbTop.onclick=async function(){
    if(!S.talk || !S.user){ return; }
    scbTop.disabled = true;
    scbTop.textContent = "… Saving";
    var sourceName = (S.sharedAuthor && S.sharedAuthor.name) || null;
    var data = await cloudSaveCopyOfPublic(
      S.talk,
      S.sharedOriginalTalkId,
      S.sharedAuthorUserId,
      sourceName,
      S.topic,
      S.style,
      S.depth
    );
    if(data){
      S.sharedCopySaved = true;   // prevent a second tap from cloning the same talk again (Codex fix)
      S.savedFlash = "✓ Saved a copy to your library" + (sourceName ? " · from "+sourceName : "");
      // Stay in public-viewer mode — user can still browse. Don't yank them away.
      render();
      setTimeout(function(){S.savedFlash="";render()},3000);
    } else {
      S.savedFlash = "⚠ Couldn't save — check connection";
      render();
      setTimeout(function(){S.savedFlash="";render()},3000);
      // Restore button on error so the user can retry
      var b = document.getElementById("saveCopyBtnTop");
      if(b){ b.disabled = false; b.innerHTML = '★ <span class="hide-mobile-text">Save copy</span>'; }
    }
  };
  // Save copy when not signed in — open the sign-in modal
  var scsibt=document.getElementById("saveCopySignInBtnTop");if(scsibt)scsibt.onclick=function(){
    S.signInOpen=true;S.authMsg="Sign in to save a copy of this talk to your library";render();
  };
  // Banner Save Copy CTA — same logic as the capsule one, promoted in the shared-talk header.
  // (Jenni 2026-06-09: coworkers were missing the capsule button.)
  var bsc=document.getElementById("bannerSaveCopyBtn");if(bsc)bsc.onclick=async function(){
    if(!S.talk || !S.user){ return; }
    bsc.disabled = true; bsc.textContent = "… Saving";
    var sourceName = (S.sharedAuthor && S.sharedAuthor.name) || null;
    var data = await cloudSaveCopyOfPublic(S.talk, S.sharedOriginalTalkId, S.sharedAuthorUserId, sourceName, S.topic, S.style, S.depth);
    if(data){
      S.sharedCopySaved = true;   // prevent duplicate clones (Codex fix)
      S.savedFlash = "✓ Saved a copy to your library" + (sourceName ? " · from "+sourceName : "");
      render();
      setTimeout(function(){S.savedFlash="";render()},3000);
    } else {
      bsc.disabled = false; bsc.textContent = "★ Save your copy";
      S.savedFlash = "⚠ Couldn't save — check connection"; render();
      setTimeout(function(){S.savedFlash="";render()},3000);
    }
  };
  var bscsi=document.getElementById("bannerSaveCopySignInBtn");if(bscsi)bscsi.onclick=function(){
    S.signInOpen=true;S.authMsg="Sign in to save a copy of this talk to your library";render();
  };
  // Save button at the bottom (after the lesson outline) — same handler.
  var stbBot=document.getElementById("saveTalkBtnBottom");if(stbBot)stbBot.onclick=saveCurrentTalk;
  // === EXPORT PDF inline button (June 2026 per Jenni) — paired with Save at bottom ===
  var ptbBot=document.getElementById("pdfTalkBtnBottom");if(ptbBot)ptbBot.onclick=exportTalkPDF;
  var ptb=document.getElementById("pdfTalkBtn");if(ptb)ptb.onclick=exportTalkPDF;
  var pngb=document.getElementById("pngTalkBtn");if(pngb)pngb.onclick=function(){S.overflowOpen=false;render();setTimeout(exportTalkImage,50)};
  // Print submenu (Jenni 2026-07-03)
  var prO=document.getElementById("printOverviewBtn");if(prO)prO.onclick=function(){S.overflowOpen=false;render();setTimeout(exportTalkPDF,50)};
  var prS=document.getElementById("printSlidesBtn");if(prS)prS.onclick=function(){S.overflowOpen=false;render();setTimeout(printSlides,60)};
  var prV=document.getElementById("printVisualBtn");if(prV)prV.onclick=function(){S.overflowOpen=false;render();setTimeout(printVisual,60)};
  var sib=document.getElementById("saveSlidesImgBtn");if(sib)sib.onclick=exportSlidesImage;
  // Overview's bottom CTA → switch to Slides tab + jump to top (Jenni 2026-06-08)
  var o2s=document.getElementById("overviewToSlidesBtn");if(o2s)o2s.onclick=function(){S.tab="slides";window.scrollTo(0,0);render()};
  // Shared-talk info chip — expands/collapses the "Shared by … · Make your own →" details
  var sit=document.getElementById("sharedInfoToggle");if(sit)sit.onclick=function(){S.shareInfoOpen=!S.shareInfoOpen;render()};
  var jtb=document.getElementById("jsonTalkBtn");if(jtb)jtb.onclick=function(){exportTalkJSON(null)};
  var dtb=document.getElementById("deleteTalkBtn");if(dtb)dtb.onclick=function(){S.overflowOpen=false;deleteCurrentTalk()};
  var shr=document.getElementById("shareTalkBtn");if(shr)shr.onclick=function(){shareTalk()};
  // ── Capsule overflow privacy handlers (Phase 1+2 redesign — Jenni 2026-06-08) ─────────
  // Old publishTalkBtn / unpublishTalkBtn / copyShareUrlBtn collapsed into:
  //   capShareBtn → opens the unified share modal
  //   capCopyLinkBtn → quick clipboard copy
  //   capMakePrivateBtn → collapses unfeature + unpublish in one tap
  var capShr=document.getElementById("capShareBtn");if(capShr)capShr.onclick=function(){
    if(!S.loadedTalkId){ alert("Save the talk first before sharing."); return; }
    S.overflowOpen=false;
    openShareModal(S.loadedTalkId);
  };
  var capCL=document.getElementById("capCopyLinkBtn");if(capCL)capCL.onclick=function(){
    var _row=(S.cloudTalks||[]).find(function(x){return x.id===S.loadedTalkId});
    if(!_row || !_row.share_token){ alert("No share link available."); return; }
    var url=publicShareURL(_row.share_token);
    S.overflowOpen=false;
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        S.savedFlash="✓ Link copied — only people you send it to can view";
        render(); setTimeout(function(){S.savedFlash="";render()},3000);
      });
    } else { prompt("Copy this URL:", url); render(); }
  };
  var capMP=document.getElementById("capMakePrivateBtn");if(capMP)capMP.onclick=async function(){
    if(!S.loadedTalkId) return;
    if(!confirm("Make this talk private?\n\nIt'll be removed from your profile (if featured) and the share link will stop working.")) return;
    S.overflowOpen=false; render();
    var _row=(S.cloudTalks||[]).find(function(x){return x.id===S.loadedTalkId});
    var _featOk = true;
    if(_row && _row.is_featured) _featOk = (await cloudSetTalkFeatured(S.loadedTalkId, false)) !== null;   // check unfeature too (Codex fix)
    var data = await cloudSetTalkPublic(S.loadedTalkId, false);
    if(!data || !_featOk){ alert("Couldn't update sharing — check connection and try again."); return; }
    S.savedFlash="🔒 Made private · existing links no longer work";
    render(); setTimeout(function(){S.savedFlash="";render()},3000);
  };
  // Share modal handlers
  var smc=document.getElementById("shareModalCloseBtn");if(smc)smc.onclick=function(){S.shareModalOpen=false;S.shareModalTalkId=null;render()};
  var smb=document.getElementById("shareModalBackdrop");if(smb)smb.onclick=function(){S.shareModalOpen=false;S.shareModalTalkId=null;render()};
  // Tier-radio clicks — switch the talk to the chosen privacy tier. (Jenni 2026-06-08 Phase 2)
  document.querySelectorAll(".shareTierBtn").forEach(function(b){b.onclick=function(){
    var tier=b.dataset.tier;
    if(!tier || !S.shareModalTalkId || S.shareModalBusy) return;
    applyShareTier(S.shareModalTalkId, tier);
  }});
  var smcp=document.getElementById("shareModalCopyBtn");if(smcp)smcp.onclick=function(){
    var row=(S.cloudTalks||[]).find(function(x){return x.id===S.shareModalTalkId});
    var token=(row && row.share_token) || S.shareModalToken;
    if(!token) return;
    var url=publicShareURL(token);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        var b=document.getElementById("shareModalCopyBtn");
        if(b){var orig=b.textContent;b.textContent="✓ Link copied — only people you send it to can view";setTimeout(function(){b.textContent=orig},2500)}
      });
    }
  };
  var ptbE=document.getElementById("pdfTalkBtnExport");if(ptbE)ptbE.onclick=exportTalkPDF;
  var jtbE=document.getElementById("jsonTalkBtnExport");if(jtbE)jtbE.onclick=function(){exportTalkJSON(null)};
  var shrE=document.getElementById("shareTalkBtnExport");if(shrE)shrE.onclick=function(){shareTalk()};
}

// ═══════════ GLOBAL ERROR HANDLERS (Jenni 2026-07-03 quality fix #3) ═══════════
// Before this, a stray promise rejection or error outside a wrapped try/catch died silently — no
// telemetry, no user feedback, stuck UI. These handlers log to console and show ONE dismissible
// toast (via direct DOM, never render(), to avoid re-entrancy loops). They never swallow errors.
(function installGlobalErrorHandlers(){
  var _lastToastAt = 0;
  function showErrToast(label){
    var now = Date.now();
    if(now - _lastToastAt < 4000) return;      // throttle so a burst can't stack toasts
    _lastToastAt = now;
    try{
      var t = document.createElement("div");
      t.setAttribute("role","alert");
      t.style.cssText = "position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:2000;background:#fdf0ee;color:#8a3a2a;border:1px solid #e6b8ab;border-radius:10px;padding:10px 14px;font-size:12.5px;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.12);max-width:340px;line-height:1.4;cursor:pointer";
      t.textContent = "⚠️ " + label + " — if something looks stuck, reload the page. (Tap to dismiss.)";
      t.onclick = function(){ try{ t.remove(); }catch(_){} };
      document.body.appendChild(t);
      setTimeout(function(){ try{ t.remove(); }catch(_){} }, 8000);
    }catch(_){}
  }
  window.addEventListener("error", function(e){
    console.error("[global error]", e && (e.error || e.message || e));
    showErrToast("Something hit an unexpected error");
  });
  window.addEventListener("unhandledrejection", function(e){
    console.error("[unhandled rejection]", e && e.reason);
    showErrToast("A background task failed");
  });
})();

try{ var _gp = localStorage.getItem("ct_gen_provider"); if(_gp==="openai"||_gp==="gemini"||_gp==="claude") S.genProvider = _gp; }catch(_){}

try{ if(localStorage.getItem("ct_compose_options")==="1") S.composeOptionsOpen = true; }catch(_){}

loadFromShareHash();
loadFromPublicShareHash();
loadFromUserProfileHash();
