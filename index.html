    h += '<img src="data:image/png;base64,'+visuals[0].imgB64+'" alt="" style="width:38px;height:38px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex-shrink:0">';
  }

  // Title + meta in a single column, flex:1
  // Samples can carry a local rename override (keyed by slug) since the seed title is immutable.
  var _ovr = isSample ? (loadSampleTitleOverrides()[x._slug]||"") : "";
  var displayTitle = _ovr || t.title || x.topic || "Untitled";
  h += '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">';
  h += '<div style="font-size:13px;font-weight:700;color:var(--plum-deep);line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(displayTitle)+'">'+esc(displayTitle)+'</div>';
  // Compact meta row — type badge + sample/dual/visual badges + date in tiny font
  h += '<div style="display:flex;gap:6px;font-size:10.5px;color:var(--ink-muted);align-items:center;flex-wrap:wrap">';
  h += '<span style="background:'+(isBQ?"#fdf0ee":"var(--lavender-bg)")+';color:'+(isBQ?"#8a3a2a":"var(--plum)")+';padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px;letter-spacing:0.02em">'+(isBQ?"📋 Boards":"🎓 Lecture")+'</span>';
  if(isSample) h += '<span style="background:#fff4e0;color:#7a5b1a;padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px">✨</span>';
  if(isShowcase) h += '<span style="background:#fff3d6;color:#7a5b1a;border:1px solid #f0d8a0;padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px" title="Featured teaching sample from Jenni">✨ Sample</span>';
  // Privacy badge — only meaningful when the viewer OWNS the talk (saved branch + logged in).
  // For showcase pull-ins or incognito browsing, "On profile" reads as the viewer's profile, which
  // is misleading. (Jenni 2026-06-10) Unified: any public share now shows ⭐ On profile — Link tier
  // is still a thing under the hood, but the badge no longer distinguishes them, because Jenni's
  // mental model is "if I made it public, it's on my profile."
  var _isMyOwnTalk = !!(S.user && x._source === "saved");
  if(_isMyOwnTalk && (x._isFeatured || x._isPublic)) {
    h += '<span style="background:#fff3d6;color:#7a5b1a;border:1px solid #f0d8a0;padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px" title="On your public profile (or link-shared — either way, publicly viewable)">⭐ On profile</span>';
  }
  // Attribution chip — Phase 5 (Jenni 2026-06-08). Now clickable: opens source curator's profile.
  // (Jenni 2026-06-09: was static text; coworkers had no way to discover the original library.)
  if(x._sourceCuratorName){
    h += '<button class="libAttribChip" data-id="'+esc(x._id||"")+'" type="button" title="View '+esc(x._sourceCuratorName)+'\'s profile" style="background:#f5edfa;color:#4a1a7a;border:1px solid #d4baea;padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px;cursor:pointer;font-family:inherit">📥 From: '+esc(x._sourceCuratorName)+'</button>';
  }
  // Visuals badge: prefer exact count (local talks with full savedVisuals data); else just show 🖼 (cloud cards).
  if(visuals) h += '<span style="background:var(--lavender-bg);color:var(--plum);padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px">🖼 '+visuals.length+'</span>';
  else if(t._hasCloudVisuals) h += '<span style="background:var(--lavender-bg);color:var(--plum);padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px">🖼</span>';
  // Both-depths badge — this talk has Concise AND Detailed saved. (Jenni 2026-07)
  if(x._hasBoth) h += '<span title="Saved in both Concise and Detailed" style="background:#eef7ee;color:#2d6a2d;border:1px solid #cbe6cb;padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px">⊜≣ Both</span>';
  if(dateStr) h += '<span style="font-size:10.5px;color:var(--ink-soft)">'+dateStr+'</span>';
  h += '</div>';
  h += '</div>';

  // Right side: kebab + clear gap + Open. The gap separates the secondary overflow menu from the primary CTA.
  h += '<div style="display:flex;align-items:center;gap:12px;flex-shrink:0">' + iconBtns + openBtn + '</div>';

  h += '</div>';
  return h;
}

function getDisplayLibrary(){
  if(S.user) return (S.cloudTalks || []).filter(function(row){return !_softDeletedIds[row.id]}).map(function(row){

    // talk object from columns so renderLibCard + the renderSaved _kind detection still work.
    // The full talk_json is fetched on Open via cloudLoadTalk(id).
    // Defensive: handle both lightweight rows (just-fetched) and full rows (just-saved, still in cache).
    var hasVis = (row.has_visuals === true) || !!(row.talk_json && row.talk_json.savedVisuals && row.talk_json.savedVisuals.length);
    var subtitle = row.subtitle || (row.talk_json && row.talk_json.subtitle) || "";
    var miniTalk = {
      title: row.title,
      subtitle: subtitle,
      question: row.style === "boards" ? {} : undefined,
      // _hasCloudVisuals signals the badge should render even without the full savedVisuals array.
      _hasCloudVisuals: hasVis
    };
    return {
      id: row.id,
      savedAt: row.created_at,
      topic: row.topic,
      style: row.style,
      talk: miniTalk,
      podScript: "",
      dg: null,
      glRef: { sources: [], specialties: [], context: "", trials: [] },
      _isPublic: !!row.is_public,
      _shareToken: row.share_token || null,
      _isFeatured: !!row.is_featured,
      _sourceId: row.source_id || null,
      _sourceCuratorName: row.source_curator_name || null,
      _sourceCuratorUserId: row.source_curator_user_id || null,
      // Option B: surface "has both depths cached" to the library card so it can show a small badge.
      _hasBoth: !!(row.depth_variants && row.depth_variants.concise && row.depth_variants.detailed),
      _depthVariantsAvailable: row.depth_variants ? Object.keys(row.depth_variants) : [],
      // Pattern A (Jenni 2026-06-09) — user-controlled curation
      _specialtyOverride: row.specialty_override || null,
      _isPinned: !!row.is_pinned,
      _pinnedAt: row.pinned_at || null,
      _sortOrder: (typeof row.sort_order === "number") ? row.sort_order : null

}

// Wait up to ~3s for Supabase to finish initializing. The module script that creates
// window.sb is deferred — if the user clicks Sign in before it lands, we briefly poll
// rather than throw a confusing "Supabase not ready" error.
function _waitForSb(){
  return new Promise(function(resolve,reject){
    if(window.sb) return resolve(window.sb);
    var tries=0;
    var iv=setInterval(function(){
      if(window.sb){clearInterval(iv);resolve(window.sb)}
      else if(++tries>30){clearInterval(iv);reject(new Error("Sign-in service is loading — please refresh the page and try again."))}
    },100);
  });
}

// Stash the current topic before any auth redirect so a signed-out user who typed a topic and hit
// Generate gets it back after the sign-in round-trip (fix #2). Restored on init.
function _stashPendingTopic(){ try{ if(S.topic && S.topic.trim()) localStorage.setItem("ct_pending_topic", S.topic); }catch(_){} }
async function signInWithMagicLink(email){
  _stashPendingTopic();
  var sb = await _waitForSb();
  var redirectTo = window.location.origin + window.location.pathname;
  var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirectTo } });
  if(r.error) throw r.error;
  return r;
}

async function signInWithGoogle(){
  _stashPendingTopic();
  // Mobile fix (Jenni 2026-07-03): on phones, letting the SDK auto-redirect after a DOM rebuild +
  // async gap gets blocked by Safari's user-activation rules, so "nothing happens." Instead we get
  // the auth URL back (skipBrowserRedirect) and do the top-level navigation ourselves, immediately.
  var sb = window.sb || await _waitForSb();
  var redirectTo = window.location.origin + window.location.pathname;
  var r = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: redirectTo, skipBrowserRedirect: true } });
  if(r.error) throw r.error;
  if(r.data && r.data.url){ window.location.assign(r.data.url); return; }
  throw new Error("Could not start Google sign-in — try the email link instead.");
}

async function signOut(){
  if(!window.sb) return;
  await window.sb.auth.signOut();
  S.session = null; S.user = null; S.profile = null;
  S.overflowOpen = false;

}

async function migrateLocalToCloud(localTalks){
  if(!window.sb || !S.user) return;
  var rows = [];
  for(var i=0; i<localTalks.length; i++){
    var e = localTalks[i];
    var t = e.talk || {};
    rows.push({
      user_id: S.user.id,
      title: t.title || e.topic || "Untitled",
      topic: e.topic || t.title || "",
      refine_context: e.refineContext || null,
      style: e.style || (t.question ? "boards" : "lecture"),
      depth: e.depth || null,
      talk_json: t,
      references_json: t.references || null,
      files_meta: e.files || null
    });
  }
  try{
    var r = await window.sb.from("talks").insert(rows);
    if(r.error){ alert("Import failed: " + r.error.message); return }
    localStorage.setItem("ct_migration_dismissed_v1", "1");
    alert("Imported " + rows.length + " talk" + (rows.length===1?"":"s") + " to your cloud library.");
    await refreshCloudTalks();
  }catch(e){ alert("Import error: " + e.message) }
}

// === Delete confirmation modal + soft-delete with Undo ===
// Replaces native confirm() for deletions. A branded modal asks first; on confirm we hide the item
// immediately and show an Undo toast. The real delete (cloud/local/sample-hide) is deferred until the
// toast window closes, so Undo is instant and lossless (nothing is removed until commit fires).
var _softDeletedIds = {};    // saved-talk ids hidden pending commit
var _softHiddenSlugs = {};   // sample slugs hidden pending commit
function _notSoftDeleted(e){ return e && !_softDeletedIds[e.id]; }

// Branded confirm dialog. onConfirm runs only if the user clicks Delete. Cancel is the focused/safe default.
function showDeleteConfirm(name, onConfirm){

  card.innerHTML='<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px"><span style="background:#fbeaea;color:#c0392b;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">🗑</span><span style="font-size:16px;font-weight:700;color:var(--ink)">Delete this talk?</span></div>'+
    '<div style="font-size:13.5px;color:var(--ink-muted);line-height:1.5;margin-bottom:18px">“'+esc(name||"This talk")+'” will be removed from your library. You’ll have a few seconds to undo.</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end">'+

    '<button id="ctConfirmDelete" style="background:#c0392b;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Delete</button>'+
    '</div>';
  ov.appendChild(card); document.body.appendChild(ov);
  function close(){ ov.remove(); document.removeEventListener("keydown",onKey) }
  function onKey(e){ if(e.key==="Escape") close() }
  document.addEventListener("keydown",onKey);
  ov.onclick=function(e){ if(e.target===ov) close() };
  document.getElementById("ctConfirmCancel").onclick=close;
  document.getElementById("ctConfirmDelete").onclick=function(){ close(); onConfirm(); };
  document.getElementById("ctConfirmCancel").focus();

// Undo toast. Calls onUndo if the user clicks Undo; otherwise onCommit fires when the window expires.
function showUndoToast(message, onUndo, onCommit, ms){
  var ex=document.getElementById("ctToast"); if(ex){ if(ex._commit) ex._commit(); ex.remove(); }
  var t=document.createElement("div");
  t.id="ctToast";
  t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;background:#241430;color:#fff;border-radius:12px;padding:10px 8px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(20,10,28,0.35);font-size:13px;font-family:inherit;max-width:90vw";
  t.innerHTML='<span>'+esc(message)+'</span><button id="ctToastUndo" style="background:none;border:none;color:#d7b3ff;font-weight:700;font-size:13px;cursor:pointer;padding:4px 10px;border-radius:8px;font-family:inherit">Undo</button>';
  document.body.appendChild(t);
  var done=false;
  function finish(undo){ if(done)return; done=true; clearTimeout(timer); t._commit=null; t.remove(); if(undo){ if(onUndo)onUndo() } else { if(onCommit)onCommit() } }
  t._commit=function(){ finish(false) };  // allow a later toast to flush this one's commit
  document.getElementById("ctToastUndo").onclick=function(){ finish(true) };
  var timer=setTimeout(function(){ finish(false) }, ms||5000);
  return t;
}

// Shared soft-delete for a saved talk id: hide now, commit (cloud or local) after the undo window.
function softDeleteSavedTalk(id, name, afterHideFn){
  _softDeletedIds[id]=true;
  if(afterHideFn) afterHideFn(); else render();
  showUndoToast("Talk deleted", function(){

    if(S.user && window.sb && !String(id).startsWith("t_")){ await cloudDeleteTalk(id); }
    else { writeSavedTalks(loadSavedTalks().filter(function(e){return e.id!==id})); }
    delete _softDeletedIds[id]; render();
  });
}

}}

async function saveCurrentTalk(){
  if(!S.talk)return;
  // If user re-taps the "✓ Saved" pill on a freshly-saved talk, just re-confirm with a flash
  // instead of doing a no-op cloud insert (which is what made the button feel "frozen"). (Jenni 2026-06-08)
  if(S.talkIsSaved && !S.isSampleTalk && S.loadedTalkId){
    S.savedFlash = "✓ Already saved · edit to save changes";
    render();
    setTimeout(function(){S.savedFlash="";render()},2500);
    return;
  }
  // If this talk was loaded from the library AND has been edited, prompt: update vs save-as-new.
  // Skip the prompt for sample-talks (no source to update) and shared/anonymous talks.
  var mode = "new"; // default behavior when nothing is loaded
  if(S.loadedTalkId && !S.isSampleTalk && !S.sharedTalk){
    var pick = confirm(
      "You opened this talk from your library. What would you like to do?\n\n" +
      "OK \u2192 Save changes to the existing talk\n" +
      "Cancel \u2192 Save as a new talk (keeps the original)"
    );
    mode = pick ? "update" : "new";
  }
  // Cloud path when signed in
  if(S.user && window.sb){
    var ok;
    if(mode === "update"){
      ok = await cloudUpdateTalk(S.loadedTalkId);
      if(ok){
        S.talkIsSaved=true;
        S.savedFlash="\u2713 Changes saved to existing talk";render();
        setTimeout(function(){S.savedFlash="";render()},2200);
      } else {
        S.savedFlash="\u26a0 Update failed \u2014 check connection";render();
        setTimeout(function(){S.savedFlash="";render()},3500);
      }
    } else {
      ok = await cloudSaveCurrentTalk();
      if(ok){
        S.talkIsSaved=true;
        // After "save as new" the new row becomes the new loaded talk so future Save prompts again.
        if(S.cloudTalks && S.cloudTalks.length){ S.loadedTalkId = S.cloudTalks[0].id; }
        S.savedFlash="\u2713 Saved as new talk in cloud library";render();
        setTimeout(function(){S.savedFlash="";render()},2200);
      } else {
        S.savedFlash="\u26a0 Cloud save failed \u2014 check connection";render();
        setTimeout(function(){S.savedFlash="";render()},3500);
      }
    }
    return;
  }
  // localStorage path
  var arr=loadSavedTalks();
  var dgLite=S.dg ? {hadImage:!!S.dg.imgB64, svg:S.dg.svg||null} : null;
  if(mode === "update" && S.loadedTalkId){
    for(var i=0;i<arr.length;i++){
      if(arr[i].id === S.loadedTalkId){
        arr[i] = Object.assign({}, arr[i], {
          savedAt: new Date().toISOString(),
          topic: S.topic, style: S.style, talk: S.talk,
          podScript: S.podScript||"", dg: dgLite, glRef: S.glRef||null
        });
        break;
      }
    }
    if(writeSavedTalks(arr)){S.talkIsSaved=true;S.savedFlash="\u2713 Changes saved";render();setTimeout(function(){S.savedFlash="";render()},2200)}
    return;
  }
  var entry={
    id:"t_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    savedAt:new Date().toISOString(),
    topic:S.topic, style:S.style, talk:S.talk,
    podScript:S.podScript||"", dg:dgLite, glRef:S.glRef||null
  };
  arr.unshift(entry);
  if(writeSavedTalks(arr)){S.talkIsSaved=true;S.loadedTalkId=entry.id;S.savedFlash="\u2713 Saved to library";render();setTimeout(function(){S.savedFlash="";render()},2200)}
}

// Persist a generated visual to the talk record + library. (Jenni 2026-07 \u2014 Codex bug fix.)
// The old path pushed into S.talk.savedVisuals then called saveCurrentTalk(), which EARLY-RETURNS for an
// already-saved talk \u2014 so the image lived only in memory and vanished on reload. This writes straight to
// the backing store (cloud row or the specific localStorage entry) so an already-saved talk actually
// updates, and only flashes success AFTER persistence. Falls back to save-as-new for unsaved/sample/shared.
async function saveCurrentVisualToLibrary(){
  if(!S.talk || !S.dg || !S.dg.imgB64) return;
  var visual = {
    imgB64: S.dg.imgB64,
    mode: S.dgMode,                 // "ai" (Gemini) or "openai"
    savedAt: new Date().toISOString(),
    label: (S.talk.title || S.topic || "Visual")
  };
  S.talk.savedVisuals = S.talk.savedVisuals || [];
  S.talk.savedVisuals.push(visual);
  var _flash = function(msg, ms){ S.savedFlash = msg; render(); setTimeout(function(){ if(S.savedFlash===msg){ S.savedFlash=""; render(); } }, ms||2200); };

  var _rollback = function(){ var i=S.talk.savedVisuals.indexOf(visual); if(i>=0) S.talk.savedVisuals.splice(i,1); };
  var isPersistedCloud = S.user && window.sb && S.loadedTalkId && !String(S.loadedTalkId).startsWith("t_") && !S.isSampleTalk && !S.sharedTalk;
  var isPersistedLocal = S.loadedTalkId && String(S.loadedTalkId).startsWith("t_");
  try{
    if(isPersistedCloud){
      var ok = await cloudUpdateTalk(S.loadedTalkId);   // serializes talk_json (incl. savedVisuals) + refreshes S.cloudTalks
      if(!ok) _rollback();
      _flash(ok ? "\u2605 Image saved to library" : "\u26a0 Couldn't save the image \u2014 check connection.", ok?2200:3500);
      return;
    }
    if(isPersistedLocal){
      var arr = loadSavedTalks(); var found = false;
      for(var i=0;i<arr.length;i++){
        if(arr[i].id === S.loadedTalkId){
          arr[i] = Object.assign({}, arr[i], { talk: S.talk, savedAt: new Date().toISOString() });
          found = true; break;
        }
      }
      var wrote = found && writeSavedTalks(arr);
      if(!wrote) _rollback();

      return;
    }

    // now carries the visual). saveCurrentTalk sets S.talkIsSaved on success and shows its own flash;
    // if it didn't persist (cancelled prompt / failure), roll the in-memory visual back.
    if(typeof saveCurrentTalk === "function"){

      if(!S.talkIsSaved) _rollback();
    }
  }catch(e){
    _rollback();
    _flash("\u26a0 Couldn't save the image \u2014 " + (typeof humanizeError==="function"?humanizeError(e):(e&&e.message||"try again.")), 3500);
  }
}

async function loadSavedTalk(id){
  // Guard unsaved work — but NOT on deep-link/hash loads (fresh page, nothing to lose). (Jenni 2026-06-22)
  if(!S.loadingFromHash && !confirmDiscardUnsaved()) return;
  var entry = null;
  // Cloud path
  if(S.user && window.sb && id && !String(id).startsWith("t_")){
    var row = await cloudLoadTalk(id);
    if(row){
      // Prefer depth_variants[S.depth] when present — Option B lets a single row hold both depths.
      // Falls back to row.talk_json for legacy rows that pre-date the schema change.
      var preferredDepth = S.depth || row.depth || "concise";
      var dv = row.depth_variants || {};
      // Pick the variant AND its ACTUAL depth together — otherwise opening a concise-only talk while
      // "detailed" is the current global depth would show concise content mislabeled as detailed. (Codex fix)
      var chosen, actualDepth;
      if(dv[preferredDepth]){ chosen = dv[preferredDepth]; actualDepth = preferredDepth; }
      else if(row.talk_json){ chosen = row.talk_json; actualDepth = row.depth || (dv.detailed && !dv.concise ? "detailed" : "concise"); }
      else if(dv.concise){ chosen = dv.concise; actualDepth = "concise"; }
      else if(dv.detailed){ chosen = dv.detailed; actualDepth = "detailed"; }
      else { chosen = null; actualDepth = row.depth || "concise"; }
      // Stash the variant map on the talk object so the depth toggle can instant-swap if both present.
      if(chosen){
        chosen._depth_variants = dv && Object.keys(dv).length ? Object.keys(dv) : null;
      }
      entry = {
        id: row.id,
        topic: row.topic,
        style: row.style,
        depth: actualDepth,
        _depthVariantsAvailable: dv && Object.keys(dv).length ? Object.keys(dv) : [],
        _depthVariantsFull: dv,
        talk: chosen,
        podScript: "",
        dg: null,
        glRef: { sources: (chosen && chosen.guideline_sources) || [], specialties: [], context: "", trials: [] }
      };
    }
  }
  if(!entry){
    var arr=loadSavedTalks();entry=arr.find(function(e){return e.id===id});
  }
  if(!entry){
    S.loadingFromHash = false;
    if(typeof render === "function") render();
    // Toast/alert so user knows why nothing loaded (silent failure is the worst UX)
    setTimeout(function(){ alert("Couldn't open that talk — it may have been deleted, or you may need to sign in first."); }, 50);
    return;
  }
  S.topic=entry.topic||"";S.style=entry.style||"lecture";S.talk=entry.talk;S.podScript=entry.podScript||"";S.dg=entry.dg||null;S.glRef=entry.glRef||null;
  if(entry.depth) S.depth = entry.depth;
  // Cache the depth_variants map so the depth toggle can instant-swap. (Jenni 2026-06-08 Option B)
  S.depthVariantsCache = entry._depthVariantsFull || null;
  S.sec=0;S.showAns=false;S.userPick="";S.msgs=[];S.error="";S.podShow=false;S.podPlaying=false;S.showSaved=false;S.isSampleTalk=false;S.sampleSlug="";S.sharedTalk=false;
  S.loadingFromHash = false; // clear before render so the loading screen disappears
  // Track which saved-talk this is so Save can prompt "update existing vs save as new" when user refines.
  S.loadedTalkId = entry.id || null;
  S.talkIsSaved = true;
  render();window.scrollTo(0,0);
}

function importLibraryJSON(file){
  // Cloud-aware: if signed in, route each incoming talk through saveCurrentTalk's
  // cloud path so it lands in Supabase (and shows up in the Library which reads
  // from S.cloudTalks). For anonymous users, fall back to the original localStorage path.
  var r=new FileReader();
  r.onload=async function(){try{
    var data=JSON.parse(r.result);
    var incoming=Array.isArray(data)?data:(data.talks||[data]);
    if(S.user && window.sb){
      var added=0, failed=0;
      for(var i=0;i<incoming.length;i++){
        var e=incoming[i];
        if(!e.talk)continue;
        try{
          var row = { user_id: S.user.id, topic: e.topic||(e.talk&&e.talk.title)||"Imported talk",
                      style: e.style||"lecture", talk_json: e.talk };
          var ins = await window.sb.from("talks").insert(row);
          if(ins.error) throw ins.error;
          added++;
        }catch(_){ failed++; }
      }
      // Refresh cloud cache; if THAT throws, don't pretend the import failed (inserts already landed).
      try { if(typeof refreshCloudTalks==="function") await refreshCloudTalks(); } catch(_) { /* surface in alert below */ }
      alert("Imported "+added+" talk"+(added===1?"":"s")+" to your cloud library"+(failed?" ("+failed+" failed)":"")+". Refresh if they don't appear immediately.");
      render();
      return;
    }
    // Anonymous user — local storage path (original behavior)
    var arr=loadSavedTalks();
    var existingIds={};arr.forEach(function(e){existingIds[e.id]=true});
    var added2=0;
    incoming.forEach(function(e){
      if(!e.id)e.id="t_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
      if(!existingIds[e.id]&&e.talk){arr.unshift(e);added2++}
    });
    writeSavedTalks(arr);alert("Imported "+added2+" talk"+(added2===1?"":"s")+".");render();
  }catch(err){alert("Could not parse JSON file: "+err.message)}};
  r.readAsText(file);
}

// Lazy-loads html2canvas from CDN on first use.
// Save the LIVE Slides view as a PNG (captures the gradient header card + key takeaways).
// Uses the same lazily-loaded html2canvas as exportTalkImage but targets the visible #slidesCapture div
// rather than rebuilding the content offscreen — preserves the gradient + Slides-specific styling exactly.
function exportSlidesImage(){
  if(!S.talk)return;
  var target = document.getElementById("slidesCapture");
  if(!target){alert("Open the Slides tab first.");return}
  var t=S.talk;
  var slug=(t.title||"chalk-talk").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);

  var toast=document.createElement("div");
  toast.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#330662;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:9999";
  toast.textContent="📸 Generating slides image…";
  document.body.appendChild(toast);
  var cleanup=function(){try{document.body.removeChild(toast)}catch(e){}};

  var runCapture=function(){
    try{
      window.html2canvas(target,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false}).then(function(canvas){
        // JPEG @0.92 — visually lossless for text/poster content, ~5-10× smaller than PNG. (Jenni 2026-06-08)
        var url=canvas.toDataURL("image/jpeg",0.92);
        var a=document.createElement("a");a.href=url;a.download="chalk-talk-slides-"+slug+".jpg";
        document.body.appendChild(a);a.click();document.body.removeChild(a);
        toast.textContent="✓ Slides image downloaded";
        setTimeout(cleanup,1500);
      }).catch(function(err){
        toast.textContent="❌ Image export failed: "+(err.message||err);
        setTimeout(cleanup,2500);
      });
    }catch(err){
      toast.textContent="❌ "+(err.message||err);
      setTimeout(cleanup,2500);
    }
  };

  // html2canvas is loaded async — wait for it if not yet ready.
  if(window.html2canvas){runCapture()}
  else{
    var deadline=Date.now()+8000;
    var wait=function(){
      if(window.html2canvas)return runCapture();
      if(Date.now()>deadline){toast.textContent="❌ Image library failed to load — refresh and try again";setTimeout(cleanup,2500);return}
      setTimeout(wait,150);
    };
    wait();
  }
}

}

function exportTalkImage(){

  // Build offscreen iframe with the same styled content used by PDF.

  document.body.appendChild(fr);

    '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"><\/script>'+
    '</head><body>'+_exportTalkBody()+'</body></html>';

  toast.textContent="\uD83D\uDCF8 Generating image\u2026";

  var cleanup=function(){try{document.body.removeChild(fr)}catch(e){};try{document.body.removeChild(toast)}catch(e){}};
  var deadline=Date.now()+15000;
  var waitFor=function(){
    var w2c=fr.contentWindow&&fr.contentWindow.html2canvas;

    }

    setTimeout(function(){

        w2c(fd.body,{scale:2,backgroundColor:"#ffffff",useCORS:true,logging:false}).then(function(canvas){
          // JPEG @0.92 — visually lossless for text/poster content, much smaller. (Jenni 2026-06-08)

          var fileName = "chalk-talk-"+slug+".jpg";

            var file = null; try { file = new File([blob], fileName, {type:"image/jpeg"}); } catch(_){}
            if(file && navigator.canShare && navigator.canShare({files:[file]}) && navigator.share){

              navigator.share({files:[file], title: (t.title||"Chalk Talk"), text: (t.title||"")})
                .then(function(){ toast.textContent="\u2713 Shared"; setTimeout(cleanup,1200); })
                .catch(function(err){
                  if(err && (err.name==="AbortError" || /cancel|abort/i.test(err.message||""))) cleanup();
                  else { toast.textContent="\u274c Share failed: "+(err.message||err); setTimeout(cleanup,2500); }
                });
            } else {
              var url = URL.createObjectURL(blob);
              var a = document.createElement("a"); a.href = url; a.download = fileName;
              document.body.appendChild(a); a.click(); document.body.removeChild(a);
              setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
              toast.textContent="\u2713 Image downloaded";
              setTimeout(cleanup,1500);
            }
          }, "image/jpeg", 0.92);
        }).catch(function(err){
          toast.textContent="\u274C Image export failed: "+(err.message||err);
          setTimeout(cleanup,2500);
        });
      }catch(err){
        toast.textContent="\u274C "+(err.message||err);

      }

  };

}

// ─── Drug-name typo guard (Jenni 2026-06-09) ───
// Mirrors the LLM-prompt drug list. Catches the same common LLM-mangling AND human typos in
// inline section edits. Returns [{found, suggest, near}] for each suspected typo.
// Heuristic: word looks like a known drug class suffix (-axaban, -gliflozin, -mab, etc.) but doesn't
// match the canonical spellings; flag with closest-match suggestion.
var _CANONICAL_DRUGS = [
  "rivaroxaban","apixaban","edoxaban","dabigatran","betrixaban",
  "clopidogrel","ticagrelor","prasugrel","cangrelor",
  "empagliflozin","dapagliflozin","canagliflozin","ertugliflozin",
  "semaglutide","liraglutide","dulaglutide","tirzepatide","exenatide","retatrutide",
  "lisinopril","enalapril","ramipril","captopril","benazepril",
  "losartan","valsartan","irbesartan","telmisartan","candesartan","olmesartan",
  "metoprolol","carvedilol","bisoprolol","atenolol","propranolol","nebivolol",
  "atorvastatin","rosuvastatin","simvastatin","pravastatin","pitavastatin",
  "vancomycin","piperacillin","tazobactam","ceftriaxone","meropenem","levofloxacin","clindamycin","linezolid","daptomycin","ceftazidime",
  "fluconazole","voriconazole","posaconazole","isavuconazole","micafungin","caspofungin","anidulafungin",
  "rituximab","infliximab","adalimumab","vedolizumab","ustekinumab","dupilumab","tocilizumab","secukinumab","ixekizumab","guselkumab","risankizumab",
  "imatinib","ibrutinib","erlotinib","dasatinib","nilotinib","gefitinib","sunitinib","sorafenib","osimertinib","alectinib","crizotinib","palbociclib","ribociclib","abemaciclib",
  "pembrolizumab","nivolumab","ipilimumab","atezolizumab","durvalumab","cemiplimab",
  "methotrexate","hydroxychloroquine","sulfasalazine","leflunomide",
  "fidaxomicin","vancomycin","metronidazole",
  "valganciclovir","ganciclovir","acyclovir","valacyclovir","famciclovir"
];
function _scanDrugNameTypos(text){
  if(!text) return [];
  var SUFFIXES = /([a-z]+axaban|[a-z]+gliflozin|[a-z]+glutide|[a-z]+pril|[a-z]+sartan|[a-z]+olol|[a-z]+statin|[a-z]+azole|[a-z]+candin|[a-z]+mab|[a-z]+tinib|[a-z]+ciclib|[a-z]+cycline|[a-z]+grel)/gi;
  var found = {};
  var match;
  while((match = SUFFIXES.exec(String(text).toLowerCase())) !== null){
    var word = match[1];
    if(_CANONICAL_DRUGS.indexOf(word) >= 0) continue; // valid
    // Find closest canonical drug by simple edit-distance threshold (≤2)
    var best = null, bestDist = 99;
    for(var i=0; i<_CANONICAL_DRUGS.length; i++){
      var cand = _CANONICAL_DRUGS[i];
      if(Math.abs(cand.length - word.length) > 3) continue;
      var d = _levenshtein(word, cand);
      if(d < bestDist){ bestDist = d; best = cand; }
    }
    if(best && bestDist <= 2 && !found[word]){
      found[word] = {found: word, suggest: best, distance: bestDist};
    }
  }
  return Object.values(found);
}
function _levenshtein(a, b){
  var m = a.length, n = b.length;
  if(!m) return n; if(!n) return m;
  var dp = []; for(var i=0;i<=m;i++) dp.push([i]);
  for(var j=1;j<=n;j++) dp[0][j] = j;
  for(var i=1;i<=m;i++){
    for(var j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1 + Math.min(dp[i-1][j-1], dp[i-1][j], dp[i][j-1]);
    }
  }
  return dp[m][n];
}

// slidesShorthand() helper deleted 2026-06-08 — was an experiment in client-side text compression
// for the Slides view. Truncated mid-word and lost clinical nuance; reverted same day. Smart
// compression should happen at generation time (LLM prompt), not at render time. (Task #8)
function _DELETED_slidesShorthand_remove_below(text, maxWords){
  if(!text) return {short:"", original:""};
  var original = String(text);
  var s = original;

  // 1) Stash citation markers so substitutions never touch them.
  //    Replace [N] / [N,M] / [N,M,...] with <idx> placeholders.
  var stashed = [];
  s = s.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, function(m){
    stashed.push(m);
    return "" + (stashed.length - 1) + "";
  });

  // 2) Safe medical abbreviations — these are universally understood by MDs.
  //    Order matters (longer phrases first) to avoid partial-word collisions.
  var subs = [
    [/\bapproximately\b/gi, "~"],
    [/\bgreater than or equal to\b/gi, "≥"],
    [/\bless than or equal to\b/gi, "≤"],
    [/\bgreater than\b/gi, ">"],
    [/\bless than\b/gi, "<"],
    [/\bpatients with\b/gi, "pts w/"],
    [/\bpatients\b/gi, "pts"],
    [/\bpatient\b/gi, "pt"],
    [/\bversus\b/gi, "vs"],
    [/\bbetween\b/gi, "btwn"],
    [/\bwithout\b/gi, "w/o"],
    [/\bwith\b/gi, "w/"],
    [/\bsecondary to\b/gi, "2/2"],
    [/\bdue to\b/gi, "d/t"],
    [/\bhistory of\b/gi, "h/o"],
    [/\bin the setting of\b/gi, "i/s/o"],
    [/\bfollow[- ]?up\b/gi, "f/u"],
    [/\bdiagnosis\b/gi, "dx"],
    [/\btreatment\b/gi, "tx"],
    [/\bmanagement\b/gi, "mgmt"],
    [/\b(\d+)\s*years?\b/gi, "$1y"],
    [/\b(\d+)\s*months?\b/gi, "$1mo"],
    [/\b(\d+)\s*weeks?\b/gi, "$1wk"],
    // Filler — safe to drop entirely
    [/\bparticularly\b/gi, ""],
    [/\btypically\b/gi, ""],
    [/\busually\b/gi, ""],
    [/\bessentially\b/gi, ""],
    [/\bimportantly\b/gi, ""],
    [/\bit is important to (?:note|remember|recognize)(?: that)?\b/gi, ""],
    [/\bplease note that\b/gi, ""],
    [/\bin general\b/gi, ""],
    [/\boverall\b/gi, ""],
    // "X is a Y" → "X: Y" (often)
    [/\bis associated with\b/gi, "→"],
    [/\bresults? in\b/gi, "→"],
    [/\bleads? to\b/gi, "→"]
  ];
  for(var i=0;i<subs.length;i++) s = s.replace(subs[i][0], subs[i][1]);

  // 3) Collapse double spaces and tidy punctuation after filler drops.
  s = s.replace(/\s{2,}/g, " ").replace(/\s+([,.;:])/g, "$1").replace(/^[,;.\s]+/, "").trim();

  // 4) Word-cap. Don't split inside a citation placeholder.
  if(maxWords && maxWords > 0){
    var words = s.split(/\s+/);
    if(words.length > maxWords){
      s = words.slice(0, maxWords).join(" ").replace(/[.,;:]+$/, "") + "…";
    }
  }

  // 5) Restore citation markers.
  s = s.replace(/(\d+)/g, function(_, idx){ return stashed[parseInt(idx, 10)] || ""; });

  return {short: s, original: original};
}

// ═══════════ CITATION RENDERER ═══════════
// Parses [N] / [N,M] markers in talk text and renders them as clickable pills.
// ── Citation chip helpers (OpenEvidence-style: inline pill with source name) ───
// Derive a short, recognizable label from a reference's society / source / trial acronym.
function _citeLabel(ref){
  if(!ref) return "ref";
  var src = String(ref.source || "");
  var type = String(ref.type || "").toLowerCase();
  // User-uploaded reference — distinct label so the reader sees "this came from your reference, not corpus"
  if(type === "user-upload" || type === "user_upload" || type === "upload"){
    // Strip extension + truncate
    var clean = src.replace(/\.(pdf|txt|docx?|md|jpe?g|png)$/i,"");
    if(clean.length > 14) clean = clean.slice(0,12)+"…";
    return "📎 " + clean;
  }
  // Trial acronym pattern: ALL-CAPS, optionally hyphenated, at the start (e.g. "DAPA-HF", "EMPEROR-Reduced", "PARADIGM-HF")
  var trial = src.match(/^([A-Z][A-Z0-9]+(?:-[A-Za-z0-9]+)?)\b/);
  if(trial) return trial[1];
  // Society label preferred for guidelines (e.g., "AHA", "KDIGO", "IDSA")
  if((type === "guideline" || ref.society) && ref.society && ref.society.length <= 12) return ref.society;
  // (Recognized journal abbreviations are checked further down — NEJM, JAMA, CJASN, JACC, etc.
  //  Only fall back to "PMID N" if the journal name doesn't match any of those.)
  // Common journal abbreviations
  var lower = src.toLowerCase();
  var journals = [
    ["new england journal","NEJM"],["nejm","NEJM"],
    ["journal of the american college of cardiology","JACC"],["jacc","JACC"],
    ["circulation","Circulation"],
    ["lancet","Lancet"],
    ["jama","JAMA"],
    ["kidney international","Kidney Int"],
    ["clinical journal of the american society of nephrology","CJASN"],["cjasn","CJASN"],
    ["american journal of kidney diseases","AJKD"],["ajkd","AJKD"],
    ["annals of internal medicine","Ann Intern Med"],
    ["diabetes care","Diabetes Care"],
    ["chest","CHEST"],
    ["thorax","Thorax"],
    ["gut","Gut"],
    ["hepatology","Hepatology"],
    ["blood","Blood"],
    ["clinical infectious diseases","CID"],
    ["british medical journal","BMJ"],["bmj","BMJ"]
  ];
  for(var j=0;j<journals.length;j++){ if(lower.indexOf(journals[j][0])>=0) return journals[j][1]; }
  // Society fallback (longer)
  if(ref.society) return ref.society.length<=14?ref.society:ref.society.slice(0,12)+"…";
  // PMID fallback for original journal articles when no recognizable journal name (Jenni 2026-06-04)
  var pmidMatch = String(ref.url||"").match(/pubmed\.ncbi\.nlm\.nih\.gov\/(\d{6,9})/);
  if(pmidMatch) return "PMID " + pmidMatch[1];
  // Last resort: truncate the source
  if(src.length<=16) return src;
  return src.slice(0,14)+"…";
}
// Color class — guidelines warm/orange, trials plum, journal articles cool/blue.
function _citeClass(ref){
  if(!ref) return "cite";
  var t = String(ref.type || "").toLowerCase();
  if(t === "guideline" || ref.society) return "cite cite-guideline";
  // Trial = ALL-CAPS acronym style
  if(/^[A-Z][A-Z0-9-]{2,}/.test(String(ref.source||""))) return "cite cite-trial";
  return "cite cite-journal";
}

// Only allow http(s) URLs into an href — refs come from the model, so a stray "javascript:" URL
// shouldn't become a clickable link. (audit hygiene)
function _safeUrl(u){ u = String(u || ""); return /^https?:\/\//i.test(u) ? u : ""; }

function renderCite(text, refs) {
  if (!text) return "";
  if (!refs || !refs.length) return esc(String(text));
  // First, merge consecutive markers like "[1][2][3]" into a single "[1,2,3]" form so the renderer
  // produces one combined chip rather than three crowded ones. (Jenni 2026-06-09 — citation chip clutter.)
  var s = String(text).replace(/\](\s*)\[/g, ",");
  var html = "";
  var lastIdx = 0;
  var re = /\[(\d+(?:\s*,\s*\d+)*)\]/g;
  var m;
  // Build a quick lookup for refs by id
  var refMap = {};
  for(var rr=0; rr<refs.length; rr++){ refMap[String(refs[rr].id)] = refs[rr]; }
  while ((m = re.exec(s)) !== null) {
    html += esc(s.slice(lastIdx, m.index));
    var ids = m[1].split(",").map(function(x){return x.trim()});
    // Collect resolved refs (skip unknown ids)
    var resolved = [];
    for(var i=0;i<ids.length;i++){ if(refMap[ids[i]]) resolved.push({id:ids[i], ref:refMap[ids[i]]}); }
    if(resolved.length === 0){
      // No matches — render raw bracketed text so the user can still see the marker
      for(var ix=0;ix<ids.length;ix++) html += '[' + ids[ix] + ']';
    } else {
      // First ref gets the labeled chip; extra refs collapse into a "+N" suffix on the same chip.
      // data-refs carries ALL ids so the popover can show every source (fixes the old bug where the
      // "+N" chip only ever surfaced the first reference). (Codex citation fix)
      var first = resolved[0];
      var allIds = resolved.map(function(r){ return r.id; }).join(",");
      var extraCount = resolved.length - 1;
      html += '<span class="' + _citeClass(first.ref) + '" data-ref="' + esc(first.id) + '" data-refs="' + esc(allIds) + '" title="' + esc(first.ref.source || _citeLabel(first.ref)) + '" tabindex="0" role="button">';
      html += esc(_citeLabel(first.ref));
      if(extraCount > 0) html += '<span class="cite-plus">+' + extraCount + '</span>';
      html += '</span>';
    }
    lastIdx = m.index + m[0].length;
  }
  html += esc(s.slice(lastIdx));
  return html;
}

// Show/hide citation popover (single global element). Accepts one id or a comma-separated list of ids
// (from the chip's data-refs) so a merged "[1,2]" chip shows ALL of its sources. (Codex citation fix)
function showCitePop(anchor, refIds) {
  hideCitePop();
  if (!S.talk || !S.talk.references) return;
  var ids = String(refIds || (anchor && anchor.dataset && anchor.dataset.ref) || "").split(",").map(function(x){ return x.trim(); }).filter(Boolean);
  if (!ids.length) return;
  var items = ids.map(function(id){
    for (var i = 0; i < S.talk.references.length; i++) { if (String(S.talk.references[i].id) === String(id)) return { id:id, ref:S.talk.references[i] }; }
    return null;
  }).filter(Boolean);
  if (!items.length) return;
  var totalRefs = S.talk.references.length;
  function refBlock(item){
    var ref = item.ref, refId = item.id;
    var tagClass = "", tagLabel = "";
    if (String(ref.type||"").toLowerCase() === "guideline" || ref.society) { tagClass = "tag-guideline"; tagLabel = "Guideline"; }
    else if (String(ref.type||"").toLowerCase() === "trial" || /^[A-Z][A-Z0-9-]{2,}/.test(String(ref.source||""))) { tagClass = "tag-trial"; tagLabel = "Trial"; }
    else if (ref.type) { tagLabel = ref.type; }
    var journalParts = [];
    if (ref.society) journalParts.push('<span class="cp-society">'+esc(ref.society)+'</span>');
    if (ref.year)    journalParts.push('<span class="cp-year">'+esc(String(ref.year))+'</span>');
    var _url = _safeUrl(ref.url);   // http(s) only \u2014 never a javascript: URL from the model
    return '<div class="cite-pop-item">' +
      '<div class="cite-pop-title">' +
        '<span class="cite-pop-num">'+esc(String(refId))+'.</span>' +
        (_url
          ? '<a href="' + esc(_url) + '" target="_blank" rel="noopener">'+esc(ref.source || "Reference "+refId)+'</a>'
          : esc(ref.source || "Reference "+refId)) +
      '</div>' +
      (journalParts.length ? '<div class="cite-pop-journal">'+journalParts.join(' &middot; ')+'</div>' : '') +
      (tagLabel ? '<span class="cite-pop-tag '+tagClass+'">'+esc(tagLabel)+'</span>' : '') +
      (_url ? '<div><a class="cite-pop-link" href="'+esc(_url)+'" target="_blank" rel="noopener">View source \u2192</a></div>' : '') +
    '</div>';
  }
  var pop = document.createElement("div");
  pop.className = "cite-pop";
  pop.id = "citePop";
  pop.innerHTML =
    '<button class="cite-pop-close" onclick="hideCitePop()" aria-label="Close">\u00D7</button>' +
    '<div class="cite-pop-head"><span>Reference'+(items.length>1?"s":"")+'</span><a class="cite-pop-seeall" data-action="see-all">See all ('+totalRefs+')</a></div>' +
    items.map(refBlock).join("");
  document.body.appendChild(pop);
  // Position below the anchor; flip up if too close to viewport bottom.
  // Uses ACTUAL offsetWidth/Height post-append so the popover sizes against its real content,
  // not a hardcoded 320px. Clamps both axes to keep the popover fully on-screen, especially on
  // narrow mobile viewports where the chip can sit near the right edge. (Jenni 2026-06-09 fix)
  var r = anchor.getBoundingClientRect();
  var popW = pop.offsetWidth || 320;
  var popH = pop.offsetHeight || 160;
  var GAP = 8;
  var vw = window.innerWidth;
  var vh = window.innerHeight;
  // Horizontal: try to anchor to the chip's left edge, clamp to viewport with 8px gutter.
  var left = r.left + window.scrollX;
  left = Math.min(left, window.scrollX + vw - popW - 8);
  left = Math.max(window.scrollX + 8, left);
  // Vertical: try below the chip first, flip above if it'd clip; if both clip, snap to whichever
  // edge gives more room and keep it inside the viewport.
  var spaceBelow = vh - r.bottom - GAP;
  var spaceAbove = r.top - GAP;
  var top;
  if (popH <= spaceBelow) {
    top = r.bottom + window.scrollY + GAP / 2;
  } else if (popH <= spaceAbove) {
    top = r.top + window.scrollY - popH - GAP / 2;
  } else {
    // Neither side fits — pin to viewport top and let user scroll the popover if it overflows.
    top = window.scrollY + 8;
  }
  pop.style.left = left + "px";
  pop.style.top = top + "px";
  // Keep popover open if mouse enters it; hide on leave (with small delay)
  pop.addEventListener("mouseenter", function(){ if(window._citePopHideTimer){clearTimeout(window._citePopHideTimer); window._citePopHideTimer=null;} });
  pop.addEventListener("mouseleave", function(){ window._citePopHideTimer = setTimeout(hideCitePop, 150); });
  // "See all" click scrolls to the references section
  var seeAll = pop.querySelector('[data-action="see-all"]');
  if (seeAll) seeAll.onclick = function(){
    hideCitePop();
    var refSec = document.getElementById("refsBlock") || document.querySelector('[data-references-block]');
    if (refSec) refSec.scrollIntoView({ behavior:"smooth", block:"start" });
  };
}
function hideCitePop() {
  if (window._citePopHideTimer) { clearTimeout(window._citePopHideTimer); window._citePopHideTimer = null; }
  var p = document.getElementById("citePop");
  if (p) p.remove();
}

// Hover + click delegation for citation chips.
// Hover (desktop): 120ms delay open, 150ms delay close \u2014 feels snappy without flickering.
// Click (touch + power users): toggles the popover instantly.
window._citeHoverTimer = null;
document.addEventListener("mouseover", function(e){
  var t = e.target && e.target.closest && e.target.closest(".cite");
  if (!t) return;
  if (t.contains(e.relatedTarget)) return;   // moving WITHIN the chip (e.g. onto "+N") — ignore, no flicker
  if (window._citeHoverTimer) clearTimeout(window._citeHoverTimer);
  if (window._citePopHideTimer) { clearTimeout(window._citePopHideTimer); window._citePopHideTimer = null; }
  window._citeHoverTimer = setTimeout(function(){ showCitePop(t, t.dataset.refs || t.dataset.ref); }, 120);
});

  if (!t) return;

// Sticky capsule scroll listener (Jenni 2026-06-09).
// Toggles a body class once user has scrolled past the capsule's natural top position, so the
// capsule visually compresses (less padding, hidden labels) — talk content gets more focus.
// Uses requestAnimationFrame for cheap throttling.
(function(){
  var ticking = false;
  function update(){
    var threshold = 100; // px scrolled before compress kicks in
    var scrolled = (window.scrollY || window.pageYOffset || 0) > threshold;
    document.body.classList.toggle("scrolled-past-capsule", scrolled);
    ticking = false;
  }
  window.addEventListener("scroll", function(){
    if(!ticking){ requestAnimationFrame(update); ticking = true; }
  }, { passive: true });
})();


function stripCitations(str) {
  if (typeof str !== "string") return str;
  // Strips ONLY XML/HTML citation markup (web_search <cite> tags, footnote spans) — NOT the
  // numeric [N] inline markers, which are the citation-chip feature. Deleting [N] here was the
  // root cause of "citations don't show": the model emitted them and this function ate them. (Jenni 2026-07-10)
  return str
    .replace(/<\/?antml:cite[^>]*>/gi, "")
    .replace(/<\/?cite[^>]*>/gi, "")
    .trim();
}


// Strip references the model didn't actually cite in body text AND that aren't in retrieved RAG chunks.
function pruneFakeReferences(talk) {
  if (!talk || !Array.isArray(talk.references) || talk.references.length === 0) return talk;
  var bodyText = JSON.stringify(talk);
  var retrievedPmids = {};
  if (S.ragChunks && S.ragChunks.length) {
    for (var k = 0; k < S.ragChunks.length; k++) {
      if (S.ragChunks[k].pmid) retrievedPmids[String(S.ragChunks[k].pmid)] = true;
    }
  }
  talk.references = talk.references.filter(function(r) {
    if (!r) return false;
    var isRetrieved = r.pmid && retrievedPmids[String(r.pmid)];
    var bodyMentions = r.source && bodyText.indexOf(r.source) !== -1;
    // User uploads are trusted by definition — the user explicitly handed us this source
    var isUserUpload = r.type === "user-upload" || r.type === "user_upload" || r.type === "upload";
    return isRetrieved || bodyMentions || isUserUpload;
  });
  // ── NEW: audit inline PMIDs in the body prose. If Claude wrote "PMID 12345678" but that PMID is
  // neither in the retrieved RAG chunks nor in the (now-pruned) references array, strip the PMID
  // and replace with a generic [unverified] tag so the user sees the claim was not source-grounded.
  // Closes the biggest credibility hole flagged in the 2026-06-04 RAG audit.
  var trustedPmids = {};
  for (var rk in retrievedPmids) trustedPmids[rk] = true;
  (talk.references || []).forEach(function(r){ if (r && r.pmid) trustedPmids[String(r.pmid)] = true; });
  function auditInlinePmids(str) {
    if (typeof str !== "string") return str;
    var out = str;
    // First pass: strip parenthetical PMID mentions where the WHOLE parenthetical is unverified PMIDs
    //   "lower CV mortality (PMID 12345)" → "lower CV mortality"
    //   "lower CV mortality (PMID 12345, 67890)" → "lower CV mortality" if both unverified
    out = out.replace(/\s*\(\s*PMID\s*[:\-]?\s*[\d,;\s]+\)/gi, function(paren){
      var pmids = paren.match(/\d{6,9}/g) || [];
      var anyVerified = pmids.some(function(p){ return trustedPmids[p]; });
      if (anyVerified) {
        // keep verified PMIDs only inside the parenthetical
        var keep = pmids.filter(function(p){ return trustedPmids[p]; });
        return " (PMID " + keep.join(", ") + ")";
      }
      return ""; // all unverified — drop the whole parenthetical
    });
    // Second pass: bare "PMID 12345" tokens not inside parens
    out = out.replace(/\s*,?\s*PMID\s*[:\-]?\s*(\d{6,9})/gi, function(match, pmid){
      if (trustedPmids[pmid]) return " (PMID " + pmid + ")"; // keep verified
      return ""; // silently drop
    });
    // Cleanup: collapse double spaces, fix orphaned commas
    out = out.replace(/\s+([,.;])/g, "$1").replace(/\s{2,}/g, " ").trim();
    return out;
  }
  function walk(node) {
    if (typeof node === "string") return auditInlinePmids(node);
    if (Array.isArray(node)) return node.map(walk);
    if (node && typeof node === "object") {
      var out = {};
      for (var key in node) {
        // Don't audit inside the references array itself — those PMIDs are already pruned above
        if (key === "references") { out[key] = node[key]; continue; }
        out[key] = walk(node[key]);
      }
      return out;
    }
    return node;
  }
  return walk(talk);
}

// ═══════════ CLAIM-LEVEL CITATION VERIFICATION ═══════════
// pruneFakeReferences() only checks a cited PMID EXISTS in our trusted set (presence).
// This step closes the harder gap: does the cited abstract actually SUPPORT the specific
// sentence it's attached to? A real PMID next to a claim it doesn't substantiate reads as
// rigor without being rigor. We verify each (claim, abstract) pair against the retrieved
// abstracts (no extra fetch — we already hold them in S.ragChunks) and strip the inline
// PMID from any claim the source doesn't support.
async function verifyCitations(talk) {
  if (!talk || !S.ragChunks || !S.ragChunks.length) return talk;
  // Map of PMID -> abstract text for everything we actually retrieved.
  var absByPmid = {};
  for (var i = 0; i < S.ragChunks.length; i++) {
    var ch = S.ragChunks[i];
    if (ch.pmid && ch.text) absByPmid[String(ch.pmid)] = { abstract: ch.text, title: ch.title || "" };
  }
  if (!Object.keys(absByPmid).length) return talk;

  // Collect (claim string, pmid) pairs from inline "PMID 12345" / "(PMID 12345)" markers.
  // Only verify PMIDs we hold an abstract for; unknown ones are handled by pruneFakeReferences.
  var PMID_RE = /PMID\s*[:\-]?\s*(\d{6,9})/gi;
  var pairs = [];           // { claim, pmid }
  var seen = {};            // dedupe identical claim+pmid
  function collect(str) {
    if (typeof str !== "string") return;
    var m;
    PMID_RE.lastIndex = 0;
    while ((m = PMID_RE.exec(str)) !== null) {
      var pmid = m[1];
      if (!absByPmid[pmid]) continue;
      var key = pmid + "::" + str;
      if (seen[key]) continue;
      seen[key] = true;
      // The claim is the sentence/bullet the marker sits in, with citation noise removed.
      var claim = str.replace(/\(?\s*PMID\s*[:\-]?\s*\d{6,9}\s*\)?/gi, "").replace(/\s{2,}/g, " ").trim();
      if (claim.length >= 12) pairs.push({ claim: claim, pmid: pmid });
    }
  }
  function walkCollect(node) {
    if (typeof node === "string") collect(node);
    else if (Array.isArray(node)) node.forEach(walkCollect);
    else if (node && typeof node === "object") for (var k in node) { if (k !== "references") walkCollect(node[k]); }
  }
  walkCollect(talk);
  if (!pairs.length) return talk;
  // Bound cost: verify at most the first 14 distinct claim/PMID pairs.
  pairs = pairs.slice(0, 14);

  // One batched judge call. Returns, per index, whether the abstract supports the claim.
  var items = pairs.map(function(p, idx) {
    var src = absByPmid[p.pmid];
    return { i: idx, pmid: p.pmid, claim: p.claim, abstract: (src.abstract || "").slice(0, 1400) };
  });
  var sys = "You are a strict evidence auditor. For each item you are given a CLAIM from a medical teaching talk and the ABSTRACT of the source cited for it (by PMID). Decide whether the abstract DIRECTLY SUPPORTS the specific claim — i.e. a careful reader would agree the abstract substantiates that exact statement (same drug/threshold/population/direction of effect). General topical relatedness is NOT support. If the abstract is about the same disease but does not establish the specific claim, mark it unsupported. Output ONLY a JSON array, one object per item: {\"i\":<index>,\"supported\":true|false}. No other text.";
  var inp = JSON.stringify(items);
  var verdicts = {};
  try {
    var res = await callAPIWithFallback(sys, inp, 1024, [MODEL_CRITIC]);
    var arr = JSON.parse(fixJSON(res.txt));
    if (Array.isArray(arr)) arr.forEach(function(v){ if (v && typeof v.i === "number") verdicts[v.i] = !!v.supported; });
  } catch (e) {
    console.warn("Citation verification failed, leaving citations as-is:", e.message);
    return talk; // fail open — never block a talk on the auditor
  }

  // Build the set of (claim, pmid) pairs judged UNSUPPORTED, then strip just those inline markers.
  var stripSet = {};
  S.citeAudit = { checked: pairs.length, dropped: 0 };
  for (var pi = 0; pi < pairs.length; pi++) {
    if (verdicts[pi] === false) { stripSet[pairs[pi].pmid + "::" + pairs[pi].claim] = true; S.citeAudit.dropped++; }
  }
  if (!S.citeAudit.dropped) return talk;
  function stripUnsupported(str) {
    if (typeof str !== "string") return str;
    var claim = str.replace(/\(?\s*PMID\s*[:\-]?\s*\d{6,9}\s*\)?/gi, "").replace(/\s{2,}/g, " ").trim();
    var out = str.replace(PMID_RE, function(match, pmid) {
      return stripSet[pmid + "::" + claim] ? "" : match;
    });
    return out.replace(/\(\s*\)/g, "").replace(/\s+([,.;])/g, "$1").replace(/\s{2,}/g, " ").trim();
  }
  function walkStrip(node) {
    if (typeof node === "string") return stripUnsupported(node);
    if (Array.isArray(node)) return node.map(walkStrip);
    if (node && typeof node === "object") {
      var o = {};
      for (var k in node) { o[k] = (k === "references") ? node[k] : walkStrip(node[k]); }
      return o;
    }
    return node;
  }
  console.info("Citation audit: dropped " + S.citeAudit.dropped + "/" + S.citeAudit.checked + " unsupported inline PMID citation(s)");
  return walkStrip(talk);
}

function deepCleanCitations(obj) {
  if (typeof obj === "string") return stripCitations(obj);
  if (Array.isArray(obj)) return obj.map(deepCleanCitations);
  if (obj && typeof obj === "object") {
    var out = {};
    for (var k in obj) out[k] = deepCleanCitations(obj[k]);
    return out;
  }
  return obj;
}

// ─────────────────────────────────────────────────────────────────────────
// Progressive rendering (Jenni 2026) — parse an INCOMPLETE JSON string mid-stream
// so the loading view can show sections as they draft. Best-effort: returns null
// when the buffer can't yet be coerced into valid JSON; the next chunk retries.
// We scan the buffer tracking string/bracket state, then auto-close open strings
// and brackets at the truncation point and JSON.parse the repaired result. A few
// fallback cut points (last comma / brace / bracket) handle a half-written token.
// ─────────────────────────────────────────────────────────────────────────
function _scanJSONState(s){
  var stack=[], inStr=false, esc=false;
  for(var i=0;i<s.length;i++){
    var c=s[i];
    if(inStr){ if(esc){esc=false;} else if(c==="\\"){esc=true;} else if(c==='"'){inStr=false;} continue; }
    if(c==='"'){ inStr=true; }
    else if(c==='{'){ stack.push('}'); }
    else if(c==='['){ stack.push(']'); }
    else if(c==='}'||c===']'){ stack.pop(); }
  }
  return {stack:stack, inStr:inStr, esc:esc};
}
function parsePartialJSON(raw){
  if(!raw) return null;
  var start=raw.indexOf("{");
  if(start<0) return null;
  var s=raw.slice(start);
  // Try the full buffer first, then a few structural fallback cut points.
  var cuts=[s.length];
  var lc=s.lastIndexOf(","); if(lc>0) cuts.push(lc);
  var lo=s.lastIndexOf("}"); if(lo>0) cuts.push(lo+1);
  var la=s.lastIndexOf("]"); if(la>0) cuts.push(la+1);
  for(var ci=0;ci<cuts.length;ci++){
    var sub=s.slice(0,cuts[ci]);
    if(!sub) continue;
    var st=_scanJSONState(sub);
    var fixed=sub;
    if(st.inStr){ if(st.esc) fixed=fixed.slice(0,-1); fixed+='"'; }   // close an open string
    fixed=fixed.replace(/[\s,]+$/,"");                                 // drop trailing comma/ws
    fixed=fixed.replace(/"[^"]*"\s*:\s*$/,"").replace(/[\s,]+$/,"");   // drop a dangling key:
    fixed=fixed.replace(/[\s,]+$/,"");
    var closers=st.stack.slice().reverse().join("");
    try { var o=JSON.parse(fixed+closers); if(o && typeof o==="object") return o; } catch(e){}
  }
  return null;
}

function fixJSON(raw) {
  // Strip web-search citation MARKUP (XML/HTML <cite> tags) that leaks into output — but NOT the
  // numeric [N] markers or '>' characters. The old /]*>/g regex ate every '>' (mangling medical
  // inequalities like "eGFR > 60") and broke the tag-stripping itself. (Jenni 2026-07-10)
  var t = raw.replace(/<\/?antml:cite[^>]*>/gi,"").replace(/<\/?cite[^>]*>/gi,"");
  t = t.replace(/```json/g,"").replace(/```/g,"").trim();
  try { return JSON.parse(t), t; } catch(e) {}
  // Truncate at the LAST `}` if there's trailing text after the JSON body (common when the
  // model adds a postscript paragraph after the valid object). Use balanced-depth walk so we
  // pick the OUTER closing brace, not a nested one inside the talk body. (Jenni 2026-06-09)
  // Walk forward to find the first `{` or `[` and forward-walk depth to its matching close.
  // Returns {start, end} or null if no balanced structure found. (Jenni 2026-06-10 fix: previously
  // the truncated substring kept the preamble — `t.substring(0, close+1)` — which still failed parse
  // when the model wrote "Looking at the references...\n\n{...}" before the JSON.)
  var braceRange = (function(){
    var startOpen = -1;
    for (var i = 0; i < t.length; i++) { if (t[i] === "{" || t[i] === "[") { startOpen = i; break; } }
    if (startOpen < 0) return null;
    var depth = 0, inStr = false, esc = false, lastClose = -1;
    var openCh = t[startOpen], closeCh = (openCh==="{"?"}":"]");
    for (var j = startOpen; j < t.length; j++) {
      var ch = t[j];
      if (esc) { esc = false; continue; }
      if (inStr) {
        if (ch === "\\") { esc = true; continue; }
        if (ch === '"') inStr = false;
        continue;
      }
      if (ch === '"') { inStr = true; continue; }
      if (ch === openCh) depth++;
      else if (ch === closeCh) {
        depth--;
        if (depth === 0) lastClose = j;
      }
    }
    return { start: startOpen, end: lastClose };
  })();
  if (braceRange && braceRange.end > braceRange.start) {
    // Slice from the open brace to the matching close — drops preamble AND any postscript.
    var sliced = t.substring(braceRange.start, braceRange.end + 1);
    try { JSON.parse(sliced); return sliced; } catch (eTrunc) {
      // Fall through to legacy heuristics on failure
    }
  }
  // Also strip leading preamble before the first `{`/`[` so the legacy fallback below stops
  // erroring with "Unexpected token 'L'" / "Unexpected token 'H'" / etc.
  var firstBrace = -1;
  for (var fb = 0; fb < t.length; fb++) { if (t[fb] === "{" || t[fb] === "[") { firstBrace = fb; break; } }
  if (firstBrace > 0) t = t.substring(firstBrace);
  if (!t.endsWith("}")) { var idx = t.lastIndexOf("}"); if (idx > 0) t = t.substring(0, idx + 1); }
  try { return JSON.parse(t), t; } catch(e) {}
  var tryPoints = [];
  for (var i = t.length - 1; i > t.length * 0.3; i--) {
    if (t[i]==="}"||t[i]==="]"||t[i]==='"') tryPoints.push(i);
  }
  for (var p = 0; p < tryPoints.length && p < 40; p++) {
    var attempt = t.substring(0, tryPoints[p] + 1).replace(/,\s*$/,"");
    var ob=(attempt.match(/{/g)||[]).length-(attempt.match(/}/g)||[]).length;
    var sb=(attempt.match(/\[/g)||[]).length-(attempt.match(/\]/g)||[]).length;
    for(var k=0;k<sb;k++) attempt+="]";
    for(var k2=0;k2<ob;k2++) attempt+="}";
    ob=(attempt.match(/{/g)||[]).length-(attempt.match(/}/g)||[]).length;
    for(var k3=0;k3<ob;k3++) attempt+="}";
    try { return JSON.parse(attempt), attempt; } catch(e2) {}
  }
  return t;
}

function wrapText(text,max){if(!text||text.length<=max)return[text||""];var w=text.split(" "),l=[],c="";for(var i=0;i<w.length;i++){if((c+" "+w[i]).trim().length>max&&c){l.push(c.trim());c=w[i]}else c=(c+" "+w[i]).trim()}if(c)l.push(c.trim());return l.slice(0,3)}

function autoLayout(nodes,arrows){
  var inc={};for(var i=0;i<arrows.length;i++)inc[arrows[i].to]=true;
  var root=null;
  for(var i2=0;i2<nodes.length;i2++){if(nodes[i2].type==="title"){root=nodes[i2].id;break}}
  if(!root){for(var i3=0;i3<nodes.length;i3++){if(!inc[nodes[i3].id]){root=nodes[i3].id;break}}}
  if(!root)root=nodes[0].id;
  var ch={};for(var i4=0;i4<nodes.length;i4++)ch[nodes[i4].id]=[];
  for(var i5=0;i5<arrows.length;i5++){if(ch[arrows[i5].from])ch[arrows[i5].from].push(arrows[i5].to)}
  var layers={},vis={},q=[{id:root,layer:0}];vis[root]=true;
  while(q.length>0){var cur=q.shift();if(!layers[cur.layer])layers[cur.layer]=[];layers[cur.layer].push(cur.id);var c2=ch[cur.id]||[];for(var ci=0;ci<c2.length;ci++){if(!vis[c2[ci]]){vis[c2[ci]]=true;q.push({id:c2[ci],layer:cur.layer+1})}}}
  for(var i6=0;i6<nodes.length;i6++){if(!vis[nodes[i6].id]){var ml=Object.keys(layers).length;if(!layers[ml])layers[ml]=[];layers[ml].push(nodes[i6].id)}}
  var tl=Object.keys(layers).length;
  var lk=Object.keys(layers).sort(function(a,b){return parseInt(a)-parseInt(b)});
  for(var li=0;li<lk.length;li++){var layer=parseInt(lk[li]);var items=layers[lk[li]];for(var ii=0;ii<items.length;ii++){var ni=nodes.findIndex(function(n){return n.id===items[ii]});if(ni>=0){nodes[ni].x=items.length===1?0.5:0.12+(ii/(items.length-1))*0.76;nodes[ni].y=tl===1?0.5:0.08+(layer/Math.max(tl-1,1))*0.84}}}
}

// ═══════════ API ═══════════
// ── MULTI-PROVIDER GENERATION (Jenni 2026-07-03) ─────────────────────────────────────────────
// Claude is the default (free tier + BYOK). Users can pick ChatGPT or Gemini, which run on their
// OWN key (BYOK) and never touch the free tier. The three provider calls live behind callAPI() so
// every caller (generate / critique / refine / proofread) stays identical.
function getOpenAIKeyRaw(){ return (localStorage.getItem("openai_api_key")||"").trim(); }
function getGeminiKeyRaw(){ return (localStorage.getItem("gemini_api_key")||"").trim(); }
function _sysToText(sys){ if(typeof sys==="string") return sys; if(Array.isArray(sys)) return sys.map(function(p){return (p&&p.text)||"";}).filter(Boolean).join("\n\n"); return String(sys||""); }
function _contentToText(content){ if(typeof content==="string") return content; if(Array.isArray(content)) return content.map(function(p){return (p&&p.type==="text")?p.text:"";}).filter(Boolean).join("\n\n"); return String(content||""); }
// Convert Anthropic-style content parts (text + document/image, from buildReferenceParts) into the
// native shapes ChatGPT and Gemini expect — so uploaded PDFs/images actually reach those models
// instead of being silently dropped to text-only. (Jenni 2026-07 — Codex bug #1.)
function _toGeminiParts(content){
  if(typeof content==="string") return [{text:content}];
  if(!Array.isArray(content)) return [{text:String(content||"")}];
  var out=[];
  content.forEach(function(p){
    if(!p) return;
    if(p.type==="text"){ if(p.text) out.push({text:p.text}); }
    else if((p.type==="document"||p.type==="image") && p.source && p.source.type==="base64" && p.source.data){
      out.push({inlineData:{mimeType:p.source.media_type||(p.type==="document"?"application/pdf":"image/png"),data:p.source.data}});
    }

}
function _toOpenAIContent(content){
  if(typeof content==="string") return content;
  if(!Array.isArray(content)) return String(content||"");
  var hasMedia = content.some(function(p){return p && (p.type==="document"||p.type==="image") && p.source && p.source.data;});
  if(!hasMedia) return _contentToText(content); // plain text → simple string
  var out=[];
  content.forEach(function(p){
    if(!p) return;
    if(p.type==="text"){ if(p.text) out.push({type:"text",text:p.text}); }
    else if(p.type==="image" && p.source && p.source.data){
      out.push({type:"image_url",image_url:{url:"data:"+(p.source.media_type||"image/png")+";base64,"+p.source.data}});
    }
    else if(p.type==="document" && p.source && p.source.data){
      out.push({type:"file",file:{filename:(p.title||"reference.pdf"),file_data:"data:"+(p.source.media_type||"application/pdf")+";base64,"+p.source.data}});
    }
  });
  return out.length?out:"";
}
// Does THIS generation draw from the free tier? Only when the provider is Claude AND the user is a

async function _callOpenAIText(sys, content, maxTok, opts){

  if(!_proxy){ throw new Error("ChatGPT needs the proxy to be configured. Switch to Claude or Gemini."); }
  var _oaEndpoint = _proxy.replace(/\/$/,"") + "/v1/openai/chat";
  var fo = {method:"POST",headers:{"Content-Type":"application/json","X-Provider-Key":key},body:JSON.stringify(body)};
  if(opts.signal) fo.signal = opts.signal;
  var r = await fetch(_oaEndpoint, fo);
  if(!r.ok){
    var ed={}; try{ ed=await r.json(); }catch(_){}
    var m=(ed.error&&ed.error.message)||("OpenAI API error "+r.status);
    if(r.status===401||r.status===403) throw new Error("Your OpenAI key was rejected. Update it, or switch the model to Claude.");
    if(r.status===429) throw new Error("OpenAI rate limit or out of credits. Top up your OpenAI account, or switch to Claude.");
    throw new Error(m);
  }
  var d = await r.json();
  return (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "";
}

async function callAPI(sys, content, maxTok, opts) {
  opts = opts || {};
  // Provider dispatch: BYOK ChatGPT/Gemini route to their own API; Claude falls through to the
  // existing (free-tier-or-BYOK) logic below. (Jenni 2026-07-03)
  var _prov = S.genProvider || "claude";
  if(_prov === "openai") return await _callOpenAIText(sys, content, maxTok, opts);
  if(_prov === "gemini") return await _callGeminiText(sys, content, maxTok, opts);
  // Anthropic prompt caching: wrap the (static, ~5000-token) system prompt in a single block with
  // cache_control:ephemeral so subsequent calls within 5 min hit the cache. ~80% cheaper + faster
  // on cache-hit. Strings are still accepted for backward compat; we only upgrade if sys is long
  // enough to be worth caching (Anthropic minimum is 1024 tokens / ~4096 chars). (Jenni 2026-06-09)
  var systemField;
  if (typeof sys === "string" && sys.length >= 4096) {
    systemField = [{ type: "text", text: sys, cache_control: { type: "ephemeral" } }];
  } else {
    systemField = sys;
  }
  var body = {
    model: opts.model || MODEL,
    max_tokens: maxTok,
    system: systemField,
    messages: [{role:"user", content: content}]
  };
  if (opts.tools) body.tools = opts.tools;
  // Streaming mode (Jenni 2026-06-09 #3) — when opts.onStreamChunk is provided, request SSE from
  // Anthropic, parse content_block_delta events as they arrive, and surface them via the callback
  // so the loading UI can show progressive feedback. The Worker just pipes the response body
  // through unchanged. Returns a payload shaped like the non-streaming response.
  if (opts.onStreamChunk) body.stream = true;
  // Routing priority: (1) free tier (signed in, no own key) → Worker on Jenni's key;
  // (2) demo proxy (if enabled) → Worker; (3) BYOK → direct to Anthropic.
  var useFree = freeTierActive();
  var useProxy = !useFree && PROXY_CONFIG.enabled && PROXY_CONFIG.url && !S.useByok;
  var endpoint, headers;
  if (useFree) {
    endpoint = RAG_CONFIG.url.replace(/\/$/, "") + "/v1/messages";
    headers = {"Content-Type":"application/json","X-Supabase-Auth":freeTierToken(),"X-CT-Meter":(opts.meterKind||"aux")};
  } else if (useProxy) {
    endpoint = PROXY_CONFIG.url.replace(/\/$/, "") + "/v1/messages";
    headers = {"Content-Type":"application/json"};
  } else {
    var key = getClaudeKey();
    if (!key) throw new Error("Anthropic API key required. Click 'Set key' in the header, or switch to Demo mode if available.");
    endpoint = "https://api.anthropic.com/v1/messages";
    headers = {"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  }
  // Try the request with up to 2 retries for transient overload (529) / unavailable (503).
  // AbortController support (Jenni 2026-06-09 #5) — caller can pass opts.signal to cut the
  // request when generation is cancelled or restarted mid-flight, saving real API budget.
  var r, attempt = 0;
  while (true) {
    var fetchOpts = {method:"POST", headers:headers, body:JSON.stringify(body)};
    if (opts.signal) fetchOpts.signal = opts.signal;
    try {
      r = await fetch(endpoint, fetchOpts);
    } catch (abortErr) {
      if (abortErr && abortErr.name === "AbortError") {
        throw new Error("AbortError: generation cancelled");
      }
      throw abortErr;
    }
    if (useProxy) {
      var rem = r.headers.get("X-RateLimit-Remaining");
      if (rem !== null && rem !== "") S.rateRemaining = parseInt(rem);
    }
    // Retry transient server overload up to 2 times with backoff
    if ((r.status === 529 || (r.status === 503 && !useFree)) && attempt < 2) {
      var waitMs = 4000 * (attempt + 1); // 4s, then 8s
      attempt++;
      await new Promise(function(resolve){setTimeout(resolve, waitMs)});
      continue;
    }
    break;
  }
  if(!r.ok){var e={};try{e=await r.json()}catch(x){}
    // Free-tier signals from the Worker — surface as tagged errors so generate() can react.
    if (useFree) {
      var ftype = (e.error && e.error.type) || "";
      var fmsg  = (e.error && e.error.message) || "";
      if (ftype === "quota_exceeded" || ftype === "image_quota_exceeded") { var qe = new Error(fmsg || "Free tier limit reached."); qe.code = "quota_exceeded"; throw qe; }
      if (ftype === "free_tier_paused") { var pe = new Error(fmsg || "Free tier paused this month."); pe.code = "free_tier_paused"; throw pe; }
      if (ftype === "auth_invalid" || r.status === 401) { var ae = new Error(fmsg || "Please sign in again."); ae.code = "auth_invalid"; throw ae; }
    }
    if (useProxy && r.status === 429) throw new Error("Daily demo-proxy limit reached. Switch to your own API key (top of header) for unlimited access, or come back tomorrow.");
    if (useProxy && r.status === 403) throw new Error("Demo proxy denied this origin. Open the deployed site or use your own API key.");
    // BYOK auth fail OR out-of-credits — prompt inline for a new key + retry once (don't loop forever).
    if (!useProxy && !opts.__retried) {
      var emsg = ((e.error && e.error.message) || "").toLowerCase();
      var isAuthFail = (r.status === 401 || r.status === 403);
      var isOutOfCredits = (r.status === 400 || r.status === 429) && /insufficient_quota|credit_balance|credit balance|exceeded.+credit|billing|payment/.test(emsg);
      if (isAuthFail || isOutOfCredits) {
        var reason = isOutOfCredits
          ? "⚠️ Your API key ran out of credits."
          : "⚠️ Your API key was rejected (auth error).";
        var newKey = promptForNewClaudeKey(reason);
        if (newKey) {
          // Retry the same call with the new key (loop guard via opts.__retried so we only retry once).
          return await callAPI(sys, content, maxTok, Object.assign({}, opts||{}, { __retried: true }));
        }
        // User cancelled — fall through to a friendly error.
        throw new Error(isOutOfCredits ? "API key is out of credits. Top up or set a new key, then click Generate again." : "API key required. Click 'Set key' in the header to add one.");
      }
    }
    if (r.status === 529 || r.status === 503) throw new Error("Anthropic servers are temporarily overloaded (we retried twice). This usually clears in 1-2 minutes — please wait and click Generate again. Boards mode uses Opus which is more capacity-constrained; if it persists, try Lecture mode (uses Haiku for review).");
    if (r.status === 408 || r.status === 504) throw new Error("Request timed out. Anthropic servers are slow right now — try again in a moment.");
    if (r.status >= 500) throw new Error("Anthropic API server error ("+r.status+"). Try again in a moment.");
    throw new Error((e.error&&e.error.message)||"API "+r.status)}
  // Streaming path — parse SSE events from Anthropic, call onStreamChunk with each text delta.
  if (opts.onStreamChunk && r.body && r.body.getReader) {
    var reader = r.body.getReader();
    var decoder = new TextDecoder();
    var sseBuffer = "";
    var fullText = "";
    var sawMessageStop = false;
    while (true) {
      var step = await reader.read();
      if (step.done) break;
      sseBuffer += decoder.decode(step.value, { stream: true });
      var lines = sseBuffer.split("\n");
      sseBuffer = lines.pop() || ""; // keep incomplete last line for next iteration
      for (var li = 0; li < lines.length; li++) {
        var line = lines[li].trim();
        if (!line.startsWith("data: ")) continue;
        var payload = line.slice(6);
        if (!payload || payload === "[DONE]") continue;
        try {
          var evt = JSON.parse(payload);
          if (evt.type === "content_block_delta" && evt.delta && evt.delta.type === "text_delta") {
            // Tool calls (web_search) stream their arguments as input_json_delta / partial_json.
            // Those are NOT assistant text; appending them corrupts the final JSON talk string.
            // Only accumulate real text deltas. (Jenni 2026-06-10)
            var t = evt.delta.text || "";
            if (t) {
              fullText += t;
              try { opts.onStreamChunk(t, fullText); } catch (e2) { /* never let UI errors kill the stream */ }
            }
          } else if (evt.type === "message_stop") {
            sawMessageStop = true;
          }
        } catch (parseErr) { /* incomplete chunk, ignore — next read will complete it */ }
      }
    }
    // Robustness (Jenni 2026-06-09): if the stream ended without a message_stop event AND the
    // accumulated text doesn't look like complete JSON, the connection was likely interrupted
    // (mobile backgrounding, network blip). Throw a clear error so the caller can retry without
    // streaming or surface a useful message — better than letting JSON.parse fail downstream.
    var trimmed = fullText.trim();
    if (!sawMessageStop && (!trimmed.endsWith("}") && !trimmed.endsWith("]"))) {
      throw new Error("Stream interrupted before completion (likely caused by backgrounding the tab). Tap Generate again — keep the tab in the foreground this time.");
    }
    return fullText;
  }
  var d=await r.json();var txt="";for(var i=0;i<(d.content||[]).length;i++){if(d.content[i].type==="text")txt+=d.content[i].text}return txt;
}

// Try a list of models in order; fall through to the next on overload/server errors only.
// Returns {txt, modelUsed} so the UI can show which model produced the result.
async function callAPIWithFallback(sys, content, maxTok, models, opts) {
  opts = opts || {};
  // Non-Claude providers (ChatGPT/Gemini) have no Claude model chain to fall through — call once.
  // (Jenni 2026-07-03)
  var _prov = S.genProvider || "claude";
  if(_prov !== "claude"){
    var t = await callAPI(sys, content, maxTok, opts);
    return { txt: t, modelUsed: (_prov==="openai"?GEN_OPENAI_MODEL:GEN_GEMINI_MODEL), fellBack: false };
  }
  var lastError;
  for (var i = 0; i < models.length; i++) {
    try {
      var modelOpts = Object.assign({}, opts, {model: models[i]});
      var txt = await callAPI(sys, content, maxTok, modelOpts);
      return {txt: txt, modelUsed: models[i], fellBack: i > 0};
    } catch (e) {
      lastError = e;
      // Only fall back on transient overload / server errors. Don't fall back on auth/key/rate-limit.
      var msg = String(e.message || "");
      var isOverload = /overloaded|server error|timed out|^API 5\d\d/i.test(msg);
      if (!isOverload || i === models.length - 1) throw e;
      console.warn("Model " + models[i] + " unavailable, falling back to " + models[i+1] + ": " + msg);
    }
  }
  throw lastError || new Error("All model fallbacks failed");
}
