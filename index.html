// Library deep-link: when a new tab opens with #t=<id> or #s=<slug>, load that talk directly.
// Samples load immediately. Saved-talk loads must wait for Supabase auth to restore (otherwise
// the cloud lookup runs before S.user is populated and silently falls through to localStorage).
window._pendingHashLoad = null; // {kind:"saved"|"sample", id} — drained when ready
function loadFromLibHash(){
  try{
    var hash = window.location.hash || "";
    var mSaved = hash.match(/^#t=(.+)$/);
    var mSample = hash.match(/^#s=(.+)$/);
    if(mSaved){
      var id = decodeURIComponent(mSaved[1]);
      history.replaceState(null,"",window.location.pathname+window.location.search);
      window._pendingHashLoad = { kind:"saved", id:id };
      // Local-only talks have a "t_" prefix and don't need auth — drain right away.
      if(String(id).startsWith("t_")){ drainPendingHashLoad(); }
      return true;
    }
    if(mSample){
      var slug = decodeURIComponent(mSample[1]);
      history.replaceState(null,"",window.location.pathname+window.location.search);
      // Samples are bundled JSON, no auth needed — load immediately.
      setTimeout(function(){ loadSample(slug) }, 50);
      return true;
    }
  }catch(e){console.error("loadFromLibHash failed:",e)}
  return false;
}
// Drain the pending hash load. Called: (a) immediately for local talks / no auth needed,
// (b) after Supabase getSession() resolves (so S.user is populated for cloud talks).
function drainPendingHashLoad(){
  if(!window._pendingHashLoad)return;
  var pending = window._pendingHashLoad;
  window._pendingHashLoad = null;
  if(pending.kind === "saved"){
    S.loadingFromHash = true;
    if(typeof render === "function") render();
    loadSavedTalk(pending.id);
  }
}

async function downloadVMC(){
  if(!S.talk)return;
  // Auto-expand VMC if collapsed, then wait one frame for render
  // vmcCard is rendered unconditionally when a talk is loaded; no need to toggle a flag.
  var vmc=document.getElementById("vmcCard");
  if(!vmc){S.savedFlash="VMC card not on page yet \u2014 try again.";render();setTimeout(function(){S.savedFlash="";render()},3000);return}
  if(typeof html2canvas==="undefined"){S.savedFlash="Image library still loading. Try again in a moment.";render();setTimeout(function(){S.savedFlash="";render()},3000);return}
  S.savedFlash="\u{1F4F8} Generating image...";render();
  var slug=(S.talk.title||"chalk-talk").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
  function triggerDownload(href,revoke){
    var a=document.createElement("a");
    a.href=href;
    a.download="vmc-"+slug+".png";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if(revoke)setTimeout(function(){URL.revokeObjectURL(href)},5000);
    S.savedFlash="\u2713 Image downloaded! Great for Twitter or slides.";render();
    setTimeout(function(){S.savedFlash="";render()},3500);
  }
  try{
    var canvas=await html2canvas(vmc,{scale:2,backgroundColor:"#330662",useCORS:true,logging:false,allowTaint:true});
    if(canvas.toBlob){
      canvas.toBlob(function(blob){
        if(!blob){
          // toBlob returned null (some Safari builds) \u2014 fall back to data URL
          try{triggerDownload(canvas.toDataURL("image/png"),false)}
          catch(e2){S.savedFlash="Image generation failed: "+e2.message;render();setTimeout(function(){S.savedFlash="";render()},4500)}
        }else{
          triggerDownload(URL.createObjectURL(blob),true);
        }
      },"image/png");
    }else{
      // toBlob unsupported \u2014 straight to data URL
      triggerDownload(canvas.toDataURL("image/png"),false);
    }
  }catch(e){
    console.error("downloadVMC error",e);
    S.savedFlash="Couldn't generate image: "+(e.message||"unknown error");render();
    setTimeout(function(){S.savedFlash="";render()},4500);
  }
}

// Copy a boards question. mode="stem" copies just stem+choices (good to send a learner without
// giving away the answer). mode="full" copies stem+choices+answer+explanation+wrong-answer rationales
// (good for self-study, printing, or sending complete review material).
function copyBoardsQuestion(mode){
  if(!S.talk||!S.talk.question)return;
  var q=S.talk.question;
  mode=mode||"stem";
  var lines=[];
  if(S.talk.title)lines.push(S.talk.title);
  lines.push("");
  lines.push(String(q.stem||""));
  lines.push("");
  (q.choices||[]).forEach(function(ch){lines.push(ch.letter+". "+ch.text)});
  if(mode==="full"){
    lines.push("");
    lines.push("ANSWER: "+(q.correct_letter||""));
    if(q.explanation){lines.push("");lines.push(String(q.explanation))}
    if((q.wrong_explanations||[]).length){
      lines.push("");lines.push("Why other answers are wrong:");
      q.wrong_explanations.forEach(function(w){lines.push(w.letter+". "+w.why)});
    }
    var pearls=(S.talk.board_pearls||[]).filter(function(p){return p&&String(p).trim().length>0});
    if(pearls.length){lines.push("");lines.push("Board pearls:");pearls.forEach(function(p,i){lines.push((i+1)+". "+p)})}
  } else {
    lines.push("");lines.push("(Answer + explanation withheld \u2014 send this version to a learner.)");
  }
  var text=lines.join("\n");
  var doneMsg=mode==="full"?"\u2713 Full question + answer + explanation copied":"\u2713 Question + choices copied (no answer)";
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      S.savedFlash=doneMsg;render();
      setTimeout(function(){S.savedFlash="";render()},2800);
    }).catch(function(){
      prompt("Couldn't auto-copy. Select and copy manually:",text);
    });
  } else {
    prompt("Copy this question:",text);
  }
}

// Guarded wrapper for resetAll. Prompts before discarding an unsaved, non-sample talk
// (samples don't need confirmation — they're cached, can be reopened from Library anytime).
// All "New talk" UI paths route through this — both the capsule header button + overflow menu.

// ═══════════ DIAGRAM SVG ═══════════
function diagSVG(dg){
  if(!dg||!dg.nodes||!dg.nodes.length)return"";
  var W=860,H=540,P=60,pos={};
  for(var i=0;i<dg.nodes.length;i++){
    var n=dg.nodes[i];
    var nx=Math.max(0,Math.min(1,n.x!=null?n.x:0.5));
    var ny=Math.max(0,Math.min(1,n.y!=null?n.y:0.5));
    pos[n.id]={px:P+nx*(W-P*2),py:P+ny*(H-P*2),label:n.label||"",type:n.type||"box"};
  }
  // Polished medical color palette
  var C={
    title:   {grad:["#4a1a7a","#702b9d"], s:"#ab82c5", t:"#fff",     z:16, w:2.5},
    accent:  {grad:["#5a2580","#8a3eb5"], s:"#c4a3da", t:"#fff",     z:13, w:2},
    formula: {grad:["#2a4a8a","#4a6db8"], s:"#9bb8e0", t:"#dde7f7",  z:13, w:2},
    warning: {grad:["#8a2828","#c84545"], s:"#e8a8a8", t:"#fff5f5",  z:13, w:2},
    box:     {grad:["#3a3450","#4d4666"], s:"#a09cb4", t:"#e8e6f0",  z:13, w:1.5}
  };
  var defs='<defs>';
  var types=Object.keys(C);
  for(var ti=0;ti<types.length;ti++){
    var ct=C[types[ti]];
    defs+='<linearGradient id="g_'+types[ti]+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+ct.grad[0]+'"/><stop offset="100%" stop-color="'+ct.grad[1]+'"/></linearGradient>';
  }
  defs+='<marker id="da" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#c4a3da"/></marker>';
  defs+='<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="0" dy="2" result="offsetblur"/><feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  defs+='</defs>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">'+defs;
  svg+='<rect width="'+W+'" height="'+H+'" fill="none"/>';
  // curved arrows
  var arrs=dg.arrows||[];
  for(var ai=0;ai<arrs.length;ai++){
    var a=arrs[ai],fr=pos[a.from],to=pos[a.to];
    if(!fr||!to)continue;
    var dx=to.px-fr.px, dy=to.py-fr.py, d=Math.sqrt(dx*dx+dy*dy);
    if(d<5)continue;
    var ux=dx/d, uy=dy/d;
    var startX=fr.px+ux*48, startY=fr.py+uy*30;
    var endX=to.px-ux*48, endY=to.py-uy*30;
    var midX=(startX+endX)/2, midY=(startY+endY)/2;
    var perpX=-uy, perpY=ux;
    var curveAmount=Math.min(d*0.15, 35);
    var c1x=startX+perpX*curveAmount*0.5, c1y=startY+perpY*curveAmount*0.5;
    var c2x=endX+perpX*curveAmount*0.5, c2y=endY+perpY*curveAmount*0.5;
    svg+='<path d="M '+startX+' '+startY+' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+endX+' '+endY+'" stroke="rgba(196,163,218,0.7)" stroke-width="2.2" fill="none" marker-end="url(#da)"/>';
    if(a.label){
      var lx=midX+perpX*curveAmount*0.4, ly=midY+perpY*curveAmount*0.4;
      var lblW=a.label.length*7+14;
      svg+='<rect x="'+(lx-lblW/2)+'" y="'+(ly-11)+'" width="'+lblW+'" height="22" rx="11" fill="#2d2a3e" stroke="rgba(196,163,218,0.5)" stroke-width="1"/>';
      svg+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle" fill="#d4baea" font-size="11" font-weight="500">'+esc(a.label)+'</text>';
    }
  }
  // nodes
  for(var ni=0;ni<dg.nodes.length;ni++){
    var nd=dg.nodes[ni], p=pos[nd.id], lb=p.label;
    var c=C[p.type]||C.box;
    var maxLen=nd.type==="title"?22:18;
    var ln=wrapText(lb,maxLen);
    var fontWeight=nd.type==="title"?700:nd.type==="accent"?600:550;
    var fontSize=c.z;
    var bw=Math.max(lb.length*(nd.type==="title"?9:7.2)+44, 110);
    var bh=(nd.type==="title"?52:42)+(ln.length-1)*19;
    var rx=nd.type==="title"?14:11;
    svg+='<g filter="url(#ds)">';
    svg+='<rect x="'+(p.px-bw/2)+'" y="'+(p.py-bh/2)+'" width="'+bw+'" height="'+bh+'" rx="'+rx+'" fill="url(#g_'+(C[p.type]?p.type:"box")+')" stroke="'+c.s+'" stroke-width="'+c.w+'"'+(nd.type==="formula"?' stroke-dasharray="6,3"':"")+'/>';
    for(var tl=0;tl<ln.length;tl++){
      var ty=p.py+5+tl*19-(ln.length-1)*9.5;
      svg+='<text x="'+p.px+'" y="'+ty+'" text-anchor="middle" fill="'+c.t+'" font-size="'+fontSize+'" font-weight="'+fontWeight+'" letter-spacing="0.2">'+esc(ln[tl])+'</text>';
    }
    svg+='</g>';
  }
  return svg+"</svg>";
}

function renderRAGSources() {
  return ''; // sources panel removed per request — references & citations retained
  if (!S.ragChunks || !S.ragChunks.length) return '';
  var chunks = S.ragChunks;
  var n = chunks.length;
  var citedSet = {};
  if (S.talk) {
    var talkText = JSON.stringify(S.talk);
    for (var ci = 0; ci < chunks.length; ci++) {
      var pmidc = chunks[ci].pmid;
      if (pmidc && talkText.indexOf(pmidc) !== -1) citedSet[pmidc] = true;
    }
  }
  var out = '<div class="rag-row ' + (S.ragOpen ? 'open' : '') + '">';
  out += '<button class="rh-head" onclick="S.ragOpen=!S.ragOpen;render();return false;">';
  out += '<span style="font-size:14px">📑</span>';
  out += '<span class="rh-count">' + n + ' source' + (n===1?'':'s') + '</span>';
  if (!S.ragOpen) {
    var chips = chunks.slice(0, 3).map(function(c){
      var tt = c.title || '';
      return esc(tt.length > 28 ? tt.slice(0, 28) + '…' : tt);
    }).join(' · ');
    out += '<span class="rh-chips">' + chips + '</span>';
  } else {
    out += '<span style="flex:1"></span>';
  }
  out += '<span class="rh-chev">⌄</span></button>';
  if (S.ragOpen) {
    out += '<div class="rh-body">';
    for (var i = 0; i < chunks.length; i++) {
      var c = chunks[i];
      var tier = c.source_tier || 4;
      var rcr = c.rcr;
      var landmark = c.is_landmark_trial;
      var sim = c.similarity;
      var pmid = c.pmid;
      var isCited = pmid && citedSet[pmid];
      var authorsRaw = (c.authors || '').split(',').slice(0, 2).map(function(s){return s.trim()}).join(', ');
      if (c.authors && c.authors.split(',').length > 2) authorsRaw += ' et al.';
      out += '<div class="rag-card">';
      out += '<div class="rc-head">';
      out += '<span class="rag-pill rag-pill-tier' + tier + '">T' + tier + '</span>';
      if (landmark) out += '<span class="rag-pill rag-pill-landmark">★</span>';
      if (rcr && rcr > 1) out += '<span class="rag-pill rag-pill-rcr">RCR ' + rcr.toFixed(1) + '</span>';
      if (isCited) out += '<span class="rag-pill rag-pill-cited">✓ Cited</span>';
      if (typeof sim === 'number') out += '<span class="rag-pill rag-pill-sim">' + sim.toFixed(2) + '</span>';
      if (c.url) out += '<a class="rc-pub-inline" href="' + esc(c.url) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">PubMed →</a>';
      out += '</div>';
      out += '<div class="rc-title">' + esc(c.title || '(untitled)') + '</div>';
      out += '<div class="rc-meta">' + esc(authorsRaw) + (c.journal ? ' · ' + esc(c.journal) : '') + (c.year ? ' · ' + c.year : '') + '</div>';
      out += '</div>';
    }
    out += '</div>';
  }
  out += '</div>';
  return out;
}

function linkifyPMIDs(root) {
  if (!root) return;
  var re = /\bPMID:?\s*(\d{6,9})\b/g;
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node) {
      if (!node.parentNode) return NodeFilter.FILTER_REJECT;
      var p = node.parentNode;
      if (p.tagName === 'A') return NodeFilter.FILTER_REJECT;
      if (p.tagName === 'SCRIPT' || p.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
      if (p.classList && p.classList.contains('pmid-pill')) return NodeFilter.FILTER_REJECT;
      return re.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  var nodes = [];
  var node;
  while ((node = walker.nextNode())) nodes.push(node);
  for (var ni = 0; ni < nodes.length; ni++) {
    var n = nodes[ni];
    re.lastIndex = 0;
    var html = n.nodeValue.replace(re, function(m, pmid){
      return '<a href="https://pubmed.ncbi.nlm.nih.gov/' + pmid + '/" target="_blank" rel="noopener" class="pmid-pill">PMID ' + pmid + '</a>';
    });
    var wrap = document.createElement('span');
    wrap.innerHTML = html;
    if (n.parentNode) n.parentNode.replaceChild(wrap, n);
  }
}

// ═══════════ EXAMPLES (DEMO MODE) ═══════════
// Pick the right version for a dual-version sample. Hero default = concise.
// Sample schema:
//   { slug, topic, style, specialty, generated_at, guideline_sources,
//     talk_concise: <json>, talk_detailed: <json>, talk: <legacy single-version fallback> }
function pickSampleTalk(s, depth){
  if(!s) return null;
  var d = depth || "concise";
  if(d === "detailed" && s.talk_detailed) return s.talk_detailed;
  if(d === "concise"  && s.talk_concise)  return s.talk_concise;
  // Fallbacks if the requested version doesn't exist
  return s.talk_concise || s.talk_detailed || s.talk || null;
}

function loadSample(slug, depth){
  if(!SAMPLES||!SAMPLES.length)return;
  var s=null;for(var i=0;i<SAMPLES.length;i++){if(SAMPLES[i].slug===slug){s=SAMPLES[i];break}}
  if(!s)return;
  // Determine which depth version was actually picked (handles fallback when requested version is missing).
  var chosen = pickSampleTalk(s, depth);
  if(!chosen) return;
  var actualDepth = "concise";
  if(s.talk_detailed && chosen === s.talk_detailed) actualDepth = "detailed";
  else if(s.talk_concise && chosen === s.talk_concise) actualDepth = "concise";
  // Otherwise it's the legacy single-version `talk` — we can't tell, default to concise.
  S.talk=chosen; S.topic=s.topic; S.style=s.style||"lecture"; S.depth=actualDepth;
  S.isSampleTalk=true; S.sampleSlug=s.slug; S.sharedTalk=false;
  S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;
  S.showAns=false;S.userPick="";
  S.msgs=[];S.error="";
  if(s.guideline_sources&&s.guideline_sources.length){
    S.glRef={specialties:[s.specialty||""],context:"",sources:s.guideline_sources,trials:[],conferences:[]};
  } else { S.glRef=null; }
  S.showSaved=false; // exit Library view if open
  speechSynthesis.cancel();
  render();
  var ts=document.getElementById("talkStart");
  if(ts)ts.scrollIntoView({behavior:"smooth",block:"start"});
  else window.scrollTo({top:0,behavior:"smooth"});
}

// renderExamples() and bindExamples() removed \u2014 samples now live inside the Library view
// (see renderSaved + bindSaved). loadSample() above is still used by the Library card
// "Open" buttons (.libOpenBtn[data-source="sample"]).

function renderSaved(){
  // Combined library \u2014 pre-built samples + user-saved talks (cloud or local).
  var saved=getDisplayLibrary();
  var samples=(typeof SAMPLES!=="undefined"&&SAMPLES)?SAMPLES:[];
  // Normalize both into a single shape with _kind ("lecture"|"boards"), _source ("sample"|"saved"),
  // _spec (specialty), and _hasBoth (true if sample has both concise+detailed cached versions).
  var all=[];
  var _hiddenSamples=loadHiddenSampleSlugs();
  for(var si=0;si<samples.length;si++){
    var s=samples[si];
    if(_hiddenSamples.indexOf(s.slug)>=0 || _softHiddenSlugs[s.slug]) continue;
    var st = s.talk_concise || s.talk || s.talk_detailed || {};
    var hasBoth = !!(s.talk_concise && s.talk_detailed);
    all.push({_source:"sample",_kind:st.question?"boards":"lecture",_slug:s.slug,_id:null,
      _spec:inferSpecialty(s.topic, st, s.specialty),
      _hasBoth:hasBoth,
      topic:s.topic||"",talk:st,savedAt:null,specialty:s.specialty||"",generated_at:s.generated_at||""});
  }
  for(var di=0;di<saved.length;di++){
    var e=saved[di];var et=e.talk||{};
    all.push({_source:"saved",_kind:et.question?"boards":"lecture",_slug:null,_id:e.id,
      _spec:inferSpecialty(e.topic, et, null),
      _isPublic: !!e._isPublic, _shareToken: e._shareToken || null,
      topic:e.topic||"",talk:et,savedAt:e.savedAt,specialty:"",generated_at:""});
  }
  // Mark items that have saved visuals (for the Visuals tab + thumbnail rendering)
  // _hasVisuals fuels the Visuals tab filter — works for local (real savedVisuals array) and cloud (boolean) sources.
  all.forEach(function(x){ x._hasVisuals = !!(x.talk && (x.talk._hasCloudVisuals || (x.talk.savedVisuals && x.talk.savedVisuals.length))); });
  // Tab filter \u2014 Lectures | Boards | Visuals (Jenni 2026-06-04 \u2014 removed "All", default to Lectures).
  // Legacy state with libTab="all" coerces to "lectures" so existing users land in the new default.
  var tab=S.libTab||"lectures"; if(tab==="all") tab="lectures";
  var byTab = (tab==="visuals") ? all.filter(function(x){return x._hasVisuals})
            : all.filter(function(x){return x._kind === (tab==="boards" ? "boards" : "lecture")});
  // Specialty filter (applied after tab, before search)
  var bySpec = S.libSpec ? byTab.filter(function(x){return x._spec===S.libSpec}) : byTab;
  // Search filter
  var filtered=bySpec;
  if(S.savedSearch.trim()){var q=S.savedSearch.toLowerCase();filtered=bySpec.filter(function(x){return(x.topic||"").toLowerCase().indexOf(q)>=0||(x.talk&&x.talk.title||"").toLowerCase().indexOf(q)>=0||(x.specialty||"").toLowerCase().indexOf(q)>=0})}
  // Counts per specialty (reflect current tab + search but ignore active spec filter so other counts stay meaningful)
  var specSourceForCounts = byTab;
  if(S.savedSearch.trim()){var qs=S.savedSearch.toLowerCase();specSourceForCounts=byTab.filter(function(x){return(x.topic||"").toLowerCase().indexOf(qs)>=0||(x.talk&&x.talk.title||"").toLowerCase().indexOf(qs)>=0||(x.specialty||"").toLowerCase().indexOf(qs)>=0})}
  var specCounts = {};
  for(var sci=0;sci<specSourceForCounts.length;sci++){var sk=specSourceForCounts[sci]._spec||"Other";specCounts[sk]=(specCounts[sk]||0)+1}
  // Counts per tab (after search, before tab) \u2014 used in the tab pills
  var searchOnly=all;
  if(S.savedSearch.trim()){var q2=S.savedSearch.toLowerCase();searchOnly=all.filter(function(x){return(x.topic||"").toLowerCase().indexOf(q2)>=0||(x.talk&&x.talk.title||"").toLowerCase().indexOf(q2)>=0||(x.specialty||"").toLowerCase().indexOf(q2)>=0})}
  var cAll=searchOnly.length, cLec=searchOnly.filter(function(x){return x._kind==="lecture"}).length, cBrd=searchOnly.filter(function(x){return x._kind==="boards"}).length, cVis=searchOnly.filter(function(x){return x._hasVisuals}).length;
  // Header
  var h='<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px"><button id="savedBack" style="background:#fff;border:1px solid #e2dfe8;border-radius:8px;padding:8px 14px;color:#6b6780;font-size:13px;cursor:pointer">\u2190 Back</button><h2 style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--plum-deep);margin:0;flex:1;letter-spacing:-0.01em">\uD83D\uDCDA Library</h2></div>';
  // Tab strip \u2014 Lectures | Boards | Visuals (segmented, no All \u2014 Jenni 2026-06-04)
  function tabBtn(key,label,count){var on=(tab===key);return '<button class="libTabBtn" data-tab="'+key+'" style="flex:1;min-width:0;background:'+(on?"#fff":"transparent")+';color:'+(on?"var(--plum-deep)":"var(--ink-muted)")+';border:'+(on?"1px solid var(--line)":"1px solid transparent")+';border-radius:10px;padding:9px 10px;font-size:13px;font-weight:'+(on?"600":"500")+';cursor:pointer;box-shadow:'+(on?"var(--shadow-soft)":"none")+';display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s ease">'+label+' <span style="color:'+(on?"var(--ink-muted)":"var(--ink-soft)")+';font-size:11px;font-weight:500">'+count+'</span></button>'}

  h+='</div>';

  // === Specialty pill strip (Jenni 2026-06-04) ===

  function specPill(specKey, label, count){

  h+='<div class="libSpecStrip" style="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-ms-overflow-style:none;mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 24px),transparent 100%);-webkit-mask-image:linear-gradient(to right,#000 0,#000 calc(100% - 24px),transparent 100%)">';

  h+='</div>';
  // Hide scrollbar on webkit
  h+='<style>.libSpecStrip::-webkit-scrollbar{display:none}</style>';
  // "Showing X \u00B7 Clear" line when a filter is active
  if(S.libSpec){
    h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:6px 10px;background:var(--lavender-bg);border-radius:8px;font-size:11.5px"><span style="color:var(--ink)"><b style="color:var(--plum-deep)">Showing '+esc(S.libSpec)+'</b> \u00B7 '+filtered.length+' '+(filtered.length===1?"item":"items")+'</span><button id="libSpecClearBtn" style="background:none;border:none;color:var(--plum);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 6px;border-radius:6px">\u00D7 Clear</button></div>';
  }

  // Loading state (cloud)
  if(S.user && !S.cloudLoaded){
    h+='<div style="text-align:center;padding:14px 20px;color:var(--ink-muted);font-size:12.5px"><span class="spinner" style="margin-right:8px"></span>Loading your library\u2026</div>';
  }
  // Search + export/import
  h+='<input id="savedSearchIn" value="'+esc(S.savedSearch)+'" placeholder="Search the library\u2026" style="width:100%;background:#fff;border:1.5px solid #e2dfe8;border-radius:12px;padding:11px 16px;font-size:14px;outline:none;margin-bottom:10px">';
  h+='<div style="display:flex;gap:8px;margin-bottom:14px;justify-content:flex-end"><button id="exportLibBtn" style="background:#fff;border:1px solid #e2dfe8;border-radius:8px;padding:7px 12px;color:#702b9d;font-size:11.5px;font-weight:600;cursor:pointer">\u2B07 Export</button><button id="importLibBtn" style="background:#fff;border:1px solid #e2dfe8;border-radius:8px;padding:7px 12px;color:#702b9d;font-size:11.5px;font-weight:600;cursor:pointer">\u2B06 Import</button><input type="file" id="importLibInput" accept=".json" style="display:none"></div>';
  // Group filtered items by specialty, render in canonical order (SPEC_ORDER).
  if(filtered.length===0){
    var emptyMsg = (all.length===0) ? "No items yet" : "No matches in "+(tab==="all"?"the library":tab);
    var emptySub = (S.savedSearch.trim()) ? "Try a different search term." : (tab==="boards" ? "Generate a Boards-style talk to add it here." : "Generate a chalk talk and click \u2605 Save to add it here.");
    h+='<div style="background:#fff;border:1px dashed #d0cce0;border-radius:12px;padding:40px 20px;text-align:center;color:#9490a6"><div style="font-size:42px;margin-bottom:10px">\uD83D\uDCD6</div><div style="font-size:14px;font-weight:600;color:#6b6780;margin-bottom:6px">'+emptyMsg+'</div><div style="font-size:12px">'+emptySub+'</div></div>';
  } else {
    if(S.libSpec){
      // Specialty filter is active \u2014 flat list, no section headers (they'd just repeat the filter label).
      for(var ci=0;ci<filtered.length;ci++){ h += renderLibCard(filtered[ci]); }
    } else {
      // No specialty filter \u2014 group + render section headers in canonical order.
      var bySpecGroup={};
      for(var fi=0;fi<filtered.length;fi++){var sp=filtered[fi]._spec||"Other";if(!bySpecGroup[sp])bySpecGroup[sp]=[];bySpecGroup[sp].push(filtered[fi])}
      for(var oi=0;oi<SPEC_ORDER.length;oi++){
        var specName=SPEC_ORDER[oi];var items=bySpecGroup[specName];if(!items||items.length===0)continue;
        var icon=SPEC_ICONS[specName]||"\uD83D\uDCDA";
        // Section header (also acts as a quick filter \u2014 tap to jump into that specialty)
        h+='<button class="libSpecHeaderBtn" data-spec="'+esc(specName)+'" style="width:100%;display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;padding:0 4px 6px;border:none;border-bottom:1px solid var(--line-soft);background:none;cursor:pointer;text-align:left">';
        h+='<span style="font-size:14px;color:var(--plum)">'+icon+'</span>';
        h+='<span style="font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--plum-deep);letter-spacing:-0.005em">'+esc(specName)+'</span>';
        h+='<span style="font-size:11px;color:var(--ink-muted);font-weight:500">'+items.length+'</span>';
        h+='</button>';
        for(var ci=0;ci<items.length;ci++){ h += renderLibCard(items[ci]); }
      }
    }
    // (The defensive "unknown specialty" branch was deleted \u2014 inferSpecialty now
    // canonicalizes to SPEC_ORDER, so the main loop above is exhaustive.)
  }
  return h;
}

function bindSaved(){
  document.getElementById("savedBack").onclick=function(){S.showSaved=false;render()};
  var ss=document.getElementById("savedSearchIn");if(ss)ss.oninput=function(e){S.savedSearch=e.target.value;render();var f=document.getElementById("savedSearchIn");if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}};
  // Tab pills — All / Lectures / Boards

  // Specialty pill strip + clear + section-header shortcut
  document.querySelectorAll(".libSpecBtn").forEach(function(b){b.onclick=function(){var v=b.dataset.spec||"";S.libSpec=v||null;render();window.scrollTo(0,0)}});
  var lscb=document.getElementById("libSpecClearBtn");if(lscb)lscb.onclick=function(){S.libSpec=null;render();window.scrollTo(0,0)};
  document.querySelectorAll(".libSpecHeaderBtn").forEach(function(b){b.onclick=function(){S.libSpec=b.dataset.spec||null;render();window.scrollTo(0,0)}});
  // Unified Open handler — routes to sample-load or saved-load based on data-source
  // libOpenBtn is now an <a target="_blank"> — let the browser handle the click natively. No onclick.
  // Loading from a hash (#t=… / #s=…) is handled on page load via the maybeLoadFromHash() helper below.
  document.querySelectorAll(".exportTalkBtn").forEach(function(b){b.onclick=function(){exportTalkJSON(b.dataset.id)}});
  // Kebab menu toggle — opens that card's action menu, closes any other. Keyed by data-key
  // ("sample:<slug>" for samples, the talk id otherwise) so samples and saved talks both work.
  document.querySelectorAll(".libCardMenuBtn").forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    var key=b.dataset.key;
    S.libCardMenuId = (S.libCardMenuId===key) ? null : key;
    render();
  }});
  // Outside-click closes the kebab menu
  if(S.libCardMenuId){
    document.body.onclick=function(e){
      if(!e.target.closest(".libCardMenu") && !e.target.closest(".libCardMenuBtn")){
        S.libCardMenuId=null;document.body.onclick=null;render();
      }
    };
  }
  // Menu items: PDF export + Delete (Rename binds below via libEditTitleBtn — already a class).
  // Each closes the menu after firing. Samples carry data-slug; saved talks carry data-id.
  document.querySelectorAll(".libPdfBtn").forEach(function(b){b.onclick=function(){
    S.libCardMenuId=null;
    var slug=b.dataset.slug;
    if(slug){
      // Sample: export straight from the seed talk object (no saved id to look up).
      var samp=(typeof SAMPLES!=="undefined"&&SAMPLES?SAMPLES:[]).find(function(s){return s.slug===slug});
      var st=samp&&(samp.talk_concise||samp.talk||samp.talk_detailed);
      if(st)exportTalkPDF(st);else alert("Couldn't find that sample to export.");
    } else {
      exportSavedTalkPDF(b.dataset.id);
    }
  }});
  document.querySelectorAll(".delTalkBtn").forEach(function(b){b.onclick=function(){
    S.libCardMenuId=null;
    var slug=b.dataset.slug;
    if(slug){
      // Sample: can't delete shared seed content, so hide it locally — confirm + Undo, commit on window close.
      var samp=(typeof SAMPLES!=="undefined"&&SAMPLES?SAMPLES:[]).find(function(s){return s.slug===slug});
      var sst=samp&&(samp.talk_concise||samp.talk||samp.talk_detailed);
      var sname=(loadSampleTitleOverrides()[slug])||(sst&&sst.title)||(samp&&samp.topic)||"This sample";
      showDeleteConfirm(sname, function(){
        _softHiddenSlugs[slug]=true; render();
        showUndoToast("Sample removed", function(){ delete _softHiddenSlugs[slug]; render(); },
          function(){ hideSampleSlug(slug); delete _softHiddenSlugs[slug]; render(); });
      });
    } else {
      var id=b.dataset.id;
      var entry=getDisplayLibrary().find(function(x){return x.id===id});
      var name=(entry&&entry.talk&&entry.talk.title)||(entry&&entry.topic)||"This talk";
      showDeleteConfirm(name, function(){ softDeleteSavedTalk(id, name); });
    }
  }});
  // Per-library-card title rename
  document.querySelectorAll(".libEditTitleBtn").forEach(function(b){b.onclick=async function(e){
    e.stopPropagation();
    S.libCardMenuId=null;
    var slug=b.dataset.slug;
    if(slug){
      // Sample: store a local title override (seed title stays untouched).
      var samp=(typeof SAMPLES!=="undefined"&&SAMPLES?SAMPLES:[]).find(function(s){return s.slug===slug});
      var sst=samp&&(samp.talk_concise||samp.talk||samp.talk_detailed);
      var scur=(loadSampleTitleOverrides()[slug])||(sst&&sst.title)||(samp&&samp.topic)||"";
      var sfresh=prompt("Edit talk title:",scur);
      if(!sfresh||sfresh===scur)return;
      setSampleTitleOverride(slug,sfresh);
      render();
      return;
    }
    var id = b.dataset.id;if(!id)return;
    var arr = getDisplayLibrary();var entry = arr.find(function(x){return x.id===id});if(!entry)return;
    var current = (entry.talk && entry.talk.title) || entry.topic || "";
    var fresh = prompt("Edit talk title:", current);
    if(!fresh || fresh === current) return;
    if(S.user && window.sb && !String(id).startsWith("t_")){
      var ok = await cloudUpdateTalkTitle(id, fresh);
      if(!ok){alert("Couldn't update title — check connection.");return}
    } else {
      var local = loadSavedTalks();
      for(var i=0;i<local.length;i++){
        if(local[i].id===id){
          if(!local[i].talk) local[i].talk={};
          local[i].talk.title = fresh;
          break;
        }
      }
      writeSavedTalks(local);
    }
    render();
  }});
  var el=document.getElementById("exportLibBtn");if(el)el.onclick=exportLibraryJSON;
  var il=document.getElementById("importLibBtn");if(il)il.onclick=function(){document.getElementById("importLibInput").click()};
  var ili=document.getElementById("importLibInput");if(ili)ili.onchange=function(e){if(e.target.files[0])importLibraryJSON(e.target.files[0])};
}

    var _hasClaudeP = !!localStorage.getItem("claude_api_key");
    var _hasGemP = !!localStorage.getItem("gemini_api_key");
    var _hasOAP = !!localStorage.getItem("openai_api_key");
    h+='<div style="margin-top:18px;padding-top:14px;border-top:1px solid var(--line)">';
    h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span style="font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.09em">API Keys</span><span style="font-size:10px;color:var(--ink-soft)">Stored in your browser only</span></div>';
    // Key row: when a key is stored, show "✓ Saved" + Edit (toggles edit-mode for that one row via S.profileKeyEditing).
    // Edit-mode shows the input + Save + Cancel. Cancel returns to "✓ Saved" without losing the stored key.
    function _keyRow(id,label,storageKey,isSet,placeholder,helperUrl){
      var editing = (S.profileKeyEditing === storageKey);
      var labelCell = '<div style="flex:0 0 auto;align-self:center;font-size:11.5px;font-weight:600;color:var(--ink);width:74px"><a href="'+helperUrl+'" target="_blank" title="Get a '+label+' key" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink-soft)">'+label+'</a></div>';
      if(isSet && !editing){

          labelCell+
          '<div style="flex:1;display:inline-flex;align-items:center;gap:5px;background:#f0f7f0;border:1px solid #c8e0c8;border-radius:8px;padding:6px 10px;font-size:11.5px;color:#2d6a2d;font-weight:600"><span style="font-size:12px">✓</span>Saved</div>'+
          '<button class="pfEditKeyBtn" data-storage="'+esc(storageKey)+'" title="Replace this key" style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--plum);font-size:11.5px;font-weight:600;cursor:pointer">Edit</button>'+
          '</div>';
      }
      // Not set, OR editing — show input + Save + (Cancel if editing)
      return '<div style="display:flex;gap:6px;align-items:stretch;margin-bottom:6px">'+
        labelCell+
        '<input id="'+id+'_input" type="password" placeholder="'+placeholder+'" data-storage="'+storageKey+'" style="flex:1;min-width:0;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;outline:none;font-family:inherit" '+(editing?'autofocus':'')+'>'+
        '<button class="pfSaveKeyBtn" data-input="'+id+'_input" data-storage="'+storageKey+'" data-label="'+esc(label)+'" title="Save key" style="background:var(--plum);border:none;border-radius:8px;padding:0 10px;color:#fff;font-size:11.5px;font-weight:600;cursor:pointer">Save</button>'+
        (editing?'<button class="pfCancelKeyBtn" title="Cancel — keep existing key" style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 9px;color:var(--ink-muted);font-size:13px;font-weight:600;cursor:pointer">×</button>':'')+
        '</div>';
    }
    h+=_keyRow("pfClaudeKey","Anthropic","claude_api_key",_hasClaudeP,"sk-ant-…","https://console.anthropic.com/settings/keys");
    h+=_keyRow("pfGeminiKey","Gemini","gemini_api_key",_hasGemP,"AIza… (optional)","https://aistudio.google.com/apikey");
    h+=_keyRow("pfOpenAIKey","OpenAI","openai_api_key",_hasOAP,"sk-… (optional)","https://platform.openai.com/api-keys");
    h+='</div>';

    // Compact sign-out at the bottom — small text link, no divider
    h+='<div style="margin-top:14px;text-align:right"><button id="pfSignOutBtn" style="background:none;border:none;color:#c0392b;font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px">Sign out</button></div>';

    h+='</div></div>';
  }

  return h;
}

  };
  // Download the generated raster image (Gemini Nano Banana Pro or OpenAI gpt-image-2) as PNG.
  var ddb=document.getElementById("dgDownloadBtn");if(ddb)ddb.onclick=function(){
    if(!S.dg||!S.dg.imgB64)return;
    try{
      var bin=atob(S.dg.imgB64);
      var bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      var blob=new Blob([bytes],{type:"image/png"});
      var url=URL.createObjectURL(blob);
      var a=document.createElement("a");
      var slug=((S.talk&&S.talk.title)||S.topic||"chalk-talk-visual").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
      a.href=url;a.download=slug+"-visual.png";a.click();
      URL.revokeObjectURL(url);
    }catch(e){alert("Download failed: "+e.message)}
  };
  document.querySelectorAll(".dgModeBtn").forEach(function(b){b.onclick=function(){if(S.dgMode!==b.dataset.m){S.dgMode=b.dataset.m;S.dg=null;S.dgErr="";render()}}});
  // resetKey/resetClaudeKey handlers deleted — those IDs no longer rendered.
  // ─── Boards-mode answer choices ────────────────────────────────────────
  document.querySelectorAll(".choiceBtn").forEach(function(b){b.onclick=function(){if(!S.showAns){S.userPick=b.dataset.letter;render()}}});
  var sb=document.getElementById("submitAnsBtn");if(sb)sb.onclick=function(){S.showAns=true;render()};

  // Feedback widget handlers deleted — feedbackToggle/feedbackTA/feedbackSubmit/feedbackCancel
  // IDs no longer rendered. submitFeedback() function and S.showFeedback/feedbackText/feedbackBusy
  // state keys also pruned. Re-add if the feedback UI is rebuilt.

  // ─── Podcast (audio narration) ─────────────────────────────────────────
  var pg=document.getElementById("podGenBtn");if(pg)pg.onclick=genPodcast;
  var pp=document.getElementById("podPlayBtn");if(pp)pp.onclick=playPod;
  document.querySelectorAll(".rateBtn").forEach(function(b){b.onclick=function(){S.podRate=parseFloat(b.dataset.r);if(S.podPlaying){speechSynthesis.cancel();S.podPlaying=false}render()}});
  var pt=document.getElementById("podToggle");if(pt)pt.onclick=function(){S.podShow=!S.podShow;render()};

  // ─── Library / samples / favorites (hero & landing) ───────────────────
  var mlb=document.getElementById("myLibBtn");if(mlb)mlb.onclick=function(){S.showSaved=true;S.savedSearch="";render()};
  // examplesBtn was removed from hero; samples now live inside the Library view.
  document.querySelectorAll(".landingSampleBtn").forEach(function(b){b.onclick=function(e){if(e.target.closest(".favBtn"))return;loadSample(b.dataset.slug)}});
  document.querySelectorAll(".landingSavedBtn").forEach(function(b){b.onclick=function(){loadSavedTalk(b.dataset.id)}});
  document.querySelectorAll(".favBtn").forEach(function(b){b.onclick=function(e){e.stopPropagation();toggleFavorite(b.dataset.slug)}});
  // ─── Visual Memory Card (download / lightbox) ──────────────────────────
  var dvb=document.getElementById("downloadVMCBtn");if(dvb)dvb.onclick=downloadVMC;
  // vmcOpenBtn/vmcCloseBtn handlers deleted — those IDs no longer rendered.
  // In-talk title edit pencil
  var etb=document.getElementById("editTitleBtn");if(etb)etb.onclick=async function(){
    if(!S.talk)return;
    var current = S.talk.title || S.topic || "";
    var fresh = prompt("Edit talk title:", current);
    if(!fresh || fresh === current) return;
    S.talk.title = fresh;
    // If this talk is currently saved in the cloud, persist the title change immediately.
    if(S.user && window.sb && S.loadedTalkId && !String(S.loadedTalkId).startsWith("t_")){
      await cloudUpdateTalkTitle(S.loadedTalkId, fresh);
    }
    // For local-saved talks, push the change into localStorage too.
    if(!S.user && S.loadedTalkId && String(S.loadedTalkId).startsWith("t_")){
      var local = loadSavedTalks();
      for(var i=0;i<local.length;i++){
        if(local[i].id===S.loadedTalkId){
          if(!local[i].talk) local[i].talk={};
          local[i].talk.title = fresh;
          break;
        }
      }
      writeSavedTalks(local);
    }
    // If the talk wasn't loaded from a saved record (e.g. user just generated it and is renaming
    // before first save), the title change isn't persisted — flag as dirty so the Save button reactivates.
    if(!S.loadedTalkId) S.talkIsSaved = false;
    render();
  };
  var cqb=document.getElementById("copyQBtn");if(cqb)cqb.onclick=function(){copyBoardsQuestion("stem")};
  var cqfb=document.getElementById("copyQFullBtn");if(cqfb)cqfb.onclick=function(){copyBoardsQuestion("full")};
  // Per-section copy buttons (lecture mode)
  // Undo button (capsule)
  var udb=document.getElementById("undoEditBtn");if(udb)udb.onclick=undoLastEdit;
  // === Per-section edit mode handlers (Jenni 2026-06-04) ===
  // Enter edit mode — clone the section into a working draft
  document.querySelectorAll(".secEditBtn").forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    if(!S.talk||!S.talk.sections)return;
    var idx=parseInt(b.dataset.i,10);var src=S.talk.sections[idx];if(!src)return;
    S.editingSection = idx;
    S.editingDraft = JSON.parse(JSON.stringify(src));
    S.activeSection = idx; // open this section
    render();
  }});
  var secCB=document.getElementById("secEditCancelBtn");if(secCB)secCB.onclick=function(){S.editingSection=null;S.editingDraft=null;render()};
  var secSB=document.getElementById("secEditSaveBtn");if(secSB)secSB.onclick=function(){
    if(S.editingSection==null||!S.editingDraft||!S.talk||!S.talk.sections)return;
    // Read current input values into draft (in case some weren't synced via onchange)
    var hEl=document.getElementById("secEditHeading");if(hEl)S.editingDraft.heading=hEl.value;
    var pEl=document.getElementById("secEditPearl");if(pEl)S.editingDraft.teaching_pearl=pEl.value;
    var tEl=document.getElementById("secEditTip");if(tEl)S.editingDraft.board_tip=tEl.value;
    document.querySelectorAll(".secEditBulletTA").forEach(function(ta){
      var i=parseInt(ta.dataset.i,10);
      if(S.editingDraft.points && i>=0 && i<S.editingDraft.points.length){S.editingDraft.points[i]=ta.value}
    });
    // Drop empty bullets
    S.editingDraft.points = (S.editingDraft.points||[]).map(function(p){return String(p||"").trim()}).filter(Boolean);
    // Snapshot for undo, commit, exit edit mode
    pushTalkHistory("section "+(S.editingSection+1)+" edit");
    S.talk.sections[S.editingSection] = S.editingDraft;
    S.talkIsSaved = false;
    S.editingSection = null;
    S.editingDraft = null;
    render();
  };
  // Live-sync bullet textareas into the draft so we don't lose typing on re-render
  document.querySelectorAll(".secEditBulletTA").forEach(function(ta){ta.oninput=function(e){
    if(!S.editingDraft||!S.editingDraft.points)return;
    var i=parseInt(ta.dataset.i,10);
    if(i>=0 && i<S.editingDraft.points.length){S.editingDraft.points[i]=ta.value}
  }});
  // Heading + pearl + tip live sync
  var seh=document.getElementById("secEditHeading");if(seh)seh.oninput=function(){if(S.editingDraft)S.editingDraft.heading=seh.value};
  var sep=document.getElementById("secEditPearl");if(sep)sep.oninput=function(){if(S.editingDraft)S.editingDraft.teaching_pearl=sep.value};
  var set=document.getElementById("secEditTip");if(set)set.oninput=function(){if(S.editingDraft)S.editingDraft.board_tip=set.value};
  // Delete bullet
  document.querySelectorAll(".secEditDelBulletBtn").forEach(function(b){b.onclick=function(){
    if(!S.editingDraft||!S.editingDraft.points)return;
    var i=parseInt(b.dataset.i,10);
    if(i>=0 && i<S.editingDraft.points.length){S.editingDraft.points.splice(i,1);render()}
  }});
  // Add new bullet
  var seab=document.getElementById("secEditAddBulletBtn");if(seab)seab.onclick=function(){
    if(!S.editingDraft)return;
    if(!S.editingDraft.points)S.editingDraft.points=[];
    S.editingDraft.points.push("");
    render();
    // Focus the new textarea
    setTimeout(function(){var ts=document.querySelectorAll(".secEditBulletTA");if(ts.length)ts[ts.length-1].focus()},50);
  };

  document.querySelectorAll(".copySecBtn").forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      if(!S.talk||!S.talk.sections)return;
      var idx=parseInt(b.dataset.i,10);var sec=S.talk.sections[idx];if(!sec)return;
      var lines=[(idx+1)+". "+(sec.heading||"")+(sec.minutes?" ("+sec.minutes+")":"")];
      lines.push("");
      (sec.points||[]).forEach(function(p){lines.push("• "+p)});
      if(sec.teaching_pearl){lines.push("");lines.push("💡 Teaching Pearl: "+sec.teaching_pearl)}
      if(sec.board_tip){lines.push("");lines.push("🎯 Board Tip: "+sec.board_tip)}
      copyTextToClipboard(lines.join("\n"),"Section copied");
    };
  });
  // "See all N →" on the landing samples row now jumps into Library (samples merged in).
  var lmb=document.getElementById("landingMoreBtn");if(lmb)lmb.onclick=function(){S.showSaved=true;S.libTab="lectures";render()};
  // modeToggleBtn handler deleted — ID no longer rendered.
  // ─── Save / export / share current talk ────────────────────────────────
  // Note: overflow-menu buttons use the unsuffixed IDs (saveTalkBtn, pdfTalkBtn, ...).
  // The Export tab uses *Export-suffixed IDs to avoid duplicate-ID collisions when both
  // are in the DOM simultaneously (getElementById only attaches to the first).
  var stb=document.getElementById("saveTalkBtn");if(stb)stb.onclick=saveCurrentTalk;
  // Save button in capsule header (top of page) — same handler.
  var stbTop=document.getElementById("saveTalkBtnTop");if(stbTop)stbTop.onclick=saveCurrentTalk;
  // Save button at the bottom (after the lesson outline) — same handler.
  var stbBot=document.getElementById("saveTalkBtnBottom");if(stbBot)stbBot.onclick=saveCurrentTalk;
  // === EXPORT PDF inline button (June 2026 per Jenni) — paired with Save at bottom ===
  var ptbBot=document.getElementById("pdfTalkBtnBottom");if(ptbBot)ptbBot.onclick=exportTalkPDF;
  var ptb=document.getElementById("pdfTalkBtn");if(ptb)ptb.onclick=exportTalkPDF;
  var pngb=document.getElementById("pngTalkBtn");if(pngb)pngb.onclick=function(){S.overflowOpen=false;render();setTimeout(exportTalkImage,50)};
  var sib=document.getElementById("saveSlidesImgBtn");if(sib)sib.onclick=exportSlidesImage;
  // Overview's bottom CTA → switch to Slides tab + jump to top (Jenni 2026-06-08)
  var o2s=document.getElementById("overviewToSlidesBtn");if(o2s)o2s.onclick=function(){S.tab="slides";window.scrollTo(0,0);render()};
  var jtb=document.getElementById("jsonTalkBtn");if(jtb)jtb.onclick=function(){exportTalkJSON(null)};
  var dtb=document.getElementById("deleteTalkBtn");if(dtb)dtb.onclick=function(){S.overflowOpen=false;deleteCurrentTalk()};
  var shr=document.getElementById("shareTalkBtn");if(shr)shr.onclick=function(){shareTalk()};
  // ── Public sharing handlers ─────────────────────────────────────────────
  var pubBtn=document.getElementById("publishTalkBtn");if(pubBtn)pubBtn.onclick=async function(){
    if(!S.loadedTalkId){ alert("Save the talk first before publishing."); return }
    if(!confirm("Publish this talk to the public web?\n\n• Anyone with the link can view it\n• Your name (from profile) will be shown as author\n• Private notes (refine context, uploaded references) will be stripped\n• You can make it private again anytime")) return;
    S.overflowOpen=false;render();
    var data = await cloudSetTalkPublic(S.loadedTalkId, true);
    if(!data){ alert("Couldn't publish — check connection and try again."); return }
    S.shareModalToken = data.share_token;
    S.shareModalOpen = true;
    render();
  };
  var unpubBtn=document.getElementById("unpublishTalkBtn");if(unpubBtn)unpubBtn.onclick=async function(){
    if(!S.loadedTalkId)return;
    if(!confirm("Make this talk private?\n\nThe share link will stop working immediately. Anyone with the link saved will see an error.")) return;
    S.overflowOpen=false;render();
    var data = await cloudSetTalkPublic(S.loadedTalkId, false);
    if(!data){ alert("Couldn't unpublish — check connection."); return }
    S.savedFlash="🔒 Made private";render();
    setTimeout(function(){S.savedFlash="";render()},2000);
  };
  var csu=document.getElementById("copyShareUrlBtn");if(csu)csu.onclick=function(){
    var _row=(S.cloudTalks||[]).find(function(x){return x.id===S.loadedTalkId});
    if(!_row||!_row.share_token){alert("No share link available.");return}
    S.shareModalToken = _row.share_token;
    S.shareModalOpen = true;
    S.overflowOpen = false;
    render();
  };
  // Share modal handlers
  var smc=document.getElementById("shareModalCloseBtn");if(smc)smc.onclick=function(){S.shareModalOpen=false;render()};
  var smb=document.getElementById("shareModalBackdrop");if(smb)smb.onclick=function(){S.shareModalOpen=false;render()};
  var smcp=document.getElementById("shareModalCopyBtn");if(smcp)smcp.onclick=function(){
    var url=publicShareURL(S.shareModalToken);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){
        var b=document.getElementById("shareModalCopyBtn");
        if(b){var orig=b.textContent;b.textContent="✓ Copied!";setTimeout(function(){b.textContent=orig},1800)}
      });
    }
  };
  var ptbE=document.getElementById("pdfTalkBtnExport");if(ptbE)ptbE.onclick=exportTalkPDF;
  var jtbE=document.getElementById("jsonTalkBtnExport");if(jtbE)jtbE.onclick=function(){exportTalkJSON(null)};
  var shrE=document.getElementById("shareTalkBtnExport");if(shrE)shrE.onclick=function(){shareTalk()};
}

// ═══════════ INIT ═══════════
loadFromShareHash();
loadFromPublicShareHash();
loadFromLibHash();
render();
// Safety net: if Supabase init never completes (e.g., user offline), still drain after 3s
// so the deep-link at least tries the localStorage path. No-op if already drained.
setTimeout(function(){ if(typeof drainPendingHashLoad==="function" && window._pendingHashLoad) drainPendingHashLoad(); }, 3000);
</script>
</body>
</html>
