// Pick the right version for a dual-version sample. Hero default = concise.
// Sample schema:
//   { slug, topic, style, specialty, generated_at, guideline_sources,
//     talk_concise: <json>, talk_detailed: <json>, talk: <legacy single-version fallback> }
function pickSampleTalk(s, depth){
  if(!s) return null;
  var d = depth || "concise";
  if(d === "detailed" && s.talk_detailed) return s.talk_detailed;
  if(d === "concise"  && s.talk_concise)  return s.talk_concise;
  // Fallbacks if the requested version doesn't exist
  return s.talk_concise || s.talk_detailed || s.talk || null;
}

function loadSample(slug, depth){
  if(!SAMPLES||!SAMPLES.length)return;
  var s=null;for(var i=0;i<SAMPLES.length;i++){if(SAMPLES[i].slug===slug){s=SAMPLES[i];break}}
  if(!s)return;
  // Determine which depth version was actually picked (handles fallback when requested version is missing).
  var chosen = pickSampleTalk(s, depth);
  if(!chosen) return;
  var actualDepth = "concise";
  if(s.talk_detailed && chosen === s.talk_detailed) actualDepth = "detailed";
  else if(s.talk_concise && chosen === s.talk_concise) actualDepth = "concise";
  // Otherwise it's the legacy single-version `talk` — we can't tell, default to concise.
  S.talk=chosen; S.topic=s.topic; S.style=s.style||"lecture"; S.depth=actualDepth;
  S.isSampleTalk=true; S.sampleSlug=s.slug; S.sharedTalk=false;
  S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;
  S.showAns=false;S.userPick="";
  S.msgs=[];S.error="";
  if(s.guideline_sources&&s.guideline_sources.length){
    S.glRef={specialties:[s.specialty||""],context:"",sources:s.guideline_sources,trials:[],conferences:[]};
  } else { S.glRef=null; }
  S.showSaved=false; // exit Library view if open
  speechSynthesis.cancel();
  render();
  var ts=document.getElementById("talkStart");
  if(ts)ts.scrollIntoView({behavior:"smooth",block:"start"});
  else window.scrollTo({top:0,behavior:"smooth"});
}

    // canonicalizes to SPEC_ORDER, so the main loop above is exhaustive.)
  }
  return h;
}

function renderLib(){

    ROLES.forEach(function(r){h+='<option value="'+r[0]+'"'+(pf.role===r[0]?" selected":"")+'>'+r[1]+'</option>'});
    h+='</select></div>';
    // Specialty
    h+='<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.09em;margin:0 0 6px 4px">Specialty</div><select id="pfSpec" style="width:100%;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;color:var(--ink)"><option value="">—</option>';
    SPECIALTIES.forEach(function(s){h+='<option value="'+esc(s)+'"'+(pf.specialty===s?" selected":"")+'>'+esc(s)+'</option>'});
    h+='</select></div>';
    // Training year
    h+='<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.09em;margin:0 0 6px 4px">Training year</div><input id="pfYear" type="number" min="0" max="15" value="'+esc(pf.training_year!=null?String(pf.training_year):"")+'" placeholder="e.g. 2" style="width:100%;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit"></div>';
    // Institution
    h+='<div style="margin-bottom:10px"><div style="font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.09em;margin:0 0 6px 4px">Institution</div><input id="pfInst" type="text" value="'+esc(pf.institution||"")+'" placeholder="NYU Langone" style="width:100%;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit"></div>';
    // Primary use
    h+='<div style="margin-bottom:18px"><div style="font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.09em;margin:0 0 6px 4px">Primary use</div><select id="pfUse" style="width:100%;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;outline:none;font-family:inherit;color:var(--ink)"><option value="">—</option>';
    USES.forEach(function(u){h+='<option value="'+u[0]+'"'+(pf.primary_use===u[0]?" selected":"")+'>'+u[1]+'</option>'});
    h+='</select></div>';
    // Save CTA
    h+='<button id="pfSaveBtn" style="width:100%;background:linear-gradient(135deg,var(--plum-rich),var(--plum-deep));border:none;border-radius:18px;padding:13px;color:#fff;font-size:14px;font-weight:600;cursor:pointer">Save profile</button>';
    h+='</div></div>';
  }

  return h;
}

// ═══════════ BIND ═══════════
function bindLib(){
  document.getElementById("libBack").onclick=function(){S.showLib=false;render()};
  document.getElementById("libSearch").oninput=function(e){S.search=e.target.value;render()};
  document.querySelectorAll(".catBtn").forEach(function(b){b.onclick=function(){S.expCat=S.expCat===b.dataset.cat?null:b.dataset.cat;S.expSub=null;render()}});
  document.querySelectorAll(".subBtn").forEach(function(b){b.onclick=function(){S.expSub=S.expSub===b.dataset.sub?null:b.dataset.sub;render()}});
  document.querySelectorAll(".topBtn").forEach(function(b){b.onclick=function(){S.topic=b.dataset.t;S.showLib=false;render()}});
}

function bindMain(){
  // ─── Compose form ───────────────────────────────────────────────────────
  var ta=document.getElementById("topicTA");if(ta)ta.oninput=function(e){S.topic=e.target.value;var gb2=document.getElementById("genBtn");if(gb2){gb2.disabled=S.loading||!S.topic.trim();gb2.style.opacity=S.loading||!S.topic.trim()?"0.4":"1"}};
  var bb=document.getElementById("browseBtn");if(bb)bb.onclick=function(){S.showLib=true;S.expCat=null;render()};
  // chatInput/chatSend handlers deleted — those IDs are no longer rendered. The
  // sendChat() function is still reachable via the reviseIn/reviseSend bindings below.
  document.querySelectorAll(".styleBtn").forEach(function(b){b.onclick=function(){if(S.style!==b.dataset.s){S.style=b.dataset.s;S.talk=null;S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;S.showAns=false;S.userPick="";S.error="";speechSynthesis.cancel()}render()}});
  document.querySelectorAll(".depthBtn").forEach(function(b){b.onclick=function(){if(S.depth!==b.dataset.d){S.depth=b.dataset.d;S.talk=null;S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;S.showAns=false;S.userPick="";S.error="";speechSynthesis.cancel()}render()}});
  var dz=document.getElementById("dropZone");if(dz)dz.onclick=function(){document.getElementById("fileInput").click()};
  var fi=document.getElementById("fileInput");if(fi)fi.onchange=async function(e){
    for(var i=0;i<e.target.files.length;i++){var f=e.target.files[i];try{
      if(f.type.indexOf("text")>=0||f.name.endsWith(".txt")){var r=new FileReader();r.onload=function(){S.files.push({n:f.name,t:"text",c:r.result.slice(0,8000)});render()};r.readAsText(f)}
      else if(f.type==="application/pdf"||f.type.indexOf("image/")===0){var r2=new FileReader();r2.onload=function(){S.files.push({n:f.name,t:f.type==="application/pdf"?"pdf":"img",c:r2.result.split(",")[1],m:f.type});render()};r2.readAsDataURL(f)}
    }catch(err){}}};
  document.querySelectorAll(".rmFile").forEach(function(b){b.onclick=function(){S.files.splice(+b.dataset.i,1);render()}});
  var pc=document.getElementById("podCheck");if(pc)pc.onchange=function(e){S.wantPod=e.target.checked};
  var wc=document.getElementById("webCheck");if(wc)wc.onchange=function(e){S.wantWebSearch=e.target.checked};
  var gb=document.getElementById("genBtn");if(gb)gb.onclick=generate;

  // ─── Generated-talk view ────────────────────────────────────────────────
  var rb=document.getElementById("resetBtn");if(rb)rb.onclick=resetAll;
  // One-tap depth flip in the capsule header. Concise ⇄ Detailed.
  // For samples: swap to the other CACHED version (no API call). For fresh generations: rebuild.
  var dtb=document.getElementById("depthToggleBtn");if(dtb)dtb.onclick=function(){
    if(S.style==="boards")return; // depth doesn't apply
    var newDepth = (S.depth==="detailed") ? "concise" : "detailed";
    if(S.isSampleTalk && S.sampleSlug){
      // Look up the sample; if the other depth is cached on it, swap instantly.
      var s=null; for(var i=0;i<SAMPLES.length;i++){if(SAMPLES[i].slug===S.sampleSlug){s=SAMPLES[i];break}}
      var otherTalk = s && (newDepth==="detailed" ? s.talk_detailed : s.talk_concise);
      if(otherTalk){ loadSample(S.sampleSlug, newDepth); return; }
      // Cached other-depth not available — silently no-op rather than burning an API call on a sample.
      return;
    }
    S.depth = newDepth;
    generate();
  };
  document.querySelectorAll(".secBtn").forEach(function(b){b.onclick=function(){var idx=+b.dataset.i;S.activeSection=(S.activeSection===idx?-1:idx);S.sec=idx;render()}});
  // Tab switching (top + bottom nav)
  document.querySelectorAll(".tk-tab,.bntab").forEach(function(b){b.onclick=function(){if(b.dataset.tab&&S.tab!==b.dataset.tab){S.tab=b.dataset.tab;render()}}});
  // Guideline collapsible
  var gtg=document.getElementById("gldToggle");if(gtg)gtg.onclick=function(){S.gldOpen=!S.gldOpen;render()};
  // gldToggle2 handler deleted — ID no longer rendered.
  // Lightbox
  var lo1=document.getElementById("lightboxOpenBtn");if(lo1)lo1.onclick=function(){S.lightbox=true;render()};
  var lo2=document.getElementById("lightboxOpenBtn2");if(lo2)lo2.onclick=function(){S.lightbox=true;render()};
  var lc=document.getElementById("lightboxClose");if(lc)lc.onclick=function(e){if(e.target===lc||e.target.id==="lightboxCloseX"){S.lightbox=false;render()}};
  // Save/share variants from new header + action row
  // saveTalkBtn2/shareTalkBtn2 handlers deleted — those IDs no longer rendered (leftover from a prior header layout).
  var stwt=document.getElementById("shareTwitterBtn");if(stwt)stwt.onclick=function(){var btn=document.getElementById("shareTalkBtn");if(btn)btn.click()};
  // Add has-talk class for bottom-nav padding
  if(S.talk){document.querySelector(".app").classList.add("has-talk")}else{document.querySelector(".app").classList.remove("has-talk")}
  // === Two-state UX bindings ===
  var rtad=document.getElementById("refineTAd");if(rtad)rtad.oninput=function(e){S.refineContext=e.target.value};
  var ttad=document.getElementById("topicTAd");if(ttad)ttad.oninput=function(e){S.topic=e.target.value};
  document.querySelectorAll(".mode-card").forEach(function(b){b.onclick=function(){if(b.dataset.tab&&S.tab!==b.dataset.tab){S.tab=b.dataset.tab;render()}}});
  var esb=document.getElementById("editSettingsBtn");if(esb)esb.onclick=function(){S.editSettings=true;S.overflowOpen=false;render()};
  var rb1=document.getElementById("rebuildBtn");if(rb1)rb1.onclick=function(){S.editSettings=false;S.overflowOpen=false;generate()};
  var rb2=document.getElementById("rebuildBtn2");if(rb2)rb2.onclick=function(){S.editSettings=false;generate()};
  var ofb=document.getElementById("overflowBtn");if(ofb)ofb.onclick=function(e){e.stopPropagation();S.overflowOpen=!S.overflowOpen;render()};
  if(S.overflowOpen){document.body.onclick=function(e){if(!e.target.closest(".overflow-menu")&&!e.target.closest("#overflowBtn")){S.overflowOpen=false;render()}}}else{document.body.onclick=null}
  var nbt=document.getElementById("newTalkBtn");if(nbt)nbt.onclick=function(){S.overflowOpen=false;resetAll()};
  var dcb=document.getElementById("drawerCloseBtn");if(dcb)dcb.onclick=function(){S.editSettings=false;render()};
  var dbk=document.getElementById("drawerBackdrop");if(dbk)dbk.onclick=function(){S.editSettings=false;render()};
  var crb=document.getElementById("composerRefBtn");if(crb)crb.onclick=function(){var fi=document.getElementById("composerFileInput")||document.getElementById("fileInput");if(fi)fi.click()};
  var cfi=document.getElementById("composerFileInput");if(cfi)cfi.onchange=function(e){var fi2=document.getElementById("fileInput");if(fi2){var dt=new DataTransfer();for(var i=0;i<e.target.files.length;i++)dt.items.add(e.target.files[i]);fi2.files=dt.files;fi2.dispatchEvent(new Event("change",{bubbles:true}))}};
  var rin=document.getElementById("reviseIn");if(rin){rin.oninput=function(e){S.reviseIn=e.target.value;var sb=document.getElementById("reviseSend");if(sb)sb.disabled=!e.target.value.trim()};rin.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey&&String(S.reviseIn||"").trim()){e.preventDefault();S.chatIn=S.reviseIn;S.reviseIn="";if(typeof sendChat==="function")sendChat()}}}
  var rsd=document.getElementById("reviseSend");if(rsd)rsd.onclick=function(){if(!String(S.reviseIn||"").trim())return;S.chatIn=S.reviseIn;S.reviseIn="";if(typeof sendChat==="function")sendChat()};

  // ─── Auth (sign-in modal + Google + account menu + profile editor) ─────
  var sib=document.getElementById("signInBtn");if(sib)sib.onclick=function(){S.signInOpen=true;S.authMsg="";render()};
  var sicb=document.getElementById("signInCloseBtn");if(sicb)sicb.onclick=function(){S.signInOpen=false;render()};
  var sibd=document.getElementById("signInBackdrop");if(sibd)sibd.onclick=function(){S.signInOpen=false;render()};
  var aei=document.getElementById("authEmailInput");if(aei)aei.oninput=function(e){S.authEmail=e.target.value};
  var mlf=document.getElementById("magicLinkForm");if(mlf)mlf.onsubmit=async function(e){e.preventDefault();var em=(S.authEmail||"").trim();if(!em){S.authMsg="Enter your email";render();return}S.authBusy=true;S.authMsg="";render();try{await signInWithMagicLink(em);S.authMsg="Check "+em+" — we sent you a magic link.";S.authBusy=false;render()}catch(err){S.authMsg=err.message||"Could not send magic link";S.authBusy=false;render()}};
  var gsb=document.getElementById("googleSignInBtn");if(gsb)gsb.onclick=async function(){S.authBusy=true;render();try{await signInWithGoogle()}catch(err){S.authMsg=err.message||"Google sign-in failed";S.authBusy=false;render()}};
  var acb=document.getElementById("accountBtn");if(acb)acb.onclick=function(e){e.stopPropagation();S.accountMenuOpen=!S.accountMenuOpen;render()};
  if(S.accountMenuOpen){document.body.onclick=function(e){if(!e.target.closest("#accountMenu")&&!e.target.closest("#accountBtn")){S.accountMenuOpen=false;render()}}}
  var sob=document.getElementById("signOutBtn");if(sob)sob.onclick=function(){S.accountMenuOpen=false;signOut()};
  var peb=document.getElementById("profileEditBtn");if(peb)peb.onclick=function(){S.accountMenuOpen=false;S.profileEditOpen=true;S.profileForm=Object.assign({},S.profile||{});render()};
  // Profile editor form
  var pcb=document.getElementById("profileCloseBtn");if(pcb)pcb.onclick=function(){S.profileEditOpen=false;S.profileForm=null;render()};
  var pbk=document.getElementById("profileBackdrop");if(pbk)pbk.onclick=function(){S.profileEditOpen=false;S.profileForm=null;render()};
  function _pfBind(id,key,coerce){
    var el=document.getElementById(id);if(!el)return;
    var write=function(e){
      if(!S.profileForm)S.profileForm={};
      var v=e.target.value;
      S.profileForm[key]=coerce?coerce(v):v;
    };
    // SELECT fires 'change' (and 'input' isn't reliable); INPUT fires 'input'. Wire whichever matches.
    if(el.tagName==="SELECT") el.onchange=write; else el.oninput=write;
  }
  // pfYear is type="number" — coerce to Number (or null if blank) so Supabase stores int.
  var toNumOrNull=function(v){var s=String(v||"").trim();if(!s)return null;var n=Number(s);return isFinite(n)?n:null};
  _pfBind("pfName","name"); _pfBind("pfRole","role"); _pfBind("pfSpec","specialty");
  _pfBind("pfYear","training_year",toNumOrNull); _pfBind("pfInst","institution"); _pfBind("pfUse","primary_use");
  var pfs=document.getElementById("pfSaveBtn");if(pfs)pfs.onclick=function(){saveProfileForm()};

  // ─── Visual / diagram generator ────────────────────────────────────────
  var db=document.getElementById("dgBtn");if(db)db.onclick=genDiagram;
  document.querySelectorAll(".dgModeBtn").forEach(function(b){b.onclick=function(){if(S.dgMode!==b.dataset.m){S.dgMode=b.dataset.m;S.dg=null;S.dgErr="";render()}}});
  // resetKey/resetClaudeKey handlers deleted — those IDs no longer rendered.
  // ─── Boards-mode answer choices ────────────────────────────────────────
  document.querySelectorAll(".choiceBtn").forEach(function(b){b.onclick=function(){if(!S.showAns){S.userPick=b.dataset.letter;render()}}});
  var sb=document.getElementById("submitAnsBtn");if(sb)sb.onclick=function(){S.showAns=true;render()};

  // Feedback widget handlers deleted — feedbackToggle/feedbackTA/feedbackSubmit/feedbackCancel
  // IDs no longer rendered. submitFeedback() function and S.showFeedback/feedbackText/feedbackBusy
  // state keys also pruned. Re-add if the feedback UI is rebuilt.

  // ─── Podcast (audio narration) ─────────────────────────────────────────
  var pg=document.getElementById("podGenBtn");if(pg)pg.onclick=genPodcast;
  var pp=document.getElementById("podPlayBtn");if(pp)pp.onclick=playPod;
  document.querySelectorAll(".rateBtn").forEach(function(b){b.onclick=function(){S.podRate=parseFloat(b.dataset.r);if(S.podPlaying){speechSynthesis.cancel();S.podPlaying=false}render()}});
  var pt=document.getElementById("podToggle");if(pt)pt.onclick=function(){S.podShow=!S.podShow;render()};

  // ─── Library / samples / favorites (hero & landing) ───────────────────
  var mlb=document.getElementById("myLibBtn");if(mlb)mlb.onclick=function(){S.showSaved=true;S.savedSearch="";render()};
  // examplesBtn was removed from hero; samples now live inside the Library view.
  document.querySelectorAll(".landingSampleBtn").forEach(function(b){b.onclick=function(e){if(e.target.closest(".favBtn"))return;loadSample(b.dataset.slug)}});
  document.querySelectorAll(".favBtn").forEach(function(b){b.onclick=function(e){e.stopPropagation();toggleFavorite(b.dataset.slug)}});
  // ─── Visual Memory Card (download / lightbox) ──────────────────────────
  var dvb=document.getElementById("downloadVMCBtn");if(dvb)dvb.onclick=downloadVMC;
  // vmcOpenBtn/vmcCloseBtn handlers deleted — those IDs no longer rendered.
  var cqb=document.getElementById("copyQBtn");if(cqb)cqb.onclick=copyBoardsQuestion;
  // "See all N →" on the landing samples row now jumps into Library (samples merged in).
  var lmb=document.getElementById("landingMoreBtn");if(lmb)lmb.onclick=function(){S.showSaved=true;S.libTab="all";render()};
  // modeToggleBtn handler deleted — ID no longer rendered.
  // ─── Save / export / share current talk ────────────────────────────────
  // Note: overflow-menu buttons use the unsuffixed IDs (saveTalkBtn, pdfTalkBtn, ...).
  // The Export tab uses *Export-suffixed IDs to avoid duplicate-ID collisions when both
  // are in the DOM simultaneously (getElementById only attaches to the first).
  var stb=document.getElementById("saveTalkBtn");if(stb)stb.onclick=saveCurrentTalk;
  // Save button in capsule header (top of page) — same handler.
  var stbTop=document.getElementById("saveTalkBtnTop");if(stbTop)stbTop.onclick=saveCurrentTalk;
  var ptb=document.getElementById("pdfTalkBtn");if(ptb)ptb.onclick=exportTalkPDF;
  var jtb=document.getElementById("jsonTalkBtn");if(jtb)jtb.onclick=function(){exportTalkJSON(null)};
  var shr=document.getElementById("shareTalkBtn");if(shr)shr.onclick=function(){shareTalk()};
  var ptbE=document.getElementById("pdfTalkBtnExport");if(ptbE)ptbE.onclick=exportTalkPDF;
  var jtbE=document.getElementById("jsonTalkBtnExport");if(jtbE)jtbE.onclick=function(){exportTalkJSON(null)};
  var shrE=document.getElementById("shareTalkBtnExport");if(shrE)shrE.onclick=function(){shareTalk()};
}

loadFromShareHash();
render();
