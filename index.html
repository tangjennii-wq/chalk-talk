  "Oncology": {
    society: "ASCO, NCCN, USPSTF",
    guidelines: [
      {name:"NCCN NSCLC v4.2024",year:2024,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1450",keys:"All advanced NSCLC: NGS for EGFR/ALK/ROS1/BRAF/KRAS-G12C/MET/RET/NTRK/HER2 + PD-L1 IHC. EGFR mut: osimertinib (FLAURA). ALK: alectinib/lorlatinib. KRAS-G12C: sotorasib/adagrasib (CodeBreaK 200). Adjuvant osimertinib (ADAURA), durvalumab (PACIFIC) post-CRT."},
      {name:"NCCN Breast Cancer v3.2024 + ASCO",year:2024,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1419",keys:"HER2+: trastuzumab + pertuzumab + taxane (CLEOPATRA); T-DXd second-line (DESTINY-Breast03). HR+: CDK4/6 inhibitors + AI/fulvestrant (PALOMA, MONALEESA, MONARCH); ribociclib OS benefit. TNBC: pembrolizumab + chemo (KEYNOTE-522). HER2-low: T-DXd."},
      {name:"NCCN Colorectal v2.2026",year:2026,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1438",keys:"Universal MMR/MSI testing. dMMR/MSI-H metastatic: pembrolizumab first-line (KEYNOTE-177; ORR ~30%, OS not reached). BRAF V600E: encorafenib + cetuximab/panitumumab (BEACON). Adjuvant FOLFOX/CAPOX +/- atezolizumab for stage III dMMR."},
      {name:"NCCN Prostate v5.2026",year:2026,access:"Paywalled",url:"https://www.nccn.org/guidelines/guidelines-detail?category=1&id=1444",keys:"Localized: surgery / radiation +/- ADT. Metastatic hormone-sensitive: ADT + docetaxel (CHAARTED) OR androgen receptor targeted (abiraterone/enzalutamide/apalutamide; LATITUDE/STAMPEDE/TITAN/ARCHES). CRPC: olaparib (BRCA, PROfound). PARPi for HRR mutations."},
      {name:"NCCN Multiple Myeloma v4.2026",year:2026,access:"Paywalled",url:"https://www.nccn.org/guidelines/",keys:"IMWG diagnosis: clonal plasma cells >=10% + myeloma-defining events (CRAB, biomarker SLiM-CRAB). Triplet/quadruplet induction (VRd, Dara-VRd; GRIFFIN, PERSEUS); ASCT eligibility-based. CAR-T (cilta-cel, ide-cel) for relapsed (CARTITUDE, KarMMa)."},
      {name:"USPSTF Cancer Screening 2024",year:2024,access:"Open",url:"https://www.uspreventiveservicestaskforce.org/uspstf/recommendation-topics/uspstf-a-and-b-recommendations",keys:"Breast: mammography 40-74 q2y (B). Colon: 45-75 (B 45-49, A 50-75). Lung LDCT: 50-80, >=20 pack-yr, current/former (quit <15y). Cervical: HPV primary q5y 30-65 or co-test. Prostate: shared decision 55-69."},
      {name:"ASCO Immunotherapy Toxicity 2024",year:2024,access:"Open",url:"https://ascopubs.org/doi/abs/10.1200/JCO.21.01440",keys:"Grade 1: continue, monitor. Grade 2: hold + consider steroids if persistent. Grade 3: hold + high-dose steroids (prednisone 1-2 mg/kg, taper 4-6 weeks). Grade 4: permanent discontinuation; immunosuppression escalation. Endocrinopathies often need lifelong replacement."},
      {name:"Cairo-Bishop TLS Definition",year:2004,access:"Open",url:"https://onlinelibrary.wiley.com/doi/10.1111/j.1365-2141.2004.05094.x",keys:"TLS: laboratory (>=2 of K, P, uric acid, Ca within +/-25% baseline) + clinical (Cr 1.5x, arrhythmia, seizure). High risk: bulky lymphoma, AML with hyperleukocytosis, ATL. Rasburicase for high-risk; allopurinol for moderate. Aggressive IV hydration."},
      {name:"ASCO Cancer Pain 2024",year:2024,access:"Open",url:"https://ascopubs.org/journal/jco",keys:"Multimodal pain management. Opioid titration with breakthrough doses. Adjuvants: gabapentinoids for neuropathic, dexamethasone for bone. Buprenorphine emerging for chronic cancer pain. Methadone caution (QT, drug interactions)."},
      {name:"ASCO Early Breast Cancer / CDK4/6 Rapid Update 2024",year:2024,access:"Open",url:"https://ascopubs.org/doi/10.1200/JCO.24.00886",keys:"HR+/HER2- node-positive high-risk: adjuvant abemaciclib 150mg BID x2y + ET >=5y (monarchE: 5y IDFS absolute benefit 7.6%; Ki-67 requirement dropped 2023). Ribociclib emerging per NATALEE (stage II-III, broader population). HER2+: trastuzumab + pertuzumab + taxane (APHINITY); T-DM1 post-neoadjuvant residual (KATHERINE). Metastatic HR+: CDK4/6i + AI first-line (PALOMA-2, MONALEESA-2/7); TNBC PD-L1+ pembrolizumab (KEYNOTE-355); sacituzumab govitecan (ASCENT)."},
      {name:"ASCO Metastatic Colorectal Cancer Guideline 2022/2024",year:2024,access:"Open",url:"https://ascopubs.org/doi/10.1200/JCO.22.01690",keys:"Adjuvant stage III: FOLFOX or CAPOX x3-6mo (IDEA: 3mo non-inferior for low-risk T1-3N1). Metastatic molecular triage: RAS/BRAF/MSI/HER2 mandatory. RAS-mut or right-sided: doublet + bevacizumab (anti-VEGF). RAS-WT left-sided: doublet + cetuximab/panitumumab (anti-EGFR; PARADIGM, CALGB 80405). BRAF V600E: encorafenib + cetuximab (BEACON). dMMR/MSI-H: pembrolizumab first-line (KEYNOTE-177). Fit selected: FOLFOXIRI + bev (TRIBE)."},
      {name:"ASCO/SITC Immune-Related Adverse Events 2021 (updated 2024)",year:2024,access:"Open",url:"https://ascopubs.org/doi/10.1200/JCO.21.01440",keys:"CTCAE v5 grading. Grade 1: continue ICI + monitor. Grade 2: hold ICI, prednisone 0.5-1 mg/kg. Grade 3-4: hold/discontinue, methylprednisolone 1-2 mg/kg + taper >=4-6wk. Steroid-refractory >48-72h: colitis → infliximab 5 mg/kg or vedolizumab 300 mg (wk 0/2/6); pneumonitis → infliximab or MMF; hepatitis → MMF (avoid infliximab); myocarditis → pulse methylpred 1g + ATG/abatacept (high mortality). Hypophysitis: hydrocortisone replacement, do NOT permanently stop ICI."},
      {name:"ASCO 2024 Stage IV NSCLC Living Guideline",year:2024,access:"Open",url:"https://ascopubs.org/doi/10.1200/JCO-24-02133",keys:"Universal molecular testing for EGFR/ALK/ROS1/BRAF/KRAS G12C/MET/RET/NTRK/HER2 before first-line therapy. Adjuvant osimertinib x3yr for resected EGFR+ stage IB-IIIA (ADAURA, 73% DFS benefit). Durvalumab x1yr post-concurrent CRT in unresectable stage III (PACIFIC). Metastatic non-driver: pembrolizumab monotherapy if PD-L1 >=50% (KEYNOTE-024); chemo + pembrolizumab regardless of PD-L1 (KEYNOTE-189 nonsquamous, KEYNOTE-407 squamous). Sotorasib/adagrasib for KRAS G12C post-progression (CodeBreaK 200)."},
      {name:"ASCO 2025 mCRPC Living Guideline",year:2025,access:"Open",url:"https://ascopubs.org/doi/10.1200/JCO-25-00007",keys:"Continue ADT lifelong; layer abiraterone + prednisone or enzalutamide first-line for mCRPC (COU-AA-301, AFFIRM, PREVAIL). nmCRPC with PSADT <=10mo: apalutamide (SPARTAN), enzalutamide (PROSPER), or darolutamide (ARAMIS) added to ADT. HRR testing universal; olaparib for BRCA1/2 (PROfound) or olaparib+abiraterone (PROpel). PSMA-PET-positive post-taxane/ARPI: 177Lu-PSMA-617 (VISION, 4mo OS gain). Docetaxel then cabazitaxel (CARD) for taxane sequencing."},
      {name:"ASCO 2020 Antiemetics Guideline Update",year:2020,access:"Open",url:"https://ascopubs.org/doi/10.1200/JCO.20.01296",keys:"Highly emetogenic chemo (cisplatin, AC): 4-drug day 1 = NK1 RA (aprepitant/fosaprepitant/netupitant/rolapitant) + 5HT3 RA (palonosetron preferred) + dexamethasone + olanzapine 5-10mg; continue dex + olanzapine days 2-4. Moderately emetogenic: 5HT3 + dex +/- NK1. Olanzapine 5mg non-inferior to 10mg, less sedation. Olanzapine rescue for breakthrough. Same 4-drug for high-dose chemo + HSCT."},
      {name:"ASCO WBC Growth Factors 2025 Update",year:2025,access:"Open",url:"https://ascopubs.org/doi/10.1200/JCO-25-02938",keys:"Primary G-CSF prophylaxis (filgrastim, pegfilgrastim, tbo-filgrastim, biosimilars) when regimen-related febrile neutropenia risk >=20%, or 10-20% with patient risk factors (age >65, prior chemo/RT, advanced disease, comorbidity, poor PS). Secondary prophylaxis after prior FN/dose-limiting neutropenia. Therapeutic G-CSF not routine for afebrile neutropenia; consider in febrile neutropenia with high-risk features. Biosimilars equivalent."},

  "Rheumatology": {
    society: "ACR (American College of Rheumatology), EULAR",
    guidelines: [
      {name:"ACR Gout 2020",year:2020,access:"Open",url:"https://www.healio.com/clinical-guidance/gout/2020-american-college-of-rheumatology-guidelines-for-the-management-of-gout-treatment-guidelines",keys:"Treat-to-target uric acid <6 mg/dL (or <5 if tophi). Allopurinol first-line, start during flare with anti-inflammatory prophylaxis (3-6 mo). HLA-B*5801 screen in Asian populations (SCAR risk). Acute: NSAID, colchicine, OR steroid (combine for severe). Febuxostat caution per CARES (CV mortality)."},
      {name:"ACR RA 2021",year:2021,access:"Open",url:"https://pubmed.ncbi.nlm.nih.gov/34101376/",keys:"MTX monotherapy first-line (preferred over biologics in DMARD-naive). If inadequate response: add bDMARD (anti-TNF, anti-IL6, abatacept) OR JAKi (caution >65/CV risk per ORAL Surveillance). Triple therapy (MTX/HCQ/SSZ) acceptable alternative to biologics."},
      {name:"EULAR SLE 2023",year:2023,access:"Open",url:"https://ard.eular.org/article/S0003-4967(24)66542-8/fulltext",keys:"Hydroxychloroquine for ALL SLE patients. Lupus nephritis: MMF + steroids; add belimumab (BLISS-LN) or voclosporin (AURORA-1) for high proteinuria. Anifrolumab (TULIP) for skin/joint disease. Goal: lupus-related damage prevention via low-dose steroids + tight DMARD control."},
      {name:"ACR ANCA Vasculitis 2021",year:2021,access:"Open",url:"https://vasculitisfoundation.org/wp-content/uploads/2024/01/2021-ACR-VF-Guideline-for-Management-of-ANCA-Associated-Vasculitis.pdf",keys:"Severe GPA/MPA induction: rituximab (RAVE) preferred over cyclophosphamide; reduced-dose steroids (PEXIVAS, NNT 11). Avacopan (C5a inhibitor) steroid-sparing (ADVOCATE). Maintenance: rituximab > AZA. Plasma exchange controversial post-PEXIVAS."},
      {name:"ACR GCA 2021",year:2021,access:"Open",url:"https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/acr.24632",keys:"High-dose prednisone immediately for vision threat (1mg/kg or 1g IV pulse if vision loss). Add tocilizumab for newly-dx (GiACTA) - reduces relapse / steroid burden. Methotrexate alternative. Temporal artery biopsy + LV vascular imaging (PET, MRA). Monitor with ESR/CRP."},
      {name:"ACR/SAA/SPARTAN Axial SpA 2019",year:2019,access:"Open",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC6764857/",keys:"Stable AS: NSAID first-line; failure -> TNFi (any) preferred over IL-17i. PsA-related: TNFi or IL-17i; IL-23i (guselkumab, risankizumab) emerging. Treat-to-target with disease activity measures (BASDAI, ASDAS)."},
      {name:"GRAPPA PsA 2022",year:2022,access:"Open",url:"https://psoriasis-hub.com/medical-information/updated-grappa-guidelines-the-good-care-campaign-for-psoriatic-arthritis",keys:"Domain-based: peripheral arthritis, axial, enthesitis, dactylitis, skin, nails. csDMARD (MTX/SSZ/LEF) vs bDMARD (TNFi, IL-17i, IL-23i, JAKi, abatacept) by domain. Treat-to-target. IL-17i (secukinumab, ixekizumab) - excellent skin + joint."},
      {name:"ACR/EULAR Sjögren 2023",year:2023,access:"Open",url:"https://www.eular.org/recommendations-management",keys:"Sicca symptoms: artificial tears, saliva substitutes, pilocarpine, cevimeline. Systemic: hydroxychloroquine first-line; immunosuppressants (MTX, AZA, MMF) for organ involvement. Rituximab/abatacept for refractory; CD4+/CD20+ targeted therapy emerging."},
      {name:"EULAR Systemic Sclerosis 2023",year:2023,access:"Open",url:"https://ard.eular.org/",keys:"Skin: MMF or MTX. SSc-ILD: MMF, nintedanib (SENSCIS), tocilizumab (focuSSced). PAH: ERA + PDE5i (AMBITION). Renal crisis: ACEi (DO NOT use in pre-crisis prevention). Raynaud: CCB + PDE5i."},
      {name:"ACR Osteoarthritis 2019",year:2019,access:"Open",url:"https://acrjournals.onlinelibrary.wiley.com/doi/10.1002/art.41142",keys:"Exercise + weight loss core. Topical NSAIDs strongly recommended for hand/knee OA. Oral NSAIDs > acetaminophen (limited efficacy). Intra-articular steroids for flares (3-4x/year max). Avoid glucosamine/chondroitin, PRP, stem cells (insufficient evidence). Joint replacement for end-stage."},
      {name:"ACR 2025 SLE Treatment Guideline",year:2025,access:"Open",url:"https://rheumatology.org/lupus-guideline",keys:"Hydroxychloroquine for ALL (target weight-based ≤5 mg/kg, retinal screen q1y after 5y). Organ-domain framework. Lupus nephritis Class III/IV: MMF + steroids + belimumab (BLISS-LN) OR voclosporin (AURORA-1, calcineurin inhibitor) triple therapy preferred over MMF alone. Non-renal SLE: anifrolumab (anti-IFNAR, TULIP-1/2) for cutaneous/articular. Steroid taper to ≤5 mg prednisone by 6 mo. Aspirin + statin + bone/vaccine/reproductive planning integrated. Belimumab maintenance reduces flares (BLISS-52/76)."},
      {name:"EULAR 2022 / KDIGO 2024 ANCA-Associated Vasculitis",year:2024,access:"Open",url:"https://kdigo.org/wp-content/uploads/2024/02/KDIGO-2024-ANCA-Vasculitis-Guideline.pdf",keys:"GPA/MPA induction: rituximab (RAVE, RITUXVAS) preferred over cyclophosphamide for severe disease; both paired with PEXIVAS reduced-dose glucocorticoid taper (40% less cumulative steroid, non-inferior outcomes). Avacopan (oral C5a receptor inhibitor) added per ADVOCATE for steroid-sparing remission (week-52 superiority, cumulative prednisone -2.3g). Maintenance: rituximab 500mg q6mo > azathioprine (MAINRITSAN). EGPA severe: mepolizumab (MIRRA) or rituximab; cyclophosphamide if cardiac involvement."},
      {name:"EULAR 2022 Giant Cell Arteritis (2023 imaging update)",year:2022,access:"Open",url:"https://ard.bmj.com/content/79/1/19",keys:"Induction: prednisone 40-60mg/day, taper to 15-20mg by 2-3mo, off by 12mo. Tocilizumab 162mg SC weekly (GiACTA) for relapsing/refractory disease or high steroid-toxicity risk; methotrexate alternative adjunct. Diagnosis: temporal artery biopsy or temporal/axillary ultrasound (halo sign, compression sign) within 1 week; do not delay steroids. Large-vessel involvement: PET-CT, MRA, or CTA aorta. Aspirin only if ischemic/cardiovascular indication."},
      {name:"ASAS-EULAR 2022 / ACR 2019 Axial Spondyloarthritis",year:2022,access:"Open",url:"https://ard.bmj.com/content/82/1/19",keys:"NSAIDs first-line continuous dosing for active disease (naproxen, celecoxib); physiotherapy adjunct. Inadequate NSAID response after 2 trials: TNFi (adalimumab, infliximab, certolizumab, etanercept, golimumab) or IL-17i (secukinumab, ixekizumab, bimekizumab) without prioritization. JAKi (upadacitinib, tofacitinib) reserved for bDMARD-contraindicated/failed (per JAK safety signals, ORAL Surveillance). Imaging: MRI SI joints (bone marrow edema) for non-radiographic; pelvic X-ray for radiographic (modified NY criteria)."},

    guidelines: [
      {name:"AHA/ASA Acute Ischemic Stroke 2019/2024",year:2024,access:"Open",url:"https://www.ahajournals.org/doi/10.1161/STR.0000000000000513",keys:"IV alteplase (0.9 mg/kg) OR tenecteplase (0.25 mg/kg) within 4.5h LKW (extended to 9h with penumbra imaging per WAKE-UP/EXTEND/AcT). Mechanical thrombectomy <=24h for LVO with favorable imaging (DAWN, DEFUSE 3). BP <185/110 for tPA, <180/105 post-tPA."},
      {name:"AHA/ASA Stroke Prevention 2021",year:2021,access:"Open",url:"https://pubmed.ncbi.nlm.nih.gov/34024117/",keys:"DAPT (aspirin + clopidogrel) <=21d for minor stroke/TIA (CHANCE/POINT, start <=24h). Ticagrelor + aspirin (THALES) alternative. Statin, ACEi/ARB. AF: DOAC. Carotid stenosis 70-99% symptomatic: CEA/CAS within 2 weeks."},
      {name:"AHA/ASA ICH 2022",year:2022,access:"Open",url:"https://www.ahajournals.org/doi/10.1161/STR.0000000000000407",keys:"BP control <140 within 1-2h (INTERACT2/ATACH-2). Reverse anticoagulation (4F-PCC, idarucizumab for dabigatran, andexanet for FXa). Avoid prophylactic steroids. Surgical evacuation for cerebellar ICH >3cm or hydrocephalus."},
      {name:"AAN/AES Status Epilepticus 2016 + 2024",year:2024,access:"Open",url:"https://www.aan.com/Guidelines/",keys:"First-line benzodiazepine: IM midazolam 10mg, IV lorazepam 4mg, or IV diazepam 10mg. Second-line: fosphenytoin 20 mg/kg, valproate 40 mg/kg, levetiracetam 60 mg/kg - equivalent (ESETT). Refractory: anesthetic infusion (midazolam/propofol/pentobarbital)."},
      {name:"AHS Migraine 2024",year:2024,access:"Paywalled",url:"https://headachejournal.onlinelibrary.wiley.com/doi/10.1111/head.14692",keys:"Acute: triptans (sumatriptan, eletriptan), gepants (rimegepant, ubrogepant), ditans (lasmiditan), NSAIDs. Preventive: CGRP mAbs (erenumab, fremanezumab, galcanezumab, eptinezumab) FIRST-LINE (no prior trial requirement); atogepant; topiramate, propranolol. Triptans cardiac contraindications."},
      {name:"AAN/AAOS Anti-Amyloid Therapy 2024",year:2024,access:"Open",url:"https://www.aan.com/Guidelines/home/GuidelineDetail/",keys:"Lecanemab (CLARITY-AD: 27% slower decline) and donanemab (TRAILBLAZER-ALZ-2: 35% slower decline at low/intermediate tau) for early symptomatic AD. Eligibility: MCI/mild dementia + amyloid PET/CSF+ + APOE4 testing for ARIA risk. ARIA-E/H 20-30% (often asymptomatic)."},
      {name:"International Consensus Myasthenia Gravis 2023",year:2023,access:"Paywalled",url:"https://www.neurology.org/doi/10.1212/WNL.0000000000011124",keys:"Pyridostigmine symptomatic. Steroids + steroid-sparing (AZA, MMF, MTX). Refractory: rituximab (off-label, especially MuSK+), eculizumab/ravulizumab (C5 inhibitors), efgartigimod (FcRn antagonist per ADAPT). Thymectomy for AChR+ early-onset (MGTX)."},
      {name:"EAN/PNS Guillain-Barré 2023",year:2023,access:"Paywalled",url:"https://onlinelibrary.wiley.com/doi/10.1111/jns.12594",keys:"PE OR IVIG 0.4 g/kg x5d - equally effective for hastening recovery (no advantage of combination). Steroids NOT recommended (no benefit). EGOS/mEGOS/mEGRIS prognostication. Mechanical ventilation for FVC <20 mL/kg or NIF <-30."},
      {name:"AAN Parkinson Disease 2018 + 2021 update",year:2021,access:"Open",url:"https://www.aan.com/Guidelines/home/GuidelineDetail/1043",keys:"Levodopa superior for motor (LEAP); dopamine agonists increase impulse control disorders, hallucinations, edema. MAO-B inhibitors (rasagiline, selegiline) modest. DBS for motor fluctuations / dyskinesias (EARLYSTIM). LCIG infusion for advanced disease."},
      {name:"AAN BPPV 2023",year:2023,access:"Paywalled",url:"https://onlinelibrary.wiley.com/doi/10.1111/acem.14558",keys:"Dix-Hallpike for posterior canal BPPV (most common). Torsional/upbeat nystagmus, latency 5-20s, fatigable. Treatment: Epley canalith repositioning maneuver (NNT 2). Brandt-Daroff exercises home alternative."},
      {name:"AAN 2018 (reaffirmed 2024) DMT for Adults with MS",year:2024,access:"Open",url:"https://www.aan.com/Guidelines/home/GuidelineDetail/898",keys:"Offer DMT for relapsing MS; earlier = better long-term disability outcome. High-efficacy agents (natalizumab, ocrelizumab, alemtuzumab, ofatumumab, S1P modulators fingolimod/ozanimod) for highly active disease (TREAT-MS, DELIVER-MS support early high-efficacy). Ocrelizumab only DMT proven for ambulatory PPMS (ORATORIO). Monitor JCV antibody for natalizumab (PML risk). Switch for breakthrough activity. Pregnancy planning: glatiramer/IFN-β safest; washout for teratogenic agents."},
      {name:"AHA/ASA 2021 Secondary Stroke Prevention",year:2021,access:"Open",url:"https://www.ahajournals.org/doi/10.1161/STR.0000000000000375",keys:"Etiologic workup within 48h. Non-cardioembolic minor stroke/high-risk TIA (ABCD2 >=4): DAPT aspirin + clopidogrel x21d (CHANCE, POINT) or +ticagrelor x30d (THALES). AF: DOAC over warfarin (apixaban, rivaroxaban, dabigatran, edoxaban). High-intensity statin targeting LDL <70 (SPARCL, TST). BP <130/80. PFO closure for cryptogenic stroke age <60 with high-risk PFO (CLOSE, REDUCE, RESPECT, DEFENSE-PFO). Symptomatic intracranial stenosis: aggressive medical (SAMMPRIS)."},

  "Allergy/Immuno": {
    society: "AAAAI/ACAAI (Joint Task Force on Practice Parameters)",
    guidelines: [
      {name:"AAAAI/ACAAI Anaphylaxis 2023",year:2023,access:"Open",url:"https://www.aaaai.org/Aaaai/media/Media-Library-PDFs/Allergist%20Resources/Statements%20and%20Practice%20Parameters/Anaphylaxis-Practice-Paramaters-2023.pdf",keys:"IM epinephrine 0.3-0.5 mg first-line (lateral thigh). Biphasic reactions 5-20% within 24h - observation 4-8h. Antihistamines/steroids ADJUNCTS only. Self-injectable epinephrine + 911 activation for at-risk patients."},
      {name:"GINA Asthma 2024",year:2024,access:"Open",url:"https://ginasthma.org/2024-report/",keys:"Track 1 preferred: ICS-formoterol PRN (mild) up to scheduled+PRN reliever (severe). Track 2: SABA + ICS. Type-2 biologics (omalizumab, mepolizumab/reslizumab/benralizumab anti-IL-5, dupilumab anti-IL-4Ra, tezepelumab anti-TSLP) for severe."},
      {name:"AAAAI/ACAAI Drug Allergy 2022",year:2022,access:"Open",url:"https://www.aaaai.org/Aaaai/media/Media-Library-PDFs/Allergist%20Resources/Statements%20and%20Practice%20Parameters/Drug-Allergy-PP-9-2022.pdf",keys:"Direct oral challenge for low-risk penicillin allergy (95% delabeling). Skin testing for high-risk. Graded challenges for radiocontrast/sulfonamides/NSAIDs. Avoid empiric desensitization without confirmed allergy."},
      {name:"HAEA/WAO Hereditary Angioedema 2021",year:2021,access:"Open",url:"https://www.haea.org/",keys:"On-demand: C1-INH concentrate, ecallantide, icatibant. Long-term prophylaxis: lanadelumab (FcRn anti-pKLK; reduces attacks 86%, HELP), berotralstat (oral pKLK inhibitor), C1-INH SC. Self-administer all therapies."},
      {name:"AAAAI Food Allergy / OIT 2024",year:2024,access:"Open",url:"https://www.aaaai.org/",keys:"Strict avoidance + epinephrine for risk-management. Palforzia (peanut OIT) FDA-approved ages 1-17 (POSEIDON, PALISADE). Omalizumab 2024 FDA approval reduces severe reactions in multi-food allergy (OUtMATCH). SLIT/EPIT emerging."},
      {name:"AAAAI Allergic Rhinitis 2017/2023",year:2023,access:"Open",url:"https://www.aaaai.org/Aaaai/media/Media-Library-PDFs/Allergist%20Resources/Statements%20and%20Practice%20Parameters/Rhinitis-2020-A-practice-parameter-update.pdf",keys:"INCS first-line monotherapy. INCS + intranasal antihistamine combination effective. Oral 2nd-gen antihistamines safer than 1st-gen. SCIT/SLIT for refractory/IgE-mediated. Avoid depot steroids."},
      {name:"AAAAI/ACAAI Drug Allergy Practice Parameter 2022",year:2022,access:"Open",url:"https://www.jacionline.org/article/S0091-6749(22)01186-1/fulltext",keys:"Penicillin allergy delabeling priority — 95% of labeled patients tolerate penicillin; label associated with broader antibiotic use, MRSA/C. difficile, longer admissions. Risk-stratify by history: low-risk (isolated GI symptoms, remote benign rash, family-only history, unknown reaction >10y) eligible for direct oral amoxicillin challenge without skin testing. Moderate-risk (urticaria, pruritus): penicillin skin testing then graded challenge. High-risk (anaphylaxis, SJS/TEN, DRESS): avoid. Sulfonamide antibiotic-to-non-antibiotic cross-reactivity is a myth — sulfasalazine, diuretics, celecoxib safe. RCM premed with prednisone + diphenhydramine."},

  "Dermatology": {
    society: "AAD (American Academy of Dermatology), NPF",
    guidelines: [
      {name:"AAD/NPF Psoriasis 2019 + 2024 biologics update",year:2024,access:"Open",url:"https://www.jaad.org/",keys:"Anti-IL-23 (guselkumab, risankizumab, tildrakizumab) and anti-IL-17 (secukinumab, ixekizumab, brodalumab, bimekizumab) preferred for moderate-severe. Anti-TNF (adalimumab, etanercept, infliximab) alternative. IL-23i favor less frequent dosing, lower candidiasis."},
      {name:"AAD Atopic Dermatitis 2024",year:2024,access:"Open",url:"https://jcadonline.com/aad-aaaai-guidelines-atopic-dermatitis/",keys:"Topical steroids + emollients + barrier care first-line. Topical calcineurin inhibitors (tacrolimus, pimecrolimus) for face/folds. Severe: dupilumab (anti-IL-4Ra), tralokinumab (anti-IL-13), abrocitinib/baricitinib/upadacitinib (JAKi). Topical ruxolitinib for mild-moderate."},
      {name:"AAD Acne 2024",year:2024,access:"Open",url:"https://www.jaad.org/article/S0190-9622(23)03389-3/fulltext",keys:"Strong recommendations: BPO, topical retinoids (tretinoin, adapalene, tazarotene), topical/oral antibiotics (limited duration), oral spironolactone (women), combined oral contraceptives. Isotretinoin for severe/scarring (iPLEDGE)."},
      {name:"USPSTF Skin Cancer Screening 2023",year:2023,access:"Open",url:"https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/skin-cancer-screening",keys:"Insufficient evidence for routine visual skin screening in asymptomatic adults (I statement). Does not apply to symptomatic, high-risk (immunocompromised, prior cancer, family history, dysplastic nevi). AAD continues to recommend self-exams + dermatologist evaluation."},
      {name:"IDSA SSTI / Cellulitis 2014/2024",year:2024,access:"Open",url:"https://www.idsociety.org/practice-guideline/skin-and-soft-tissue-infections/",keys:"Nonpurulent cellulitis: oral cephalexin or amoxicillin (Strep coverage). Purulent: incision + drainage; add MRSA coverage (TMP-SMX, doxycycline, clindamycin) if SIRS. Severe: IV vancomycin/daptomycin/linezolid. Diabetic foot: extended courses, image for osteomyelitis."},
      {name:"AAD/HSF Hidradenitis Suppurativa 2019/2024",year:2024,access:"Open",url:"https://www.jaad.org/",keys:"Adalimumab (anti-TNF) FDA-approved (PIONEER 1/2; HiSCR 40-59%). Secukinumab (anti-IL-17A; SUNRISE/SUNSHINE) approved 2023. Bimekizumab approved 2024. Surgical excision for fibrotic stages."},
      {name:"AAD-NPF 2020/2021 Psoriasis (Topicals + Biologics)",year:2021,access:"Open",url:"https://www.aad.org/member/clinical-quality/guidelines/psoriasis",keys:"Topical corticosteroids + vitamin D analogs (calcipotriene) first-line for limited disease; phototherapy (NB-UVB) for moderate. Biologics for moderate-severe: TNFi (etanercept, adalimumab, infliximab), IL-17i (secukinumab, ixekizumab, brodalumab), IL-23i (guselkumab, risankizumab, tildrakizumab). Oral: apremilast, methotrexate, cyclosporine, acitretin, deucravacitinib. Screen all for psoriatic arthritis and cardiometabolic comorbidities."},
      {name:"AAD 2023/2024 Atopic Dermatitis",year:2024,access:"Open",url:"https://www.aad.org/member/clinical-quality/guidelines/atopic-dermatitis",keys:"Emollients + bathing, topical corticosteroids first-line; topical calcineurin inhibitors (tacrolimus, pimecrolimus) and crisaborole for face/folds/steroid-sparing; topical ruxolitinib for mild-moderate. NB-UVB phototherapy for refractory. Strong recommendations for dupilumab (anti-IL-4Ra, LIBERTY-AD), tralokinumab (anti-IL-13, ECZTRA), and oral JAKi abrocitinib/upadacitinib/baricitinib (JADE, Measure Up, BREEZE-AD) for moderate-severe."},

  "Psychiatry": {

    guidelines: [
      {name:"APA Major Depression 2024 + ACP 2023",year:2024,access:"Open",url:"https://www.apa.org/depression-guideline",keys:"First-line: SSRIs (sertraline, escitalopram), SNRIs, mirtazapine, bupropion. Treatment-resistant (>=2 failed): augmentation (lithium, T3, atypical antipsychotic) OR ketamine/esketamine (NMDA antagonist; STAR*D, TRD-IV). ECT for severe / refractory. CBT/IPT comparable to medication for mild-moderate."},
      {name:"APA/WFSBP Bipolar Disorder",year:2002,access:"Open",url:"https://www.psychiatry.org/",keys:"Acute mania: lithium, valproate, atypical antipsychotics. Bipolar depression: lithium or lamotrigine (NOT antidepressant monotherapy - switch risk). Maintenance: lithium gold standard (suicide prevention). Avoid valproate in reproductive-age women (teratogenicity, MHRA)."},
      {name:"APA PTSD 2023",year:2023,access:"Open",url:"https://www.apa.org/ptsd-guideline",keys:"First-line: trauma-focused CBT (CPT, PE, EMDR) + SSRI/SNRI (sertraline, paroxetine, venlafaxine FDA-approved). Prazosin for nightmares. Avoid benzos. MDMA-assisted therapy under FDA review (denied 2024 - additional evidence required)."},
      {name:"APA Schizophrenia 2020/2024",year:2024,access:"Open",url:"https://abhfl.org/wp-content/uploads/sites/5/2025/06/APA-Schizophrenia-Clinical-Practice-Guidelines-compressed.pdf",keys:"Atypical antipsychotic first-line (avoid first-gen unless clozapine intolerance). Clozapine for treatment-resistant (>=2 failed) - reduces suicide. LAI antipsychotics for adherence (1-3 month formulations). Cognitive behavioral therapy + supported employment."},
      {name:"SAMHSA TIP 63 / ASAM OUD",year:2020,access:"Open",url:"https://library.samhsa.gov/product/tip-63-medications-opioid-use-disorder/pep21-02-01-002",keys:"MAT first-line: buprenorphine (mu partial agonist; office-based; X-waiver removed 2023), methadone (opioid agonist; OTP only), naltrexone (mu antagonist; XR-NTX preferred). Concurrent psychosocial. Naloxone co-prescription for overdose risk."},
      {name:"APA Eating Disorders 2023",year:2023,access:"Open",url:"https://psychiatryonline.org/doi/full/10.1176/appi.ajp.23180001",keys:"First major update since 2006. Anorexia: weight restoration + family-based therapy (adolescents) or eating-disorder-focused CBT (adults). Bulimia/BED: CBT-ED + SSRI (fluoxetine 60mg). Lisdexamfetamine for BED. Olanzapine for severe AN weight gain."},
      {name:"AASM Insomnia 2017/2024",year:2024,access:"Paywalled",url:"https://jcsm.aasm.org/doi/10.5664/jcsm.6470",keys:"CBT-I FIRST-line (digital CBT-I expanded access). Pharmacotherapy: dual orexin antagonists (suvorexant, lemborexant, daridorexant) preferred over benzos/Z-drugs. Melatonin/ramelteon for circadian. Avoid chronic benzo/Z-drug use."},

  "Geriatrics": {
    society: "AGS (American Geriatrics Society)",
    guidelines: [
      {name:"AGS/BGS/WFG Falls Prevention 2022 (World Falls Guidelines)",year:2022,access:"Open",url:"https://agsjournals.onlinelibrary.wiley.com/doi/epdf/10.1111/jgs.18734",keys:"Multifactorial assessment: vision, gait, cognition, medications (esp. anticholinergics, benzos, sleep aids per Beers), home hazards. Exercise + balance training (tai chi). Vitamin D if deficient. STOPPFall medication review. Screen all >=65 annually with Timed Up-and-Go."},
      {name:"AGS Beers Criteria 2023",year:2023,access:"Open",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC12478568/",keys:"Potentially inappropriate medications in >=65: anticholinergics (cumulative burden -> falls/dementia), benzos (falls, delirium), NSAIDs (GI/renal/CV), tertiary TCAs, glyburide, megestrol, PPI >8 weeks. Drug-disease and drug-drug warnings. Cumulative anticholinergic score added 2023."},
      {name:"NPIAP/EPUAP Pressure Injury 2019",year:2019,access:"Open",url:"https://epuap.org/pu-guidelines/",keys:"Stages 1-4 (+ unstageable, deep tissue). Risk assessment (Braden, Norton). Repositioning q2h, support surfaces, nutritional support. Staging guides treatment: stage 1 protect; 2 hydrocolloid/foam; 3-4 debridement, wound vac, consider surgery."},
      {name:"AAOS Hip Fracture 2021",year:2021,access:"Open",url:"https://www.aaos.org/globalassets/quality-and-practice-resources/hip-fractures-in-the-elderly/hipfxcpg.pdf",keys:"Surgery within 24-48h reduces mortality. Geriatric co-management (NICE/HELLP). Regional anesthesia (fascia iliaca block) for analgesia. Pharmacologic VTE prophylaxis. Bisphosphonate / denosumab for osteoporosis after."},
      {name:"AGS Frailty Framework",year:2019,access:"Open",url:"https://www.facs.org/",keys:"Phenotypic (Fried 5 criteria): unintentional weight loss, weakness, exhaustion, slow gait, low activity. >=3 = frail. Deficits-of-aging (Rockwood Clinical Frailty Scale). Frailty -> increased surgical / hospital risk. Optimize before elective surgery."},
      {name:"AAHPM End-of-Life 2024",year:2024,access:"Open",url:"https://aahpm.org/",keys:"Goals-of-care discussions early (ask-tell-ask). Hospice eligibility: prognosis <=6 months. POLST/MOLST documentation across settings. Symptom management hierarchy: pain (opioid titration, adjuvants), dyspnea (opioids), delirium (haloperidol)."},

  "Women's Health": {

    guidelines: [
      {name:"ACOG Breast Cancer Screening 2024",year:2024,access:"Open",url:"https://journals.lww.com/greenjournal/fulltext/2025/01000/age_to_initiate_routine_breast_cancer_screening_.29.aspx",keys:"Begin annual or biennial mammography at age 40 for average-risk (USPSTF 40-74 q2y; ACS 45-54 annually then biennial). Risk assessment for BRCA / family history -> earlier MRI screening. Stop ~age 75 individualized."},
      {name:"USPSTF Cervical Cancer Screening 2023",year:2023,access:"Open",url:"https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/cervical-cancer-screening",keys:"Ages 21-29: Pap q3y. Ages 30-65: HPV primary q5y (preferred), co-testing q5y, OR Pap q3y. Stop at 65 if adequate screening and no high-grade lesions in 25 years. ACS 2025 update: start age 25, HPV primary preferred (incl. self-collection)."},
      {name:"CDC US MEC Contraception 2024",year:2024,access:"Open",url:"https://www.cdc.gov/contraception/hcp/usmec/index.html",keys:"Categories 1 (no restriction) - 4 (unacceptable). LARC (IUD, implant) most effective; encourage as first-line. CHCs contraindicated in: smokers >=35, migraine with aura, breast cancer, severe HTN, VTE history. Updated for CKD, postpartum, transplant."},
      {name:"NAMS Menopause Hormone Therapy 2022",year:2022,access:"Open",url:"https://menopause.org/wp-content/uploads/professional/nams-2022-hormone-therapy-position-statement.pdf",keys:"HT most effective for VMS. Favorable benefit-risk for symptomatic women <60 OR <10 years from menopause onset. Transdermal estrogen LOWER VTE/stroke risk vs oral. Add progestogen if uterus present. Bazedoxifene/CEE (Duavee) alternative."},
      {name:"ACOG Hypertension in Pregnancy 2024",year:2024,access:"Open",url:"https://www.acog.org/clinical/clinical-guidance/practice-bulletin/articles/2020/06/gestational-hypertension-and-preeclampsia",keys:"Severe features: SBP>=160, DBP>=110, plt<100k, AST/ALT 2x normal, Cr>1.1, pulmonary edema, neuro symptoms. Aspirin 81mg from 12-28 weeks if high-risk preeclampsia. Mag sulfate for severe features / eclampsia. Deliver 37w (no severe) or 34w (severe)."},
      {name:"ACOG Endometriosis 2026",year:2026,access:"Open",url:"https://www.acog.org/clinical/clinical-guidance/clinical-practice-guideline/articles/2026/03/diagnosis-of-endometriosis",keys:"Clinical diagnosis with empiric medical therapy (NSAIDs, CHCs, progestins, GnRH agonists/antagonists, elagolix). TVUS first imaging (deep infiltrating disease). Laparoscopy not required for diagnosis. Avoid biomarker testing."},
      {name:"ACOG Gestational Diabetes 2024 (CPG #2)",year:2024,access:"Open",url:"https://www.acog.org/clinical/clinical-guidance/clinical-practice-guideline/articles/2024/07/screening-for-gestational-and-pregestational-diabetes-in-pregnancy",keys:"Universal 2-step screen at 24-28 wk: 50g GCT → 100g 3h OGTT if abnormal; Carpenter-Coustan criteria (2 of 4 abnormal). Early screening if BMI ≥25 (≥23 Asian) + risk factors (A1c ≥5.7, prior GDM, PCOS). Lifestyle first; insulin preferred if pharmacologic needed (metformin/glyburide cross placenta, second-line). Targets: fasting <95, 1h pp <140, 2h pp <120. Delivery 39-40w (A1), 39w (A2 controlled). Postpartum 75g OGTT 4-12 wk; 50-70% lifetime T2DM risk."},
      {name:"NAMS 2020 Genitourinary Syndrome of Menopause Position Statement",year:2020,access:"Open",url:"https://menopause.org/wp-content/uploads/default-document-library/2020-gsm-ps.pdf",keys:"Non-hormonal lubricants/long-acting moisturizers first for mild symptoms. Low-dose vaginal estrogen (cream, tablet, ring) first-line prescription for moderate-severe GSM; minimal systemic absorption, endometrial protection generally not required. Vaginal DHEA (prasterone) and oral ospemifene (SERM) effective alternatives. Systemic ET if vasomotor symptoms coexist. Energy-based therapies (CO2 laser, RF) insufficient evidence; not recommended outside trials."},
      {name:"ACOG 2022 Polycystic Ovary Syndrome (Practice Bulletin 194 update)",year:2022,access:"Paywalled",url:"https://www.acog.org/clinical/clinical-guidance/practice-bulletin/articles/2018/06/polycystic-ovary-syndrome",keys:"Rotterdam criteria: 2 of 3 (oligo-/anovulation, clinical or biochemical hyperandrogenism, polycystic ovarian morphology on US) after exclusion of CAH, Cushing, thyroid, prolactinoma. Screen all for T2DM (2-hr 75g OGTT), dyslipidemia, OSA, endometrial cancer risk. Combined OCs first-line for menstrual regulation/hirsutism; spironolactone adjunct. Metformin for metabolic/glycemic. Letrozole first-line for ovulation induction (PPCOS II: higher live births vs clomiphene). GLP-1 RA emerging for weight."},

function getGuidelinesForTopic(topic) {
  if (!topic) return null;
  var t = topic.toLowerCase();
  var matched = [];
  // map topic keywords to specialties
  var kwMap = {
    "Nephrology": ["kidney","renal","nephro","ckd","aki","gfr","dialysis","transplant","glomerul","nephrotic","nephritic","proteinuria","creatinine","urine","sodium","hyponatremia","hypernatremia","potassium","hyperkalemia","acid-base","rta","metabolic acidosis","metabolic alkalosis","diuretic","furst","siadh","beer potomania","rhabdomyolysis","tumor lysis","hepatorenal","crrt","ihd","peritoneal","fistula","raas","sglt2","finerenone","aldosteronism"],
    "Cardiovascular": ["heart","cardiac","cardio","hf ","hfref","hfpef","acs","stemi","nstemi","atrial fib","af ","afib","valve","valvular","endocarditis","syncope","hypertension","htn","blood pressure","dyslipidemia","cholesterol","statin","anticoagul","warfarin","doac","chads"],
    "Pulmonary": ["copd","asthma","lung","pulmonary","pneumonia","cap ","hap ","vap","ards","pleural","pe ","pulmonary embolism","ild","ipf","pulmonary hypertension","oxygen","ventilat","intubat","bronch"],
    "GI/Hepatology": ["liver","hepat","cirrhosis","varices","ascites","nafld","masld","nash","mash","gi bleed","ibd","crohn","colitis","c diff","cdiff","pancreat","gi ","gastro","esophag","celiac","barrett"],
    "Endocrinology": ["diabet","dka","hhs","insulin","a1c","thyroid","hypothyroid","hyperthyroid","adrenal","cortisol","addison","cushing","pheochrom","calcium","hypercalcemia","pth","osteoporosis","pituitary","prolactin"],

    "Heme/Onc": ["anemia","iron","b12","folate","sickle","thalassemia","ttp","hus","dic","platelet","thrombocytopenia","hit","dvt","vte","anticoagul","lymphoma","leukemia","myeloma","oncolog","cancer","malignancy","febrile neutropenia"],
    "Rheumatology": ["rheumat","arthritis","lupus","sle","gout","vasculitis","anca","scleroderma","myositis","antiphospholipid","dmard","biologic","autoimmune"],
    "Neurology": ["stroke","tpa","thrombectomy","seizure","epilepsy","headache","migraine","guillain","myasthenia","ms ","multiple sclerosis","neuropathy","parkinson","dementia"],
    "Critical Care": ["icu","critical care","ventilat","ards","sepsis","septic shock","vasopressor","norepinephrine","intubat","prone","sedation","delirium","rass","crrt"],
    "Allergy/Immuno": ["anaphylax","allerg","drug allergy","penicillin allergy","urticaria","angioedema","immunodefic","ivig","hereditary angioedema","mast cell"],
    "Dermatology": ["psoriasis","atopic dermatitis","eczema","sjs","tens","stevens","cellulit","erysipelas","melanoma","skin cancer","acne","pemphig","rash","dermatitis"],
    "Psychiatry": ["depress","anxiety","bipolar","schizophren","substance use","alcohol use","opioid use","mat ","buprenorphine","naltrexone","methadone","ssri","snri","ect","suicide","mania"],
    "Geriatrics": ["geriatr","elderly","frail","fall","beers","polypharmacy","dementia","alzheimer","delirium","pressure injury","decubitus","goals of care","advance directive","frailty"],
    "Women's Health": ["contracept","menopaus","hrt","menstrua","pregnan","cervical cancer","breast cancer screen","ocp","preeclamp","postpartum","gestational"],
    "Oncology": ["cancer","tumor","oncolog","malignan","chemo","immunotherapy","metastasis","metastatic","carcinoma","lymphoma","leukemia","myeloma","sarcoma","lung cancer","breast cancer","colorectal","prostate cancer"],
    "Prevention": ["screen","prevention","uspstf","vaccin","immuniz","aspirin primary","statin primary","cancer screen","cardiovascular risk","tobacco cessation"],
    "Palliative": ["palliat","hospice","end of life","cancer pain","opioid titration","goals of care","comfort care","dnr","dni"]
  };
  for (var spec in kwMap) {
    var kws = kwMap[spec];
    for (var ki = 0; ki < kws.length; ki++) {
      if (t.indexOf(kws[ki]) >= 0 && matched.indexOf(spec) < 0) {
        matched.push(spec);
        break;
      }
    }
  }
  if (matched.length === 0) {
    // try category match from TOPICS structure
    for (var cat in TOPICS) {
      var subs = TOPICS[cat].topics;
      for (var sub in subs) {
        for (var ti = 0; ti < subs[sub].length; ti++) {
          if (subs[sub][ti] === topic) {
            var cleanCat = cat.replace(/★\s*/,"").replace(/\s*\(\d+%.*\)/,"").trim();
            if (cleanCat === "★ Nephrology" || cleanCat === "Nephrology" || cat.indexOf("Nephrology") >= 0) matched.push("Nephrology");
            else if (cat.indexOf("Cardiovascular") >= 0) matched.push("Cardiovascular");
            else if (cat.indexOf("Pulmonary") >= 0) matched.push("Pulmonary");
            else if (cat.indexOf("GI") >= 0) matched.push("GI/Hepatology");
            else if (cat.indexOf("Endocrin") >= 0) matched.push("Endocrinology");
            else if (cat.indexOf("ID") >= 0) matched.push("ID");
            else if (cat.indexOf("Hematology") >= 0) matched.push("Heme/Onc");
            else if (cat.indexOf("Oncology") >= 0) matched.push("Oncology");
            else if (cat.indexOf("Heme") >= 0) matched.push("Heme/Onc");
            else if (cat.indexOf("Rheum") >= 0) matched.push("Rheumatology");
            else if (cat.indexOf("Neuro") >= 0) matched.push("Neurology");
            else if (cat.indexOf("Allergy") >= 0) matched.push("Allergy/Immuno");
            else if (cat.indexOf("Dermatology") >= 0) matched.push("Dermatology");
            else if (cat.indexOf("Psychiatry") >= 0) matched.push("Psychiatry");
            else if (cat.indexOf("Geriatric") >= 0) matched.push("Geriatrics");
            else if (cat.indexOf("Women") >= 0) matched.push("Women's Health");
            else if (cat.indexOf("Prevention") >= 0) matched.push("Prevention");
            else if (cat.indexOf("Critical Care") >= 0) matched.push("Critical Care");
            else if (cat.indexOf("Palliative") >= 0) matched.push("Palliative");
          }
        }
      }
    }
  }
  if (matched.length === 0) return null;
  var result = { specialties: matched, context: "", sources: [], trials: [], conferences: [] };
  for (var mi = 0; mi < matched.length; mi++) {
    var g = GUIDELINES[matched[mi]];
    if (!g) continue;
    result.context += "\n\n[" + g.society + " Guidelines]\n";
    for (var gi = 0; gi < g.guidelines.length; gi++) {
      var gl = g.guidelines[gi];
      result.context += "• " + gl.name + " (" + gl.year + ", " + gl.access + "): " + gl.keys + "\n";
      result.sources.push(gl.name + " (" + gl.year + ")");
    }
    result.trials = result.trials.concat(g.trials || []);
    result.conferences = result.conferences.concat(g.conferences || []);
  }
  return result;
}

var LECTURE_PROMPT = 'You are a senior Internal Medicine educator (general IM across all subspecialties: cardiology, pulmonary, GI/hepatology, endocrine, ID, heme/onc, rheum, neuro, nephrology, critical care, allergy, derm, psych, geriatrics, palliative). Identify the relevant specialty from the topic and teach from that field. Default to general IM reasoning unless a specialty is explicitly stated; do NOT default to nephrology.\n\nINTERNAL REASONING PROCESS (think through this BEFORE writing the JSON, do not include in output):\n1. What is the precise mechanism at the cellular/molecular level?\n2. What is the organ-level physiology that follows from that mechanism?\n3. What is the pathophysiology — how does the disease disrupt normal physiology?\n4. What clinical findings logically follow from the pathophysiology?\n5. What is the workup strategy and why does each test answer a specific question?\n6. What is the current first-line treatment per the relevant society guideline, AND what is the mechanism by which it works?\n7. What landmark trials established this approach?\n8. Verify each step is internally consistent — does the treatment section logically follow from the mechanism section? Are there any contradictions?\n\nOnly after completing this reasoning, write the chalk talk. The physiology section MUST be deep and mechanistic, not superficial. Every clinical recommendation MUST trace back to a mechanistic rationale.\n\nMEDICAL SHORTHAND (USE WHEREVER STANDARD): Write for an internal medicine resident audience that expects standard abbreviations. Spell out the full term ONCE on first use with the abbreviation in parentheses, then use the abbreviation throughout. Examples — pulmonary function tests (PFTs), thyroid stimulating hormone (TSH), arterial blood gas (ABG), complete blood count (CBC), basic metabolic panel (BMP), comprehensive metabolic panel (CMP), hemoglobin A1c (HbA1c), estimated GFR (eGFR), blood urea nitrogen (BUN), creatinine (Cr), troponin (trop), brain natriuretic peptide (BNP), chest X-ray (CXR), electrocardiogram (ECG/EKG), computed tomography (CT), magnetic resonance imaging (MRI), ultrasound (US), echocardiogram (echo). Common conditions — myocardial infarction (MI), heart failure (HF), atrial fibrillation (AFib), pulmonary embolism (PE), deep vein thrombosis (DVT), chronic obstructive pulmonary disease (COPD), chronic kidney disease (CKD), acute kidney injury (AKI), type 2 diabetes mellitus (T2DM), hypertension (HTN), hyperlipidemia (HLD), gastroesophageal reflux disease (GERD), inflammatory bowel disease (IBD), ulcerative colitis (UC), Crohn disease (CD), rheumatoid arthritis (RA), systemic lupus erythematosus (SLE), obstructive sleep apnea (OSA). Drug classes — ACE inhibitor (ACEi), angiotensin receptor blocker (ARB), beta blocker (BB), calcium channel blocker (CCB), proton pump inhibitor (PPI), non-steroidal anti-inflammatory drug (NSAID), selective serotonin reuptake inhibitor (SSRI). Hormones already-abbreviated — TSH, T3, T4, ACTH, FSH, LH, PTH, ADH, GH, IGF-1 (do not spell out unless first introduction needs it). Use the abbreviation directly when it is already universally understood (PFTs, EKG, CT, MRI, BMP) without re-spelling each time. Do NOT over-abbreviate prose so it becomes unreadable — keep flow natural for a resident reading.\n\nDRUG NAMES (MANDATORY): Use only canonical INN generic spellings. Verify each drug name before writing it. High-risk drugs commonly mangled by language models — confirm spelling: Factor Xa inhibitors (rivaroxaban, apixaban, edoxaban; thrombin inhibitor dabigatran), P2Y12 inhibitors (clopidogrel, ticagrelor, prasugrel, cangrelor), SGLT2 inhibitors (empagliflozin, dapagliflozin, canagliflozin, ertugliflozin), GLP-1 agonists (semaglutide, liraglutide, dulaglutide, tirzepatide, exenatide), ACEi (lisinopril, enalapril, ramipril), ARBs (losartan, valsartan, telmisartan, irbesartan), beta blockers (metoprolol, carvedilol, bisoprolol), statins (atorvastatin, rosuvastatin), antibiotics (vancomycin, piperacillin-tazobactam, ceftriaxone, meropenem, levofloxacin, clindamycin), antifungals (fluconazole, voriconazole, isavuconazole, micafungin), biologics (rituximab, infliximab, adalimumab, vedolizumab, ustekinumab, dupilumab, dupixent → spelled dupilumab generically), oncology TKIs (imatinib, ibrutinib, erlotinib, dasatinib, nilotinib), checkpoint inhibitors (pembrolizumab, nivolumab, ipilimumab, atezolizumab). If you are uncertain of the exact generic spelling, use the brand name (e.g. Xarelto, Eliquis, Plavix, Jardiance, Ozempic, Mounjaro, Humira) rather than guess. NEVER fabricate a drug name. Example of forbidden output: "rivarelbaxaban" (not a word — the correct generic is rivaroxaban or brand name Xarelto).\n\n10-min chalk talk. Physiology FIRST and DEEP. CRITICAL: When GUIDELINE REFERENCE CONTEXT is provided below, you MUST anchor your treatment recommendations and board tips to those specific guideline recommendations and cite the specific guideline name and year (e.g., "per KDIGO 2024" or "per 2022 AHA/ACC/HFSA"). Also cite the landmark trials listed. If the user has uploaded reference documents, use those as PRIMARY sources. If web search is available and the topic involves recent treatment standards, search for the most current guideline recommendations before writing.\n\nInclude treatment per the guideline society appropriate to the topic (AHA/ACC cardio, ATS/ERS pulm, ACG/AASLD GI/liver, ADA endo, IDSA ID, ASH heme, ASCO/NCCN onc, ACR rheum, AAN neuro, KDIGO nephro, SCCM ICU, AAAAI allergy, AAD derm, APA psych, AGS geriatrics, ACOG/NAMS women\'s health, USPSTF prevention, AAHPM palliative). 3-4 sections.\n\nOUTCOMES SECTION (when clinically relevant): If the topic has meaningful prognosis / morbidity / mortality data — e.g. infective endocarditis, sepsis, PE, GI bleed, HF, ARDS, many malignancies, transplant — ADD a FINAL section titled "Outcomes & Prognosis" (or similar) covering the key numbers: mortality/survival rates // ═══════════ BACKGROUND (SERVER-SIDE) GENERATION ═══════════
// Jenni 2026-07-03 (Workers Paid $5/mo). Problem: a synchronous generate() lives entirely in the
// browser tab — background the tab, lock the phone, or lose focus mid-draft and the fetch/stream
// dies, so the talk never finishes. Fix: submit the draft+critique to the Worker, which runs them
// server-side via ctx.waitUntil and stashes the result in KV; the browser just polls (and can
// disconnect + reconnect freely). Scoped to free-tier Claude only (that's the path that goes through
// our Worker + key). FAIL-SAFE: if the Worker isn't configured for async (no JOBS_KV → 503) or the
// submit errors, we transparently fall back to the existing synchronous streaming path, so nothing
// breaks before Jenni finishes the Cloudflare KV/Paid setup. Once a 503 unconfigured is seen, we
// remember it for the session (_asyncUnavailable) and skip the wasted submit on later gens.
var ASYNC_GEN_CONFIG = {
  enabled: true,          // master switch; sync path is always the fallback
  pollMs: 2500,           // status poll interval
  maxPollMs: 540000,      // stop polling after 9 min (under the 10-min KV TTL) — a rare slow job stays
                          // recoverable via reconnect rather than being abandoned mid-flight
  jobKey: "ct_active_job" // localStorage key holding the in-flight jobId for reconnect
};
var _asyncUnavailable = false; // set true after a 503 async_unconfigured this session

// Should THIS generation go through the background Worker path?
function asyncGenApplicable(){
  return !!(ASYNC_GEN_CONFIG.enabled && !_asyncUnavailable && genUsesFreeTier() && RAG_CONFIG.url && freeTierToken());
}

// Submit a background job. Returns { jobId } on success, or null to signal "fall back to sync".
// A client-generated jobId is sent so the submit is IDEMPOTENT: if the POST reaches the server (reserving
// a talk + starting the job) but the RESPONSE is lost, we don't blindly fall back to sync (which would
// double-generate) — we recover by checking that job's status first. (Codex bug #2)
async function submitAsyncGeneration(payload){
  var clientJobId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
    : (Date.now().toString(16) + "-" + Math.random().toString(16).slice(2,10) + "-" + Math.random().toString(16).slice(2,10));
  payload.clientJobId = clientJobId;
  try{
    var r = await fetch(RAG_CONFIG.url.replace(/\/$/,"") + "/generate-async", {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-Supabase-Auth": freeTierToken() },
      body: JSON.stringify(payload)
    });
    if(r.status === 503){
      var e503 = {}; try{ e503 = await r.json(); }catch(_){}
      if(((e503.error && e503.error.type) || "") === "async_unconfigured"){ _asyncUnavailable = true; } // KV not set up yet
      return null; // includes free_tier_paused: let the SYNC path surface it consistently
    }
    // Out of quota: the worker RESERVED and found none left. Don't fall back to sync (that would
    // generate one more on the owner's key) — surface the paywall.
    if(r.status === 403){
      var e403 = {}; try{ e403 = await r.json(); }catch(_){}
      if(((e403.error && e403.error.type) || "") === "quota_exceeded"){ var qe = new Error((e403.error && e403.error.message) || "You've used all your free talks."); qe.code = "quota_exceeded"; throw qe; }
      return null;
    }
    // ANY other non-success (401 auth, 4xx, 5xx) → fall back to the synchronous path, which owns the
    // real error handling (auth_invalid, paused) and keeps one code path for user-facing errors.
    if(!r.ok){ return null; }
    var data = await r.json();
    return (data && data.jobId) ? data : { jobId: clientJobId };
  }catch(err){
    if(err && err.code) throw err; // tagged (quota_exceeded) — don't swallow
    // Network error AFTER the POST may have started the job server-side. Check whether our clientJobId
    // exists before falling back to sync — otherwise a lost response double-generates. Retry once (KV is
    // read-your-write within a colo but can lag briefly).
    for(var attempt=0; attempt<2; attempt++){
      await new Promise(function(res){ setTimeout(res, attempt===0?600:1400); });
      try{
        var sr = await fetch(RAG_CONFIG.url.replace(/\/$/,"") + "/generate-status/" + encodeURIComponent(clientJobId), { headers:{ "X-Supabase-Auth": freeTierToken() } });
        if(sr.ok){ return { jobId: clientJobId, recovered:true }; }  // job exists → poll it, don't sync
        if(sr.status === 404){ return null; }                        // CONFIRMED never created → safe to sync
      }catch(_){ /* status check itself failed — keep trying */ }
    }
    // Inconclusive (couldn't get a definitive 404): the POST may have reached the server and reserved a
    // talk. Do NOT fall back to sync — that would reserve+consume a SECOND talk and generate twice. Instead
    // return the clientJobId so the caller polls it: if the job exists it connects, and if it truly never
    // started the poll 404s into a clean "try again" — either way, no double-charge. (Audit fix)
    return { jobId: clientJobId, unconfirmed:true };
  }
}

// Poll a job to completion. onStage(stage) fires when the server stage changes (drafting/critique).
// checkAbort() returns true if the caller wants to stop (cancel / stale gen); we then cancel the job.
// Returns { draftText, critText, modelUsed }. Throws on server error / timeout / cancel.
async function pollAsyncGeneration(jobId, onStage, checkAbort){
  var start = Date.now();
  var lastStage = "";
  while(true){
    if(checkAbort && checkAbort()){
      try{ fetch(RAG_CONFIG.url.replace(/\/$/,"") + "/generate-cancel/" + encodeURIComponent(jobId), { method:"POST", headers:{ "X-Supabase-Auth": freeTierToken() } }); }catch(_){}
      var ce = new Error("Generation cancelled"); ce.code = "cancelled"; throw ce;
    }
    if(Date.now() - start > ASYNC_GEN_CONFIG.maxPollMs){
      var te = new Error("Still generating on our servers — reload the page in a moment to pick it back up."); te.code = "timeout"; throw te;
    }
    await new Promise(function(res){ setTimeout(res, ASYNC_GEN_CONFIG.pollMs); });
    var r;
    try{
      r = await fetch(RAG_CONFIG.url.replace(/\/$/,"") + "/generate-status/" + encodeURIComponent(jobId), {
        headers:{ "X-Supabase-Auth": freeTierToken() }
      });
    }catch(netErr){ continue; } // transient network blip — keep polling (this is the whole point)
    if(r.status === 404){ throw new Error("Generation job expired. Please tap Generate again."); }
    if(!r.ok){ continue; }
    var job; try{ job = await r.json(); }catch(_){ continue; }
    if(job.stage && job.stage !== lastStage){ lastStage = job.stage; if(onStage) try{ onStage(job.stage); }catch(_){} }
    if(job.status === "done" && job.result){
      // Re-check abort on the SAME tick we got the result: if a restart superseded us during this
      // poll interval, don't let the stale invocation proceed to the success path (which would run an
      // unguarded localStorage.removeItem and clobber the new gen's reconnect key). (Jenni 2026-07-03)
      if(checkAbort && checkAbort()){ var da = new Error("Generation cancelled"); da.code = "cancelled"; throw da; }
      return job.result;
    }
    if(job.status === "error"){ throw new Error((job.error && job.error.message) || "Background generation failed."); }
    if(job.status === "cancelled"){ var xe = new Error("Generation cancelled"); xe.code = "cancelled"; throw xe; }
    // else still running — loop
  }
}

// RELOAD RECONNECT (Jenni 2026-07-03): the background path persists the in-flight jobId. If the user
// reloads the page (or the mobile browser killed + relaunched the tab) while a talk was generating,
// pick the job back up and finish rendering it — the server kept working the whole time. Guarded so
// it runs at most once and only for a fresh (<TTL) job on the free-tier Claude path. Safe no-op
// otherwise. Called once auth is restored (token available).
var _resumeAttempted = false;
async function resumeAsyncJobIfAny(){
  if(_resumeAttempted) return;

  // still be reconnectable when the user reloads a few seconds later. (audit fix)
  if((Date.now() - (stored.at || 0)) > 600000 || S.loading){

// Loaded from rag/trial_expansions.json at boot. Used in generate() to inject richer trial
// context (NEJM/NephJC/CardioNerds-grounded primary finding, critique, guideline impact)
// into the system prompt when the topic / refine text references a curated landmark trial.
var TRIAL_EXPANSIONS = {};
(function loadTrialExpansions(){
  // Fetch is relative to the HTML's directory. Works on github.io + localhost.
  fetch("rag/trial_expansions.json", { cache: "no-cache" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(data){
      if(!data) return;
      // Drop the _meta key — keep only trial entries
      var out = {};
      for(var k in data){ if(k !== "_meta") out[k] = data[k]; }
      TRIAL_EXPANSIONS = out;
      console.log("Loaded", Object.keys(out).length, "trial expansions");
    })
    .catch(function(e){ console.warn("trial_expansions.json not loaded:", e); });
})();

// Scan a body of text for trial names. Returns the matched expansion objects.
// Case-insensitive substring match, longest names first so "PARTNER 3" beats "PARTNER".
function getMatchingTrialExpansions(text){
  if(!text || !TRIAL_EXPANSIONS) return [];
  var lower = String(text).toLowerCase();
  var names = Object.keys(TRIAL_EXPANSIONS).sort(function(a,b){ return b.length - a.length; });
  var matches = [];
  var seen = {};
  for(var i=0;i<names.length;i++){
    var n = names[i];
    if(seen[n]) continue;
    if(lower.indexOf(n.toLowerCase()) >= 0){
      matches.push({ name: n, exp: TRIAL_EXPANSIONS[n] });
      seen[n] = true;
    }
  }
  return matches;
}

// Build the TRIAL CONTEXT block that gets injected into the prompt.
function buildTrialExpansionContext(topic, refineContext){
  var haystack = (topic||"") + "\n" + (refineContext||"");
  var matches = getMatchingTrialExpansions(haystack);
  if(!matches.length) return "";
  var out = "\n\n═══ TRIAL CONTEXT (use these expert-curated summaries to anchor trial discussion) ═══";
  matches.forEach(function(m){
    var e = m.exp;
    out += "\n\n[" + e.trial + "]";
    if(e.primary_finding)   out += "\n  Primary finding: " + e.primary_finding;
    if(e.population)        out += "\n  Population: " + e.population;
    if(e.critique)          out += "\n  Critique/limitation: " + e.critique;
    if(e.followup)          out += "\n  Long-term follow-up: " + e.followup;
    if(e.guideline_impact)  out += "\n  Guideline impact: " + e.guideline_impact;
    if(e.nephjc_takeaway)   out += "\n  NephJC takeaway: " + e.nephjc_takeaway;
    if(e.expert_takeaway)   out += "\n  Expert takeaway: " + e.expert_takeaway;
    if(e.sources && e.sources.length) out += "\n  Cite as: " + e.sources.join(" | ");
  });
  out += "\n═══ END TRIAL CONTEXT ═══";
  return out;
}

// ═══════════ SUPABASE AUTH ═══════════
window.onSupabaseReady = function(client){
  // Pull current session, then subscribe to changes
  client.auth.getSession().then(function(r){
    if(r && r.data && r.data.session){
      S.session = r.data.session;
      S.user = r.data.session.user;
      loadProfile();
      if(typeof refreshFreeTierStatus === "function") refreshFreeTierStatus();
    }
    if(typeof render === "function") render();
    // Background-fetch featured talks for the landing page (Jenni 2026-06-08)
    if(typeof loadLandingFeatured === "function") loadLandingFeatured();
    // Auth state is now known — drain any pending #t=<cloud-id> hash load from a deep-link.
    if(typeof drainPendingHashLoad === "function") drainPendingHashLoad();
  });
  client.auth.onAuthStateChange(function(event, session){
    var wasSignedIn = !!S.user;
    S.session = session || null;
    S.user = (session && session.user) || null;
    if(S.user){
      loadProfile();
      if(typeof refreshFreeTierStatus === "function") refreshFreeTierStatus();
      // First-time-on-this-device prompt: migrate localStorage talks
      if(!wasSignedIn) maybeOfferLocalMigration();
      // Reconnect to a background talk left mid-generation before a reload (now that we have a token).
      if(typeof resumeAsyncJobIfAny === "function") resumeAsyncJobIfAny();
    } else {
      S.profile = null; S.freeTier = null;
      _profileLoadedForUser = null; // signed out — next sign-in reloads profile/talks/favorites
    }
    if(typeof render === "function") render();
  });
};

// Dedupe guard (Jenni 2026-07-03): on page load, getSession() AND onAuthStateChange (INITIAL_SESSION,
// SIGNED_IN, TOKEN_REFRESHED) each called loadProfile → profiles/talks/favorites fetched 3× per load.
// Track which user we've loaded (and in-flight loads) so repeat auth events are no-ops. A real
// sign-out → sign-in resets the guard via the onAuthStateChange else-branch.
var _profileLoadedForUser = null;
var _profileLoadInflight = null;
async function loadProfile(force){
  if(!window.sb || !S.user) return;
  if(!force && (_profileLoadedForUser === S.user.id || _profileLoadInflight === S.user.id)) return;
  _profileLoadInflight = S.user.id;
  try{
    var r = await window.sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle();
    S.profile = r.data || null;
    _profileLoadedForUser = S.user.id;
    if(typeof render === "function") render();
    // Also refresh cloud talks + favorites on profile load
    refreshCloudTalks();
    refreshFavorites();
  }catch(e){ console.warn("loadProfile failed", e) }
  finally{ _profileLoadInflight = null; }
}

// === Cloud talks (Supabase-backed library) ===
// LIGHTWEIGHT list fetch — pulls only the columns the library cards need (no talk_json,
// which can be MBs per row with base64 visuals). The full talk_json is fetched on-demand
// by cloudLoadTalk(id) when the user clicks Open.
async function refreshCloudTalks(){
  if(!window.sb || !S.user) return;
  try{
    // talk_json->>subtitle projects just the subtitle text from the JSONB column (no quotes).
    // Tiny bandwidth (~30-80 bytes/row) and restores the subtitle line on library cards.
    // has_visuals is a denormalized boolean column maintained by the sync_has_visuals trigger
    // (see supabase/migrations/add_has_visuals.sql). Lets us show the 🖼 badge without fetching the heavy talk_json.
    // Try the full query first (includes Pattern A columns). If the migration hasn't been run yet,
    // the new columns don't exist and PostgREST returns 42703 / "column does not exist" — fall back
    // to the prior query so the user still sees their saved talks. (Jenni 2026-06-09)
    var FULL_COLS = "id, title, topic, style, depth, created_at, share_token, is_public, is_featured, featured_at, has_visuals, source_id, source_curator_name, source_curator_user_id, depth_variants, specialty_override, is_pinned, pinned_at, sort_order, files_meta, talk_json->>subtitle";
    // Fallback query. Includes the curation columns (specialty_override / is_pinned / pinned_at /
    // sort_order) too — they exist in every migrated DB, so keeping them here means a transient
    // FULL_COLS error can't silently DROP a user's recategorization / pin / manual order on reload.
    // (Jenni 2026-07-03 — recategorize-doesn't-persist fix.) files_meta drives the copyright confirm
    // on publish (Jenni 2026-07 — talks built from an uploaded reference warn before going public).
    var LEGACY_COLS = "id, title, topic, style, depth, created_at, share_token, is_public, is_featured, featured_at, has_visuals, source_id, source_curator_name, source_curator_user_id, depth_variants, specialty_override, is_pinned, pinned_at, sort_order, files_meta, talk_json->>subtitle";
    var r = await window.sb.from("talks").select(FULL_COLS).order("created_at", { ascending: false });
    if(r.error){
      var msg = (r.error && (r.error.message||"")) + " " + (r.error.code||"");
      if(/specialty_override|is_pinned|pinned_at|42703|column .* does not exist/i.test(msg)){
        console.warn("Pattern A columns missing — using legacy query. Run the migration to enable pin/recategorize.");
        r = await window.sb.from("talks").select(LEGACY_COLS).order("created_at", { ascending: false });
      }
    }
    if(r.error) throw r.error;
    S.cloudTalks = r.data || [];
    S.cloudLoaded = true;
    if(typeof render === "function") render();
  }catch(e){ console.warn("refreshCloudTalks failed", e) }
}

async function cloudSaveCurrentTalk(){
  if(!window.sb || !S.user || !S.talk) return false;

  var dgLite = S.dg ? { hadImage: !!S.dg.imgB64, svg: S.dg.svg||null } : null;
  // depth_variants: single-row container for concise+detailed. New saves seed with current depth;

  // Seed depth_variants with EVERY depth the user has viewed this session (S.depthVariantsCache), so
  // toggling Concise↔Detailed then Saving persists BOTH versions. (Jenni 2026-07)
  var dvSeed = null;
  if(!isBQ){
    dvSeed = {};
    if(S.depthVariantsCache){ for(var _dvk in S.depthVariantsCache){ if(S.depthVariantsCache[_dvk]) dvSeed[_dvk] = S.depthVariantsCache[_dvk]; } }
    if(S.depth) dvSeed[S.depth] = t;
    if(!Object.keys(dvSeed).length) dvSeed = null;
  }
  var row = {
    user_id: S.user.id,
    title: t.title || S.topic || "Untitled",
    topic: S.topic || t.title || "",
    refine_context: S.refineContext || null,
    style: isBQ ? "boards" : "lecture",
    depth: S.depth || null,
    talk_json: t,
    depth_variants: dvSeed,
    references_json: t.references || null,
    files_meta: (S.files||[]).map(function(f){return {n:f.n, type:(f.t||f.type||null), size:(f._size||f.size||null)}})
  };
  var r = await window.sb.from("talks").insert(row).select().maybeSingle();
  if(r.error){ console.warn(r.error); return false }
  S.cloudTalks = [r.data].concat(S.cloudTalks || []);
  return true;
}

async function cloudSaveCopyOfPublic(originalTalk, sourceTalkId, sourceUserId, sourceCuratorName, topic, style, depth){

// Merge a new depth variant into an existing talk row. Used when a user opens a saved talk,
// switches depth, generates the other version, and we want to consolidate into ONE row instead
// of creating a duplicate. (Jenni 2026-06-08 Option B)
async function cloudUpsertDepthVariant(id, depth, talkJson){
  if(!window.sb || !S.user || !id || !depth || !talkJson) return false;
  // Read current depth_variants, merge new depth, write back. RLS confines this to user's own rows.
  var existing = await window.sb.from("talks").select("depth_variants").eq("id", id).maybeSingle();
  if(existing.error){ console.warn("cloudUpsertDepthVariant read", existing.error); return false }
  var dv = (existing.data && existing.data.depth_variants) || {};
  dv[depth] = talkJson;
  var r = await window.sb.from("talks")
    .update({
      depth_variants: dv,
      talk_json: talkJson, // also update the canonical current snapshot
      depth: depth
    })
    .eq("id", id)
    .select()
    .maybeSingle();
  if(r.error){ console.warn("cloudUpsertDepthVariant write", r.error); return false }
  S.cloudTalks = (S.cloudTalks || []).map(function(x){ return x.id === id ? r.data : x });
  return true;
}

// Update an existing cloud talk in place (used when user opens a saved talk, refines it,
// then chooses "Save changes" instead of "Save as new").
async function cloudUpdateTalk(id){
  if(!window.sb || !S.user || !S.talk || !id) return false;
  var t = S.talk;
  var isBQ = !!(t.question);
  // Preserve / extend depth_variants so the other-depth variant survives a "Save changes" update.
  // (Jenni 2026-06-08 Option B — without this, editing concise and re-saving would wipe the cached detailed.)
  var existingCloud = (S.cloudTalks||[]).find(function(x){return x.id===id});
  // Preserve a saved image across depth toggles: uploads aren't restored on open, and toggling depth
  // swaps S.talk to a variant without savedVisuals — so re-saving could drop the image and flip
  // has_visuals off. If the live snapshot lacks visuals but a cached variant has them, carry them over.
  if((!t.savedVisuals || !t.savedVisuals.length) && S.depthVariantsCache){
    for(var _dk in S.depthVariantsCache){ var _v = S.depthVariantsCache[_dk]; if(_v && _v.savedVisuals && _v.savedVisuals.length){ t.savedVisuals = _v.savedVisuals; break; } }
  }
  var dv = (existingCloud && existingCloud.depth_variants) || {};
  // Merge in every depth viewed this session so "Save changes" persists BOTH versions. (Jenni 2026-07)
  if(!isBQ && S.depthVariantsCache){ for(var _dvu in S.depthVariantsCache){ if(S.depthVariantsCache[_dvu]) dv[_dvu] = S.depthVariantsCache[_dvu]; } }
  if(!isBQ && S.depth) dv[S.depth] = t;
  // files_meta drives the publish copyright guardrail. S.files is only populated during compose and is
  // empty when a saved talk is reopened — so overwriting it here would ERASE the reference metadata and
  // silently disable the guardrail. Only rewrite when we actually have uploads this session; otherwise
  // keep whatever the row already had. (Audit fix)
  var _filesMeta = (S.files && S.files.length)
    ? S.files.map(function(f){ return {n:f.n, type:(f.t||f.type||null), size:(f._size||f.size||null)}; })
    : ((existingCloud && existingCloud.files_meta) || null);
  var row = {
    title: t.title || S.topic || "Untitled",
    topic: S.topic || t.title || "",
    refine_context: S.refineContext || null,
    style: isBQ ? "boards" : "lecture",
    depth: S.depth || null,
    talk_json: t,
    depth_variants: Object.keys(dv).length ? dv : null,
    references_json: t.references || null,
    files_meta: _filesMeta
  };
  var r = await window.sb.from("talks").update(row).eq("id", id).select().maybeSingle();
  if(r.error){ console.warn(r.error); return false }
  // Refresh cached row in cloudTalks
  S.cloudTalks = (S.cloudTalks || []).map(function(x){ return x.id === id ? r.data : x });
  return true;
}

// Apply a tier change from the share modal. tier ∈ "private" | "link" | "profile".
// Downgrades are collapsed: going private from any state unfeatures AND unpublishes.
// (Jenni 2026-06-08 Phase 2 — one verb per outcome.)
async function applyShareTier(talkId, tier){
  if(!talkId) return;
  S.shareModalBusy = true; render();
  var row = (S.cloudTalks||[]).find(function(x){return x.id===talkId});
  var curIsPublic = !!(row && row.is_public);
  var curIsFeatured = !!(row && row.is_featured);

  try{
    var publishing = (tier === "link" || tier === "profile");
    // Copyright guardrail (Jenni 2026-07): if this talk was built from an uploaded reference (e.g.
    // MKSAP, a textbook), warn before it goes public — publishing could redistribute copyrighted
    // material. Only fires on the actual PRIVATE→public step (not when re-sharing an already-public
    // talk, e.g. link→profile). Private use is unaffected.
    if(publishing && !curIsPublic){
      var _fm = (row && Array.isArray(row.files_meta)) ? row.files_meta : [];
      if(_fm.length){
        var _names = _fm.map(function(f){return f && f.n;}).filter(Boolean).join(", ");
        var _okPub = confirm(
          "This talk was built from an uploaded reference" + (_names ? " (" + _names + ")" : "") + ".\n\n" +
          "Publishing it publicly could redistribute copyrighted material. Only continue if the talk is your own synthesis and doesn't reproduce that source.\n\n" +
          "Publish anyway?"
        );
        if(!_okPub){ S.shareModalBusy = false; render(); return; }
      }
    }
    // BEFORE publishing/featuring: sync the currently-viewed depth's content to the row's
    // canonical talk_json. Otherwise an instant depth swap (cached) leaves the DB stale and
    // coworkers see a different depth than the curator is viewing. (Jenni 2026-06-09 fix.)
    if(publishing && S.loadedTalkId === talkId && S.talk && S.depth){
      // If this sync fails we'd publish the STALE talk_json — abort rather than serve old content. (Codex fix)
      var _synced = await cloudUpsertDepthVariant(talkId, S.depth, S.talk);
      if(_synced === false) throw new Error("depth_sync_failed");
    }

    // cloudSetTalkFeatured/Public return null (not throw) on failure — check each so a failed
    // publish/unpublish surfaces an error instead of looking like success. (Codex fix)
    var ok = true;
    if(tier === "private"){
      if(curIsFeatured && (await cloudSetTalkFeatured(talkId, false)) === null) ok = false;
      if(curIsPublic && (await cloudSetTalkPublic(talkId, false)) === null) ok = false;
    } else if(tier === "link"){
      if(curIsFeatured && (await cloudSetTalkFeatured(talkId, false)) === null) ok = false;
      if(!curIsPublic && (await cloudSetTalkPublic(talkId, true)) === null) ok = false;
    } else if(tier === "profile"){
      if((await cloudSetTalkFeatured(talkId, true)) === null) ok = false;
    }
    if(!ok) throw new Error("share_update_failed");
    // Refresh cached share_token for the modal display
    var updated = (S.cloudTalks||[]).find(function(x){return x.id===talkId});
    if(updated) S.shareModalToken = updated.share_token;
  }catch(e){
    console.warn("applyShareTier", e);
    S.savedFlash = "⚠ Couldn't update sharing — check your connection and try again";
    if(typeof _toast === "function") _toast("⚠ Couldn't update sharing — try again", 3200);
  }
  S.shareModalBusy = false;
  render();
}

// Fetch featured talks. Lightweight query — title + topic + style + share_token, plus subtitle
// projected from talk_json. Drops the full talk_json (heavy) — it's fetched only when a user clicks
// into a specific talk via loadPublicTalkByToken. Anon Supabase client works thanks to RLS on
// is_public=true. (Jenni 2026-06-08 — landing + showcase share this loader for caching.)
async function loadShowcaseTalks(limit, curatorId){
  if(!window.sb) return [];
  var q = window.sb.from("talks")
    .select("id,title,topic,style,depth,share_token,featured_at,created_at,sort_order,user_id,has_visuals,talk_json->>subtitle")
    .eq("is_public", true)
    .eq("is_featured", true)
    .order("featured_at", {ascending:false});
  if(curatorId) q = q.eq("user_id", curatorId);   // per-curator profile / owner-scoped surfaces
  if(limit) q = q.limit(limit);
  var r = await q;
  if(r.error){ console.warn("loadShowcaseTalks", r.error); return []; }
  var rows = r.data || [];
  // Apply the SAME manual order as the library (Jenni 2026-07-03): sort by sort_order, falling back
  // to created_at (newest first) for talks that haven't been manually placed. Keeps the public
  // profile order in sync with drag-reordering done in the library.
  rows.sort(function(a,b){ return libSortKey(a.sort_order, a.created_at) - libSortKey(b.sort_order, b.created_at); });
  return rows;
}

// Shared ordering key: an explicit sort_order wins; otherwise fall back to newest-first by date
// (negated epoch so newer = smaller = higher in the list). One axis for library + showcase.
function libSortKey(sortOrder, dateStr){
  if(typeof sortOrder === "number") return sortOrder;
  return -(new Date(dateStr||0).getTime());
}

// Load a public talk via the Worker /share/:token route (works without sign-in)
async function loadPublicTalkByToken(token){
  if(!token) return false;
  S.loadingFromHash = true;
  if(typeof render === "function") render();
  try{
    var workerUrl = (RAG_CONFIG && RAG_CONFIG.url) ? (RAG_CONFIG.url.replace(/\/$/, "") + "/share/" + encodeURIComponent(token)) : null;
    if(!workerUrl) throw new Error("Worker URL not configured");
    var res = await fetch(workerUrl, { headers: {"Accept": "application/json"} });
    if(!res.ok){
      var body = await res.text();
      throw new Error("HTTP "+res.status+": "+body.slice(0,200));
    }
    var data = await res.json();
    if(!data || !data.talk_json) throw new Error("Empty talk payload");
    S.talk = data.talk_json;
    S.topic = data.topic || data.title || "";
    S.style = data.style || "lecture";
    S.depth = data.depth || "concise";
    S.sharedTalk = true;
    S.sharedCopySaved = false;   // fresh shared talk → allow one save-copy (Codex fix)
    S.sharedAuthor = data.author || null;
    // Phase 5 — capture origin so the "Save copy" button can stamp attribution + detect own-talk
    S.sharedAuthorUserId = data.author_user_id || null;
    S.sharedOriginalTalkId = data.id || null;
    S.isSampleTalk = false; S.sampleSlug = "";
    S.loadedTalkId = null; S.talkIsSaved = true; // public viewer is read-only
    S.sec = 0; S.showAns = false; S.userPick = "";
    S.loadingFromHash = false;
    if(typeof render === "function") render();
    window.scrollTo(0,0);
    return true;
  }catch(e){
    console.error("loadPublicTalkByToken failed:", e);
    S.loadingFromHash = false;
    if(typeof render === "function") render();
    alert("Couldn't open that shared talk — it may have been unpublished, or the link is wrong.");
    return false;
  }
}
