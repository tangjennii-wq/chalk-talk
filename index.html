// Additive refinement \u2014 pass the EXISTING talk JSON to Claude + the user's add/change request.
// Explicitly tells the model: preserve sections, pearls, citations, references. ONLY add new content
// (new sections, new bullets, new references) unless the user explicitly asked to remove something.
// Snapshot the current talk so a refine/edit can be undone.
// Stores a deep clone — never mutate a snapshot in place. Caps history at 8 entries.
function pushTalkHistory(label){
  if(!S.talk)return;
  try{
    var snap = {
      label: label || "edit",
      at: Date.now(),
      talk: JSON.parse(JSON.stringify(S.talk))
    };
    S.talkHistory.push(snap);
    if(S.talkHistory.length > 8) S.talkHistory.shift();
  }catch(e){console.warn("pushTalkHistory failed:",e)}
}
function undoLastEdit(){
  if(!S.talkHistory.length)return;
  var snap = S.talkHistory.pop();
  S.talk = snap.talk;
  S.talkIsSaved = false; // undoing puts us back at an unsaved state
  // Clear visuals/podcast — they were tied to the post-refine version
  S.dg = null; S.dgErr = ""; S.podScript = "";
  S.editingSection = null; S.editingDraft = null;
  render();
}

// === PATCH-BASED WEAVE (Jenni 2026-06-10 \u2014 replaces full-rewrite weave) ============================
// The old weave asked Claude to return a fully-rewritten talk JSON with additions woven in. Two
// problems: (1) under max_tokens pressure on detailed talks, Claude silently dropped existing
// content to fit; (2) Claude's "is this already covered?" audit fired too eagerly and ignored
// the user's explicit add request. Result: users hit "add X" and lost their existing content
// OR got nothing back. Both failure modes are catastrophic for a tool people trust to KEEP work.
//
// Fix: model returns ONLY a JSON patch of SURGICAL ops — add / edit / delete — each targeting an
// exact coordinate (section_index, bullet_index, list index). JS merges deterministically via a
// tombstone-then-compact pass, so every index the model emits stays valid against the snapshot it
// saw, and any content the model does NOT name is preserved verbatim. The model never returns the
// whole talk, so it can't truncate or lose work. This lets the user proofread elsewhere (e.g.
// OpenEvidence), paste a corrected block, and have Claude reconcile it bullet-by-bullet. Whole-talk
// reshapes (rewrite / shorten / expand / restructure) still route to their dedicated paths.
// (Surgical add/edit/delete: Jenni 2026-06-22. Was add-only before.)
async function weaveRevision(userMsg){
  if(!S.talk) return null;
  // Refines count as 1 talk (FREE_TIER_SPEC.md). Charge-AFTER (Jenni 2026-07-03): pre-check only if
  // visibly exhausted; the actual consume happens after the model call succeeds (see below).
  if(genUsesFreeTier() && S.freeTier && typeof S.freeTier.talks_remaining === "number" && S.freeTier.talks_remaining <= 0){
    S.freePausedMsg = ""; S.showOutOfFreeModal = true; if(typeof render === "function") render();
    return null;
  }
  var sectionHeadings = (S.talk.sections||[]).map(function(s,i){return i+": "+s.heading}).join("\n  ");
  var nextRefId = ((S.talk.references||[]).reduce(function(m,r){return Math.max(m,parseInt(r.id)||0)},0)+1);

  // Indexed snapshot of the CURRENT talk. Replaces dumping raw JSON labelled "do not echo" (which
  // made the model treat a pasted correction as reference text to ignore, not edits to apply). Every
  // item is tagged with the exact coordinate the patch must use, so edits/deletes land precisely.
  // (Jenni 2026-06-22)
  var _snapLines = [];
  (S.talk.sections||[]).forEach(function(s,si){
    _snapLines.push("SECTION ["+si+"]: " + (s.heading||"(untitled)"));
    (s.points||[]).forEach(function(b,bi){ _snapLines.push("  bullet["+si+"]["+bi+"]: " + b); });
    if(s.teaching_pearl) _snapLines.push("  section_pearl["+si+"]: " + s.teaching_pearl);
    if(s.board_tip) _snapLines.push("  section_board_tip["+si+"]: " + s.board_tip);
  });
  (S.talk.board_pearls||[]).forEach(function(p,i){ if(p&&String(p).trim()) _snapLines.push("board_pearl["+i+"]: " + p); });
  (S.talk.teaching_points||[]).forEach(function(p,i){ if(p&&String(p).trim()) _snapLines.push("teaching_point["+i+"]: " + p); });
  (S.talk.summary_points||[]).forEach(function(p,i){ if(p&&String(p).trim()) _snapLines.push("summary_point["+i+"]: " + p); });
  (S.talk.references||[]).forEach(function(r){ _snapLines.push("reference[id="+(r.id||"?")+"]: " + (r.title||r.source||"") + (r.year?(" ("+r.year+")"):"")); });
  var indexedState = _snapLines.join("\n");

  // Style-match: additions inherit the talk's current depth so concise talks stay terse and detailed
  // talks stay rich. The model gets this hint in the system prompt. (Jenni 2026-06-11)
  var _depthHint = (S.depth === "concise")
    ? "STYLE: This talk is in CONCISE mode \u2014 terse telegraphic bullets, 1-2 short sentences each. " +
      "Your new additions MUST match. No verbose explanations, no paragraph-length bullets. " +
      "Examples of concise style: 'GDMT: ARNi + BB + MRA + SGLT2i \u2014 start all 4 within 30d if eGFR > 25', " +
      "'PRAISE trial: \u2193 mortality with amlodipine in nonischemic HFrEF [N]'. "
    : "STYLE: This talk is in DETAILED mode \u2014 fuller explanations welcome, multi-sentence bullets OK, " +
      "include mechanism and rationale alongside facts. Your new additions should match that depth. ";

  var sys = "You are SURGICALLY refining an existing chalk talk for an internal medicine educator. " +
    "ITERATIVE REFINEMENT IS THE NORM \u2014 the user refines this talk many times, often by proofreading " +
    "it elsewhere (e.g. OpenEvidence) and pasting back a corrected/annotated block for you to reconcile. " +
    "Your job: ASSESS the user's input against the CURRENT TALK, then return a JSON PATCH of surgical " +
    "operations \u2014 ADD, EDIT, and/or DELETE \u2014 each targeting an EXACT coordinate. Deterministic JS applies " +
    "your patch; anything you do NOT explicitly name is preserved verbatim. NEVER return the whole talk. " +
    "NEVER touch content that is already correct \u2014 only change what is wrong, missing, or what the user asked to change.\n\n" +
    _depthHint + "\n\n" +
    "COORDINATES: The CURRENT TALK is shown indexed. Sections are 0-based (SECTION [i]). Within a section, " +
    "bullets are 0-based (bullet[i][b]). Top-level lists are 0-based (board_pearl[i], teaching_point[i], " +
    "summary_point[i]). Use these EXACT indices. All indices refer to the current state shown to you, " +
    "BEFORE your patch is applied.\n\n" +
    "PATCH SCHEMA (return exactly this shape \u2014 every field optional, omit what you don't use):\n" +
    "{\n" +
    '  "skip_reason": null,\n' +
    '  "edit_section_bullets":   [{"section_index": 0, "bullet_index": 2, "new_text": "corrected bullet text [N]"}],\n' +
    '  "delete_section_bullets": [{"section_index": 0, "bullet_indices": [3, 5]}],\n' +
    '  "edit_section_heading":   [{"section_index": 1, "new_heading": "..."}],\n' +
    '  "edit_section_pearl":     [{"section_index": 1, "new_text": "..."}],\n' +
    '  "edit_section_board_tip": [{"section_index": 1, "new_text": "..."}],\n' +
    '  "delete_sections":        [4],\n' +
    '  "edit_pearls":            [{"index": 0, "new_text": "..."}],\n' +
    '  "delete_pearls":          [2],\n' +
    '  "edit_teaching_points":   [{"index": 0, "new_text": "..."}],\n' +
    '  "delete_teaching_points": [1],\n' +
    '  "edit_summary_points":    [{"index": 0, "new_text": "..."}],\n' +
    '  "delete_summary_points":  [1],\n' +
    '  "add_pearls": ["board pearl 1", "..."],\n' +
    '  "add_teaching_points": ["teaching point 1", "..."],\n' +
    '  "add_summary_points": ["summary point 1", "..."],\n' +
    '  "add_references": [{"type": "user-upload"|"guideline"|"trial"|"review", "source": "filename or paper title", "year": 2024, "society": "AHA/ACC", "url": "https://...", "title": "..."}],\n' +
    '  "add_section_bullets": [{"section_index": 0, "bullets": ["new bullet 1", "..."]}],\n' +
    '  "add_sections": [{"after_index": 2, "heading": "...", "points": ["..."], "teaching_pearl": "...", "board_tip": "..."}],\n' +
    '  "edit_vmc": {"top_left": "...", "top_right": "...", "bottom_left": "...", "bottom_right": "..."}\n' +
    "}\n\n" +
    "EXISTING SECTION HEADINGS (0-based):\n  " + sectionHeadings + "\n\n" +
    "RULES:\n" +
    "- SURGICAL, NOT WHOLESALE. Emit ops ONLY for content that is wrong, missing, or that the user named. If a bullet is already correct, leave it alone (no op for it).\n" +
    "- TO FIX AN ERROR: use edit_section_bullets (or edit_pearls / edit_teaching_points / edit_summary_points / edit_section_pearl / edit_section_board_tip / edit_section_heading) with the exact index and the corrected text. Fix only what's wrong; preserve the rest of the item's meaning and its [N] citations.\n" +
    "- TO REMOVE wrong / outdated / redundant content: use delete_section_bullets (list bullet_indices) or delete_sections. Be conservative \u2014 only delete what is clearly wrong or what the user told you to remove. Never delete merely to shorten.\n" +
    "- KEEP THE VISUAL MEMORY CARD IN SYNC: if your edits change the core MECHANISM, key FINDINGS, the WORKUP move, or the first-line TREATMENT, emit edit_vmc with ONLY the quadrant(s) that changed (top_left=mechanism, top_right=findings, bottom_left=workup, bottom_right=treatment; each \u22648 words). If your edit doesn't touch any of those four, omit edit_vmc entirely.\n" +
    "- TO ADD new content: use the add_* ops, placing new bullets in the topically-correct section via section_index (0-based, see headings).\n" +
    "- WHEN THE USER PASTES A CORRECTED / PROOFREAD VERSION OR A LARGE CHUNK OF TEXT: read it fully and DIFF it against the current talk. For each real difference emit the matching edit / delete / add op. Do NOT re-add content that already matches, and do NOT re-emit unchanged bullets.\n" +
    "- IF THE USER NAMES A SECTION (e.g. 'fix section 2' or 'in the treatment section'): confine your ops to that section's indices.\n" +
    "- CITATIONS: keep existing [N] on edited bullets unless the underlying fact changed. New clinical claims need a [N] \u2014 reuse an existing reference id when applicable, or add one via add_references (next free id: " + nextRefId + ") and cite it inline.\n" +
    "- Uploaded refs are PRIMARY sources; when a fact comes from one, add it to add_references and cite it.\n" +
    "- Keep edited/added bullets / pearls / tips concise and standalone (one teaching point each).\n" +
    "- ONLY set skip_reason (and omit all other fields) if the input needs NO change \u2014 e.g. it is already reflected verbatim, or it is a request to reshape the WHOLE talk (make it shorter/longer/restructured), in which case say: 'that reshapes the whole talk \u2014 say \"shorten\", \"add more detail\", \"restructure\", or \"rewrite\".'\n\n" +
    "Return ONLY the JSON patch object. No markdown fences, no commentary, no preamble. Start with { and end with }.";
  var weaveTrialContext = buildTrialExpansionContext(userMsg, "");
  var contentParts = [{
    type: "text",
    text: "USER REQUEST / PROOFREAD INPUT (may be a short instruction OR a long pasted block of corrected/annotated text \u2014 read it fully and reconcile it against the CURRENT TALK below): " + userMsg + weaveTrialContext +
      "\n\n===== CURRENT TALK (indexed \u2014 use these exact coordinates in your patch) =====\n" + indexedState
  }].concat(buildReferenceParts(S.files));
  // Patches are small (~1500 tokens for generous additions), but cap as high as Sonnet supports
  // so a verbose addition (e.g., a long PDF of refs the user wants fully woven in) never truncates.
  // Also routes refine through Sonnet (was Haiku via default MODEL) — refine is a context-heavy
  // task where Haiku was occasionally dropping bullets. Worth ~$0.02/refine for the bump in
  // reliability. (Jenni 2026-06-10 "increase the cap for refine".)
  var txt = await callAPI(sys, contentParts, 32768, { model: "claude-sonnet-4-6", meterKind: "talk" });
  // Charge-after: the refine model call succeeded (owner billed), so consume 1 talk now.
  if(genUsesFreeTier()){ try{ await consumeFreeTier("talk"); }catch(_){} }
  var patch = JSON.parse(fixJSON(txt));
  // Returns the patch — caller applies it via applyWeavePatch().
  return { kind: "patch", patch: patch };
}

// Deterministic merge of a patch into a talk. Returns { talk, applied, warnings } — does NOT
// mutate the input. Supports surgical ADD / EDIT / DELETE. Edits apply in place; deletes tombstone
// the target; a final compaction pass removes tombstones + deleted sections. This ordering means
// every coordinate the model emitted (add, edit, AND delete) stays valid against the snapshot it
// saw — nothing untargeted can shift or vanish. (Jenni 2026-06-11 audit; surgical ops 2026-06-22.)
function applyWeavePatch(talk, patch){
  var t = JSON.parse(JSON.stringify(talk));
  var applied = { pearls:0, teaching_points:0, summary_points:0, references:0, section_bullets:0, sections:0, edits:0, deletes:0, vmc:0 };
  var warnings = [];
  if(!patch || typeof patch !== "object") return { talk: t, applied: applied, warnings: warnings };

  // ---- SURGICAL EDITS (in place — no length change, all original indices stay valid) ----
  var TOMB = "\u0000__WEAVE_DELETE__";
  function _inSec(i){ return typeof i === "number" && t.sections && t.sections[i] && !t.sections[i]._deleted; }
  if(Array.isArray(patch.edit_section_bullets)){
    patch.edit_section_bullets.forEach(function(e){
      if(!e || typeof e !== "object") return;
      var si=e.section_index, bi=e.bullet_index, nt=e.new_text;
      if(!_inSec(si) || !Array.isArray(t.sections[si].points) || typeof bi!=="number" || bi<0 || bi>=t.sections[si].points.length || typeof nt!=="string" || !nt.trim()){
        warnings.push("Couldn't edit bullet ["+si+"]["+bi+"] — coordinate out of range; left as-is."); return;
      }
      t.sections[si].points[bi]=nt; applied.edits++;
    });
  }
  if(Array.isArray(patch.edit_section_heading)){
    patch.edit_section_heading.forEach(function(e){
      if(e && _inSec(e.section_index) && typeof e.new_heading==="string" && e.new_heading.trim()){ t.sections[e.section_index].heading=e.new_heading; applied.edits++; }
      else warnings.push("Couldn't edit a section heading — bad index.");
    });
  }
  if(Array.isArray(patch.edit_section_pearl)){
    patch.edit_section_pearl.forEach(function(e){ if(e && _inSec(e.section_index) && typeof e.new_text==="string"){ t.sections[e.section_index].teaching_pearl=e.new_text; applied.edits++; } });
  }
  if(Array.isArray(patch.edit_section_board_tip)){
    patch.edit_section_board_tip.forEach(function(e){ if(e && _inSec(e.section_index) && typeof e.new_text==="string"){ t.sections[e.section_index].board_tip=e.new_text; applied.edits++; } });
  }
  function _editList(field, ops){
    if(!Array.isArray(ops)) return;
    ops.forEach(function(e){
      if(!e || typeof e!=="object") return;
      var i=e.index, nt=e.new_text;
      if(Array.isArray(t[field]) && typeof i==="number" && i>=0 && i<t[field].length && typeof nt==="string" && nt.trim()){ t[field][i]=nt; applied.edits++; }
      else warnings.push("Couldn't edit "+field+"["+i+"] — coordinate out of range; left as-is.");
    });
  }
  _editList("board_pearls", patch.edit_pearls);
  _editList("teaching_points", patch.edit_teaching_points);
  _editList("summary_points", patch.edit_summary_points);

  // ---- SURGICAL DELETES (tombstone now; compacted after the ADD pass below) ----
  if(Array.isArray(patch.delete_section_bullets)){
    patch.delete_section_bullets.forEach(function(d){
      if(!d || !_inSec(d.section_index) || !Array.isArray(d.bullet_indices)) return;
      var pts = t.sections[d.section_index].points || [];
      d.bullet_indices.forEach(function(bi){ if(typeof bi==="number" && bi>=0 && bi<pts.length && pts[bi]!==TOMB){ pts[bi]=TOMB; applied.deletes++; } });
    });
  }
  if(Array.isArray(patch.delete_sections)){
    patch.delete_sections.forEach(function(si){ if(_inSec(si) && !t.sections[si]._deleted){ t.sections[si]._deleted=true; applied.deletes++; } });
  }
  function _delList(field, idxs){
    if(!Array.isArray(idxs) || !Array.isArray(t[field])) return;
    idxs.forEach(function(i){ if(typeof i==="number" && i>=0 && i<t[field].length && t[field][i]!==TOMB){ t[field][i]=TOMB; applied.deletes++; } });
  }
  _delList("board_pearls", patch.delete_pearls);
  _delList("teaching_points", patch.delete_teaching_points);
  _delList("summary_points", patch.delete_summary_points);

  // Length budget for concise talks (chars/bullet). Verbose adds trigger a warning so the user
  // can manually tighten them — they're still merged, never dropped. (Jenni 2026-06-11)
  var conciseBudget = (talk._sourceDepth === "concise" || (typeof S !== "undefined" && S && S.depth === "concise")) ? 220 : Infinity;
  var verboseCount = 0;

  function appendList(field, items, counterKey){
    if(!Array.isArray(items) || items.length === 0) return;
    var clean = items.filter(function(x){return x && (typeof x === "string" || typeof x === "object")});
    t[field] = (t[field] || []).concat(clean);
    applied[counterKey] += clean.length;
    if(conciseBudget !== Infinity){
      clean.forEach(function(x){ if(typeof x === "string" && x.length > conciseBudget) verboseCount++; });
    }
  }
  appendList("board_pearls", patch.add_pearls, "pearls");
  appendList("teaching_points", patch.add_teaching_points, "teaching_points");
  appendList("summary_points", patch.add_summary_points, "summary_points");

  if(Array.isArray(patch.add_references) && patch.add_references.length > 0){
    var maxId = (t.references || []).reduce(function(m, r){return Math.max(m, parseInt(r.id) || 0)}, 0);
    t.references = (t.references || []).slice();
    patch.add_references.forEach(function(ref){
      if(!ref || typeof ref !== "object") return;
      maxId++;
      t.references.push(Object.assign({}, ref, {
        id: ref.id || maxId,
        type: ref.type || "user-upload"
      }));
      applied.references++;
    });
  }

  if(Array.isArray(patch.add_section_bullets)){
    var sectionCount = (t.sections || []).length;
    patch.add_section_bullets.forEach(function(addition){
      if(!addition || typeof addition !== "object") return;
      var idx = addition.section_index;
      var bullets = (addition.bullets || []).filter(function(b){return typeof b === "string" && b.trim()});
      if(typeof idx !== "number" || !t.sections || !t.sections[idx]){
        // Silent drop — record a warning so the success message doesn't lie.
        if(bullets.length > 0){
          warnings.push(bullets.length + " bullet" + (bullets.length===1?"":"s") +
            " couldn't be placed — section_index " + idx + " is invalid (talk has " +
            sectionCount + " section" + (sectionCount===1?"":"s") + ", indices 0–" + (sectionCount-1) + ")");
        }
        return;
      }
      if(bullets.length === 0) return;
      t.sections[idx].points = (t.sections[idx].points || []).concat(bullets);
      applied.section_bullets += bullets.length;
      if(conciseBudget !== Infinity){
        bullets.forEach(function(b){ if(b.length > conciseBudget) verboseCount++; });
      }
    });
  }

  if(Array.isArray(patch.add_sections)){
    // Insert highest-position-first so an earlier splice can't shift the after_index of a later one
    // (the model emits after_index against the ORIGINAL array). Append-to-end items (no valid
    // after_index) sort first and stack at the end. (Jenni 2026-06-22: fixes multi-add drift.)
    var _addSecs = patch.add_sections.slice().sort(function(a,b){
      var ai = (a && typeof a.after_index === "number") ? a.after_index : Infinity;
      var bi = (b && typeof b.after_index === "number") ? b.after_index : Infinity;
      return bi - ai;
    });
    _addSecs.forEach(function(newSec){
      if(!newSec || typeof newSec !== "object" || !newSec.heading) return;
      var insertAt;
      if(typeof newSec.after_index === "number" && newSec.after_index >= 0 && newSec.after_index < (t.sections||[]).length){
        insertAt = newSec.after_index + 1;
      } else {
        insertAt = (t.sections || []).length;
      }
      t.sections = t.sections || [];
      var cleanPts = (newSec.points || []).filter(function(p){return typeof p === "string" && p.trim()});
      t.sections.splice(insertAt, 0, {
        heading: String(newSec.heading),
        points: cleanPts,
        teaching_pearl: newSec.teaching_pearl || "",
        board_tip: newSec.board_tip || ""
      });
      applied.sections++;
      if(conciseBudget !== Infinity){
        cleanPts.forEach(function(p){ if(p.length > conciseBudget) verboseCount++; });
      }
    });
  }

  // Visual memory card sync (Jenni 2026-07-03) — apply edit_vmc quadrant patches so the memory card
  // stays consistent with edited content. Only the quadrants the model provided change.
  if(patch.edit_vmc && typeof patch.edit_vmc === "object"){
    t.visual_memory_card = t.visual_memory_card || {};
    ["top_left","top_right","bottom_left","bottom_right"].forEach(function(q){
      if(typeof patch.edit_vmc[q] === "string" && patch.edit_vmc[q].trim()){
        t.visual_memory_card[q] = patch.edit_vmc[q].trim();
        applied.vmc++;
      }
    });
  }

  // Flag verbose bullets so the user knows to manually tighten if they care about concise style.
  if(verboseCount > 0){
    warnings.push(verboseCount + " new bullet" + (verboseCount===1?"":"s") +
      " came back longer than the concise budget (" + conciseBudget + " chars) — they were kept as-is, but you may want to tighten them by hand.");
  }

  // ---- COMPACTION (Jenni 2026-06-22): physically remove tombstoned bullets/points + deleted
  // sections. Runs LAST so the ADD/EDIT passes above could all reference original coordinates. ----
  if(Array.isArray(t.sections)){
    t.sections = t.sections.filter(function(s){ return !(s && s._deleted); });
    t.sections.forEach(function(s){
      if(Array.isArray(s.points)) s.points = s.points.filter(function(b){ return b !== TOMB; });
      if(s && s._deleted !== undefined) delete s._deleted;
    });
  }
  ["board_pearls","teaching_points","summary_points"].forEach(function(f){
    if(Array.isArray(t[f])) t[f] = t[f].filter(function(x){ return x !== TOMB; });
  });

  return { talk: t, applied: applied, warnings: warnings };
}

// Human-readable summary of what ACTUALLY landed — uses the applied counts from applyWeavePatch,
// not the raw patch fields. So silent drops are visible in the confirmation message.
function describeApplied(applied){
  if(!applied) return "no changes";
  var bits = [];
  if(applied.edits) bits.push(applied.edits + " edit" + (applied.edits===1?"":"s"));
  if(applied.deletes) bits.push(applied.deletes + " deletion" + (applied.deletes===1?"":"s"));
  if(applied.pearls) bits.push(applied.pearls + " pearl" + (applied.pearls===1?"":"s"));
  if(applied.teaching_points) bits.push(applied.teaching_points + " teaching point" + (applied.teaching_points===1?"":"s"));
  if(applied.summary_points) bits.push(applied.summary_points + " summary point" + (applied.summary_points===1?"":"s"));
  if(applied.references) bits.push(applied.references + " reference" + (applied.references===1?"":"s"));
  if(applied.section_bullets) bits.push(applied.section_bullets + " bullet" + (applied.section_bullets===1?"":"s"));
  if(applied.sections) bits.push(applied.sections + " new section" + (applied.sections===1?"":"s"));
  return bits.length === 0 ? "no changes" : bits.join(", ");
}

// Legacy alias — keep for any external callers; routes through the new flow.
function describePatchChanges(patch){
  if(!patch) return "no changes";
  // For pre-merge estimation (just looking at the patch JSON), count optimistically.
  var bits = [];
  if(Array.isArray(patch.add_pearls) && patch.add_pearls.length) bits.push(patch.add_pearls.length + " pearl" + (patch.add_pearls.length===1?"":"s"));
  if(Array.isArray(patch.add_teaching_points) && patch.add_teaching_points.length) bits.push(patch.add_teaching_points.length + " teaching point" + (patch.add_teaching_points.length===1?"":"s"));
  if(Array.isArray(patch.add_summary_points) && patch.add_summary_points.length) bits.push(patch.add_summary_points.length + " summary point" + (patch.add_summary_points.length===1?"":"s"));
  if(Array.isArray(patch.add_references) && patch.add_references.length) bits.push(patch.add_references.length + " reference" + (patch.add_references.length===1?"":"s"));
  if(Array.isArray(patch.add_section_bullets)){
    var bb = patch.add_section_bullets.reduce(function(s,a){return s + (Array.isArray(a.bullets) ? a.bullets.length : 0)}, 0);
    if(bb) bits.push(bb + " bullet" + (bb===1?"":"s"));
  }
  if(Array.isArray(patch.add_sections) && patch.add_sections.length) bits.push(patch.add_sections.length + " new section" + (patch.add_sections.length===1?"":"s"));
  return bits.length === 0 ? "no changes" : bits.join(", ");
}

async function sendChat(){
  if(!S.chatIn.trim()||S.chatBusy||S.loading)return;
  var msg=S.chatIn.trim();S.chatIn="";S.reviseIn="";
  // Keep the composer OPEN during the refine so the user can see the working state.
  // It auto-closes only after success or error (see end of weave-path below).
  if(!S.talk){
    // No talk loaded \u2014 interpret the input as a topic.
    S.topic=msg;
    S.msgs.push({r:"u",t:msg});
    S.msgs.push({r:"a",t:'Topic set to "'+msg+'". Tap Generate to start.'});
    render();
    return;
  }

  S.msgs.push({r:"u",t:msg});
  // Additive-intent SHORTCUT (Jenni 2026-06-11): if the user is clearly asking to add specific
  // content ("add the FOURIER trial", "include the SPRINT data", "talk about euvolemia"), skip
  // straight to the weave path even if their phrasing happens to contain words like "more detail"
  // or "split" that would otherwise trip the structural intent detectors. Addition is the most
  // common refine intent \u2014 make sure it always works.
  // AUDIT FIX 2026-06-11: an EXPLICIT compression / expansion intent overrides additive when both
  // fire. Rationale: if the user uses a compression keyword (concise, shorten, trim, condense),
  // that's a deliberate signal \u2014 additive shouldn't silently override it. (Same logic for expansion.)
  var _isAdditiveSignal = isAdditiveIntent(msg) && !isCompressionIntent(msg) && !isExpansionIntent(msg);
  // Surgical-edit / large-paste signal (Jenni 2026-06-22): a long pasted block (e.g. a proofread
  // version from OpenEvidence) OR an explicit fix/correct/replace/delete request goes straight to
  // the weave, which now applies precise add/edit/delete ops. This bypasses the keyword routers
  // (restructure/expand/compress/rewrite) — they're tuned for short commands and would misfire on a
  // long paste (e.g. a paste that happens to contain "shorten" or "rewrite"). Short, explicit
  // "shorten"/"rewrite"/etc. commands are unaffected and still route to their dedicated paths.
  var _isLargePaste = msg.length > 600;
  var _isSurgicalEdit = _isLargePaste || isSurgicalEditIntent(msg);
  // APPLY-PROOFREAD path (Jenni 2026-07-03) \u2014 the user pasted OpenEvidence-style reviewer feedback
  // (or tapped "Apply proofread"). Runs FIRST so a big feedback paste can't be swallowed by the
  // surgical/restructure/compress routers (which is exactly what used to make it a silent no-op).
  var _applyProofread = (S._applyProofreadMode === true) || isProofreadFeedback(msg);
  S._applyProofreadMode = false; // one-shot flag
  if(_applyProofread){
    await applyProofreadFeedback(msg);
    return;
  }
  // Restructure-intent path (Jenni 2026-06-11) \u2014 splits / merges / reorders / renames sections
  // without losing any bullet, fact, or citation. Checked BEFORE expansion/compression because
  // restructure intent words can overlap (e.g. "break this into smaller sections" sounds compressive
  // but is actually structural).
  if(!_isAdditiveSignal && !_isSurgicalEdit && isRestructureIntent(msg)){
    pushTalkHistory("restructure");
    S.chatBusy = true;
    S.msgs.push({r:"a",t:"Restructuring sections \u2014 keeping every bullet, every fact, every citation\u2026"});
    render();
    try{
      var restructured = await restructureTalk(msg);
      if(restructured && restructured.title){
        // Count original bullets + references for the safety check
        var origBullets = 0;
        (S.talk.sections || []).forEach(function(s){ origBullets += (s.points || []).length; });
        var newBullets = 0;
        (restructured.sections || []).forEach(function(s){ newBullets += (s.points || []).length; });
        var origRefCount = (S.talk.references || []).length;
        var newRefCount = (restructured.references || []).length;
        if(newBullets < origBullets){
          S.msgs.push({r:"a",t:"\u26a0 Restructure dropped content ("+origBullets+" \u2192 "+newBullets+" bullets). Keeping the original to protect your work. Try a more specific instruction like \"split the treatment section into pharmacologic and non-pharmacologic\" or \"reorder so workup comes before pathophys.\""});
        } else if(newRefCount < origRefCount){
          S.msgs.push({r:"a",t:"\u26a0 Restructure dropped a reference. Keeping the original. Try a more specific phrasing."});
        } else {
          var origSecCount = (S.talk.sections || []).length;
          var newSecCount = (restructured.sections || []).length;
          S.talk = restructured;
          if(S.dg && S.dg.imgB64) S.visualStale = true;
          else { S.dg = null; S.dgErr = ""; }
          S.podScript = "";
          S.talkIsSaved = false;
          var deltaSec = newSecCount - origSecCount;
          var secMsg = deltaSec === 0 ? "reordered " + newSecCount + " sections"
                      : deltaSec > 0 ? "split into " + newSecCount + " sections (was " + origSecCount + ")"
                      : "merged into " + newSecCount + " sections (was " + origSecCount + ")";
          S.msgs.push({r:"a",t:"\u2713 Restructured \u2014 " + secMsg + ", kept all " + newBullets + " bullets and " + newRefCount + " references."});
        }
      } else {
        S.msgs.push({r:"a",t:"Couldn't parse the restructured version \u2014 your original is intact. Try again."});
      }
    } catch(e){
      S.msgs.push({r:"a",t:"Restructure failed — "+humanizeError(e)+" Your original is intact."});
    }
    S.chatBusy = false;
    S._composerOpen = false;
    render();
    return;
  }
  // Expansion-intent path (Jenni 2026-06-11) \u2014 keeps every section + every existing fact, enriches
  // bullets with mechanism / doses / trial details. Mirror of compression. Listen to the user when
  // they explicitly want more detail.
  if(!_isAdditiveSignal && !_isSurgicalEdit && isExpansionIntent(msg)){
    pushTalkHistory("expand");
    S.chatBusy = true;
    S.msgs.push({r:"a",t:"Deepening each section \u2014 keeping every existing fact, adding mechanism + evidence\u2026"});
    render();
    try{
      var expanded = await expandTalk(msg);
      if(expanded && expanded.title){
        var origSecCount = (S.talk.sections || []).length;
        var newSecCount = (expanded.sections || []).length;
        var origRefCount = (S.talk.references || []).length;
        var newRefCount = (expanded.references || []).length;
        if(newSecCount < origSecCount){
          S.msgs.push({r:"a",t:"\u26a0 Expansion dropped a section ("+origSecCount+" \u2192 "+newSecCount+"). Keeping the original to protect your work. Try \"add more detail to the treatment section\" for a targeted enrichment."});
        } else if(newRefCount < origRefCount){
          S.msgs.push({r:"a",t:"\u26a0 Expansion dropped a reference. Keeping the original. Try again."});
        } else {
          S.talk = expanded;
          if(S.dg && S.dg.imgB64) S.visualStale = true;
          else { S.dg = null; S.dgErr = ""; }
          S.podScript = "";
          S.talkIsSaved = false;
          S.msgs.push({r:"a",t:"\u2713 Expanded \u2014 kept all "+newSecCount+" sections + "+newRefCount+" references"+(newRefCount > origRefCount ? " (+"+(newRefCount-origRefCount)+" new)" : "")+", added depth to existing content."});
        }
      } else {
        S.msgs.push({r:"a",t:"Couldn't parse the expanded version \u2014 your original is intact. Try again."});
      }
    } catch(e){
      S.msgs.push({r:"a",t:"Expansion failed — "+humanizeError(e)+" Your original is intact."});
    }
    S.chatBusy = false;
    S._composerOpen = false;
    render();
    return;
  }
  // Compression-intent path (Jenni 2026-06-11) \u2014 keeps every section + every fact, just tightens
  // phrasing. Distinct from full regenerate (which would start from scratch and lose details) AND
  // from additive weave (which can only add, not shorten).
  if(!_isAdditiveSignal && !_isSurgicalEdit && isCompressionIntent(msg)){
    pushTalkHistory("compress");
    S.chatBusy = true;
    S.msgs.push({r:"a",t:"Tightening phrasing \u2014 keeping every section, every fact, every citation\u2026"});
    render();
    try{
      var compressed = await compressTalk(msg);
      if(compressed && compressed.title){
        // Safety check \u2014 never accept a compressed version that LOST sections or references.
        var origSecCount = (S.talk.sections || []).length;
        var newSecCount = (compressed.sections || []).length;
        var origRefCount = (S.talk.references || []).length;
        var newRefCount = (compressed.references || []).length;
        if(newSecCount < origSecCount){
          S.msgs.push({r:"a",t:"\u26a0 Compression dropped a section ("+origSecCount+" \u2192 "+newSecCount+"). Keeping the original to protect your work. Try a more specific phrasing like \"tighten the treatment section\" or \"shorter bullets, keep all sections.\""});
        } else if(newRefCount < origRefCount){
          S.msgs.push({r:"a",t:"\u26a0 Compression dropped a reference ("+origRefCount+" \u2192 "+newRefCount+"). Keeping the original. Try again or say \"rewrite\" for a full regen."});
        } else {
          S.talk = compressed;
          if(S.dg && S.dg.imgB64) S.visualStale = true;
          else { S.dg = null; S.dgErr = ""; }
          S.podScript = "";
          S.talkIsSaved = false;
          S.msgs.push({r:"a",t:"\u2713 Tightened \u2014 kept all "+newSecCount+" sections + "+newRefCount+" references. Say \"rewrite\" if you wanted a fuller change."});
        }
      } else {
        S.msgs.push({r:"a",t:"Couldn't parse the compressed version \u2014 your original is intact. Try again or say \"rewrite\"."});
      }
    } catch(e){
      S.msgs.push({r:"a",t:"Compression failed — "+humanizeError(e)+" Your original is intact."});
    }
    S.chatBusy = false;
    S._composerOpen = false;
    render();
    return;
  }
  if(!_isSurgicalEdit && isRadicalRevision(msg)){
    // User signalled they want a fresh take \u2014 full regenerate path (RAG + peer review + everything).
    pushTalkHistory("rewrite"); // snapshot for undo
    S.refineContext = (S.refineContext && S.refineContext.trim() ? S.refineContext.trim() + "\n\nAlso: " : "") + msg;
    S.msgs.push({r:"a",t:"Regenerating the lesson from scratch with your direction\u2026"});
    render();
    generate();
    return;
  }

  // Default \u2014 surgical weave. Edit, add, or delete the targeted content; everything else is preserved.
  // (Jenni 2026-06-22: now supports editing/deleting bullets, not just adding \u2014 for OpenEvidence proofread paste-back.)
  pushTalkHistory("refine"); // snapshot for undo
  S.chatBusy=true;
  S.msgs.push({r:"a",t:"Reading your notes and editing the lesson surgically (everything else stays put)\u2026"});
  render();
  try{
    // weaveRevision now returns { kind: "patch", patch }. Existing content is preserved by applyWeavePatch.
    var result = await weaveRevision(msg);
    var patch = result && result.patch;
    if(patch && typeof patch === "object"){
      if(patch.skip_reason){
        S.msgs.push({r:"a",t:"\u2139\ufe0f No changes \u2014 " + patch.skip_reason + ". Try naming the section or pasting the exact text to fix, or say \"rewrite\" for a full regenerate."});
      } else {
        // applyWeavePatch returns { talk, applied, warnings } \u2014 applied is the ACTUAL merge counts,
        // not the optimistic patch field counts. So if the model wrote a bad section_index, the
        // success message reflects what really landed. (Jenni 2026-06-11 audit fix.)
        var merge = applyWeavePatch(S.talk, patch);
        var changes = describeApplied(merge.applied);
        if(changes === "no changes"){
          var warnMsg = (merge.warnings && merge.warnings.length) ? " \u2014 " + merge.warnings.join("; ") : "";
          S.msgs.push({r:"a",t:"\u2139\ufe0f Nothing landed" + warnMsg + ". Try a more specific phrasing or say \"rewrite\" for a full regenerate."});
        } else {
          S.talk = merge.talk;
          // VMC staleness (Jenni 2026-07-03): if the refine changed content but the model didn't
          // update the memory card, flag it so the reader knows the card may lag the latest edits.
          // An explicit VMC edit clears the flag.
          if(merge.applied && merge.applied.vmc > 0) S.vmcStale = false;
          else if(changes !== "no changes") S.vmcStale = true;
          if(S.dg && S.dg.imgB64) S.visualStale = true;
          else { S.dg = null; S.dgErr = ""; }
          S.podScript = "";
          S.talkIsSaved = false;
          var warnSuffix = (merge.warnings && merge.warnings.length) ? "\n\n\u26a0 " + merge.warnings.join("\n\u26a0 ") : "";
          S.msgs.push({r:"a",t:"\u2713 Applied " + changes + ". Everything else untouched \u2014 tap Undo to revert." + warnSuffix});
        }
      }
      S._composerOpen = false;
    } else {
      S.msgs.push({r:"a",t:"Couldn't parse the update \u2014 try again, or say \"rewrite\" for a full regenerate."});
    }
  } catch(e){
    S.msgs.push({r:"a",t:"Refine failed — "+humanizeError(e)+" Or say \"rewrite\" for a full regenerate."});
  }
  S.chatBusy=false;render();
}

async function genPodcast(){
  if(!S.talk||S.podBusy)return;S.podBusy=true;render();
  try{
    var c="";
    if(S.talk.sections){c="Title: "+S.talk.title+"\n";var ss=S.talk.sections;for(var i=0;i<ss.length;i++)c+="Section: "+ss[i].heading+". "+((ss[i].points||[]).join(". "))+". Pearl: "+(ss[i].teaching_pearl||"")+"\n";c+="Takeaways: "+(S.talk.summary_points||[]).join(". ")}
    else if(S.talk.question){c="Title: "+S.talk.title+"\nQ: "+S.talk.question.stem+"\nAnswer: "+S.talk.question.correct_letter+". "+S.talk.question.explanation+"\nPearls: "+(S.talk.board_pearls||[]).join(". ")}
    var txt=await callAPI("Convert to a 1-2 min conversational podcast for internal medicine doctors. Warm, plain text only.",c,1500);
    S.podScript=txt.trim();
  }catch(e){S.podScript="Error: "+e.message}
  S.podBusy=false;render();
}

function playPod(){
  if(!S.podScript)return;
  if(S.podPlaying){speechSynthesis.cancel();S.podPlaying=false;render();return}
  var u=new SpeechSynthesisUtterance(S.podScript);u.rate=S.podRate;u.pitch=1;
  u.onend=function(){S.podPlaying=false;render()};
  speechSynthesis.cancel();speechSynthesis.speak(u);S.podPlaying=true;render();
}

// A user's public portfolio: #u/<handle> → look up the curator (safe fields only) + their featured
// lectures. Renders through renderShowcase with a profile header. (Jenni 2026-07)
function loadFromUserProfileHash(){
  try{
    var hash = window.location.hash || "";
    var m = hash.match(/^#u\/([A-Za-z0-9_]{1,40})$/);
    if(!m) return false;
    var handle = m[1];
    history.replaceState(null,"",window.location.pathname+window.location.search);
    S.showcase = true; S.showcaseLoading = true; S.showcaseProfile = null; S.showcaseCuratorId = null; S.showcaseTalks = [];
    if(typeof render === "function") render();
    (async function(){
      try{
        var pr = window.sb ? await window.sb.rpc("get_public_profile", {p_handle:handle}) : {data:null};
        var row = (pr && pr.data && pr.data[0]) ? pr.data[0] : null;
        if(!row){
          S.showcaseProfile = {notFound:true, handle:handle}; S.showcaseTalks = []; S.showcaseLoading = false;
          if(typeof render === "function") render(); return;
        }
        S.showcaseProfile = { handle:row.handle, name:row.display_name, role:row.role, specialty:row.specialty };
        S.showcaseCuratorId = row.user_id;
        S.showcaseTalks = await loadShowcaseTalks(null, row.user_id);
        S.showcaseLoading = false;
        if(typeof render === "function") render();
      }catch(e){ console.error("loadFromUserProfileHash", e); S.showcaseLoading = false; if(typeof render==="function") render(); }
    })();
    return true;
  }catch(e){ console.error("loadFromUserProfileHash failed:", e); }
  return false;
}

// Library deep-link: when a new tab opens with #t=<id> or #s=<slug>, load that talk directly.
// Samples load immediately. Saved-talk loads must wait for Supabase auth to restore (otherwise
// the cloud lookup runs before S.user is populated and silently falls through to localStorage).
window._pendingHashLoad = null; // {kind:"saved"|"sample", id} — drained when ready
function loadFromLibHash(){
  try{
    var hash = window.location.hash || "";
    var mSaved = hash.match(/^#t=(.+)$/);
    var mSample = hash.match(/^#s=(.+)$/);
    if(mSaved){
      var id = decodeURIComponent(mSaved[1]);
      history.replaceState(null,"",window.location.pathname+window.location.search);
      window._pendingHashLoad = { kind:"saved", id:id };
      // Local-only talks have a "t_" prefix and don't need auth — drain right away.
      if(String(id).startsWith("t_")){ drainPendingHashLoad(); }
      return true;
    }
    if(mSample){
      var slug = decodeURIComponent(mSample[1]);
      history.replaceState(null,"",window.location.pathname+window.location.search);
      // Samples are bundled JSON, no auth needed — load immediately.
      setTimeout(function(){ loadSample(slug) }, 50);
      return true;
    }
  }catch(e){console.error("loadFromLibHash failed:",e)}
  return false;
}
// Drain the pending hash load. Called: (a) immediately for local talks / no auth needed,
// (b) after Supabase getSession() resolves (so S.user is populated for cloud talks).
function drainPendingHashLoad(){
  if(!window._pendingHashLoad)return;
  var pending = window._pendingHashLoad;
  window._pendingHashLoad = null;
  if(pending.kind === "saved"){
    S.loadingFromHash = true;
    if(typeof render === "function") render();
    loadSavedTalk(pending.id);
  }
}

async function downloadVMC(){
  if(!S.talk)return;
  // Auto-expand VMC if collapsed, then wait one frame for render
  // vmcCard is rendered unconditionally when a talk is loaded; no need to toggle a flag.
  var vmc=document.getElementById("vmcCard");
  if(!vmc){S.savedFlash="VMC card not on page yet \u2014 try again.";render();setTimeout(function(){S.savedFlash="";render()},3000);return}
  if(typeof html2canvas==="undefined"){S.savedFlash="Image library still loading. Try again in a moment.";render();setTimeout(function(){S.savedFlash="";render()},3000);return}
  S.savedFlash="\u{1F4F8} Generating image...";render();
  var slug=(S.talk.title||"chalk-talk").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60);
  function triggerDownload(href,revoke){
    var a=document.createElement("a");
    a.href=href;
    a.download="vmc-"+slug+".jpg";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if(revoke)setTimeout(function(){URL.revokeObjectURL(href)},5000);
    S.savedFlash="\u2713 Image downloaded! Great for Twitter or slides.";render();
    setTimeout(function(){S.savedFlash="";render()},3500);
  }
  try{
    var canvas=await html2canvas(vmc,{scale:2,backgroundColor:"#330662",useCORS:true,logging:false,allowTaint:true});
    // JPEG @0.92 \u2014 smaller files, visually lossless for poster content. (Jenni 2026-06-08)
    if(canvas.toBlob){
      canvas.toBlob(function(blob){
        if(!blob){
          // toBlob returned null (some Safari builds) \u2014 fall back to data URL
          try{triggerDownload(canvas.toDataURL("image/jpeg",0.92),false)}
          catch(e2){S.savedFlash="Image generation failed: "+e2.message;render();setTimeout(function(){S.savedFlash="";render()},4500)}
        }else{
          triggerDownload(URL.createObjectURL(blob),true);
        }
      },"image/jpeg",0.92);
    }else{
      // toBlob unsupported \u2014 straight to data URL
      triggerDownload(canvas.toDataURL("image/jpeg",0.92),false);
    }
  }catch(e){
    console.error("downloadVMC error",e);
    S.savedFlash="Couldn't generate image: "+(e.message||"unknown error");render();
    setTimeout(function(){S.savedFlash="";render()},4500);
  }
}

// Copy a boards question. mode="stem" copies just stem+choices (good to send a learner without
// giving away the answer). mode="full" copies stem+choices+answer+explanation+wrong-answer rationales
// (good for self-study, printing, or sending complete review material).
function copyBoardsQuestion(mode){
  if(!S.talk||!S.talk.question)return;
  var q=S.talk.question;
  mode=mode||"stem";
  var lines=[];
  if(S.talk.title)lines.push(S.talk.title);
  lines.push("");
  lines.push(String(q.stem||""));
  lines.push("");
  (q.choices||[]).forEach(function(ch){lines.push(ch.letter+". "+ch.text)});
  if(mode==="full"){
    lines.push("");
    lines.push("ANSWER: "+(q.correct_letter||""));
    if(q.explanation){lines.push("");lines.push(String(q.explanation))}
    if(S.talk.key_point&&String(S.talk.key_point).trim()){lines.push("");lines.push("KEY POINT: "+String(S.talk.key_point))}
    if((q.wrong_explanations||[]).length){
      lines.push("");lines.push("Why other answers are wrong:");
      q.wrong_explanations.forEach(function(w){lines.push(w.letter+". "+w.why)});
    }
    var pearls=(S.talk.board_pearls||[]).filter(function(p){return p&&String(p).trim().length>0});
    if(pearls.length){lines.push("");lines.push("Board pearls:");pearls.forEach(function(p,i){lines.push((i+1)+". "+p)})}
  } else {
    lines.push("");lines.push("(Answer + explanation withheld \u2014 send this version to a learner.)");
  }
  var text=lines.join("\n");
  var doneMsg=mode==="full"?"\u2713 Full question + answer + explanation copied":"\u2713 Question + choices copied (no answer)";
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      S.savedFlash=doneMsg;render();
      setTimeout(function(){S.savedFlash="";render()},2800);
    }).catch(function(){
      prompt("Couldn't auto-copy. Select and copy manually:",text);
    });
  } else {
    prompt("Copy this question:",text);
  }
}

// Shared guard for any in-tab action that would replace the current talk (new talk, opening a

// safeResetAll condition: only warns for a real, unsaved, non-sample talk. (Jenni 2026-06-22:

function confirmDiscardUnsaved(){
  if(S.talk && !S.isSampleTalk && !S.sharedTalk && !S.talkIsSaved){

// Browser-level safety net: warn before a tab close / reload / external nav drops an unsaved talk.
// Native dialog (message text is ignored by modern browsers; presence of returnValue triggers it).

// ═══════════ DIAGRAM SVG ═══════════
function diagSVG(dg){
  if(!dg||!dg.nodes||!dg.nodes.length)return"";
  var W=860,H=540,P=60,pos={};
  for(var i=0;i<dg.nodes.length;i++){
    var n=dg.nodes[i];
    var nx=Math.max(0,Math.min(1,n.x!=null?n.x:0.5));
    var ny=Math.max(0,Math.min(1,n.y!=null?n.y:0.5));
    pos[n.id]={px:P+nx*(W-P*2),py:P+ny*(H-P*2),label:n.label||"",type:n.type||"box"};
  }
  // Polished medical color palette
  var C={
    title:   {grad:["#4a1a7a","#702b9d"], s:"#ab82c5", t:"#fff",     z:16, w:2.5},
    accent:  {grad:["#5a2580","#8a3eb5"], s:"#c4a3da", t:"#fff",     z:13, w:2},
    formula: {grad:["#2a4a8a","#4a6db8"], s:"#9bb8e0", t:"#dde7f7",  z:13, w:2},
    warning: {grad:["#8a2828","#c84545"], s:"#e8a8a8", t:"#fff5f5",  z:13, w:2},
    box:     {grad:["#3a3450","#4d4666"], s:"#a09cb4", t:"#e8e6f0",  z:13, w:1.5}
  };
  var defs='<defs>';
  var types=Object.keys(C);
  for(var ti=0;ti<types.length;ti++){
    var ct=C[types[ti]];
    defs+='<linearGradient id="g_'+types[ti]+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+ct.grad[0]+'"/><stop offset="100%" stop-color="'+ct.grad[1]+'"/></linearGradient>';
  }
  defs+='<marker id="da" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto"><polygon points="0 0,12 4.5,0 9" fill="#c4a3da"/></marker>';
  defs+='<filter id="ds" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="3"/><feOffset dx="0" dy="2" result="offsetblur"/><feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>';
  defs+='</defs>';
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">'+defs;
  svg+='<rect width="'+W+'" height="'+H+'" fill="none"/>';
  // curved arrows
  var arrs=dg.arrows||[];
  for(var ai=0;ai<arrs.length;ai++){
    var a=arrs[ai],fr=pos[a.from],to=pos[a.to];
    if(!fr||!to)continue;
    var dx=to.px-fr.px, dy=to.py-fr.py, d=Math.sqrt(dx*dx+dy*dy);
    if(d<5)continue;
    var ux=dx/d, uy=dy/d;
    var startX=fr.px+ux*48, startY=fr.py+uy*30;
    var endX=to.px-ux*48, endY=to.py-uy*30;
    var midX=(startX+endX)/2, midY=(startY+endY)/2;
    var perpX=-uy, perpY=ux;
    var curveAmount=Math.min(d*0.15, 35);
    var c1x=startX+perpX*curveAmount*0.5, c1y=startY+perpY*curveAmount*0.5;
    var c2x=endX+perpX*curveAmount*0.5, c2y=endY+perpY*curveAmount*0.5;
    svg+='<path d="M '+startX+' '+startY+' C '+c1x+' '+c1y+' '+c2x+' '+c2y+' '+endX+' '+endY+'" stroke="rgba(196,163,218,0.7)" stroke-width="2.2" fill="none" marker-end="url(#da)"/>';
    if(a.label){
      var lx=midX+perpX*curveAmount*0.4, ly=midY+perpY*curveAmount*0.4;
      var lblW=a.label.length*7+14;
      svg+='<rect x="'+(lx-lblW/2)+'" y="'+(ly-11)+'" width="'+lblW+'" height="22" rx="11" fill="#2d2a3e" stroke="rgba(196,163,218,0.5)" stroke-width="1"/>';
      svg+='<text x="'+lx+'" y="'+(ly+4)+'" text-anchor="middle" fill="#d4baea" font-size="11" font-weight="500">'+esc(a.label)+'</text>';
    }
  }
  // nodes
  for(var ni=0;ni<dg.nodes.length;ni++){
    var nd=dg.nodes[ni], p=pos[nd.id], lb=p.label;
    var c=C[p.type]||C.box;
    var maxLen=nd.type==="title"?22:18;
    var ln=wrapText(lb,maxLen);
    var fontWeight=nd.type==="title"?700:nd.type==="accent"?600:550;
    var fontSize=c.z;
    var bw=Math.max(lb.length*(nd.type==="title"?9:7.2)+44, 110);
    var bh=(nd.type==="title"?52:42)+(ln.length-1)*19;
    var rx=nd.type==="title"?14:11;
    svg+='<g filter="url(#ds)">';
    svg+='<rect x="'+(p.px-bw/2)+'" y="'+(p.py-bh/2)+'" width="'+bw+'" height="'+bh+'" rx="'+rx+'" fill="url(#g_'+(C[p.type]?p.type:"box")+')" stroke="'+c.s+'" stroke-width="'+c.w+'"'+(nd.type==="formula"?' stroke-dasharray="6,3"':"")+'/>';
    for(var tl=0;tl<ln.length;tl++){
      var ty=p.py+5+tl*19-(ln.length-1)*9.5;
      svg+='<text x="'+p.px+'" y="'+ty+'" text-anchor="middle" fill="'+c.t+'" font-size="'+fontSize+'" font-weight="'+fontWeight+'" letter-spacing="0.2">'+esc(ln[tl])+'</text>';
    }
    svg+='</g>';
  }
  return svg+"</svg>";
}

      var isCited = pmid && citedSet[pmid];
      var authorsRaw = (c.authors || '').split(',').slice(0, 2).map(function(s){return s.trim()}).join(', ');
      if (c.authors && c.authors.split(',').length > 2) authorsRaw += ' et al.';

      if (rcr && rcr > 1) out += '<span class="rag-pill rag-pill-rcr">RCR ' + rcr.toFixed(1) + '</span>';
      if (isCited) out += '<span class="rag-pill rag-pill-cited">✓ Cited</span>';

      out += '</div>';
    }

  }
  out += '</div>';
  return out;
}

function linkifyPMIDs(root) {
  if (!root) return;
  var re = /\bPMID:?\s*(\d{6,9})\b/g;
  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node) {
      if (!node.parentNode) return NodeFilter.FILTER_REJECT;
      var p = node.parentNode;
      if (p.tagName === 'A') return NodeFilter.FILTER_REJECT;
      if (p.tagName === 'SCRIPT' || p.tagName === 'STYLE') return NodeFilter.FILTER_REJECT;
      if (p.classList && p.classList.contains('pmid-pill')) return NodeFilter.FILTER_REJECT;
      return re.test(node.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  var nodes = [];
  var node;
  while ((node = walker.nextNode())) nodes.push(node);
  for (var ni = 0; ni < nodes.length; ni++) {
    var n = nodes[ni];
    re.lastIndex = 0;
    var html = n.nodeValue.replace(re, function(m, pmid){
      return '<a href="https://pubmed.ncbi.nlm.nih.gov/' + pmid + '/" target="_blank" rel="noopener" class="pmid-pill">PMID ' + pmid + '</a>';
    });
    var wrap = document.createElement('span');
    wrap.innerHTML = html;
    if (n.parentNode) n.parentNode.replaceChild(wrap, n);
  }
}

// Focus/caret/scroll-preserving wrapper (Jenni 2026-07-03 quality fix #2). The app rebuilds the
// whole DOM on every render(), which otherwise drops the focused input and its caret whenever a
// BACKGROUND render fires while you're typing (loading-timer tick, free-tier poll, citation audit,
// etc.). Capture focus + selection before the rebuild and restore it after. Scroll is only restored
// if the rebuild moved it unexpectedly, so intentional scrollTo() calls by handlers still win.
function render(){
  var active = document.activeElement;
  var focusId = (active && active.id) ? active.id : null;
  var selStart = null, selEnd = null;
  if(focusId && active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")){
    try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(_){}
  }
  var scrollY = window.scrollY;
  _renderInner();
  if(focusId){
    var el = document.getElementById(focusId);
    if(el && el !== document.activeElement){
      try{ el.focus({preventScroll:true}); }catch(_){ try{ el.focus(); }catch(__){} }
      if(selStart != null && (el.tagName === "INPUT" || el.tagName === "TEXTAREA")){
        try{ el.setSelectionRange(selStart, selEnd); }catch(_){}
      }
    }
  }
  if(Math.abs(window.scrollY - scrollY) > 2) window.scrollTo(0, scrollY);
}

  return h;
}

function bindShowcase(){
  var back = document.getElementById("showcaseBackBtn");
  if(back) back.onclick = function(){
    S.showcase = false;
    render();
  };
  var copy = document.getElementById("showcaseCopyLinkBtn");
  if(copy) copy.onclick = function(){
    // A user portfolio copies its #u/<handle> URL; the owner #showcase copies the showcase URL.
    var url = (S.showcaseProfile && S.showcaseProfile.handle)
      ? (window.location.origin + window.location.pathname + "#u/" + S.showcaseProfile.handle)
      : showcaseURL();
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){
        copy.textContent = "✓ Link copied";
        setTimeout(function(){ copy.textContent = "📋 Copy this page link" }, 1800);
      }).catch(function(){ prompt("Copy this URL to share the showcase:", url) });
    } else { prompt("Copy this URL to share the showcase:", url) }
  };
  // Card click — intercept to use hash navigation (preserves SPA behavior on direct anchor click)
  document.querySelectorAll(".showcaseCard").forEach(function(a){
    a.onclick = function(e){
      e.preventDefault();
      var token = a.dataset.token;
      if(!token) return;
      S.showcase = false;
      // Load the public talk via the existing token path so the public-viewer UI kicks in
      loadPublicTalkByToken(token);
    };
  });
}

// ═══════════ EXAMPLES (DEMO MODE) ═══════════
// Pick the right version for a dual-version sample. Hero default = concise.
// Sample schema:
//   { slug, topic, style, specialty, generated_at, guideline_sources,
//     talk_concise: <json>, talk_detailed: <json>, talk: <legacy single-version fallback> }
function pickSampleTalk(s, depth){
  if(!s) return null;
  var d = depth || "concise";
  if(d === "detailed" && s.talk_detailed) return s.talk_detailed;
  if(d === "concise"  && s.talk_concise)  return s.talk_concise;
  // Fallbacks if the requested version doesn't exist
  return s.talk_concise || s.talk_detailed || s.talk || null;
}

function loadSample(slug, depth){
  if(!SAMPLES||!SAMPLES.length)return;
  // Guard unsaved work before a sample replaces it. Depth-flips pass a `depth` arg and the current
  // talk is itself a sample (excluded by confirmDiscardUnsaved), so those never prompt. (Jenni 2026-06-22)
  if(!confirmDiscardUnsaved())return;
  var s=null;for(var i=0;i<SAMPLES.length;i++){if(SAMPLES[i].slug===slug){s=SAMPLES[i];break}}
  if(!s)return;
  // Determine which depth version was actually picked (handles fallback when requested version is missing).
  var chosen = pickSampleTalk(s, depth);
  if(!chosen) return;
  var actualDepth = "concise";
  if(s.talk_detailed && chosen === s.talk_detailed) actualDepth = "detailed";
  else if(s.talk_concise && chosen === s.talk_concise) actualDepth = "concise";
  // Otherwise it's the legacy single-version `talk` — we can't tell, default to concise.
  S.talk=chosen; S.topic=s.topic; S.style=s.style||"lecture"; S.depth=actualDepth;
  S.isSampleTalk=true; S.sampleSlug=s.slug; S.sharedTalk=false;
  S.sec=0;S.dg=null;S.dgErr="";S.podScript="";S.podPlaying=false;S.podShow=false;
  S.showAns=false;S.userPick="";
  S.msgs=[];S.error="";
  if(s.guideline_sources&&s.guideline_sources.length){
    S.glRef={specialties:[s.specialty||""],context:"",sources:s.guideline_sources,trials:[],conferences:[]};
  } else { S.glRef=null; }
  S.showSaved=false; // exit Library view if open
  speechSynthesis.cancel();
  render();
  var ts=document.getElementById("talkStart");
  if(ts)ts.scrollIntoView({behavior:"smooth",block:"start"});
  else window.scrollTo({top:0,behavior:"smooth"});
}

  var saved=getDisplayLibrary();

    var resolvedSpec = inferSpecialty(e.topic, et, normalizeSpec(e._specialtyOverride));

  all.forEach(function(x){ x._hasVisuals = !!(x.talk && (x.talk._hasCloudVisuals || (x.talk.savedVisuals && x.talk.savedVisuals.length))); });
  // Tab filter \u2014 Lectures | Boards | Visuals (Jenni 2026-06-04 \u2014 removed "All", default to Lectures).

  // Specialty filter (applied after tab, before search)

  // Search filter

  if(S.savedSearch.trim()){var q=S.savedSearch.toLowerCase();filtered=byProfile.filter(function(x){return(x.topic||"").toLowerCase().indexOf(q)>=0||(x.talk&&x.talk.title||"").toLowerCase().indexOf(q)>=0||(x.specialty||"").toLowerCase().indexOf(q)>=0})}
  // Counts base: current tab + search (ignore active spec filter so other spec counts stay meaningful).
  var byTabSearched = byTab;

  var profileCount = byTabSearched.filter(onProfileFn).length;

  // Counts per tab (after search, before tab) \u2014 used in the tab pills
  var searchOnly=all;
  if(S.savedSearch.trim()){var q2=S.savedSearch.toLowerCase();searchOnly=all.filter(function(x){return(x.topic||"").toLowerCase().indexOf(q2)>=0||(x.talk&&x.talk.title||"").toLowerCase().indexOf(q2)>=0||(x.specialty||"").toLowerCase().indexOf(q2)>=0})}
  var cAll=searchOnly.length, cLec=searchOnly.filter(function(x){return x._kind==="lecture"}).length, cBrd=searchOnly.filter(function(x){return x._kind==="boards"}).length, cVis=searchOnly.filter(function(x){return x._hasVisuals}).length;
  // Header
  var h='<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px"><button id="savedBack" style="background:#fff;border:1px solid #e2dfe8;border-radius:8px;padding:8px 14px;color:#6b6780;font-size:13px;cursor:pointer">\u2190 Back</button><h2 style="font-family:Georgia,serif;font-size:22px;font-weight:700;color:var(--plum-deep);margin:0;flex:1;letter-spacing:-0.01em">\uD83D\uDCDA Library</h2></div>';
  // Tab strip \u2014 Lectures | Boards | Visuals (segmented, no All \u2014 Jenni 2026-06-04)
  function tabBtn(key,label,count){var on=(tab===key);return '<button class="libTabBtn" data-tab="'+key+'" style="flex:1;min-width:0;background:'+(on?"#fff":"transparent")+';color:'+(on?"var(--plum-deep)":"var(--ink-muted)")+';border:'+(on?"1px solid var(--line)":"1px solid transparent")+';border-radius:10px;padding:9px 10px;font-size:13px;font-weight:'+(on?"600":"500")+';cursor:pointer;box-shadow:'+(on?"var(--shadow-soft)":"none")+';display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s ease">'+label+' <span style="color:'+(on?"var(--ink-muted)":"var(--ink-soft)")+';font-size:11px;font-weight:500">'+count+'</span></button>'}
  h+='<div style="display:flex;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow-soft);margin-bottom:14px">';

    h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;padding:6px 10px;background:var(--lavender-bg);border-radius:8px;font-size:11.5px"><span style="color:var(--ink)"><b style="color:var(--plum-deep)">Showing '+_showLbl+'</b> \u00B7 '+filtered.length+' '+(filtered.length===1?"item":"items")+'</span><button id="libSpecClearBtn" style="background:none;border:none;color:var(--plum);font-size:11.5px;font-weight:600;cursor:pointer;padding:2px 6px;border-radius:6px">\u00D7 Clear</button></div>';

  h+='<div style="display:flex;gap:8px;margin-bottom:14px;justify-content:flex-end"><button id="exportLibBtn" style="background:#fff;border:1px solid #e2dfe8;border-radius:8px;padding:7px 12px;color:#702b9d;font-size:11.5px;font-weight:600;cursor:pointer">\u2B07 Export</button><button id="importLibBtn" style="background:#fff;border:1px solid #e2dfe8;border-radius:8px;padding:7px 12px;color:#702b9d;font-size:11.5px;font-weight:600;cursor:pointer">\u2B06 Import</button><input type="file" id="importLibInput" accept=".json" style="display:none"></div>';
  // Group filtered items by specialty, render in canonical order (SPEC_ORDER).

  } else {

    // first, else newest-first by date. Applies to both the flat (filtered) view and each spec group.
    var _libCmp = function(a,b){ return libSortKey(a._sortOrder, a.savedAt) - libSortKey(b._sortOrder, b.savedAt); };
    if(S.libSpec){
      // Specialty filter is active \u2014 flat list, no section headers (they'd just repeat the filter label).
      h+='<div class="libSortGroup" data-libspec="'+esc(S.libSpec)+'">';
      filtered.slice().sort(_libCmp).forEach(function(it){ h += renderLibCard(it); });
      h+='</div>';
    } else {
      // No specialty filter \u2014 group + render section headers in canonical order.
      var bySpecGroup={};
      for(var fi=0;fi<filtered.length;fi++){var sp=filtered[fi]._spec||"Other";if(!bySpecGroup[sp])bySpecGroup[sp]=[];bySpecGroup[sp].push(filtered[fi])}
      for(var oi=0;oi<SPEC_ORDER.length;oi++){
        var specName=SPEC_ORDER[oi];var items=bySpecGroup[specName];if(!items||items.length===0)continue;
        items.sort(_libCmp);
        var icon=SPEC_ICONS[specName]||"\uD83D\uDCDA";
        // Section header (also acts as a quick filter \u2014 tap to jump into that specialty)
        h+='<button class="libSpecHeaderBtn" data-spec="'+esc(specName)+'" style="width:100%;display:flex;align-items:baseline;gap:8px;margin:18px 0 8px;padding:0 4px 6px;border:none;border-bottom:1px solid var(--line-soft);background:none;cursor:pointer;text-align:left">';
        h+='<span style="font-size:14px;color:var(--plum)">'+icon+'</span>';
        h+='<span style="font-family:Georgia,serif;font-size:15px;font-weight:700;color:var(--plum-deep);letter-spacing:-0.005em">'+esc(specName)+'</span>';
        h+='<span style="font-size:11px;color:var(--ink-muted);font-weight:500">'+items.length+'</span>';
        h+='</button>';
        h+='<div class="libSortGroup" data-libspec="'+esc(specName)+'">';
        for(var ci=0;ci<items.length;ci++){ h += renderLibCard(items[ci]); }
        h+='</div>';
      }
    }
    // (The defensive "unknown specialty" branch was deleted \u2014 inferSpecialty now
    // canonicalizes to SPEC_ORDER, so the main loop above is exhaustive.)
  }
  return h;
}

// Library drag-to-reorder via SortableJS (Codex 2026-07). The hand-rolled versions felt like
// "click → teleport"; SortableJS gives standard smooth drag + ghost + animated placeholder + touch,
// with zero build step. Each specialty section is its own Sortable in a shared group, so you can drag
// within a section OR across sections (which recategorizes the talk). Grab the ⠿ handle. Persistence
// (midpoint sort_order + specialty_override) is computed in _commitSortableLibraryReorder.
function bindLibraryReorder(){
  // SortableJS is CDN-loaded with `defer`, so it may not be ready when the library first renders.
  // Retry until it arrives (bounded by the user staying on the library) so drag never stays dead. (audit)
  if(!window.Sortable){ setTimeout(function(){ if(typeof S!=="undefined" && S.showSaved) bindLibraryReorder(); }, 300); return; }
  document.querySelectorAll(".libSortGroup").forEach(function(groupEl){
    if(groupEl._sortableBound) return;   // guard against double-init on re-render
    groupEl._sortableBound = true;
    Sortable.create(groupEl, {
      group: "chalkTalkLibrary",
      animation: 180,
      easing: "cubic-bezier(.2,.8,.2,1)",
      handle: ".libDragHandle",
      draggable: '.libCard[data-reorderable="1"]',
      ghostClass: "lib-sort-ghost",
      chosenClass: "lib-sort-chosen",
      dragClass: "lib-sort-drag",
      forceFallback: true,
      fallbackOnBody: true,
      scroll: true,
      bubbleScroll: true,
      onStart: function(){ document.body.classList.add("lib-is-reordering"); },
      onEnd: function(evt){
        document.body.classList.remove("lib-is-reordering");
        if(!evt || !evt.item) return;
        _commitSortableLibraryReorder(evt.item, evt.from, evt.to);
      }
    });
  });
}

// Persist a SortableJS drop: read the card's new neighbors within its target group, compute a midpoint
// sort_order, and recategorize if it landed in a different specialty section.
async function _commitSortableLibraryReorder(item, fromGroup, toGroup){
  var fromId = item && item.dataset && item.dataset.libid;
  if(!fromId) return;
  var origSpec = (fromGroup && fromGroup.dataset && fromGroup.dataset.libspec) || item.dataset.libspec || "Other";
  var newSpec  = (toGroup && toGroup.dataset && toGroup.dataset.libspec) || origSpec;
  var cards = Array.prototype.slice.call(toGroup.querySelectorAll('.libCard[data-reorderable="1"]'));
  var idx = cards.indexOf(item);
  if(idx < 0) return;
  var prev = idx > 0 ? cards[idx-1] : null;
  var next = idx < cards.length-1 ? cards[idx+1] : null;
  var prevKey = prev ? _libKeyOf(prev.dataset.libid) : null;
  var nextKey = next ? _libKeyOf(next.dataset.libid) : null;
  var newKey;
  if(prevKey==null && nextKey==null) newKey = -Date.now();
  else if(prevKey==null) newKey = nextKey - 1e6;
  else if(nextKey==null) newKey = prevKey + 1e6;
  else newKey = (prevKey + nextKey) / 2;
  // Check that the DB writes actually landed — otherwise the drop only "sticks" optimistically and a
  // refresh silently loses it. On failure, reload from the server to reconcile the UI. (Codex #2 fix)
  var specOk = true;
  if(newSpec && newSpec !== origSpec && typeof cloudSetSpecialtyOverride === "function"){
    specOk = !!(await cloudSetSpecialtyOverride(fromId, newSpec));   // recategorize to the dropped section
  }
  var sortOk = await cloudSetSortOrder(fromId, newKey);
  if(specOk === false || sortOk === false){
    _toast("⚠ Couldn't save the new order — check your connection.");
    if(typeof refreshCloudTalks === "function"){ try{ await refreshCloudTalks(); }catch(_){} }   // revert to server truth
  } else if(newSpec && newSpec !== origSpec){
    _toast("✓ Moved to " + newSpec);   // view-independent (renderSaved ignores savedFlash)
  }
  render();
}

    h+='<span style="font-size:12.5px;color:var(--ink-soft);white-space:nowrap;font-weight:500">#u/</span>';

    h+='<button id="pfHandleSave" style="background:var(--plum-deep);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11.5px;font-weight:600;cursor:pointer;flex-shrink:0">Save</button>';
    h+='</div>';
    h+='<div id="pfHandleStatus" style="font-size:11px;margin:5px 4px 0;min-height:14px;line-height:1.3;color:var(--ink-muted)"></div>';

      h+='<button id="pfCopyLink" style="flex:1;background:var(--lavender-bg);color:var(--plum);border:1px solid var(--lavender-soft);border-radius:8px;padding:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit">🔗 Copy my profile link</button>';

    h+='<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px"><span style="font-size:11px;font-weight:700;color:var(--ink-muted);text-transform:uppercase;letter-spacing:0.09em">API Keys</span><span style="font-size:10px;color:var(--ink-soft)">Stored in your browser only</span></div>';
    // Key row: when a key is stored, show "✓ Saved" + Edit (toggles edit-mode for that one row via S.profileKeyEditing).
    // Edit-mode shows the input + Save + Cancel. Cancel returns to "✓ Saved" without losing the stored key.
    function _keyRow(id,label,storageKey,isSet,placeholder,helperUrl){
      var editing = (S.profileKeyEditing === storageKey);
      var labelCell = '<div style="flex:0 0 auto;align-self:center;font-size:11.5px;font-weight:600;color:var(--ink);width:74px"><a href="'+helperUrl+'" target="_blank" title="Get a '+label+' key" style="color:inherit;text-decoration:none;border-bottom:1px dotted var(--ink-soft)">'+label+'</a></div>';
      if(isSet && !editing){
        // Compact "Saved" pill with an Edit button — replaces input row
        return '<div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">'+
          labelCell+
          '<div style="flex:1;display:inline-flex;align-items:center;gap:5px;background:#f0f7f0;border:1px solid #c8e0c8;border-radius:8px;padding:6px 10px;font-size:11.5px;color:#2d6a2d;font-weight:600"><span style="font-size:12px">✓</span>Saved</div>'+
          '<button class="pfEditKeyBtn" data-storage="'+esc(storageKey)+'" title="Replace this key" style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--plum);font-size:11.5px;font-weight:600;cursor:pointer">Edit</button>'+
          '</div>';
      }
      // Not set, OR editing — show input + Save + (Cancel if editing)
      return '<div style="display:flex;gap:6px;align-items:stretch;margin-bottom:6px">'+
        labelCell+
        '<input id="'+id+'_input" type="password" placeholder="'+placeholder+'" data-storage="'+storageKey+'" style="flex:1;min-width:0;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;outline:none;font-family:inherit" '+(editing?'autofocus':'')+'>'+
        '<button class="pfSaveKeyBtn" data-input="'+id+'_input" data-storage="'+storageKey+'" data-label="'+esc(label)+'" title="Save key" style="background:var(--plum);border:none;border-radius:8px;padding:0 10px;color:#fff;font-size:11.5px;font-weight:600;cursor:pointer">Save</button>'+
        (editing?'<button class="pfCancelKeyBtn" title="Cancel — keep existing key" style="background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 9px;color:var(--ink-muted);font-size:13px;font-weight:600;cursor:pointer">×</button>':'')+
        '</div>';
    }
    h+=_keyRow("pfClaudeKey","Anthropic","claude_api_key",_hasClaudeP,"sk-ant-…","https://console.anthropic.com/settings/keys");
    h+=_keyRow("pfGeminiKey","Gemini","gemini_api_key",_hasGemP,"AIza… (optional)","https://aistudio.google.com/apikey");
    h+=_keyRow("pfOpenAIKey","OpenAI","openai_api_key",_hasOAP,"sk-… (optional)","https://platform.openai.com/api-keys");
    h+='</div>';

    // Compact sign-out at the bottom — small text link, no divider
    h+='<div style="margin-top:14px;text-align:right"><button id="pfSignOutBtn" style="background:none;border:none;color:#c0392b;font-size:12px;font-weight:600;cursor:pointer;padding:4px 8px;border-radius:6px">Sign out</button></div>';

    h+='</div></div>';
  }

  return h;
}
