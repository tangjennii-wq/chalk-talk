  "Dermatology": {
    society: "AAD (American Academy of Dermatology), NPF",
    guidelines: [
      {name:"AAD/NPF Psoriasis 2019 + 2024 biologics update",year:2024,access:"Open",url:"https://www.jaad.org/",keys:"Anti-IL-23 (guselkumab, risankizumab, tildrakizumab) and anti-IL-17 (secukinumab, ixekizumab, brodalumab, bimekizumab) preferred for moderate-severe. Anti-TNF (adalimumab, etanercept, infliximab) alternative. IL-23i favor less frequent dosing, lower candidiasis."},
      {name:"AAD Atopic Dermatitis 2024",year:2024,access:"Open",url:"https://jcadonline.com/aad-aaaai-guidelines-atopic-dermatitis/",keys:"Topical steroids + emollients + barrier care first-line. Topical calcineurin inhibitors (tacrolimus, pimecrolimus) for face/folds. Severe: dupilumab (anti-IL-4Ra), tralokinumab (anti-IL-13), abrocitinib/baricitinib/upadacitinib (JAKi). Topical ruxolitinib for mild-moderate."},
      {name:"AAD Acne 2024",year:2024,access:"Open",url:"https://www.jaad.org/article/S0190-9622(23)03389-3/fulltext",keys:"Strong recommendations: BPO, topical retinoids (tretinoin, adapalene, tazarotene), topical/oral antibiotics (limited duration), oral spironolactone (women), combined oral contraceptives. Isotretinoin for severe/scarring (iPLEDGE)."},
      {name:"USPSTF Skin Cancer Screening 2023",year:2023,access:"Open",url:"https://www.uspreventiveservicestaskforce.org/uspstf/recommendation/skin-cancer-screening",keys:"Insufficient evidence for routine visual skin screening in asymptomatic adults (I statement). Does not apply to symptomatic, high-risk (immunocompromised, prior cancer, family history, dysplastic nevi). AAD continues to recommend self-exams + dermatologist evaluation."},
      {name:"IDSA SSTI / Cellulitis 2014/2024",year:2024,access:"Open",url:"https://www.idsociety.org/practice-guideline/skin-and-soft-tissue-infections/",keys:"Nonpurulent cellulitis: oral cephalexin or amoxicillin (Strep coverage). Purulent: incision + drainage; add MRSA coverage (TMP-SMX, doxycycline, clindamycin) if SIRS. Severe: IV vancomycin/daptomycin/linezolid. Diabetic foot: extended courses, image for osteomyelitis."},
      {name:"AAD/HSF Hidradenitis Suppurativa 2019/2024",year:2024,access:"Open",url:"https://www.jaad.org/",keys:"Adalimumab (anti-TNF) FDA-approved (PIONEER 1/2; HiSCR 40-59%). Secukinumab (anti-IL-17A; SUNRISE/SUNSHINE) approved 2023. Bimekizumab approved 2024. Surgical excision for fibrotic stages."},
      {name:"AAD-NPF 2020/2021 Psoriasis (Topicals + Biologics)",year:2021,access:"Open",url:"https://www.aad.org/member/clinical-quality/guidelines/psoriasis",keys:"Topical corticosteroids + vitamin D analogs (calcipotriene) first-line for limited disease; phototherapy (NB-UVB) for moderate. Biologics for moderate-severe: TNFi (etanercept, adalimumab, infliximab), IL-17i (secukinumab, ixekizumab, brodalumab), IL-23i (guselkumab, risankizumab, tildrakizumab). Oral: apremilast, methotrexate, cyclosporine, acitretin, deucravacitinib. Screen all for psoriatic arthritis and cardiometabolic comorbidities."},
      {name:"AAD 2023/2024 Atopic Dermatitis",year:2024,access:"Open",url:"https://www.aad.org/member/clinical-quality/guidelines/atopic-dermatitis",keys:"Emollients + bathing, topical corticosteroids first-line; topical calcineurin inhibitors (tacrolimus, pimecrolimus) and crisaborole for face/folds/steroid-sparing; topical ruxolitinib for mild-moderate. NB-UVB phototherapy for refractory. Strong recommendations for dupilumab (anti-IL-4Ra, LIBERTY-AD), tralokinumab (anti-IL-13, ECZTRA), and oral JAKi abrocitinib/upadacitinib/baricitinib (JADE, Measure Up, BREEZE-AD) for moderate-severe."},

  "Psychiatry": {

    guidelines: [
      {name:"APA Major Depression 2024 + ACP 2023",year:2024,access:"Open",url:"https://www.apa.org/depression-guideline",keys:"First-line: SSRIs (sertraline, escitalopram), SNRIs, mirtazapine, bupropion. Treatment-resistant (>=2 failed): augmentation (lithium, T3, atypical antipsychotic) OR ketamine/esketamine (NMDA antagonist; STAR*D, TRD-IV). ECT for severe / refractory. CBT/IPT comparable to medication for mild-moderate."},
      {name:"APA/WFSBP Bipolar Disorder",year:2002,access:"Open",url:"https://www.psychiatry.org/",keys:"Acute mania: lithium, valproate, atypical antipsychotics. Bipolar depression: lithium or lamotrigine (NOT antidepressant monotherapy - switch risk). Maintenance: lithium gold standard (suicide prevention). Avoid valproate in reproductive-age women (teratogenicity, MHRA)."},
      {name:"APA PTSD 2023",year:2023,access:"Open",url:"https://www.apa.org/ptsd-guideline",keys:"First-line: trauma-focused CBT (CPT, PE, EMDR) + SSRI/SNRI (sertraline, paroxetine, venlafaxine FDA-approved). Prazosin for nightmares. Avoid benzos. MDMA-assisted therapy under FDA review (denied 2024 - additional evidence required)."},

// Scan a body of text for trial names. Returns the matched expansion objects.
// Case-insensitive substring match, longest names first so "PARTNER 3" beats "PARTNER".
function getMatchingTrialExpansions(text){
  if(!text || !TRIAL_EXPANSIONS) return [];
  var lower = String(text).toLowerCase();
  var names = Object.keys(TRIAL_EXPANSIONS).sort(function(a,b){ return b.length - a.length; });
  var matches = [];
  var seen = {};
  for(var i=0;i<names.length;i++){
    var n = names[i];
    if(seen[n]) continue;
    if(lower.indexOf(n.toLowerCase()) >= 0){
      matches.push({ name: n, exp: TRIAL_EXPANSIONS[n] });
      seen[n] = true;
    }
  }
  return matches;
}

// Build the TRIAL CONTEXT block that gets injected into the prompt.
function buildTrialExpansionContext(topic, refineContext){
  var haystack = (topic||"") + "\n" + (refineContext||"");
  var matches = getMatchingTrialExpansions(haystack);
  if(!matches.length) return "";
  var out = "\n\n═══ TRIAL CONTEXT (use these expert-curated summaries to anchor trial discussion) ═══";
  matches.forEach(function(m){
    var e = m.exp;
    out += "\n\n[" + e.trial + "]";
    if(e.primary_finding)   out += "\n  Primary finding: " + e.primary_finding;
    if(e.population)        out += "\n  Population: " + e.population;
    if(e.critique)          out += "\n  Critique/limitation: " + e.critique;
    if(e.followup)          out += "\n  Long-term follow-up: " + e.followup;
    if(e.guideline_impact)  out += "\n  Guideline impact: " + e.guideline_impact;
    if(e.nephjc_takeaway)   out += "\n  NephJC takeaway: " + e.nephjc_takeaway;
    if(e.expert_takeaway)   out += "\n  Expert takeaway: " + e.expert_takeaway;
    if(e.sources && e.sources.length) out += "\n  Cite as: " + e.sources.join(" | ");
  });
  out += "\n═══ END TRIAL CONTEXT ═══";
  return out;
}

// ═══════════ SUPABASE AUTH ═══════════
window.onSupabaseReady = function(client){
  // Pull current session, then subscribe to changes
  client.auth.getSession().then(function(r){
    if(r && r.data && r.data.session){
      S.session = r.data.session;
      S.user = r.data.session.user;
      loadProfile();
    }
    if(typeof render === "function") render();
    // Auth state is now known — drain any pending #t=<cloud-id> hash load from a deep-link.
    if(typeof drainPendingHashLoad === "function") drainPendingHashLoad();
  });
  client.auth.onAuthStateChange(function(event, session){
    var wasSignedIn = !!S.user;
    S.session = session || null;
    S.user = (session && session.user) || null;
    if(S.user){
      loadProfile();
      // First-time-on-this-device prompt: migrate localStorage talks
      if(!wasSignedIn) maybeOfferLocalMigration();
    } else {
      S.profile = null;
    }
    if(typeof render === "function") render();
  });
};

async function loadProfile(){
  if(!window.sb || !S.user) return;
  try{
    var r = await window.sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle();
    S.profile = r.data || null;
    if(typeof render === "function") render();
    // Also refresh cloud talks + favorites on profile load
    refreshCloudTalks();
    refreshFavorites();
  }catch(e){ console.warn("loadProfile failed", e) }
}

// LIGHTWEIGHT list fetch — pulls only the columns the library cards need (no talk_json,

// by cloudLoadTalk(id) when the user clicks Open.
async function refreshCloudTalks(){
  if(!window.sb || !S.user) return;
  try{
    // talk_json->>subtitle projects just the subtitle text from the JSONB column (no quotes).
    // Tiny bandwidth (~30-80 bytes/row) and restores the subtitle line on library cards.
    // has_visuals is a denormalized boolean column maintained by the sync_has_visuals trigger
    // (see supabase/migrations/add_has_visuals.sql). Lets us show the 🖼 badge without fetching the heavy talk_json.
    var r = await window.sb.from("talks")
      .select("id, title, topic, style, depth, created_at, share_token, is_public, has_visuals, talk_json->>subtitle")
      .order("created_at", { ascending: false });
    if(r.error) throw r.error;
    S.cloudTalks = r.data || [];
    S.cloudLoaded = true;
    if(typeof render === "function") render();
  }catch(e){ console.warn("refreshCloudTalks failed", e) }
}

// Load a public talk via the Worker /share/:token route (works without sign-in)
async function loadPublicTalkByToken(token){
  if(!token) return false;
  S.loadingFromHash = true;
  if(typeof render === "function") render();
  try{
    var workerUrl = (RAG_CONFIG && RAG_CONFIG.url) ? (RAG_CONFIG.url.replace(/\/$/, "") + "/share/" + encodeURIComponent(token)) : null;
    if(!workerUrl) throw new Error("Worker URL not configured");
    var res = await fetch(workerUrl, { headers: {"Accept": "application/json"} });
    if(!res.ok){
      var body = await res.text();
      throw new Error("HTTP "+res.status+": "+body.slice(0,200));
    }
    var data = await res.json();
    if(!data || !data.talk_json) throw new Error("Empty talk payload");
    S.talk = data.talk_json;
    S.topic = data.topic || data.title || "";
    S.style = data.style || "lecture";
    S.depth = data.depth || "concise";
    S.sharedTalk = true;
    S.sharedAuthor = data.author || null;
    S.isSampleTalk = false; S.sampleSlug = "";
    S.loadedTalkId = null; S.talkIsSaved = true; // public viewer is read-only
    S.sec = 0; S.showAns = false; S.userPick = "";
    S.loadingFromHash = false;
    if(typeof render === "function") render();
    window.scrollTo(0,0);
    return true;
  }catch(e){
    console.error("loadPublicTalkByToken failed:", e);
    S.loadingFromHash = false;
    if(typeof render === "function") render();
    alert("Couldn't open that shared talk — it may have been unpublished, or the link is wrong.");
    return false;
  }
}

  var visuals = (t.savedVisuals && t.savedVisuals.length) ? t.savedVisuals : null;
  // Compact single-row library card (Jenni 2026-06-04 — actions live next to the title).
  // Open is the primary CTA (small filled button on the right); pencil/export/delete are tiny icon buttons.
  // Sample cards skip pencil/export/delete (samples are immutable).
  // Open is an <a target="_blank"> so the talk loads in a NEW TAB — library stays open behind it.
  // Middle-click and cmd-click still work natively. The hash carries the source so the new tab knows what to load.
  var openHref = isSample ? ('#s='+encodeURIComponent(x._slug)) : ('#t='+encodeURIComponent(x._id));
  var openBtn = '<a class="libOpenBtn" href="'+openHref+'" target="_blank" rel="noopener" style="background:linear-gradient(135deg,var(--plum-deep),var(--plum));border:none;border-radius:8px;padding:7px 14px;color:#fff;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;text-decoration:none;display:inline-flex;align-items:center;line-height:1">Open</a>';

  // Kebab menu replaces the row of inline icons (Jenni 2026-06-04 — matches OpenEvidence-style action menu).
  // One ⋮ button per card — on EVERY card type incl. samples, so the action affordance is consistent
  // (Jenni 2026-06-06). Samples are keyed by slug ("sample:<slug>"); rename/delete persist as local
  // overrides (immutable seed data is never mutated). Clicking toggles a labeled dropdown:
  // Rename / Export PDF / Delete. Only one menu open at a time, tracked via S.libCardMenuId; closes on outside click.
  var menuKey = isSample ? ('sample:'+x._slug) : x._id;
  var dataAttr = isSample ? ('data-slug="'+esc(x._slug)+'"') : ('data-id="'+esc(x._id)+'"');
  var menuOpen = (S.libCardMenuId === menuKey);
  var iconBtns = '';
  iconBtns += '<div style="position:relative;flex-shrink:0">';
  iconBtns += '<button class="libCardMenuBtn" data-key="'+esc(menuKey)+'" title="More actions" aria-label="More actions" aria-haspopup="true" style="background:none;border:none;color:var(--ink-muted);font-size:18px;cursor:pointer;padding:5px 8px;border-radius:50%;line-height:1;font-weight:700">⋮</button>';
  if(menuOpen){
    iconBtns += '<div class="libCardMenu" style="position:absolute;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(20,10,28,0.14);min-width:170px;z-index:80;overflow:hidden">';
    iconBtns += '<button class="libMenuItem libEditTitleBtn" '+dataAttr+' style="width:100%;background:none;border:none;display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:13px;color:var(--ink);text-align:left;border-bottom:1px solid var(--line-soft);font-family:inherit"><span style="color:var(--plum);font-size:14px;width:16px;display:inline-flex;justify-content:center">✎</span>Rename</button>';
    iconBtns += '<button class="libMenuItem libPdfBtn" '+dataAttr+' style="width:100%;background:none;border:none;display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:13px;color:var(--ink);text-align:left;border-bottom:1px solid var(--line-soft);font-family:inherit"><span style="color:var(--plum);font-size:14px;width:16px;display:inline-flex;justify-content:center">↓</span>Export PDF</button>';
    iconBtns += '<button class="libMenuItem delTalkBtn" '+dataAttr+' style="width:100%;background:none;border:none;display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;font-size:13px;color:#c0392b;text-align:left;font-family:inherit"><span style="font-size:14px;width:16px;display:inline-flex;justify-content:center">🗑</span>Delete</button>';
    iconBtns += '</div>';
  }
  iconBtns += '</div>';

  var h = '<div style="background:#fff;border:1px solid var(--line);border-left:3px solid '+(isBQ?"#e67e22":"var(--plum)")+';border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px">';

  // Optional small thumbnail (only on Visuals tab — elsewhere the badge in the meta row indicates an image)
  if(visuals && S.libTab === "visuals"){
    h += '<img src="data:image/png;base64,'+visuals[0].imgB64+'" alt="" style="width:44px;height:44px;object-fit:cover;border-radius:7px;border:1px solid var(--line);flex-shrink:0">';
  }

  // Title + meta in a single column, flex:1
  // Samples can carry a local rename override (keyed by slug) since the seed title is immutable.
  var _ovr = isSample ? (loadSampleTitleOverrides()[x._slug]||"") : "";
  var displayTitle = _ovr || t.title || x.topic || "Untitled";
  h += '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">';
  h += '<div style="font-size:13.5px;font-weight:700;color:var(--plum-deep);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="'+esc(displayTitle)+'">'+esc(displayTitle)+'</div>';
  // Compact meta row — type badge + sample/dual/visual badges + date in tiny font
  h += '<div style="display:flex;gap:6px;font-size:10.5px;color:var(--ink-muted);align-items:center;flex-wrap:wrap">';
  h += '<span style="background:'+(isBQ?"#fdf0ee":"var(--lavender-bg)")+';color:'+(isBQ?"#8a3a2a":"var(--plum)")+';padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px;letter-spacing:0.02em">'+(isBQ?"📋 Boards":"🎓 Lecture")+'</span>';
  if(isSample) h += '<span style="background:#fff4e0;color:#7a5b1a;padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px">✨</span>';
  // Public badge — talk has is_public=true (sharing feature Jenni 2026-06-04)
  if(x._isPublic) h += '<span style="background:#e6f4ea;color:#2d6a2d;border:1px solid #c8e0c8;padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px" title="Public — anyone with the link can view">🌐 Public</span>';
  // Visuals badge: prefer exact count (local talks with full savedVisuals data); else just show 🖼 (cloud cards).
  if(visuals) h += '<span style="background:var(--lavender-bg);color:var(--plum);padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px">🖼 '+visuals.length+'</span>';
  else if(t._hasCloudVisuals) h += '<span style="background:var(--lavender-bg);color:var(--plum);padding:1px 7px;border-radius:8px;font-weight:600;font-size:10px">🖼</span>';
  if(dateStr) h += '<span style="font-size:10.5px;color:var(--ink-soft)">'+dateStr+'</span>';
  h += '</div>';
  h += '</div>';

  // Right side: kebab + clear gap + Open. The gap separates the secondary overflow menu from the primary CTA.
  h += '<div style="display:flex;align-items:center;gap:12px;flex-shrink:0">' + iconBtns + openBtn + '</div>';

  h += '</div>';
  return h;
}

function getDisplayLibrary(){
  if(S.user) return (S.cloudTalks || []).filter(function(row){return !_softDeletedIds[row.id]}).map(function(row){
    // talk_json is intentionally NOT fetched in the lightweight list query — synthesize a minimal
    // talk object from columns so renderLibCard + the renderSaved _kind detection still work.
    // The full talk_json is fetched on Open via cloudLoadTalk(id).
    // Defensive: handle both lightweight rows (just-fetched) and full rows (just-saved, still in cache).
    var hasVis = (row.has_visuals === true) || !!(row.talk_json && row.talk_json.savedVisuals && row.talk_json.savedVisuals.length);
    var subtitle = row.subtitle || (row.talk_json && row.talk_json.subtitle) || "";
    var miniTalk = {
      title: row.title,
      subtitle: subtitle,
      question: row.style === "boards" ? {} : undefined,
      // _hasCloudVisuals signals the badge should render even without the full savedVisuals array.
      _hasCloudVisuals: hasVis
    };
    return {
      id: row.id,
      savedAt: row.created_at,
      topic: row.topic,
      style: row.style,
      talk: miniTalk,
      podScript: "",
      dg: null,
      glRef: { sources: [], specialties: [], context: "", trials: [] },
      _isPublic: !!row.is_public,
      _shareToken: row.share_token || null
    };
  });
  return loadSavedTalks().filter(_notSoftDeleted);
}

// Wait up to ~3s for Supabase to finish initializing. The module script that creates
// window.sb is deferred — if the user clicks Sign in before it lands, we briefly poll
// rather than throw a confusing "Supabase not ready" error.
function _waitForSb(){
  return new Promise(function(resolve,reject){
    if(window.sb) return resolve(window.sb);
    var tries=0;
    var iv=setInterval(function(){
      if(window.sb){clearInterval(iv);resolve(window.sb)}
      else if(++tries>30){clearInterval(iv);reject(new Error("Sign-in service is loading — please refresh the page and try again."))}
    },100);
  });
}

async function signInWithMagicLink(email){
  var sb = await _waitForSb();
  var redirectTo = window.location.origin + window.location.pathname;
  var r = await sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: redirectTo } });
  if(r.error) throw r.error;
  return r;
}

async function signInWithGoogle(){
  var sb = await _waitForSb();
  var redirectTo = window.location.origin + window.location.pathname;
  var r = await sb.auth.signInWithOAuth({ provider: "google", options: { redirectTo: redirectTo } });
  if(r.error) throw r.error;
}

async function signOut(){
  if(!window.sb) return;
  await window.sb.auth.signOut();
  S.session = null; S.user = null; S.profile = null;
  S.overflowOpen = false;

}

// One-time prompt to migrate localStorage talks → Supabase on first cloud sign-in
function maybeOfferLocalMigration(){
  try{

    if(localStorage.getItem("ct_migration_dismissed_v1") === "1") return;
    setTimeout(function(){

      if(ok){
        migrateLocalToCloud(localTalks);
      } else {

      }
    }, 600);

async function migrateLocalToCloud(localTalks){
  if(!window.sb || !S.user) return;
  var rows = [];
  for(var i=0; i<localTalks.length; i++){
    var e = localTalks[i];
    var t = e.talk || {};
    rows.push({
      user_id: S.user.id,
      title: t.title || e.topic || "Untitled",
      topic: e.topic || t.title || "",
      refine_context: e.refineContext || null,
      style: e.style || (t.question ? "boards" : "lecture"),
      depth: e.depth || null,
      talk_json: t,
      references_json: t.references || null,
      files_meta: e.files || null
    });
  }
  try{
    var r = await window.sb.from("talks").insert(rows);
    if(r.error){ alert("Import failed: " + r.error.message); return }
    localStorage.setItem("ct_migration_dismissed_v1", "1");
    alert("Imported " + rows.length + " talk" + (rows.length===1?"":"s") + " to your cloud library.");
    await refreshCloudTalks();
  }catch(e){ alert("Import error: " + e.message) }
}

// === Delete confirmation modal + soft-delete with Undo ===
// Replaces native confirm() for deletions. A branded modal asks first; on confirm we hide the item
// immediately and show an Undo toast. The real delete (cloud/local/sample-hide) is deferred until the
// toast window closes, so Undo is instant and lossless (nothing is removed until commit fires).
var _softDeletedIds = {};    // saved-talk ids hidden pending commit
var _softHiddenSlugs = {};   // sample slugs hidden pending commit
function _notSoftDeleted(e){ return e && !_softDeletedIds[e.id]; }

// Branded confirm dialog. onConfirm runs only if the user clicks Delete. Cancel is the focused/safe default.
function showDeleteConfirm(name, onConfirm){
  var ex=document.getElementById("ctConfirmOverlay"); if(ex)ex.remove();
  var ov=document.createElement("div");
  ov.id="ctConfirmOverlay";
  ov.style.cssText="position:fixed;inset:0;z-index:10000;background:rgba(20,10,28,0.45);display:flex;align-items:center;justify-content:center;padding:20px";
  var card=document.createElement("div");
  card.style.cssText="background:#fff;border-radius:16px;max-width:380px;width:100%;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(20,10,28,0.3);font-family:inherit";
  card.innerHTML='<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px"><span style="background:#fbeaea;color:#c0392b;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0">🗑</span><span style="font-size:16px;font-weight:700;color:var(--ink)">Delete this talk?</span></div>'+
    '<div style="font-size:13.5px;color:var(--ink-muted);line-height:1.5;margin-bottom:18px">“'+esc(name||"This talk")+'” will be removed from your library. You’ll have a few seconds to undo.</div>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end">'+
    '<button id="ctConfirmCancel" style="background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit">Cancel</button>'+
    '<button id="ctConfirmDelete" style="background:#c0392b;border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;color:#fff;cursor:pointer;font-family:inherit">Delete</button>'+
    '</div>';
  ov.appendChild(card); document.body.appendChild(ov);
  function close(){ ov.remove(); document.removeEventListener("keydown",onKey) }
  function onKey(e){ if(e.key==="Escape") close() }
  document.addEventListener("keydown",onKey);
  ov.onclick=function(e){ if(e.target===ov) close() };
  document.getElementById("ctConfirmCancel").onclick=close;
  document.getElementById("ctConfirmDelete").onclick=function(){ close(); onConfirm(); };
  document.getElementById("ctConfirmCancel").focus();
}

// Undo toast. Calls onUndo if the user clicks Undo; otherwise onCommit fires when the window expires.
function showUndoToast(message, onUndo, onCommit, ms){
  var ex=document.getElementById("ctToast"); if(ex){ if(ex._commit) ex._commit(); ex.remove(); }
  var t=document.createElement("div");
  t.id="ctToast";
  t.style.cssText="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9999;background:#241430;color:#fff;border-radius:12px;padding:10px 8px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(20,10,28,0.35);font-size:13px;font-family:inherit;max-width:90vw";
  t.innerHTML='<span>'+esc(message)+'</span><button id="ctToastUndo" style="background:none;border:none;color:#d7b3ff;font-weight:700;font-size:13px;cursor:pointer;padding:4px 10px;border-radius:8px;font-family:inherit">Undo</button>';
  document.body.appendChild(t);
  var done=false;
  function finish(undo){ if(done)return; done=true; clearTimeout(timer); t._commit=null; t.remove(); if(undo){ if(onUndo)onUndo() } else { if(onCommit)onCommit() } }
  t._commit=function(){ finish(false) };  // allow a later toast to flush this one's commit
  document.getElementById("ctToastUndo").onclick=function(){ finish(true) };
  var timer=setTimeout(function(){ finish(false) }, ms||5000);
  return t;
}

// Shared soft-delete for a saved talk id: hide now, commit (cloud or local) after the undo window.
function softDeleteSavedTalk(id, name, afterHideFn){
  _softDeletedIds[id]=true;
  if(afterHideFn) afterHideFn(); else render();
  showUndoToast("Talk deleted", function(){
    delete _softDeletedIds[id]; render();
  }, async function(){
    if(S.user && window.sb && !String(id).startsWith("t_")){ await cloudDeleteTalk(id); }
    else { writeSavedTalks(loadSavedTalks().filter(function(e){return e.id!==id})); }
    delete _softDeletedIds[id]; render();
  });
}

}}

async function saveCurrentTalk(){
  if(!S.talk)return;
  // If this talk was loaded from the library AND has been edited, prompt: update vs save-as-new.
  // Skip the prompt for sample-talks (no source to update) and shared/anonymous talks.
  var mode = "new"; // default behavior when nothing is loaded
  if(S.loadedTalkId && !S.isSampleTalk && !S.sharedTalk){
    var pick = confirm(
      "You opened this talk from your library. What would you like to do?\n\n" +
      "OK \u2192 Save changes to the existing talk\n" +
      "Cancel \u2192 Save as a new talk (keeps the original)"
    );
    mode = pick ? "update" : "new";
  }
  // Cloud path when signed in
  if(S.user && window.sb){
    var ok;
    if(mode === "update"){
      ok = await cloudUpdateTalk(S.loadedTalkId);
      if(ok){
        S.talkIsSaved=true;
        S.savedFlash="\u2713 Changes saved to existing talk";render();
        setTimeout(function(){S.savedFlash="";render()},2200);
      } else {
        S.savedFlash="\u26a0 Update failed \u2014 check connection";render();
        setTimeout(function(){S.savedFlash="";render()},3500);
      }
    } else {
      ok = await cloudSaveCurrentTalk();
      if(ok){
        S.talkIsSaved=true;
        // After "save as new" the new row becomes the new loaded talk so future Save prompts again.
        if(S.cloudTalks && S.cloudTalks.length){ S.loadedTalkId = S.cloudTalks[0].id; }
        S.savedFlash="\u2713 Saved as new talk in cloud library";render();
        setTimeout(function(){S.savedFlash="";render()},2200);
      } else {
        S.savedFlash="\u26a0 Cloud save failed \u2014 check connection";render();
        setTimeout(function(){S.savedFlash="";render()},3500);
      }
    }
    return;
  }
  // localStorage path
  var arr=loadSavedTalks();
  var dgLite=S.dg ? {hadImage:!!S.dg.imgB64, svg:S.dg.svg||null} : null;
  if(mode === "update" && S.loadedTalkId){
    for(var i=0;i<arr.length;i++){
      if(arr[i].id === S.loadedTalkId){
        arr[i] = Object.assign({}, arr[i], {
          savedAt: new Date().toISOString(),
          topic: S.topic, style: S.style, talk: S.talk,
          podScript: S.podScript||"", dg: dgLite, glRef: S.glRef||null
        });
        break;
      }
    }
    if(writeSavedTalks(arr)){S.talkIsSaved=true;S.savedFlash="\u2713 Changes saved";render();setTimeout(function(){S.savedFlash="";render()},2200)}
    return;
  }
  var entry={
    id:"t_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),
    savedAt:new Date().toISOString(),
    topic:S.topic, style:S.style, talk:S.talk,
    podScript:S.podScript||"", dg:dgLite, glRef:S.glRef||null
  };
  arr.unshift(entry);
  if(writeSavedTalks(arr)){S.talkIsSaved=true;S.loadedTalkId=entry.id;S.savedFlash="\u2713 Saved to library";render();setTimeout(function(){S.savedFlash="";render()},2200)}
}
async function deleteSavedTalk(id){
  if(!confirm("Delete this saved chalk talk? This cannot be undone."))return;
  // Cloud path: UUIDs (any string without "t_" prefix)
  if(S.user && window.sb && id && !String(id).startsWith("t_")){
    var ok = await cloudDeleteTalk(id);
    if(!ok){ alert("Delete failed — check connection."); return }
    render();
    return;
  }

function importLibraryJSON(file){
  // Cloud-aware: if signed in, route each incoming talk through saveCurrentTalk's
  // cloud path so it lands in Supabase (and shows up in the Library which reads
  // from S.cloudTalks). For anonymous users, fall back to the original localStorage path.
  var r=new FileReader();
  r.onload=async function(){try{
    var data=JSON.parse(r.result);
    var incoming=Array.isArray(data)?data:(data.talks||[data]);
    if(S.user && window.sb){
      var added=0, failed=0;
      for(var i=0;i<incoming.length;i++){
        var e=incoming[i];
        if(!e.talk)continue;
        try{
          var row = { user_id: S.user.id, topic: e.topic||(e.talk&&e.talk.title)||"Imported talk",
                      style: e.style||"lecture", talk_json: e.talk };
          var ins = await window.sb.from("talks").insert(row);
          if(ins.error) throw ins.error;
          added++;
        }catch(_){ failed++; }
      }
      // Refresh cloud cache; if THAT throws, don't pretend the import failed (inserts already landed).
      try { if(typeof refreshCloudTalks==="function") await refreshCloudTalks(); } catch(_) { /* surface in alert below */ }
      alert("Imported "+added+" talk"+(added===1?"":"s")+" to your cloud library"+(failed?" ("+failed+" failed)":"")+". Refresh if they don't appear immediately.");
      render();
      return;
    }
    // Anonymous user — local storage path (original behavior)
    var arr=loadSavedTalks();
    var existingIds={};arr.forEach(function(e){existingIds[e.id]=true});
    var added2=0;
    incoming.forEach(function(e){
      if(!e.id)e.id="t_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
      if(!existingIds[e.id]&&e.talk){arr.unshift(e);added2++}
    });
    writeSavedTalks(arr);alert("Imported "+added2+" talk"+(added2===1?"":"s")+".");render();
  }catch(err){alert("Could not parse JSON file: "+err.message)}};
  r.readAsText(file);
}

// ─── Slides shorthand compressor (Jenni 2026-06-06) ───
// Slides aren't lecture notes — they should read like a whiteboard scribble.
// This applies safe medical abbreviations + drops filler words + word-caps to keep
// each card scannable. Citation markers ([N], [N,M]) are PROTECTED so renderCite
// downstream still chips them. Original text returned via .original so callers can
// stash it in a title= tooltip for hover-reveal.
//
// Heuristic, NOT semantic. We avoid aggressive medical rewrites (e.g. won't drop
// "not" or invert dosing). For high-stakes phrasing the user can hover for full.
function slidesShorthand(text, maxWords){
  if(!text) return {short:"", original:""};
  var original = String(text);
  var s = original;

  // 1) Stash citation markers so substitutions never touch them.
  //    Replace [N] / [N,M] / [N,M,...] with <idx> placeholders.
  var stashed = [];
  s = s.replace(/\[(\d+(?:\s*,\s*\d+)*)\]/g, function(m){
    stashed.push(m);
    return "" + (stashed.length - 1) + "";
  });

  // 2) Safe medical abbreviations — these are universally understood by MDs.
  //    Order matters (longer phrases first) to avoid partial-word collisions.
  var subs = [
    [/\bapproximately\b/gi, "~"],
    [/\bgreater than or equal to\b/gi, "≥"],
    [/\bless than or equal to\b/gi, "≤"],
    [/\bgreater than\b/gi, ">"],
    [/\bless than\b/gi, "<"],
    [/\bpatients with\b/gi, "pts w/"],
    [/\bpatients\b/gi, "pts"],
    [/\bpatient\b/gi, "pt"],
    [/\bversus\b/gi, "vs"],
    [/\bbetween\b/gi, "btwn"],
    [/\bwithout\b/gi, "w/o"],
    [/\bwith\b/gi, "w/"],
    [/\bsecondary to\b/gi, "2/2"],
    [/\bdue to\b/gi, "d/t"],
    [/\bhistory of\b/gi, "h/o"],
    [/\bin the setting of\b/gi, "i/s/o"],
    [/\bfollow[- ]?up\b/gi, "f/u"],
    [/\bdiagnosis\b/gi, "dx"],
    [/\btreatment\b/gi, "tx"],
    [/\bmanagement\b/gi, "mgmt"],
    [/\b(\d+)\s*years?\b/gi, "$1y"],
    [/\b(\d+)\s*months?\b/gi, "$1mo"],
    [/\b(\d+)\s*weeks?\b/gi, "$1wk"],
    // Filler — safe to drop entirely
    [/\bparticularly\b/gi, ""],
    [/\btypically\b/gi, ""],
    [/\busually\b/gi, ""],
    [/\bessentially\b/gi, ""],
    [/\bimportantly\b/gi, ""],
    [/\bit is important to (?:note|remember|recognize)(?: that)?\b/gi, ""],
    [/\bplease note that\b/gi, ""],
    [/\bin general\b/gi, ""],
    [/\boverall\b/gi, ""],
    // "X is a Y" → "X: Y" (often)
    [/\bis associated with\b/gi, "→"],
    [/\bresults? in\b/gi, "→"],
    [/\bleads? to\b/gi, "→"]
  ];
  for(var i=0;i<subs.length;i++) s = s.replace(subs[i][0], subs[i][1]);

  // 3) Collapse double spaces and tidy punctuation after filler drops.
  s = s.replace(/\s{2,}/g, " ").replace(/\s+([,.;:])/g, "$1").replace(/^[,;.\s]+/, "").trim();

  // 4) Word-cap. Don't split inside a citation placeholder.
  if(maxWords && maxWords > 0){
    var words = s.split(/\s+/);
    if(words.length > maxWords){
      s = words.slice(0, maxWords).join(" ").replace(/[.,;:]+$/, "") + "…";
    }
  }

  // 5) Restore citation markers.
  s = s.replace(/(\d+)/g, function(_, idx){ return stashed[parseInt(idx, 10)] || ""; });

  return {short: s, original: original};
}

// ═══════════ CITATION RENDERER ═══════════
// Parses [N] / [N,M] markers in talk text and renders them as clickable pills.
// ── Citation chip helpers (OpenEvidence-style: inline pill with source name) ───
// Derive a short, recognizable label from a reference's society / source / trial acronym.
function _citeLabel(ref){
  if(!ref) return "ref";
  var src = String(ref.source || "");
  var type = String(ref.type || "").toLowerCase();
  // User-uploaded reference — distinct label so the reader sees "this came from your reference, not corpus"
  if(type === "user-upload" || type === "user_upload" || type === "upload"){
    // Strip extension + truncate
    var clean = src.replace(/\.(pdf|txt|docx?|md|jpe?g|png)$/i,"");
    if(clean.length > 14) clean = clean.slice(0,12)+"…";
    return "📎 " + clean;
  }
  // Trial acronym pattern: ALL-CAPS, optionally hyphenated, at the start (e.g. "DAPA-HF", "EMPEROR-Reduced", "PARADIGM-HF")
  var trial = src.match(/^([A-Z][A-Z0-9]+(?:-[A-Za-z0-9]+)?)\b/);
  if(trial) return trial[1];
  // Society label preferred for guidelines (e.g., "AHA", "KDIGO", "IDSA")
  if((type === "guideline" || ref.society) && ref.society && ref.society.length <= 12) return ref.society;
  // (Recognized journal abbreviations are checked further down — NEJM, JAMA, CJASN, JACC, etc.
  //  Only fall back to "PMID N" if the journal name doesn't match any of those.)
  // Common journal abbreviations
  var lower = src.toLowerCase();
  var journals = [
    ["new england journal","NEJM"],["nejm","NEJM"],
    ["journal of the american college of cardiology","JACC"],["jacc","JACC"],
    ["circulation","Circulation"],
    ["lancet","Lancet"],
    ["jama","JAMA"],
    ["kidney international","Kidney Int"],
    ["clinical journal of the american society of nephrology","CJASN"],["cjasn","CJASN"],
    ["american journal of kidney diseases","AJKD"],["ajkd","AJKD"],
    ["annals of internal medicine","Ann Intern Med"],
    ["diabetes care","Diabetes Care"],
    ["chest","CHEST"],
    ["thorax","Thorax"],
    ["gut","Gut"],
    ["hepatology","Hepatology"],
    ["blood","Blood"],
    ["clinical infectious diseases","CID"],
    ["british medical journal","BMJ"],["bmj","BMJ"]
  ];
  for(var j=0;j<journals.length;j++){ if(lower.indexOf(journals[j][0])>=0) return journals[j][1]; }
  // Society fallback (longer)
  if(ref.society) return ref.society.length<=14?ref.society:ref.society.slice(0,12)+"…";
  // PMID fallback for original journal articles when no recognizable journal name (Jenni 2026-06-04)
  var pmidMatch = String(ref.url||"").match(/pubmed\.ncbi\.nlm\.nih\.gov\/(\d{6,9})/);
  if(pmidMatch) return "PMID " + pmidMatch[1];
  // Last resort: truncate the source
  if(src.length<=16) return src;
  return src.slice(0,14)+"…";
}
// Color class — guidelines warm/orange, trials plum, journal articles cool/blue.
function _citeClass(ref){
  if(!ref) return "cite";
  var t = String(ref.type || "").toLowerCase();
  if(t === "guideline" || ref.society) return "cite cite-guideline";
  // Trial = ALL-CAPS acronym style
  if(/^[A-Z][A-Z0-9-]{2,}/.test(String(ref.source||""))) return "cite cite-trial";
  return "cite cite-journal";
}

function renderCite(text, refs) {
  if (!text) return "";
  if (!refs || !refs.length) return esc(String(text));
  var s = String(text);
  var html = "";
  var lastIdx = 0;
  var re = /\[(\d+(?:\s*,\s*\d+)*)\]/g;
  var m;
  // Build a quick lookup for refs by id
  var refMap = {};
  for(var rr=0; rr<refs.length; rr++){ refMap[String(refs[rr].id)] = refs[rr]; }
  while ((m = re.exec(s)) !== null) {
    html += esc(s.slice(lastIdx, m.index));
    var ids = m[1].split(",").map(function(x){return x.trim()});
    // Collect resolved refs (skip unknown ids)
    var resolved = [];
    for(var i=0;i<ids.length;i++){ if(refMap[ids[i]]) resolved.push({id:ids[i], ref:refMap[ids[i]]}); }
    if(resolved.length === 0){
      // No matches — render raw bracketed text so the user can still see the marker
      for(var ix=0;ix<ids.length;ix++) html += '[' + ids[ix] + ']';
    } else {
      // First ref gets the labeled chip; extra refs collapse into a "+N" suffix on the same chip.
      var first = resolved[0];
      var extraCount = resolved.length - 1;
      html += '<span class="' + _citeClass(first.ref) + '" data-ref="' + first.id + '">';
      html += esc(_citeLabel(first.ref));
      if(extraCount > 0){
        // Encode the extra ids so the popover can show all sources when clicked
        html += '<span class="cite-plus">+' + extraCount + '</span>';
        // Also expose the trailing ids on the chip's dataset for future popover use
        var extraIds = resolved.slice(1).map(function(r){return r.id}).join(",");
        // Re-open the chip with the data attribute (we already opened above, append via JS instead — simplest: include another attribute)
        // (Done via the data-extra-refs attribute added to the chip element below.)
      }
      html += '</span>';
    }
    lastIdx = m.index + m[0].length;
  }
  html += esc(s.slice(lastIdx));
  return html;
}

// Show/hide citation popover (single global element)
function showCitePop(anchor, refId) {

function stripCitations(str) {
  if (typeof str !== "string") return str;
  return str
    .replace(/]*>/g, "")
    .replace(/<\/antml:cite>/g, "")
    .replace(/<cite[^>]*>/g, "")
    .replace(/<\/cite>/g, "")
    .replace(/\[\d+(?:[-,:]\d+)*\]/g, "")  // also strip bracket citations like [1] [2-3]
    .trim();
}


// Strip references the model didn't actually cite in body text AND that aren't in retrieved RAG chunks.
function pruneFakeReferences(talk) {
  if (!talk || !Array.isArray(talk.references) || talk.references.length === 0) return talk;
  var bodyText = JSON.stringify(talk);
  var retrievedPmids = {};
  if (S.ragChunks && S.ragChunks.length) {
    for (var k = 0; k < S.ragChunks.length; k++) {
      if (S.ragChunks[k].pmid) retrievedPmids[String(S.ragChunks[k].pmid)] = true;
    }
  }
  talk.references = talk.references.filter(function(r) {
    if (!r) return false;
    var isRetrieved = r.pmid && retrievedPmids[String(r.pmid)];
    var bodyMentions = r.source && bodyText.indexOf(r.source) !== -1;
    // User uploads are trusted by definition — the user explicitly handed us this source
    var isUserUpload = r.type === "user-upload" || r.type === "user_upload" || r.type === "upload";
    return isRetrieved || bodyMentions || isUserUpload;
  });
  // ── NEW: audit inline PMIDs in the body prose. If Claude wrote "PMID 12345678" but that PMID is
  // neither in the retrieved RAG chunks nor in the (now-pruned) references array, strip the PMID
  // and replace with a generic [unverified] tag so the user sees the claim was not source-grounded.
  // Closes the biggest credibility hole flagged in the 2026-06-04 RAG audit.
  var trustedPmids = {};
  for (var rk in retrievedPmids) trustedPmids[rk] = true;
  (talk.references || []).forEach(function(r){ if (r && r.pmid) trustedPmids[String(r.pmid)] = true; });
  function auditInlinePmids(str) {
    if (typeof str !== "string") return str;
    var out = str;
    // First pass: strip parenthetical PMID mentions where the WHOLE parenthetical is unverified PMIDs
    //   "lower CV mortality (PMID 12345)" → "lower CV mortality"
    //   "lower CV mortality (PMID 12345, 67890)" → "lower CV mortality" if both unverified
    out = out.replace(/\s*\(\s*PMID\s*[:\-]?\s*[\d,;\s]+\)/gi, function(paren){
      var pmids = paren.match(/\d{6,9}/g) || [];
      var anyVerified = pmids.some(function(p){ return trustedPmids[p]; });
      if (anyVerified) {
        // keep verified PMIDs only inside the parenthetical
        var keep = pmids.filter(function(p){ return trustedPmids[p]; });
        return " (PMID " + keep.join(", ") + ")";
      }
      return ""; // all unverified — drop the whole parenthetical
    });
    // Second pass: bare "PMID 12345" tokens not inside parens
    out = out.replace(/\s*,?\s*PMID\s*[:\-]?\s*(\d{6,9})/gi, function(match, pmid){
      if (trustedPmids[pmid]) return " (PMID " + pmid + ")"; // keep verified
      return ""; // silently drop
    });
    // Cleanup: collapse double spaces, fix orphaned commas
    out = out.replace(/\s+([,.;])/g, "$1").replace(/\s{2,}/g, " ").trim();
    return out;
  }
  function walk(node) {
    if (typeof node === "string") return auditInlinePmids(node);
    if (Array.isArray(node)) return node.map(walk);
    if (node && typeof node === "object") {
      var out = {};
      for (var key in node) {
        // Don't audit inside the references array itself — those PMIDs are already pruned above
        if (key === "references") { out[key] = node[key]; continue; }
        out[key] = walk(node[key]);
      }
      return out;
    }
    return node;
  }
  return walk(talk);
}

// ═══════════ CLAIM-LEVEL CITATION VERIFICATION ═══════════
// pruneFakeReferences() only checks a cited PMID EXISTS in our trusted set (presence).
// This step closes the harder gap: does the cited abstract actually SUPPORT the specific
// sentence it's attached to? A real PMID next to a claim it doesn't substantiate reads as
// rigor without being rigor. We verify each (claim, abstract) pair against the retrieved
// abstracts (no extra fetch — we already hold them in S.ragChunks) and strip the inline
// PMID from any claim the source doesn't support.
async function verifyCitations(talk) {
  if (!talk || !S.ragChunks || !S.ragChunks.length) return talk;
  // Map of PMID -> abstract text for everything we actually retrieved.
  var absByPmid = {};
  for (var i = 0; i < S.ragChunks.length; i++) {
    var ch = S.ragChunks[i];
    if (ch.pmid && ch.text) absByPmid[String(ch.pmid)] = { abstract: ch.text, title: ch.title || "" };
  }
  if (!Object.keys(absByPmid).length) return talk;

  // Collect (claim string, pmid) pairs from inline "PMID 12345" / "(PMID 12345)" markers.
  // Only verify PMIDs we hold an abstract for; unknown ones are handled by pruneFakeReferences.
  var PMID_RE = /PMID\s*[:\-]?\s*(\d{6,9})/gi;
  var pairs = [];           // { claim, pmid }
  var seen = {};            // dedupe identical claim+pmid
  function collect(str) {
    if (typeof str !== "string") return;
    var m;
    PMID_RE.lastIndex = 0;
    while ((m = PMID_RE.exec(str)) !== null) {
      var pmid = m[1];
      if (!absByPmid[pmid]) continue;
      var key = pmid + "::" + str;
      if (seen[key]) continue;
      seen[key] = true;
      // The claim is the sentence/bullet the marker sits in, with citation noise removed.
      var claim = str.replace(/\(?\s*PMID\s*[:\-]?\s*\d{6,9}\s*\)?/gi, "").replace(/\s{2,}/g, " ").trim();
      if (claim.length >= 12) pairs.push({ claim: claim, pmid: pmid });
    }
  }
  function walkCollect(node) {
    if (typeof node === "string") collect(node);
    else if (Array.isArray(node)) node.forEach(walkCollect);
    else if (node && typeof node === "object") for (var k in node) { if (k !== "references") walkCollect(node[k]); }
  }
  walkCollect(talk);
  if (!pairs.length) return talk;
  // Bound cost: verify at most the first 14 distinct claim/PMID pairs.
  pairs = pairs.slice(0, 14);

  // One batched judge call. Returns, per index, whether the abstract supports the claim.
  var items = pairs.map(function(p, idx) {
    var src = absByPmid[p.pmid];
    return { i: idx, pmid: p.pmid, claim: p.claim, abstract: (src.abstract || "").slice(0, 1400) };
  });
  var sys = "You are a strict evidence auditor. For each item you are given a CLAIM from a medical teaching talk and the ABSTRACT of the source cited for it (by PMID). Decide whether the abstract DIRECTLY SUPPORTS the specific claim — i.e. a careful reader would agree the abstract substantiates that exact statement (same drug/threshold/population/direction of effect). General topical relatedness is NOT support. If the abstract is about the same disease but does not establish the specific claim, mark it unsupported. Output ONLY a JSON array, one object per item: {\"i\":<index>,\"supported\":true|false}. No other text.";
  var inp = JSON.stringify(items);
  var verdicts = {};
  try {
    var res = await callAPIWithFallback(sys, inp, 1024, [MODEL_CRITIC]);
    var arr = JSON.parse(fixJSON(res.txt));
    if (Array.isArray(arr)) arr.forEach(function(v){ if (v && typeof v.i === "number") verdicts[v.i] = !!v.supported; });
  } catch (e) {
    console.warn("Citation verification failed, leaving citations as-is:", e.message);
    return talk; // fail open — never block a talk on the auditor
  }

  // Build the set of (claim, pmid) pairs judged UNSUPPORTED, then strip just those inline markers.
  var stripSet = {};
  S.citeAudit = { checked: pairs.length, dropped: 0 };
  for (var pi = 0; pi < pairs.length; pi++) {
    if (verdicts[pi] === false) { stripSet[pairs[pi].pmid + "::" + pairs[pi].claim] = true; S.citeAudit.dropped++; }
  }
  if (!S.citeAudit.dropped) return talk;
  function stripUnsupported(str) {
    if (typeof str !== "string") return str;
    var claim = str.replace(/\(?\s*PMID\s*[:\-]?\s*\d{6,9}\s*\)?/gi, "").replace(/\s{2,}/g, " ").trim();
    var out = str.replace(PMID_RE, function(match, pmid) {
      return stripSet[pmid + "::" + claim] ? "" : match;
    });
    return out.replace(/\(\s*\)/g, "").replace(/\s+([,.;])/g, "$1").replace(/\s{2,}/g, " ").trim();
  }
  function walkStrip(node) {
    if (typeof node === "string") return stripUnsupported(node);
    if (Array.isArray(node)) return node.map(walkStrip);
    if (node && typeof node === "object") {
      var o = {};
      for (var k in node) { o[k] = (k === "references") ? node[k] : walkStrip(node[k]); }
      return o;
    }
    return node;
  }
  console.info("Citation audit: dropped " + S.citeAudit.dropped + "/" + S.citeAudit.checked + " unsupported inline PMID citation(s)");
  return walkStrip(talk);
}

function deepCleanCitations(obj) {
  if (typeof obj === "string") return stripCitations(obj);
  if (Array.isArray(obj)) return obj.map(deepCleanCitations);
  if (obj && typeof obj === "object") {
    var out = {};
    for (var k in obj) out[k] = deepCleanCitations(obj[k]);
    return out;
  }
  return obj;
}

function fixJSON(raw) {
  // Strip web search citation tags that leak into output
  var t = raw.replace(/]*>/g,"").replace(/<\/antml:cite>/g,"").replace(/<cite[^>]*>/g,"").replace(/<\/cite>/g,"");
  t = t.replace(/```json/g,"").replace(/```/g,"").trim();
  try { return JSON.parse(t), t; } catch(e) {}
  if (!t.endsWith("}")) { var idx = t.lastIndexOf("}"); if (idx > 0) t = t.substring(0, idx + 1); }
  try { return JSON.parse(t), t; } catch(e) {}
  var tryPoints = [];
  for (var i = t.length - 1; i > t.length * 0.3; i--) {
    if (t[i]==="}"||t[i]==="]"||t[i]==='"') tryPoints.push(i);
  }
  for (var p = 0; p < tryPoints.length && p < 40; p++) {
    var attempt = t.substring(0, tryPoints[p] + 1).replace(/,\s*$/,"");
    var ob=(attempt.match(/{/g)||[]).length-(attempt.match(/}/g)||[]).length;
    var sb=(attempt.match(/\[/g)||[]).length-(attempt.match(/\]/g)||[]).length;
    for(var k=0;k<sb;k++) attempt+="]";
    for(var k2=0;k2<ob;k2++) attempt+="}";
    ob=(attempt.match(/{/g)||[]).length-(attempt.match(/}/g)||[]).length;
    for(var k3=0;k3<ob;k3++) attempt+="}";
    try { return JSON.parse(attempt), attempt; } catch(e2) {}
  }
  return t;
}

function wrapText(text,max){if(!text||text.length<=max)return[text||""];var w=text.split(" "),l=[],c="";for(var i=0;i<w.length;i++){if((c+" "+w[i]).trim().length>max&&c){l.push(c.trim());c=w[i]}else c=(c+" "+w[i]).trim()}if(c)l.push(c.trim());return l.slice(0,3)}

function autoLayout(nodes,arrows){
  var inc={};for(var i=0;i<arrows.length;i++)inc[arrows[i].to]=true;
  var root=null;
  for(var i2=0;i2<nodes.length;i2++){if(nodes[i2].type==="title"){root=nodes[i2].id;break}}
  if(!root){for(var i3=0;i3<nodes.length;i3++){if(!inc[nodes[i3].id]){root=nodes[i3].id;break}}}
  if(!root)root=nodes[0].id;
  var ch={};for(var i4=0;i4<nodes.length;i4++)ch[nodes[i4].id]=[];

async function callAPI(sys, content, maxTok, opts) {
  opts = opts || {};
  var body = {
    model: opts.model || MODEL,
    max_tokens: maxTok,
    system: sys,
    messages: [{role:"user", content: content}]
  };
  if (opts.tools) body.tools = opts.tools;
  var useProxy = PROXY_CONFIG.enabled && PROXY_CONFIG.url && !S.useByok;
  var endpoint, headers;
  if (useProxy) {
    endpoint = PROXY_CONFIG.url.replace(/\/$/, "") + "/v1/messages";
    headers = {"Content-Type":"application/json"};
  } else {
    var key = getClaudeKey();
    if (!key) throw new Error("Anthropic API key required. Click 'Set key' in the header, or switch to Demo mode if available.");
    endpoint = "https://api.anthropic.com/v1/messages";
    headers = {"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
  }
  // Try the request with up to 2 retries for transient overload (529) / unavailable (503).
  var r, attempt = 0;
  while (true) {
    r = await fetch(endpoint, {method:"POST", headers:headers, body:JSON.stringify(body)});
    if (useProxy) {
      var rem = r.headers.get("X-RateLimit-Remaining");
      if (rem !== null && rem !== "") S.rateRemaining = parseInt(rem);
    }
    // Retry transient server overload up to 2 times with backoff
    if ((r.status === 529 || r.status === 503) && attempt < 2) {
      var waitMs = 4000 * (attempt + 1); // 4s, then 8s
      attempt++;
      await new Promise(function(resolve){setTimeout(resolve, waitMs)});
      continue;
    }
    break;
  }
  if(!r.ok){var e={};try{e=await r.json()}catch(x){}
    if (useProxy && r.status === 429) throw new Error("Daily demo-proxy limit reached. Switch to your own API key (top of header) for unlimited access, or come back tomorrow.");
    if (useProxy && r.status === 403) throw new Error("Demo proxy denied this origin. Open the deployed site or use your own API key.");
    // BYOK auth fail OR out-of-credits — prompt inline for a new key + retry once (don't loop forever).
    if (!useProxy && !opts.__retried) {
      var emsg = ((e.error && e.error.message) || "").toLowerCase();
      var isAuthFail = (r.status === 401 || r.status === 403);
      var isOutOfCredits = (r.status === 400 || r.status === 429) && /insufficient_quota|credit_balance|credit balance|exceeded.+credit|billing|payment/.test(emsg);
      if (isAuthFail || isOutOfCredits) {
        var reason = isOutOfCredits
          ? "⚠️ Your API key ran out of credits."
          : "⚠️ Your API key was rejected (auth error).";
        var newKey = promptForNewClaudeKey(reason);
        if (newKey) {
          // Retry the same call with the new key (loop guard via opts.__retried so we only retry once).
          return await callAPI(sys, content, maxTok, Object.assign({}, opts||{}, { __retried: true }));
        }
        // User cancelled — fall through to a friendly error.
        throw new Error(isOutOfCredits ? "API key is out of credits. Top up or set a new key, then click Generate again." : "API key required. Click 'Set key' in the header to add one.");
      }
    }
    if (r.status === 529 || r.status === 503) throw new Error("Anthropic servers are temporarily overloaded (we retried twice). This usually clears in 1-2 minutes — please wait and click Generate again. Boards mode uses Opus which is more capacity-constrained; if it persists, try Lecture mode (uses Haiku for review).");
    if (r.status === 408 || r.status === 504) throw new Error("Request timed out. Anthropic servers are slow right now — try again in a moment.");
    if (r.status >= 500) throw new Error("Anthropic API server error ("+r.status+"). Try again in a moment.");
    throw new Error((e.error&&e.error.message)||"API "+r.status)}
  var d=await r.json();var txt="";for(var i=0;i<(d.content||[]).length;i++){if(d.content[i].type==="text")txt+=d.content[i].text}return txt;
}

// Try a list of models in order; fall through to the next on overload/server errors only.
// Returns {txt, modelUsed} so the UI can show which model produced the result.
async function callAPIWithFallback(sys, content, maxTok, models, opts) {
  opts = opts || {};
  var lastError;
  for (var i = 0; i < models.length; i++) {
    try {
      var modelOpts = Object.assign({}, opts, {model: models[i]});
      var txt = await callAPI(sys, content, maxTok, modelOpts);
      return {txt: txt, modelUsed: models[i], fellBack: i > 0};
    } catch (e) {
      lastError = e;
      // Only fall back on transient overload / server errors. Don't fall back on auth/key/rate-limit.
      var msg = String(e.message || "");
      var isOverload = /overloaded|server error|timed out|^API 5\d\d/i.test(msg);
      if (!isOverload || i === models.length - 1) throw e;
      console.warn("Model " + models[i] + " unavailable, falling back to " + models[i+1] + ": " + msg);
    }
  }
  throw lastError || new Error("All model fallbacks failed");
}

// ═══════════ RAG RETRIEVAL ═══════════
async function retrieveRAG(topic, opts) {
  opts = opts || {};
  if (!RAG_CONFIG.enabled || !RAG_CONFIG.url) return {text: "", chunks: []};
  // ── Retrieval quality floors ──────────────────────────────────────────────
  // Weakly-related chunks (the 0.16–0.30 tail seen in the old sources panel) were
  // reaching the prompt and diluting grounding. Embeddings are over (title+abstract)
  // vs a SHORT topic query, so absolute cosine runs low even for good matches — a
  // naive high floor would return nothing. So we combine:
  //   • ABS_FLOOR  — a modest absolute minimum to drop the genuinely-irrelevant tail
  //   • REL_DELTA  — keep only chunks within this gap of the BEST match (the strong cluster)
  // and never starve the prompt (always keep at least the top 2 candidates).
  var ABS_FLOOR = (typeof opts.minSim === "number") ? opts.minSim : 0.30;
  var REL_DELTA = (typeof opts.relDelta === "number") ? opts.relDelta : 0.08;
  var MAX_KEEP = opts.maxKeep || 6;
  try {
    var endpoint = RAG_CONFIG.url.replace(/\/$/, "") + "/retrieve";
    var r = await fetch(endpoint, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      // Pull a wider candidate set, then gate client-side so the relative filter has options.
      body: JSON.stringify({ query: topic, match_count: opts.match_count || 12, min_similarity: ABS_FLOOR })
    });
    if (!r.ok) { console.warn("RAG retrieve failed: " + r.status); return {text: "", chunks: []}; }
    var data = await r.json();
    var chunks = data.chunks || [];
    if (!chunks.length) return {text: "", chunks: []};
    // Absolute floor (backstop in case the worker didn't enforce it).
    chunks = chunks.filter(function(c){ return typeof c.similarity !== "number" || c.similarity >= ABS_FLOOR; });
    if (chunks.length) {
      // Relative floor: keep only the top similarity cluster.
      var topSim = chunks.reduce(function(m,c){ return (typeof c.similarity === "number" && c.similarity > m) ? c.similarity : m; }, 0);
      var relFloor = topSim - REL_DELTA;
      var strong = chunks.filter(function(c){ return typeof c.similarity !== "number" || c.similarity >= relFloor; });
      // Don't starve the prompt — keep the 2 best candidates even if the gate is strict.
      if (strong.length < 2) strong = chunks.slice(0, 2);
      chunks = strong.slice(0, MAX_KEEP);
    }
    if (!chunks.length) { console.info("RAG: all chunks below similarity floor for \"" + topic + "\""); return {text: "", chunks: []}; }
    var lines = chunks.map(function(c, i) {
      var auths = (c.authors || "").split(",").slice(0, 3).join(",");
      if (c.authors && c.authors.split(",").length > 3) auths += " et al.";
      return "[" + (i+1) + "] " + (c.title || "(untitled)") + " — " + auths + ". " + (c.journal || "") + " " + (c.year || "") + ". PMID: " + (c.pmid || "n/a") + ".\nAbstract: " + (c.text || "");
    });
    var text = "\n\n═══ RETRIEVED PUBMED SOURCES (real, verified citations — use these to ground your talk) ═══\nThese are REAL peer-reviewed sources retrieved for THIS topic. CITATION RULE: When you state a specific clinical fact (number, threshold, rate, NNT, hazard ratio, drug dose, treatment efficacy, mortality, prognosis, guideline recommendation), cite a provided PMID inline using EXACTLY the format \"PMID 12345678\" — the word PMID followed by a space and the number, in running text where the fact is stated, no brackets, no colon. Aim for AT LEAST 3 inline PMID citations across the talk on the most quantitative/specific claims. NEVER invent PMIDs — only use PMIDs from the sources listed below. If a claim has no matching source here, teach it normally from your training but skip the citation for that claim. Use your full clinical knowledge for teaching; the sources are for citation grounding, not to replace your pedagogical voice.\n\n" + lines.join("\n\n---\n\n") + "\n═══ END RETRIEVED SOURCES ═══";
    return {text: text, chunks: chunks};
  } catch (e) {
    console.warn("RAG retrieve error: " + e.message);
    return {text: "", chunks: []};
  }
}

function buildReferenceParts(files) {
  var parts = [];
  if (!files || !files.length) return parts;
  parts.push({
    type: "text",
    text: "\n\n═══ USER-UPLOADED REFERENCE MATERIALS ═══\nUse the following uploaded reference materials as PRIMARY source context. Prefer them over general model knowledge when there is a conflict. If you draw a clinical claim from one of these uploaded references, ADD it to the references array as a new entry with type:\"user-upload\", source:\"<the filename>\", year:null, society:null, url:null, AND cite it inline with [N] just like any other reference. Treat user uploads as evidence-grounded — they're material the user explicitly trusts. Flag uncertainty rather than inventing details for content not in the uploaded source."
  });
  for (var i = 0; i < files.length; i++) {
    var f = files[i] || {};
    var label = "Reference " + (i + 1) + ": " + (f.n || "untitled");
    if (f.t === "text") {
      parts.push({ type: "text", text: "\n\n--- " + label + " ---\n" + (f.c || "").slice(0, 12000) });
    } else if (f.t === "pdf" && f.c) {
      parts.push({ type: "text", text: "\n\n--- " + label + " (PDF) ---" });
      parts.push({
        type: "document",
        source: { type: "base64", media_type: "application/pdf", data: f.c },
        title: f.n || ("reference-" + (i + 1) + ".pdf")
      });
    } else if (f.t === "img" && f.c) {
      parts.push({ type: "text", text: "\n\n--- " + label + " (image) ---" });
      parts.push({
        type: "image",
        source: { type: "base64", media_type: f.m || "image/png", data: f.c }
      });
    }
  }
  parts.push({ type: "text", text: "\n═══ END USER-UPLOADED REFERENCES ═══" });
  return parts;
}

      var txt=await callAPI('Generate JSON for a CLEAN MEDICAL FLOWCHART in the style of Pathoma, Robbins Pathology, or a USMLE board review figure. NOT a beautiful illustration \u2014 a tight clinical-reasoning diagram with crisp labeled boxes and arrows.\n\nFormat: {"nodes":[{"id":"n1","label":"Concise label","type":"title"}],"arrows":[{"from":"n1","to":"n2","label":"optional edge label"}]}\n\nCOMMIT TO FLOWCHART AESTHETIC:\n- ONE title node at top = the key concept being taught (the takeaway, not the disease name)\n- Then a hierarchical/decision-tree structure: mechanism \u2192 consequence \u2192 clinical finding \u2192 workup \u2192 treatment\n- 7-9 nodes total (max 10). Fewer is better than crammed.\n- Labels SHORT: 2-5 words each. NEVER a full sentence. If you need a sentence, break it into 2 nodes.\n- Use arrow labels for relationships: "leads to", "blocks", "\u2191", "\u2193", "if positive", "if negative", "first-line", "if refractory" \u2014 make causality explicit.\n- Branching is GOOD when the topic has decision points (e.g. "ferritin >300?" \u2192 Yes branch / No branch). Use it.\n- Node types pick the right one: "title" (the main concept, EXACTLY 1), "accent" (key transitions/turning points), "formula" (equations, scoring criteria, named ratios), "warning" (red flags, contraindications, pitfalls \u2014 use red/orange), "box" (default for everything else).\n- NO redundant nodes. NO decorative nodes. Every node earns its place by adding a real teaching point or decision.\n\nNo x/y coordinates \u2014 layout is computed automatically. Output ONLY the JSON, no commentary.',"Topic: "+sm,1200);
      var p=JSON.parse(fixJSON(txt));
      if(p.nodes&&p.nodes.length>0){autoLayout(p.nodes,p.arrows||[]);S.dg={svg:p}}
      else throw new Error("No nodes returned");
    }catch(e){S.dgErr="Failed: "+e.message}
    S.dgBusy=false;render();
    return;
  }

  if(S.dgMode==="openai"){
    // ChatGPT image generation via the Cloudflare proxy. Direct browser calls to
    // OpenAI commonly fail before returning an API response.
    var imageProxy=getImageProxyURL();
    var oaKey=imageProxy ? null : getOpenAIKey();
    if(!imageProxy&&!oaKey){S.dgErr="OpenAI API key required (or switch to Gemini)";S.dgBusy=false;render();return}
    try{
      var oaPrompt=buildImagePrompt(sm);
      var oaEndpoint=imageProxy ? imageProxy + "/v1/images/generations" : "https://api.openai.com/v1/images/generations";
      var oaHeaders={"Content-Type":"application/json"};
      if(oaKey)oaHeaders.Authorization="Bearer "+oaKey;
      var oaRes=await fetch(oaEndpoint,{
        method:"POST",
        headers:oaHeaders,
        body:JSON.stringify({
          model:"gpt-image-1.5",  // Bump to "gpt-image-2" once OpenAI org verification is complete (gpt-image-2 is gated)
          prompt:oaPrompt,
          size:"1536x1024",
          quality:"high",
          n:1
        })
      });
      if(!oaRes.ok){
        var oaErrTxt=await oaRes.text();
        if(oaRes.status===401||oaRes.status===403){
          localStorage.removeItem("openai_api_key");
          throw new Error("OpenAI API key rejected ("+oaRes.status+"). Cleared \u2014 try again to re-enter.");
        }
        throw new Error("OpenAI API "+oaRes.status+": "+oaErrTxt.slice(0,200));
      }
      var oaData=await oaRes.json();
      var oaImgB64=oaData.data&&oaData.data[0]&&oaData.data[0].b64_json;
      if(!oaImgB64)throw new Error("No image returned from OpenAI.");
      S.dg={imgB64:oaImgB64};
    }catch(e){
      var msg=e&&e.message?e.message:"unknown error";
      if(/failed to fetch|networkerror|load failed/i.test(msg))msg="Could not reach OpenAI from the browser. Use the deployed proxy or switch to Gemini.";
      S.dgErr="Failed: "+msg
    }
    S.dgBusy=false;render();
    return;
  }

  // AI illustration via Gemini Nano Banana 2 (default "ai" mode)
  var key=getGeminiKey();
  if(!key){S.dgErr="Gemini API key required (or switch to ChatGPT / Simple Diagram)";S.dgBusy=false;render();return}
  try{
    var imgPrompt=buildImagePrompt(sm);
    var res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-3-pro-image:generateContent?key="+encodeURIComponent(key),{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        contents:[{parts:[{text:imgPrompt}]}],
        generationConfig:{
          responseModalities:["TEXT","IMAGE"],
          imageConfig:{aspectRatio:"16:9",imageSize:"2K"}
        }
      })
    });
    if(!res.ok){
      var errTxt=await res.text();
      if(res.status===400||res.status===401||res.status===403){
        localStorage.removeItem("gemini_api_key");
        throw new Error("API key rejected ("+res.status+"). Cleared \u2014 try again to re-enter.");
      }
      throw new Error("Gemini API "+res.status+": "+errTxt.slice(0,200));
    }
    var data=await res.json();
    var imgB64=null;
    if(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts){
      for(var pi=0;pi<data.candidates[0].content.parts.length;pi++){
        var pt=data.candidates[0].content.parts[pi];
        if(pt.inlineData&&pt.inlineData.data){imgB64=pt.inlineData.data;break}
        if(pt.inline_data&&pt.inline_data.data){imgB64=pt.inline_data.data;break}
      }
    }
    if(!imgB64)throw new Error("No image returned. Check that the Image model is enabled for your key.");
    S.dg={imgB64:imgB64};
  }catch(e){S.dgErr="Failed: "+e.message}
  S.dgBusy=false;render();
}

// Detect when the user wants a RADICAL rewrite (full regenerate) vs. a normal additive refine.
// Default is additive \u2014 only trigger a full regen when they clearly say so. Keeps the user's good content
// intact when they're just adding context (e.g. "include EGPA" or "add a pregnancy section").
function isRadicalRevision(msg){
  var m = String(msg||"").toLowerCase();
  return /\b(rewrite|redo|start over|from scratch|completely (?:different|new|change)|trash (?:it|this)|throw (?:it|this) out|wrong angle|totally different|new approach|different approach|scrap (?:it|this)|change everything|regenerate)\b/.test(m);
}

// Additive refinement \u2014 pass the EXISTING talk JSON to Claude + the user's add/change request.
// Explicitly tells the model: preserve sections, pearls, citations, references. ONLY add new content
// (new sections, new bullets, new references) unless the user explicitly asked to remove something.
// Snapshot the current talk so a refine/edit can be undone.
// Stores a deep clone — never mutate a snapshot in place. Caps history at 8 entries.
function pushTalkHistory(label){
  if(!S.talk)return;
  try{
    var snap = {
      label: label || "edit",
      at: Date.now(),
      talk: JSON.parse(JSON.stringify(S.talk))
    };
    S.talkHistory.push(snap);
    if(S.talkHistory.length > 8) S.talkHistory.shift();
  }catch(e){console.warn("pushTalkHistory failed:",e)}
}
function undoLastEdit(){
  if(!S.talkHistory.length)return;
  var snap = S.talkHistory.pop();
  S.talk = snap.talk;
  S.talkIsSaved = false; // undoing puts us back at an unsaved state
  // Clear visuals/podcast — they were tied to the post-refine version
  S.dg = null; S.dgErr = ""; S.podScript = "";
  S.editingSection = null; S.editingDraft = null;
  render();
}

async function weaveRevision(userMsg){
  if(!S.talk) return;
  var existingJson = JSON.stringify(S.talk);
  var sys = "You are refining an existing chalk talk for an internal medicine educator. " +
    "The user wants to ADD content, not start over.\n\n" +
    "INTERNAL AUDIT PROCESS (do this BEFORE writing the JSON, do not include in output):\n" +
    "1. Read the user's request and identify the SPECIFIC concepts/facts they want incorporated. Often a user pastes a large block of text (e.g. an OpenEvidence dump, MKSAP excerpt, society guideline passage) just to make sure ONE or TWO key points land. Extract those points; don't blindly absorb the whole dump.\n" +
    "2. For EACH extracted concept, scan the existing talk JSON in full. Ask:\n" +
    "   (a) Is this concept ALREADY covered? Check the sections' points, teaching_pearl, board_tip, summary_points, AND visual_memory_card quadrants. If it's already present in any meaningful form, DO NOT add it again \u2014 note internally that it's already covered and skip the addition.\n" +
    "   (b) If only partially covered (e.g. the talk mentions the drug but not the dose, or names the trial but not the year), make a TARGETED addition to the existing location \u2014 don't create a parallel section.\n" +
    "   (c) If genuinely new: identify which existing section it BELONGS in by topic affinity. Prefer extending an existing section over creating a new one. Only create a new section if the concept truly doesn't fit any existing one.\n" +
    "3. After this audit, plan the minimum number of edits needed. Fewer changes is better.\n\n" +
    "PRESERVATION RULES (strict):\n" +
    "- KEEP all existing sections, teaching pearls, board tips, summary points, visual memory card quadrants, and references that are already working.\n" +
    "- KEEP the title and subtitle unless the user's request directly contradicts them.\n" +
    "- KEEP the citation IDs as they are; if you add new references, assign them new IDs continuing from the existing list.\n" +
    "ADDITION RULES:\n" +
    "- You MAY add new sections, new bullets to existing sections, new references, new teaching pearls \u2014 whatever the user asked for AND that isn't already present.\n" +
    "- You MAY expand or clarify existing content when the user's request demands it (e.g. 'go deeper on physiology').\n" +
    "- You MUST NOT delete or rewrite working content unless the user EXPLICITLY asked you to remove or replace something.\n" +
    "- You MUST NOT duplicate concepts that already exist in the talk in any form (bullet, pearl, board tip, summary point, or VMC quadrant). Re-read the existing talk before adding ANY new content to verify.\n" +
    "- If the user asks to add a topic that overlaps with an existing section, weave it in (add bullets, extend the section heading) rather than creating a duplicate section.\n" +
    "- New bullets MUST be added to the most topically relevant existing section. Do not put a new mechanism bullet into the treatment section, or a new treatment bullet into the physiology section.\n" +
    "- If the user uploaded reference PDFs/notes (in the context below), use them as PRIMARY sources for the new additions and add them to the references array. But still apply the duplication audit \u2014 only add what's NEW vs. the existing talk.\n" +
    "SELF-CHECK BEFORE RETURNING:\n" +
    "- Did you add anything that's already in the talk in another form? If yes, remove the duplicate.\n" +
    "- Is each new bullet in the section it topically belongs to?\n" +
    "- If the user's request was already 100% covered, return the talk unchanged with a 'note' field at the top level saying \"User-requested content was already covered \u2014 no changes needed.\" (Otherwise omit the note field entirely.)\n" +
    "Return the COMPLETE updated talk JSON in the EXACT same schema. ONLY JSON, no commentary, no markdown fences.";
  // Inject trial expansions if the user's refine references a curated landmark trial
  var weaveTrialContext = buildTrialExpansionContext(userMsg, "");
  var content = "USER REQUEST: " + userMsg + weaveTrialContext + "\n\nEXISTING TALK JSON (preserve this, weave in additions):\n" + existingJson;
  var txt = await callAPI(sys, content, 8192);
  var parsed = JSON.parse(fixJSON(txt));
  parsed = deepCleanCitations(parsed);
  if(typeof pruneFakeReferences === "function") parsed = pruneFakeReferences(parsed);
  return parsed;
}

async function sendChat(){
  if(!S.chatIn.trim()||S.chatBusy||S.loading)return;
  var msg=S.chatIn.trim();S.chatIn="";S.reviseIn="";
  // Keep the composer OPEN during the refine so the user can see the working state.
  // It auto-closes only after success or error (see end of weave-path below).
  if(!S.talk){
    // No talk loaded \u2014 interpret the input as a topic.
    S.topic=msg;
    S.msgs.push({r:"u",t:msg});
    S.msgs.push({r:"a",t:'Topic set to "'+msg+'". Tap Generate to start.'});
    render();
    return;
  }

  S.msgs.push({r:"u",t:msg});
  if(isRadicalRevision(msg)){
    // User signalled they want a fresh take \u2014 full regenerate path (RAG + peer review + everything).
    pushTalkHistory("rewrite"); // snapshot for undo
    S.refineContext = (S.refineContext && S.refineContext.trim() ? S.refineContext.trim() + "\n\nAlso: " : "") + msg;
    S.msgs.push({r:"a",t:"Regenerating the lesson from scratch with your direction\u2026"});
    render();
    generate();
    return;
  }

  // Default \u2014 additive weave. Keep what's working, add the requested content.
  pushTalkHistory("refine"); // snapshot for undo
  S.chatBusy=true;
  S.msgs.push({r:"a",t:"Weaving in your update (preserving the rest of the lesson)\u2026"});
  render();
  try{
    var updated = await weaveRevision(msg);
    if(updated && (updated.title || updated.question)){
      // Detect the "already covered" signal from the audit step \u2014 model returns the talk unchanged
      // with a top-level note field if everything the user asked for was already in the talk.
      var alreadyCovered = updated.note && /already covered|no changes needed/i.test(updated.note);
      if(alreadyCovered){
        // Don't replace S.talk (nothing changed). Strip the note from what we'd save.
        S.msgs.push({r:"a",t:"\u2139\ufe0f The content you asked about is already in the lesson \u2014 no changes made. Say \"add detail about X\" or \"rewrite\" if you want me to expand or replace something."});
      } else {
        // Strip any stray note field before persisting.
        if(updated.note) delete updated.note;
        S.talk = updated;
        // Don't reset section index / mode \u2014 user stays where they were in the talk.
        S.dg = null; S.dgErr = ""; S.podScript = ""; // visuals/podcast may need refresh after content change
        S.talkIsSaved = false; // edits made \u2014 unsaved again
        S.msgs.push({r:"a",t:"\u2713 Updated \u2014 only what was new was added, in the relevant section. Existing content preserved. Say \"rewrite\" if you want a full regenerate instead."});
      }
      S._composerOpen = false; // auto-collapse on success
    } else {
      S.msgs.push({r:"a",t:"Couldn't parse the update \u2014 try again or say \"rewrite\" for a full regenerate."});
    }
  } catch(e){
    S.msgs.push({r:"a",t:"Refine failed: "+e.message+". Try \"rewrite\" if you want a full regenerate."});
  }
  S.chatBusy=false;render();
}

function playPod(){

}
