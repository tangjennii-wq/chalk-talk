// ═══════════ RAG RETRIEVAL ═══════════
async function retrieveRAG(topic, opts) {
  opts = opts || {};
  if (!RAG_CONFIG.enabled || !RAG_CONFIG.url) return {text: "", chunks: []};
  // ── Retrieval quality floors ──────────────────────────────────────────────
  // Weakly-related chunks (the 0.16–0.30 tail seen in the old sources panel) were
  // reaching the prompt and diluting grounding. Embeddings are over (title+abstract)
  // vs a SHORT topic query, so absolute cosine runs low even for good matches — a
  // naive high floor would return nothing. So we combine:
  //   • ABS_FLOOR  — a modest absolute minimum to drop the genuinely-irrelevant tail
  //   • REL_DELTA  — keep only chunks within this gap of the BEST match (the strong cluster)
  // and never starve the prompt (always keep at least the top 2 candidates).
  var ABS_FLOOR = (typeof opts.minSim === "number") ? opts.minSim : 0.30;
  var REL_DELTA = (typeof opts.relDelta === "number") ? opts.relDelta : 0.08;
  var MAX_KEEP = opts.maxKeep || 6;
  try {
    var endpoint = RAG_CONFIG.url.replace(/\/$/, "") + "/retrieve";
    var r = await fetch(endpoint, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      // Pull a wider candidate set, then gate client-side so the relative filter has options.
      body: JSON.stringify({ query: topic, match_count: opts.match_count || 12, min_similarity: ABS_FLOOR })
    });
    if (!r.ok) { console.warn("RAG retrieve failed: " + r.status); return {text: "", chunks: []}; }
    var data = await r.json();
    var chunks = data.chunks || [];
    if (!chunks.length) return {text: "", chunks: []};
    // Absolute floor (backstop in case the worker didn't enforce it).
    chunks = chunks.filter(function(c){ return typeof c.similarity !== "number" || c.similarity >= ABS_FLOOR; });
    if (chunks.length) {
      // Relative floor: keep only the top similarity cluster.
      var topSim = chunks.reduce(function(m,c){ return (typeof c.similarity === "number" && c.similarity > m) ? c.similarity : m; }, 0);
      var relFloor = topSim - REL_DELTA;
      var strong = chunks.filter(function(c){ return typeof c.similarity !== "number" || c.similarity >= relFloor; });
      // Don't starve the prompt — keep the 2 best candidates even if the gate is strict.
      if (strong.length < 2) strong = chunks.slice(0, 2);
      chunks = strong.slice(0, MAX_KEEP);
    }
    if (!chunks.length) { console.info("RAG: all chunks below similarity floor for \"" + topic + "\""); return {text: "", chunks: []}; }
    var lines = chunks.map(function(c, i) {
      var auths = (c.authors || "").split(",").slice(0, 3).join(",");
      if (c.authors && c.authors.split(",").length > 3) auths += " et al.";
      return "[" + (i+1) + "] " + (c.title || "(untitled)") + " — " + auths + ". " + (c.journal || "") + " " + (c.year || "") + ". PMID: " + (c.pmid || "n/a") + ".\nAbstract: " + (c.text || "");
    });
    var text = "\n\n═══ RETRIEVED PUBMED SOURCES (real, verified citations — use these to ground your talk) ═══\nThese are REAL peer-reviewed sources retrieved for THIS topic. CITATION RULE: When you state a specific clinical fact (number, threshold, rate, NNT, hazard ratio, drug dose, treatment efficacy, mortality, prognosis, guideline recommendation), cite a provided PMID inline using EXACTLY the format \"PMID 12345678\" — the word PMID followed by a space and the number, in running text where the fact is stated, no brackets, no colon. Aim for AT LEAST 3 inline PMID citations across the talk on the most quantitative/specific claims. NEVER invent PMIDs — only use PMIDs from the sources listed below. If a claim has no matching source here, teach it normally from your training but skip the citation for that claim. Use your full clinical knowledge for teaching; the sources are for citation grounding, not to replace your pedagogical voice.\n\n" + lines.join("\n\n---\n\n") + "\n═══ END RETRIEVED SOURCES ═══";
    return {text: text, chunks: chunks};
  } catch (e) {
    console.warn("RAG retrieve error: " + e.message);
    return {text: "", chunks: []};
  }
}

// ═══════════ ACTIONS ═══════════
// Reference-upload limits (Jenni 2026-07). The Worker caps request bodies at 5 MB and base64 inflates
// raw bytes ~33%, and the system prompt + RAG context also share that budget — so cap each file at
// 3.5 MB raw (~4.7 MB base64) and the whole upload set at 8 files. Text is truncated in buildReferenceParts.
var MAX_UPLOAD_BYTES = 3.5 * 1024 * 1024;
var MAX_UPLOAD_FILES = 8;
var ALLOWED_UPLOAD_RE = /\.(pdf|txt|md|png|jpe?g)$/i;

function _fileToast(msg){ S.savedFlash = msg; if(typeof render==="function") render(); setTimeout(function(){ if(S.savedFlash===msg){ S.savedFlash=""; if(typeof render==="function") render(); } }, 4500); }

// Turn a raw thrown error into a clear, actionable, non-technical message for the user. Our own
// intentionally-friendly errors (overload notice, key prompts, etc.) pass through unchanged; this only
// rewrites the leaky ones — JSON SyntaxErrors, "Failed to fetch", raw "API 400: {...}" passthroughs, and
// stack-ish noise — into plain guidance. (Jenni 2026-07 — Codex reliability pass)
function humanizeError(e){
  var m = (e && e.message) ? String(e.message) : String(e || "");
  if(!m) return "Something went wrong. Please try again.";
  if(/Unexpected token|Unexpected end of (JSON|input)|in JSON at position|is not valid JSON|JSON\.parse|Empty response/i.test(m))
    return "The AI returned an incomplete response. Tap Generate again — a retry almost always fixes it.";
  if(/Failed to fetch|NetworkError|Load failed|ERR_[A-Z]|ECONN|net::/i.test(m))
    return "Network hiccup — check your connection and tap Generate again.";
  if(/timed out|timeout|\b408\b|\b504\b/i.test(m))
    return "That took too long to come back. Tap Generate again.";
  if(/overloaded|\b529\b|temporarily (unavailable|overloaded)/i.test(m))
    return "The AI servers are briefly overloaded. Wait a moment, then tap Generate again.";
  if(/^API \d{3}\b/i.test(m) || /"type":\s*"|\bat <anonymous>|\bTypeError\b|\bReferenceError\b|undefined is not/i.test(m))
    return "Generation failed (server error). Please try again in a moment.";
  return m;
}

// Single robust entry point for BOTH uploaders (drop zone + composer). Validates type/size, reads each
// file with per-file error handling, dedupes by name+size, and gives the user clear feedback on any
// reject — instead of the old silent try/catch that dropped bad files without a word. Fixes the
// closure bug where async onload callbacks all captured the loop's last file. (Jenni 2026-07)
function addUploadedFiles(fileList){
  var arr = Array.prototype.slice.call(fileList || []);
  if(!arr.length) return;
  var rejected = [];
  arr.forEach(function(f){
    if(!f) return;
    if((S.files||[]).length >= MAX_UPLOAD_FILES){ rejected.push(f.name + " (max " + MAX_UPLOAD_FILES + " files)"); return; }
    var isText = f.type.indexOf("text")>=0 || /\.(txt|md)$/i.test(f.name);
    var isPdf  = f.type==="application/pdf" || /\.pdf$/i.test(f.name);
    var isImg  = f.type.indexOf("image/")===0 || /\.(png|jpe?g)$/i.test(f.name);
    if(!isText && !isPdf && !isImg && !ALLOWED_UPLOAD_RE.test(f.name||"")){ rejected.push(f.name + " (unsupported type)"); return; }
    if(f.size > MAX_UPLOAD_BYTES){ rejected.push(f.name + " (too large — max 3.5 MB)"); return; }
    // Dedupe: same name + size already queued.
    if((S.files||[]).some(function(x){ return x._name===f.name && x._size===f.size; })){ return; }
    var reader = new FileReader();
    reader.onerror = function(){ _fileToast("⚠ Couldn't read " + f.name + " — try re-saving or another file."); };
    if(isText){
      reader.onload = function(){
        try{ S.files.push({ n:f.name, t:"text", c:String(reader.result||"").slice(0,12000), _name:f.name, _size:f.size }); if(typeof render==="function") render(); }
        catch(_){ _fileToast("⚠ Couldn't attach " + f.name + "."); }
      };
      reader.readAsText(f);
    } else {
      reader.onload = function(){
        try{
          var b64 = String(reader.result||"").split(",")[1] || "";
          if(!b64){ _fileToast("⚠ " + f.name + " came back empty."); return; }
          S.files.push({ n:f.name, t: isPdf ? "pdf" : "img", c:b64, m:(f.type|| (isPdf?"application/pdf":"image/png")), _name:f.name, _size:f.size });
          if(typeof render==="function") render();

function buildReferenceParts(files) {
  var parts = [];
  if (!files || !files.length) return parts;
  parts.push({
    type: "text",
    text: "\n\n═══ USER-UPLOADED REFERENCE MATERIALS ═══\nUse the following uploaded reference materials as PRIMARY source context. Prefer them over general model knowledge when there is a conflict. If you draw a clinical claim from one of these uploaded references, ADD it to the references array as a new entry with type:\"user-upload\", source:\"<the filename>\", year:null, society:null, url:null, AND cite it inline with [N] just like any other reference. Treat user uploads as evidence-grounded — they're material the user explicitly trusts. Flag uncertainty rather than inventing details for content not in the uploaded source."
  });
  for (var i = 0; i < files.length; i++) {
    var f = files[i] || {};
    var label = "Reference " + (i + 1) + ": " + (f.n || "untitled");
    if (f.t === "text") {
      parts.push({ type: "text", text: "\n\n--- " + label + " ---\n" + (f.c || "").slice(0, 12000) });
    } else if (f.t === "pdf" && f.c) {
      parts.push({ type: "text", text: "\n\n--- " + label + " (PDF) ---" });
      parts.push({
        type: "document",
        source: { type: "base64", media_type: "application/pdf", data: f.c },
        title: f.n || ("reference-" + (i + 1) + ".pdf")
      });
    } else if (f.t === "img" && f.c) {
      parts.push({ type: "text", text: "\n\n--- " + label + " (image) ---" });
      parts.push({
        type: "image",
        source: { type: "base64", media_type: f.m || "image/png", data: f.c }
      });
    }
  }
  parts.push({ type: "text", text: "\n═══ END USER-UPLOADED REFERENCES ═══" });
  return parts;
}

  // speedup; user can read while the audit runs.)
  // CHARGE-AFTER consume (Jenni 2026-07-03): we're past the cancel + stale-gen guards, the draft
  // succeeded and the talk is real — NOW consume 1 talk. A failed/cancelled/superseded generation
  // returned earlier and never reaches here, so it never charges. If the atomic decrement reports
  // paused/exhausted at this point, we still show this already-generated talk (the owner was billed);
  // the counter just floors at 0.
  // ASYNC EXCEPTION: the background path consumes quota SERVER-SIDE (see worker runGeneration), so the
  // charge happens even if the user never reconnects. Skip the client consume here to avoid
  // double-charging. Only the synchronous path consumes on the client. (Jenni 2026-07-03)
  if(genUsesFreeTier() && !_useAsync){
    try{ await consumeFreeTier("talk"); }catch(_){}
  } else if(_useAsync && typeof refreshFreeTierStatus === "function"){
    // Quota was decremented on the server — refresh the badge so the client count stays in sync.
    try{ refreshFreeTierStatus(); }catch(_){}
  }
  S.citationAuditPending = true;
  S.talk = finalTalk;
    S.sec=0;S.dg=null;S.dgErr="";S.podScript="";
    if (glRef) { S.glRef = glRef; } else { S.glRef = null; }
    // Always cache the depth we just generated so an immediate flip back is instant AND both variants
    // are available to save together. resetAll() clears this cache between talks, so it can never show
    // a prior talk's variant. (Jenni 2026-07 — depth-variant fixes.)
    if(!S.depthVariantsCache) S.depthVariantsCache = {};
    S.depthVariantsCache[S.depth] = finalTalk;
    // Option B: a depth flip on an already-SAVED cloud talk merges the new variant into the same row.
    if(S._pendingDepthMerge && S.loadedTalkId && !String(S.loadedTalkId).startsWith("t_")){
      S._pendingDepthMerge = false;
      cloudUpsertDepthVariant(S.loadedTalkId, S.depth, finalTalk).then(function(ok){
        if(!ok) console.warn("Depth variant merge failed — talk loaded in memory but not persisted to existing row.");
      });
    } else if(S.loadedTalkId && S.talkIsSaved){
      // A depth flip on an UNSAVED-locally or non-merge saved talk → mark dirty so the pill shows
      // "Save changes" (the newly-generated variant isn't persisted yet). (Jenni 2026-07)
      S.talkIsSaved = false;
    }
  }catch(e){
    // Clear THIS gen's persisted background job so a stale one isn't resumed on next load — but only
    // if we're still the current generation. If a restart superseded us (genId bumped), the NEW gen
    // already wrote its own jobId here; don't clobber it. (Jenni 2026-07-03)
    // EXCEPTION: on a poll TIMEOUT the server job is likely still running (and the talk was paid for) —
    // keep the reconnect key so a reload can pick it back up rather than abandoning it. (Audit fix)
    if(_myGenId === S.genId && !(e && e.code === "timeout")){ try { localStorage.removeItem(ASYNC_GEN_CONFIG.jobKey); } catch(_){} }
    // "cancelled" (from the async poll, on user-cancel OR a superseding restart) and stale-gen are
    // silent — not real errors. (Jenni 2026-07-03)
    if(!S.genCancelled && !(e && e.code === "cancelled") && _myGenId === S.genId){
      // Free-tier signals (rare here — quota is pre-consumed — but cap can flip mid-flight).
      if(e && (e.code === "quota_exceeded" || e.code === "free_tier_paused")){
        if(e.code === "free_tier_paused") S.freePausedMsg = e.message || "Chalk Talk's free tier is paused for this month.";
        S.showOutOfFreeModal = true;
      } else if(e && e.code === "auth_invalid"){
        S.error = "Your session expired — please sign in again.";
      } else if(e && e.code === "timeout"){
        // Server job is still running — show its own message (reload to reconnect), NOT the generic
        // "tap Generate again" that humanizeError would produce (which would double-generate).
        S.error = e.message;
      } else {
        S.error = humanizeError(e);
      }
    }
  }
  // If a restart superseded this generation (genId bumped), a NEW generate() already owns the loading
  // UI + timer. Bail out so this stale invocation's teardown doesn't clear the new gen's spinner/timer
  // or stomp its state. (Critical for the async path: our poll loop isn't killed by the abort signal,
  // so a superseded invocation lives on until its next poll tick. Jenni 2026-07-03)
  if(_myGenId !== S.genId) return;
  // Keep the quota badge fresh after every generation attempt.
  if(typeof refreshFreeTierStatus === "function") refreshFreeTierStatus();
  clearInterval(loadTimer);S.loading=false;render();
  if(S.talk){var ts=document.getElementById("talkStart");if(ts)ts.scrollIntoView({behavior:"smooth",block:"start"})}
  // If user queued audio during the loading state, fire podcast generation now.
  // Flag is one-shot — cleared so it doesn't bleed into the next generation. (Jenni 2026-06-08)
  if(S.talk && S.queueAudio){
    S.queueAudio = false;
    genPodcast();
  }
  // Step 3c (Jenni 2026-06-09 #4): kick off the slow claim-level citation audit AFTER the talk
  // is on screen. When it returns, replace S.talk with the audited version, clear the pending
  // badge, and surface a toast if any citations were modified.
  if(S.talk && S.citationAuditPending){
    var _auditTargetGenId = _myGenId;
    var _talkBeforeAudit = S.talk;
    (async function runBackgroundAudit(){
      try {
        var auditedTalk = await verifyCitations(_talkBeforeAudit);
        // Don't apply the audit result if the user has navigated away or started a new gen.
        if(_auditTargetGenId !== S.genId) return;
        if(!S.talk) return;
        // Count differences in reference list as a proxy for "citations were modified."
        var beforeCount = (_talkBeforeAudit.references||[]).length;
        var afterCount  = (auditedTalk.references||[]).length;
        var modified = beforeCount !== afterCount;
        S.talk = auditedTalk;
        S.citationAuditPending = false;
        render();
        if(modified){
          var diff = Math.abs(beforeCount - afterCount);
          S.savedFlash = "✓ Citations verified · " + diff + " reference" + (diff===1?"":"s") + " " + (afterCount<beforeCount?"removed":"updated") + " after review";
          render();
          setTimeout(function(){ S.savedFlash=""; render() }, 4000);
        } else {
          S.savedFlash = "✓ Citations verified";
          render();
          setTimeout(function(){ S.savedFlash=""; render() }, 2500);
        }
      } catch(auditErr){
        console.warn("Background citation audit failed:", auditErr && auditErr.message);
        if(_auditTargetGenId === S.genId){
          S.citationAuditPending = false;
          render();
        }
      }
    })();
  }
}

// Cancel an in-flight generation. We can't abort the fetch (no AbortController wired up
// through the existing call chain), but we can flip a flag so generate() discards the result
// when it returns. Loader teardown is immediate so UI feels responsive.
function cancelGen(){
  if(!S.loading) return;
  S.genCancelled = true;
  // Stop any server-side background job immediately (don't wait for the poll loop's next tick) and
  // drop the persisted job so it isn't resumed after a reload. (Jenni 2026-07-03)
  try {
    var _stored = JSON.parse(localStorage.getItem(ASYNC_GEN_CONFIG.jobKey) || "null");
    if(_stored && _stored.jobId && RAG_CONFIG.url){
      fetch(RAG_CONFIG.url.replace(/\/$/,"") + "/generate-cancel/" + encodeURIComponent(_stored.jobId), { method:"POST", headers:{ "X-Supabase-Auth": freeTierToken() } });
    }
  } catch(_){}
  try { localStorage.removeItem(ASYNC_GEN_CONFIG.jobKey); } catch(_){}
  S.queueAudio = false; // don't carry the audio-queue intent into the next generation
  // Abort the live fetch so we stop paying for tokens we won't use. (Jenni 2026-06-09 #5)
  if (window._lastGenAbort) try { window._lastGenAbort.abort() } catch(_){}
  window._lastGenAbort = null;
  clearInterval(loadTimer);
  S.loading = false;
  S.loadSec = 0;
  S.loadMsg = "";
  render();
}

// Restart an in-flight generation with the user's just-changed settings (depth / web-verify).
// Preserves S.queueAudio so the audio intent survives across the restart. The stale gen's late
// return is dropped via the genId check inside generate(). (Jenni 2026-06-08)
function restartGen(){
  if(!S.loading) return;
  // Abort the in-flight call so we stop wasting tokens on the result we're about to discard.
  // (Jenni 2026-06-09 #5)
  if (window._lastGenAbort) try { window._lastGenAbort.abort() } catch(_){}
  window._lastGenAbort = null;
  // Tear down the current loader without setting genCancelled — we WANT to start fresh
  clearInterval(loadTimer);
  S.loading = false;
  S.loadSec = 0;
  S.loadMsg = "";
  S.genCancelled = false; // genId check handles the stale-drop; cancel flag should be clean
  // Use setTimeout so the loading-state DOM clears before the new generate() re-sets S.loading=true
  setTimeout(generate, 0);
}

async function genDiagram(){

  if(S.talk.teaching_points)parts.push("Teaching: "+S.talk.teaching_points.slice(0,3).join("; "));
  var sm=parts.join(". ");

  // Flowchart/SVG mode REMOVED — autoLayout produced overlapping/clipped output. Use Gemini or ChatGPT for raster visuals.
  // The branch below is now unreachable (UI no longer exposes "svg"); kept inside this guard so a stale
  // localStorage/preference can't trigger it — the render-side guard also flips dgMode back to "ai".
  if(false && S.dgMode==="svg"){
    var tpl=findDiagramTemplate(S.topic);
    if(tpl){
      S.dg={template:tpl};

      var p=JSON.parse(fixJSON(txt));

        // Precedence fix (Jenni 2026-07-03): parenthesize the OR. Without it this was
        // `401 || (403 && !free)`, so ANY 401 \u2014 including a free-tier user's 401 from the owner's
        // proxy \u2014 wiped their own saved openai_api_key. Only clear the key for BYOK auth failures.
        if((oaRes.status===401||oaRes.status===403) && !freeTierActive()){

        }

  try{

    if(data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts){
      for(var pi=0;pi<data.candidates[0].content.parts.length;pi++){
        var pt=data.candidates[0].content.parts[pi];
        if(pt.inlineData&&pt.inlineData.data){imgB64=pt.inlineData.data;break}
        if(pt.inline_data&&pt.inline_data.data){imgB64=pt.inline_data.data;break}
      }

    S.dg={imgB64:imgB64};

}

// Detect when the user wants a RADICAL rewrite (full regenerate) vs. a normal additive refine.
// Default is additive \u2014 only trigger a full regen when they clearly say so. Keeps the user's good content
// intact when they're just adding context (e.g. "include EGPA" or "add a pregnancy section").
function isRadicalRevision(msg){
  var m = String(msg||"").toLowerCase();
  // Rewrite-from-scratch intents:
  if(/\b(rewrite|redo|start over|from scratch|completely (?:different|new|change)|trash (?:it|this)|throw (?:it|this) out|wrong angle|totally different|new approach|different approach|scrap (?:it|this)|change everything|regenerate)\b/.test(m)) return true;
  return false;
}

// Detect a clear ADDITIVE intent (user is asking to add SPECIFIC content). When this fires, we
// bypass restructure/expand/compress and go straight to weave — so phrases like
// "add more detail about FOURIER" or "include the SPRINT trial" route as additions, not as
// whole-talk operations. (Jenni 2026-06-11)
// AUDIT FIX 2026-06-11: dropped "cover", "note", "address" — they were ambiguous and collided with
// compression keywords ("cover fewer points", "address the wordiness"). The kept list is now
// unambiguously additive — every keyword implies the user is naming new content to add.
function isAdditiveIntent(msg){
  var m = String(msg||"").toLowerCase();
  return /\b(add\b|include\b|incorporate\b|mention\b|talk about|say (?:something|more) about|discuss\b|what about|also cover|don't forget|remember to|consider adding|include the|append\b|insert\b)\b/.test(m);
}

// Detect a SURGICAL-EDIT intent — the user wants to fix / correct / replace / delete specific
// existing content (often after proofreading in OpenEvidence), NOT reshape the whole talk. Routes
// to the weave path, which now applies precise add/edit/delete ops by index. (Jenni 2026-06-22)
function isSurgicalEditIntent(msg){
  var m = String(msg||"").toLowerCase();
  return /\b(fix|fixes|fixed|correct|corrected|correction|wrong|incorrect|inaccurate|error|errors|mistake|mistakes|typo|typos|should (?:be|say|read)|replace|delete|remove|edit|edits|proofread|reconcile|update the|revise the)\b/.test(m) || /\bchange\b.+\bto\b/.test(m);
}

// Detect a "compress this existing talk" intent — different from radical revision because the user
// wants to KEEP all sections + clinical details, just tighten phrasing. Routes to compressTalk(),
// NOT generate(). (Jenni 2026-06-11 — "it cuts way too short and drops sections" was the bug.)
function isCompressionIntent(msg){
  var m = String(msg||"").toLowerCase();
  // Broad: catches "keep it concise", "be concise", "make this concise", "stay concise",
  // "concise version", "more concise", as well as shorten/trim/condense/etc.
  return /\bconcise\b|\b(less verbose|shorten|shorter|condens(e|ed)|trim(?: it| this| down)?|tighten|cut (?:down|out|it)|summari[sz]e|too long|less detail|fewer (?:bullets|points|sections)|punch(?:y|ier)|tl;?dr|more brief|briefer|terse|less wordy|less long|wordy)\b/.test(m);
}

// Mirror of isCompressionIntent — detect "make more detailed / expand / go deeper" intent.
// Routes to expandTalk(), which enriches existing content while keeping structure intact. (Jenni 2026-06-11)
function isExpansionIntent(msg){
  var m = String(msg||"").toLowerCase();
  // Broad: catches "more detail", "add more detail", "be detailed", "make it detailed",
  // "more in depth", "go deeper", "expand", etc.
  return /\bdetailed\b|\b(more detail(?:s|ed)?|add detail|add more detail|more thorough|expand|elaborate|go deeper|deeper|fuller|richer|longer|more depth|more comprehensive|more in.?depth|in.?depth|flesh (?:it|this) out|fill (?:it|this) out|more explanation|more content|more substantive)\b/.test(m);
}

// Detect "restructure this talk" intent — splitting / merging / reordering / renaming sections.
// Patch path can only ADD; compression/expansion preserve structure. This path is the only one
// that can ACTUALLY MOVE content between sections. (Jenni 2026-06-11)
function isRestructureIntent(msg){
  var m = String(msg||"").toLowerCase();
  return /\b(split|break (?:up|down|out|into|apart)|divide|separate (?:into|out)|reorder|re-?order|rearrange|move (?:section|sections|the section)|swap (?:section|sections)|merge|combine (?:section|sections)|consolidate|rename (?:section|sections|the section|the heading)|change (?:section|the section|the heading|the order)|smaller sections|bigger sections|fewer sections|more sections)\b/.test(m);
}

// Restructure an existing talk — splits, merges, reorders, renames sections WITHOUT losing any
// bullet, pearl, fact, or citation. The model returns the talk with reorganized sections; JS
// validates that every original citation [N] and every bullet survives somewhere.
async function restructureTalk(userMsg){
  if(!S.talk) return null;
  var existingJson = JSON.stringify(S.talk);
  var sectionList = (S.talk.sections||[]).map(function(s,i){
    var bulletCount = (s.points||[]).length;
    return (i+1)+". \""+(s.heading||"(no heading)")+"\" — "+bulletCount+" bullet"+(bulletCount===1?"":"s");
  }).join("\n  ");
  var refCount = (S.talk.references||[]).length;
  // Count all bullets across sections so we can validate "no bullet lost"
  var totalBullets = 0;
  (S.talk.sections || []).forEach(function(s){ totalBullets += (s.points || []).length; });

  var sys = "You are restructuring an existing medical chalk talk for an internal medicine educator. " +
    "The user wants to REORGANIZE sections — split, merge, reorder, or rename — WITHOUT losing any " +
    "clinical content. This is a structural rearrangement, not a regeneration.\n\n" +
    "EXISTING STRUCTURE (use these 1-based indices to refer to sections in your reasoning):\n  " + sectionList + "\n" +
    "Existing bullet count across all sections: " + totalBullets + "\n" +
    "Existing references count: " + refCount + "\n\n" +
    "ABSOLUTE PRESERVATION RULES:\n" +
    "- EVERY bullet from the existing sections must end up SOMEWHERE in the output. Total bullet count must be ≥ " + totalBullets + ".\n" +
    "- EVERY reference must be preserved. References array must come back the same length or longer (never shorter).\n" +
    "- EVERY [N] citation must still appear inline somewhere in the output, attached to its original fact.\n" +
    "- EVERY clinical detail: drug names, doses, trial names, lab values, percentages, numbers — all preserved.\n" +
    "- The teaching_pearl and board_tip of each ORIGINAL section must end up attached to a section (the one they topically belong to after restructuring).\n" +
    "- Title, subtitle, visual_memory_card, summary_points, board_pearls, teaching_points — all unchanged.\n\n" +
    "ALLOWED STRUCTURAL OPERATIONS:\n" +
    "- SPLIT a section into 2 or more sections (move some bullets to a new section, give each part its own heading + appropriate pearl/tip).\n" +
    "- MERGE 2 or more sections into one (combine bullets, pick the most encompassing heading, keep all pearls/tips by appending).\n" +
    "- REORDER sections (just rearrange the array — content stays attached to its heading).\n" +
    "- RENAME headings (change the wording, keep the bullets attached).\n" +
    "- MOVE bullets between sections if they topically belong elsewhere after the restructure.\n\n" +
    "WHEN SPLITTING:\n" +
    "- Give each new sub-section a focused heading.\n" +
    "- Distribute the original bullets between them based on topic.\n" +
    "- Distribute the teaching_pearl/board_tip — usually one new section keeps the original pearl, the other gets a derived one (or an empty string if no good fit).\n" +
    "- NEVER duplicate a bullet across the split. Each bullet goes in exactly ONE new sub-section.\n\n" +
    "WHEN MERGING:\n" +
    "- Concatenate the bullets in a sensible order.\n" +
    "- Combine the pearls/tips into single longer strings if both have content, separated by '; '.\n" +
    "- Use the most encompassing heading (or coin a new one).\n\n" +
    "WHAT NOT TO DO:\n" +
    "- Do NOT drop any bullet. Total bullet count after restructure must be ≥ " + totalBullets + ".\n" +
    "- Do NOT drop or rewrite bullets to be shorter — phrasing stays the same, only the GROUPING changes.\n" +
    "- Do NOT drop references. References array must be the same length or longer.\n" +
    "- Do NOT drop a [N] citation. Every original citation must remain inline.\n" +
    "- Do NOT add NEW clinical content unless the user explicitly asked. This is restructuring, not enrichment.\n\n" +
    "SELF-CHECK BEFORE RETURNING:\n" +
    "1. Total bullet count: count every bullet across every section in your output. Is it ≥ " + totalBullets + "? If not, you LOST content — go back and recover it.\n" +
    "2. Citations: list every [N] in the original talk. Is each one still present in your output? If not, ADD IT BACK.\n" +
    "3. References array: ≥ " + refCount + " entries? If not, ADD BACK what you dropped.\n" +
    "4. Every drug name, dose, trial name, lab value from the original — still present in some bullet?\n\n" +
    "Return the COMPLETE updated talk JSON in the EXACT same schema. ONLY JSON, no commentary, no markdown fences.";

  var contentParts = [{
    type: "text",
    text: "USER REQUEST: " + userMsg + "\n\nEXISTING TALK JSON (restructure per the user's request; preserve every bullet, fact, and citation):\n" + existingJson
  }];
  var txt = await callAPI(sys, contentParts, 32768, { model: "claude-sonnet-4-6" });
  var restructured = JSON.parse(fixJSON(txt));
  if(typeof deepCleanCitations === "function") restructured = deepCleanCitations(restructured);
  if(typeof pruneFakeReferences === "function") restructured = pruneFakeReferences(restructured);
  return restructured;
}

// ── APPLY PROOFREAD FEEDBACK (Jenni 2026-07-03) ──────────────────────────────────────────────
// The user's real workflow: paste her talk into OpenEvidence, get back PROSE feedback (assessments
// + recommended corrections), then paste that feedback here to incorporate the changes while
// PRESERVING everything else. The surgical differ (weaveRevision) fails at this — it treats a big
// feedback paste as a whole-talk reshape and bails, or mis-maps prose to bullet coordinates. This
// path instead returns the FULL corrected talk (edit-in-place, no coordinate math) and guards it
// with the restructure-style content-loss check so nothing can be silently dropped.

// Detect "reviewer feedback to apply" — substantial prose with multiple corrective/recommendation
// markers. Short "fix X" stays on the surgical path. An explicit button (S._applyProofreadMode)
// always wins regardless of this heuristic.
function isProofreadFeedback(msg){
  var m = String(msg||"").toLowerCase();
  if(m.length < 300) return false;
  var markers = /should (?:be|say|read|include|consider)|recommend|correction|consider (?:adding|revising|removing)|is (?:incorrect|wrong|inaccurate)|the (?:correct|accurate)|assessment|inaccurac|overstat|understat|misstat|not supported|per (?:the )?guideline|update(?:d)? to|revise (?:the|to)|reviewer|flag(?:ged)?|suggest/g;
  return (m.match(markers) || []).length >= 2;
}

// Model call: apply the feedback, return the FULL corrected talk in the same schema. Returns
// { talk, applied[], vmcTouched }. Consumes 1 free-tier talk (a refine = 1 talk), guarded.
async function weaveFeedbackTalk(userMsg){
  if(!S.talk) return { talk:null };
  // Charge-after pre-check (Jenni 2026-07-03): block only if visibly exhausted; consume after success.
  if(genUsesFreeTier() && S.freeTier && typeof S.freeTier.talks_remaining === "number" && S.freeTier.talks_remaining <= 0){
    S.freePausedMsg = ""; S.showOutOfFreeModal = true; if(typeof render==="function") render();
    return { talk:null, quotaBlocked:true };
  }
  var existingJson = JSON.stringify(S.talk);
  var totalBullets = 0; (S.talk.sections||[]).forEach(function(s){ totalBullets += (s.points||[]).length; });
  var refCount = (S.talk.references||[]).length;
  var secCount = (S.talk.sections||[]).length;
  // CHANGED-SECTIONS-ONLY (Jenni 2026-07-03 speed fix): instead of re-emitting the WHOLE talk (slow —
  // output length is the bottleneck), the model reads the whole talk but returns ONLY the sections it
  // actually changed (fully, with all their bullets) + any changed summary / VMC / references. We
  // splice those into a clone and keep every untouched section verbatim. If the feedback is genuinely
  // global it'll return most sections (appropriately slower); if it touches 1-2, it's fast.
  var sys =
    "You are applying EXTERNAL REVIEWER FEEDBACK to an existing medical chalk talk. The user pasted assessments and recommended corrections (e.g. from OpenEvidence) ABOUT this talk — a CRITIQUE, not a rewrite. Incorporate every ACTIONABLE correction; leave everything else untouched.\n\n" +
    "TO KEEP THIS FAST, RETURN ONLY WHAT YOU CHANGED — never the whole talk. Emit a JSON object:\n" +
    "{\n" +
    '  "changed_sections": [ { "index": <0-based section index from the talk below>, "heading": "...", "points": ["...all bullets of this section, corrected..."], "mechanism": "...", "teaching_pearl": "...", "board_tip": "..." } ],\n' +
    '  "changed_summary_points": ["...full updated array..."] ,   // include ONLY if a correction affects the summary; else omit\n' +
    '  "changed_vmc": {"top_left":"...","top_right":"...","bottom_left":"...","bottom_right":"..."},  // ONLY the quadrant(s) that changed; else omit\n' +
    '  "add_references": [ {"id":<int>,"source":"...","year":2024,"society":"...","url":"...","type":"guideline"} ],  // any NEW references a correction introduced; else omit\n' +
    '  "changed_key_point": "..." ,  // boards only, if the key point changed; else omit\n' +
    '  "applied": ["short description of each change you made", ...],\n' +
    '  "global": true|false\n' +
    "}\n\n" +
    "RULES:\n" +
    "- List a section in changed_sections ONLY if you changed something in it. Do NOT list unchanged sections.\n" +
    "- When you DO include a section, return its FULL corrected content — ALL its bullets, keeping every bullet and [N] citation you didn't need to change. A changed section must keep at least as many bullets as it had, unless the feedback explicitly says to remove specific content.\n" +
    "- NEVER drop a reference. A new clinical claim needs a [N] — reuse an existing reference id or add one via add_references.\n" +
    "- If a correction changes the core mechanism/findings/workup/first-line treatment, include the affected changed_vmc quadrant(s).\n" +
    "- If a recommendation is vague, non-actionable, or merely confirms the talk is correct, SKIP it (do not invent changes). If NOTHING is actionable, return \"changed_sections\": [] and \"applied\": [].\n" +
    "- Set \"global\": true only if the feedback genuinely requires changing most/all sections.\n" +
    "ONLY JSON — no markdown fences, no commentary.";
  var contentParts = [{
    type:"text",
    text: "REVIEWER FEEDBACK TO APPLY:\n" + userMsg +
      "\n\n===== CURRENT TALK JSON (0-based section indices; apply the feedback, return only changes) =====\n" + existingJson
  }].concat(buildReferenceParts(S.files));
  var txt = await callAPI(sys, contentParts, 32768, { model:"claude-sonnet-4-6", meterKind:"talk" });
  // Charge-after: parse FIRST — if the model returned malformed JSON the refine failed and we throw
  // below without charging. Only consume once we have a usable result. (Jenni 2026-07-03)
  var parsed = JSON.parse(fixJSON(txt));
  if(genUsesFreeTier()){ try{ await consumeFreeTier("talk"); }catch(_){} }
  // Reconstruct: clone the original, splice in only the changed pieces — untouched content is
  // literally carried over, so it can't be lost.
  var revised = JSON.parse(JSON.stringify(S.talk));
  var vmcTouched = false;
  if(Array.isArray(parsed.changed_sections)){
    parsed.changed_sections.forEach(function(cs){
      if(!cs || typeof cs.index !== "number") return;
      if(cs.index < 0 || cs.index >= (revised.sections||[]).length) return;
      var tgt = revised.sections[cs.index];
      if(Array.isArray(cs.points) && cs.points.length) tgt.points = cs.points;
      if(typeof cs.heading === "string" && cs.heading.trim()) tgt.heading = cs.heading;
      if(typeof cs.mechanism === "string") tgt.mechanism = cs.mechanism;
      if(typeof cs.teaching_pearl === "string") tgt.teaching_pearl = cs.teaching_pearl;
      if(typeof cs.board_tip === "string") tgt.board_tip = cs.board_tip;
    });
  }
  if(Array.isArray(parsed.changed_summary_points) && parsed.changed_summary_points.length) revised.summary_points = parsed.changed_summary_points;
  if(parsed.changed_vmc && typeof parsed.changed_vmc === "object"){
    revised.visual_memory_card = revised.visual_memory_card || {};
    ["top_left","top_right","bottom_left","bottom_right"].forEach(function(q){
      if(typeof parsed.changed_vmc[q] === "string" && parsed.changed_vmc[q].trim()){ revised.visual_memory_card[q] = parsed.changed_vmc[q].trim(); vmcTouched = true; }
    });
  }
  if(Array.isArray(parsed.add_references) && parsed.add_references.length){
    var seen = {}; (revised.references||[]).forEach(function(r){ if(r && r.id!=null) seen[r.id] = true; });
    parsed.add_references.forEach(function(r){ if(r && r.id!=null && !seen[r.id]){ revised.references = (revised.references||[]).concat([r]); seen[r.id] = true; } });
  }
  if(typeof parsed.changed_key_point === "string" && parsed.changed_key_point.trim()) revised.key_point = parsed.changed_key_point;
  if(typeof deepCleanCitations === "function") revised = deepCleanCitations(revised);
  if(typeof pruneFakeReferences === "function") revised = pruneFakeReferences(revised);
  return { talk: revised, applied: Array.isArray(parsed.applied)?parsed.applied:[], vmcTouched: vmcTouched };
}

// Orchestrator: history snapshot, model call, safety guard (keep original if content dropped),
// messaging, Undo, and staleness flags — mirrors the restructure block's conventions exactly.
async function applyProofreadFeedback(userMsg){
  if(!S.talk) return;
  pushTalkHistory("proofread");
  S.chatBusy = true;
  // Live progress (Jenni 2026-07-03): proofread rewrites the WHOLE talk to apply corrections in place,
  // so it takes ~20-40s on a detailed talk. Show a ticking timer so it doesn't feel stuck.
  S._proofreadRunning = true; S.refineSec = 0;
  if(refineTimer) clearInterval(refineTimer);
  refineTimer = setInterval(function(){ S.refineSec++; render(); }, 1000);
  S.msgs.push({r:"a",t:"Reading the feedback and applying each recommended correction — keeping every other bullet, section, and citation…"});
  render();
  try{
    var origBullets = 0, origRefs = (S.talk.references||[]).length, origSecs = (S.talk.sections||[]).length;
    (S.talk.sections||[]).forEach(function(s){ origBullets += (s.points||[]).length; });
    var result = await weaveFeedbackTalk(userMsg);
    if(result && result.quotaBlocked){ if(refineTimer){ clearInterval(refineTimer); refineTimer=null; } S._proofreadRunning=false; S.chatBusy=false; render(); return; }   // bug fix: was leaking the 1s timer + stuck _proofreadRunning on this early return
    var revised = result && result.talk;
    if(revised && revised.title){
      var newBullets = 0, newRefs = (revised.references||[]).length, newSecs = (revised.sections||[]).length;
      (revised.sections||[]).forEach(function(s){ newBullets += (s.points||[]).length; });
      if(newBullets < origBullets){
        S.msgs.push({r:"a",t:"⚠ Applying that would have dropped content ("+origBullets+" → "+newBullets+" bullets), so I kept your original untouched. If the feedback asked to REMOVE something, say e.g. \"delete the epidemiology section\" and I'll do exactly that."});
      } else if(newRefs < origRefs){
        S.msgs.push({r:"a",t:"⚠ That would have dropped a reference ("+origRefs+" → "+newRefs+"). Kept your original. Try applying the corrections one at a time."});
      } else if(newSecs < origSecs){
        S.msgs.push({r:"a",t:"⚠ That would have dropped a section ("+origSecs+" → "+newSecs+"). Kept your original. If a deletion was intended, name the section explicitly."});
      } else if(!result.applied || result.applied.length === 0){
        S.msgs.push({r:"a",t:"ℹ️ I read the feedback but didn't find a concrete change to make — it either confirms the talk is accurate or is too general to act on. If there's a specific fix, quote the exact bullet or tell me what it should say."});
      } else {
        S.talk = revised;
        if(S.dg && S.dg.imgB64) S.visualStale = true;
        else { S.dg = null; S.dgErr = ""; }
        S.podScript = ""; S.talkIsSaved = false;
        S.vmcStale = !(result.vmcTouched === true);
        var summary = result.applied.slice(0,8).map(function(x){return "• "+x}).join("\n");
        var more = result.applied.length > 8 ? "\n…and "+(result.applied.length-8)+" more" : "";
        S.msgs.push({r:"a",t:"✓ Applied "+result.applied.length+" correction"+(result.applied.length===1?"":"s")+" from the feedback. Everything else untouched — tap Undo to revert.\n\n"+summary+more});
      }
    } else {
      S.msgs.push({r:"a",t:"Couldn't parse the corrected version — your original is intact. Try again, or apply the feedback one point at a time."});
    }
  } catch(e){
    S.msgs.push({r:"a",t:"Applying the feedback failed — "+humanizeError(e)+" Your original is intact."});
  }
  if(refineTimer){ clearInterval(refineTimer); refineTimer = null; }
  S._proofreadRunning = false;
  S.chatBusy = false; S._composerOpen = false; render();
}

// Compress an existing talk — keeps every section, every clinical detail, every citation; just
// rewrites bullets/pearls/tips in fewer words. Returns the full updated talk JSON.
// Uses Sonnet 4.6 with high max_tokens so nothing gets squeezed out. (Jenni 2026-06-11)
async function compressTalk(userMsg){
  if(!S.talk) return null;
  var existingJson = JSON.stringify(S.talk);
  var sectionList = (S.talk.sections||[]).map(function(s,i){return (i+1)+". "+(s.heading||"(no heading)")}).join("\n  ");
  var sectionCount = (S.talk.sections||[]).length;
  var refCount = (S.talk.references||[]).length;

  var sys = "You are tightening an existing medical chalk talk for an internal medicine educator. " +
    "Your ONLY job is to compress phrasing — make every bullet, pearl, and tip use fewer words while " +
    "preserving EVERY clinical fact. This is not a regeneration; it is a copy-edit pass.\n\n" +
    "ABSOLUTE PRESERVATION RULES (the user explicitly asked for this):\n" +
    "- KEEP all " + sectionCount + " sections. Do NOT drop any. The exact section list (must be returned in the same order):\n  " + sectionList + "\n" +
    "- KEEP all section headings exactly as-is unless the user explicitly asks to rename one.\n" +
    "- KEEP all " + refCount + " references. Do NOT drop any. References array must come back identical or longer (never shorter).\n" +
    "- KEEP every clinical fact: drug names, drug doses, trial names, study years, lab values, percentages, mortality numbers, NNT/NNH, society guideline citations [N], every named criterion.\n" +
    "- KEEP every teaching_pearl and board_tip — tighten the wording but the clinical content stays.\n" +
    "- KEEP all inline [N] citations exactly where they appeared. If a fact was cited [3], the compressed fact must still be cited [3].\n" +
    "- KEEP the title, subtitle, and overall structure (visual_memory_card, summary_points, board_pearls, teaching_points).\n\n" +
    "WHAT TO COMPRESS:\n" +
    "- Remove filler words: 'in patients with', 'it is important to note that', 'studies have shown that', 'this is because', etc.\n" +
    "- Convert long phrases to shorthand: 'has been shown to reduce mortality' → '↓ mortality'; 'in the setting of' → 'with'; 'patients who have' → 'patients with'.\n" +
    "- Combine related bullets within a section if they're saying the same thing with different examples (but keep all the examples).\n" +
    "- Use telegraphic style: noun phrases + dashes + arrows where appropriate. Cardiologists love → and ↓ and ↑.\n\n" +
    "WHAT NOT TO DO:\n" +
    "- Do NOT drop sections. The output must have EXACTLY " + sectionCount + " sections in the same order with the same headings.\n" +
    "- Do NOT drop bullets that mention a unique fact. You may merge two bullets that say the same thing differently, but never drop a unique clinical point.\n" +
    "- Do NOT drop references. The compressed talk must cite every reference the original talk cited.\n" +
    "- Do NOT drop drug names, doses, trial names, or numeric values. Those are the most teaching-relevant content.\n" +
    "- Do NOT drop teaching_pearl or board_tip. Tighten the wording, but the content stays.\n\n" +
    "SELF-CHECK BEFORE RETURNING:\n" +

    "3. Drug names: are every dose, drug name, trial name, and lab value still present? If any dropped, ADD BACK.\n" +
    "4. References: same length or longer? Never shorter.\n\n" +
    "Return the COMPLETE updated talk JSON in the EXACT same schema. ONLY JSON, no commentary, no markdown fences.";

  var contentParts = [{
    type: "text",
    text: "USER REQUEST: " + userMsg + "\n\nEXISTING TALK JSON (compress this; preserve every section, fact, and citation):\n" + existingJson
  }];
  // No file refs needed — this is a copy-edit of the existing talk, not a content addition.
  var txt = await callAPI(sys, contentParts, 32768, { model: "claude-sonnet-4-6", meterKind: "talk" });
  var compressed = JSON.parse(fixJSON(txt));   // parse before charging — malformed = no charge
  if(genUsesFreeTier()){ try{ await consumeFreeTier("talk"); }catch(_){} }   // was a free full generation with no consume (quota bypass)
  if(typeof deepCleanCitations === "function") compressed = deepCleanCitations(compressed);
  if(typeof pruneFakeReferences === "function") compressed = pruneFakeReferences(compressed);

}
