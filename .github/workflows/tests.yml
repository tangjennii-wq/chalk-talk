name: Chalk Talk safety tests

# Reconciled workflow (branch consolidation 2026-07-26): the union of the citation-coverage and
# free-gemini-tier copies. citation-coverage contributed the rag ESM syntax check, the PubMed
# trust-but-verify suite and the landmark-validator suite; free-gemini-tier contributed the Gemini
# funnel / withheld-review safety suite. All of them run here — this is now the single copy.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dev dependencies (eslint — needed by the inline-scope suite)
        run: npm install --no-audit --no-fund

      - name: JS syntax check (all inline script blocks)
        run: |
          node --input-type=module -e '
          import fs from "fs";
          const html = fs.readFileSync("index.html","utf8");
          const re = /<script\b([^>]*)>([\s\S]*?)<\/script>/gi;
          let m, i = 0, bad = 0;
          while((m = re.exec(html))){
            const a = m[1] || "";
            if(/type\s*=\s*["\x27]?module/i.test(a) || /\bsrc\s*=/.test(a)) continue;
            i++;
            try { new Function(m[2]); } catch(e){ bad++; console.log("BLOCK #"+i+": "+e.message); }
          }
          console.log("checked "+i+" blocks, "+bad+" errors");
          if(bad) process.exit(1);
          '

      - name: rag ESM syntax check (validator + lib + ingest/reconcile)
        run: |
          for f in rag/validator_lib.mjs rag/validate_landmark_pmids.mjs rag/ingest_landmarks.mjs rag/reconcile_landmarks.mjs; do
            node --check "$f" && echo "ok: $f"
          done

      - name: Guideline manifest audit (must be hard:0)
        run: |
          node rag/extract_guidelines.mjs
          node rag/build_manifest.mjs
          node rag/audit_manifest.mjs | tee /tmp/audit.txt
          grep -q "(hard: 0)" /tmp/audit.txt

      - name: Boards difficulty suite
        run: node test_boards_difficulty.mjs

      - name: Citation / refine guard suite
        run: node test_refine_guard.mjs

      - name: Guideline source (JSON single-source-of-truth) suite
        run: node test_guidelines_source.mjs

      - name: PubMed trust-but-verify suite
        run: node test_pubmed_verify.mjs

      - name: Landmark validator suite (title thresholds + Europe PMC/Crossref agreement)
        run: node test_landmark_validator.mjs

      - name: Gemini funnel + withheld-review safety/provenance suite
        run: node test_gemini_safety.mjs

      - name: Targeted Concise safety-review suite
        run: node test_targeted_review.mjs

      - name: State isolation suite (talk-scoped reset + owner-scoped withheld draft)
        run: node test_state_isolation.mjs

      - name: Gemini dev-gate + DOI verification suite
        run: node test_gemini_gate_and_doi.mjs

      - name: Strict talk parsing (never render partial medical content)
        run: node test_parse_strict.mjs

      # EXECUTES generate()'s review -> finalize path. The pattern-matching suites all passed while an
      # undeclared local threw a ReferenceError on every successful generation; only running it catches that.
      - name: generate() review -> finalize, executed
        run: node test_generate_execution.mjs

      # A present-but-hollow field renders as blank space — same harm as a missing one, harder to notice.
      - name: Deep completeness gate + citation audit on every release path
        run: node test_deep_completeness.mjs

      # Behavioural, not regex: executes the retry loop and inspects the request it reconstructs.
      - name: Retry evidence preservation + provenance stamping
        run: node test_retry_evidence.mjs

      # The preview must survive review (perceived speed) but be retired at every exit (safety).
      - name: Streaming preview through review, retired at every exit
        run: node test_review_preview.mjs

      # A proposed reference is a MODEL-SUPPLIED CITATION — the exact thing this app never trusts.
      - name: Check for updates (verify before offering; never rewrite the talk)
        run: node test_update_check.mjs

      # A patch cannot silently drop a field it never names — but only if the applier is airtight.
      - name: Patch-based review (all-or-nothing, re-gated, no rewrite in disguise)
        run: node test_patch_review.mjs

      # The drug detector can DISQUALIFY a model, so its false positives cost as much as its misses.
      - name: Drug-name detector (true positives + the 2026-07-26 false positives)
        run: node rag/test_drug_detector.mjs

      # The critic benchmark's fixtures and scoring must load offline before anyone spends quota on it.
      - name: Critic benchmark loads (dry run)
        run: node rag/eval_critic.mjs --model claude-opus-5 --dry

      # The benchmark harness decides which models may write medical content. If it can report a PASS
      # when its verifiers were unreachable, every clearance it has ever granted is suspect.
      - name: Benchmark harness (never pass on unverified evidence)
        run: node test_eval_harness.mjs

      # ── Wired 2026-07-29. SIX suites were on disk and absent from this workflow — three from the
      # 2026-07-28 retrieval work and three from the 2026-07-29 audit. This is the second time an
      # unwired suite has slipped through, so the last step below now FAILS if it happens again rather
      # than relying on anyone remembering.

      # Answer-position bias: the correct choice must not cluster on C/D/E.
      - name: Boards answer-choice shuffle
        run: node test_choice_shuffle.mjs

      # Stage 1 + 2 ranking behaviour, executed against stubs rather than pattern-matched.
      - name: Rerank + metadata filter stages
        run: node test_rerank_stage.mjs

      # A JS test cannot catch a SQL type error; these compare the migrations against the schema.
      - name: SQL type agreement (RPC signatures vs document_chunks.id)
        run: node test_schema_types.mjs

      # A rerank that also repeals the authority boosts is two changes wearing one name, and no
      # four-arm experiment can attribute it. Binds the two ranking formulas together.
      - name: Ranking parity (score_candidate_chunks vs canonical match_chunks)
        run: node test_ranking_formula.mjs

      # Guards that reported states they had not earned: a rerank that ranked nothing, a filter that
      # had nothing to filter, a spend cap parsed from a typo.
      - name: Retrieval guards (coverage, NaN comparators, two kinds of zero)
        run: node test_retrieve_guards.mjs

      # EXECUTES the handler. The scope error this caught is a ReferenceError, not a syntax error —
      # node --check passes it, and so does importing the module.
      - name: Legacy /v1/messages path is capped and metered
        run: node test_legacy_path_metering.mjs

      # Found in production on the first real talk after the durable deploy: three correct NEJM landmark
      # trials (DOSE, ADVOR, CARRESS-HF) were dropped because "NEJM" could not be matched to "The New
      # England Journal of Medicine". The initials fallback maps a single token to its first letter.
      - name: Citation identity — journal acronyms and the drop rule
        run: node test_citation_identity.mjs

      # A live talk was generated with zero retrieved evidence and presented like a grounded one,
      # because /retrieve 502'd and the client swallowed it. Fail open for generation, fail closed for
      # provenance: no response may claim ok/applied while returning zero sources.
      - name: Retrieval status is explicit (timeout vs error vs empty)
        run: node test_retrieval_status.mjs

      # Fail open for generation, fail closed for provenance. A talk written during a retrieval outage
      # rendered identically to a grounded one; these assert the two zeroes read differently and that
      # the disclosure survives save/resume/refine.
      - name: Evidence disclosure + free Retry sources
        run: node test_evidence_disclosure.mjs

      # Four SECURITY DEFINER billing RPCs were callable by anon, including free_tier_grant_bonus, which
      # authorises nothing and grants quota by email. CREATE FUNCTION's default EXECUTE-to-PUBLIC had
      # outlived an explicit `revoke ... from anon, authenticated`.
      - name: Privileged RPCs are not reachable from a browser
        run: node test_rpc_exposure.mjs

      # The receipt headers were added to the client and never to Access-Control-Allow-Headers, so every
      # browser-side /v1/messages call died at preflight. 33 suites passed because none of them speak
      # CORS: preflight is a browser behaviour and the Node tests call worker.fetch() directly.
      - name: CORS preflight allows every header the client sends
        run: node test_cors_preflight.mjs

      # ct_active_job was deleted the instant the poll returned — before parsing, review recovery,
      # provenance or render — so any post-processing failure stranded a completed, already-paid
      # Workflow result with no handle left to reconnect with.
      - name: Reconnect handle outlives post-processing
        run: node test_job_handle_lifecycle.mjs

      # The live smoke test covered generation, retrieval failure, retry and reconnect — but NOT
      # cancellation/refund, duplicate submit, or a critique failure. Two of the three are automatable
      # without buying a real talk; the cancel/refund canary still needs a browser.
      - name: Cancel confirmation, duplicate submit, critique isolation
        run: node test_cancel_and_duplicate.mjs

      # The durable Workflow NEVER refunded: refundOnce was dead code and makeWorkflowDeps supplied no
      # deps.refund. Cancellation also swallowed termination failure, ignored the cancelled flag between
      # paid steps, and misreported cancelling an already-finished job.
      - name: Cancellation and exactly-once refund
        run: node test_cancel_refund.mjs

      # The client and Worker disagreed about when authorisation exists: desktop drafted before getting a
      # receipt, /generate-async returned none, and talk receipts omitted the aux stage the citation
      # audit uses. One session endpoint mints before any model call; enforcement is staged behind a flag.
      - name: Generation session / receipt lifecycle
        run: node test_receipt_session.mjs

      # Client half of the receipt lifecycle: session before drafting, receipt returned from the async
      # path, and a resume that restores BOTH job id and receipt. Every earlier 402 came from holding one
      # half of that pair.
      - name: Client receipt wiring (session, async receipt, resume)
        run: node test_client_receipt_wiring.mjs

      # Syntax gates for the two files CI never executes. Cheap, and they catch a broken commit
      # before it reaches a deploy or a calibration run.
      - name: Syntax check the Worker and the evaluator
        run: |
          node --check worker.js
          node --check rag/eval_pipeline_arms.mjs

      # DDL that drops before it creates must be atomic: psql -v ON_ERROR_STOP=1 stops on error but does
      # NOT undo what already autocommitted, so an unwrapped file can leave production with no function.
      - name: Migrations containing DROP/ALTER are transactional
        run: node test_migration_atomicity.mjs

      # A precision number that silently excludes successful abstentions would pick the wrong arm.
      - name: Calibration scoring (abstention is scored, not skipped)
        run: node test_calibration_scoring.mjs

      # EXECUTES BOTH SIDES of the stall contract: the real Worker handler produces a real response,
      # which is fed to the real pollAsyncGeneration lifted from index.html. A test that pattern-matched
      # only worker.js certified a field no client read, and the spinner still ran for nine minutes.
      - name: Stall detection reaches the browser poller
        run: node test_stall_integration.mjs

      # step.do() retries FIVE times by default. Wrapping a paid Anthropic call without overriding that
      # would bill up to five drafts per talk. This executes the real step logic under Node.
      - name: Durable generation workflow (paid steps never inherit the 5x retry default)
        run: node test_generation_workflow.mjs

      # Only the reservation belonging to the NEWLY created job may ever be refunded. A duplicate
      # submit whose instance is live must not claw back a running job's credit.
      - name: Submit / refund scope
        run: node test_submit_refund_scope.mjs

      # Two server-side bypasses on the SYNCHRONOUS route: an unbenchmarked model could write medical
      # content, and a signed-in caller could generate with zero quota. Executed against the handler,
      # counting upstream calls — a gate that returns the right status while still spending is not a gate.
      - name: Writer allowlist + quota receipt (server-side)
        run: node test_writer_and_quota_gates.mjs

      # Layout audit of the 390px viewport. Two of these had a fix COMMENT already in the file: the
      # composer claimed an iOS keyboard fix using a Chromium-only API, and the 16px zoom guard was
      # scoped to .app while every modal renders outside it.
      - name: Mobile layout (keyboard, zoom, horizontal overflow)
        run: node test_mobile_layout.mjs

      # Deleting a control left an explanatory line still referencing its local. render() threw
      # ReferenceError, the overlay never cleared, and every saved-talk open hung on "Opening your talk".
      # node --check cannot see it: an undeclared identifier is valid syntax until it executes.
      - name: No orphaned locals (the _dvCached hang)
        run: node test_no_orphan_locals.mjs

      # Drafting never searched the web despite a comment claiming it always did, so recommendations came
      # from training data plus a corpus snapshot. The search now runs in the REVIEW pass, skips pure
      # mechanism topics, and records only what actually happened.
      - name: Live check runs in the review pass (and only where it pays)
        run: node test_live_check.mjs

      # "GENERATED - do not hand-edit" is a comment, and comments in this repo have a track record. This
      # regenerates the index from rag/landmark_trials.json and fails if the committed file differs, so
      # drift across 559 entries cannot survive a push. A collision now exits nonzero here too.
      - name: landmark_pmids.json is reproducible from its source
        run: |
          node rag/build_landmark_index.mjs
          git diff --exit-code -- landmark_pmids.json

      # Nothing recorded that a talk had been through a refine, so reviewing a library one at a time there
      # was no way to tell which were done. ABSENCE is the signal, which is why what must NOT stamp matters
      # more than what does: loading a talk, the citation audit, the depth toggle and undo all rewrite
      # S.talk without the user asking, and any of them stamping would mark every talk as refined.
      - name: Refine stamp (five refine paths stamp, nothing else does)
        run: node test_refine_stamp.mjs

      # Jenni asked for the ⓘ and, in the same sentence, guessed that pressing Updates again undoes it.
      # It does not — it discards the results and searches again. When the person who commissioned the
      # feature guesses wrong, every user will, so the panel says so and this asserts that it still does.
      # It also checks the panel's claims against the CODE: a help text that describes behaviour the app
      # does not have is worse than no help text.
      - name: Updates explainer (the ⓘ, and its claims match what the code does)
        run: node test_updates_info.mjs

      # Physician review of a GENERATED CARD keeps finding faults that are not the card's - it repeated what
      # guidelines.json told it. So the fix belongs in the corpus and so does the regression test. The rule
      # this enforces: a correction is made AT SOURCE, never appended. The first fluid fix appended "not a
      # mandate" while leaving "now favoured" in place higher up, and the model reads the whole entry as
      # ground truth. Every negative assertion in this suite is the old wording.
      - name: Corpus review corrections (DKA + PE, corrected at source)
        run: node test_corpus_corrections.mjs

      # Three worded buttons crowded the LESSON OUTLINE row; two lose their labels and ONE KEEPS ITS LABEL
      # DELIBERATELY. The same ⧉ glyph sits on every section card, so an icon-only ⧉ in the header would
      # read as "copy this one section" - Reorder and Expand have no such collision. The asymmetry is the
      # design, and making all three icon-only would be more consistent and worse. Also asserts the
      # accessible names, since an icon-only button is otherwise nameless.
      - name: Outline-head controls (icon-only, except the one that would be ambiguous)
        run: node test_outline_controls.mjs

      # A fabricated malignancy figure on a pericarditis card was NOT the model drifting:
      # getGuidelinesForTopic("Acute Pericarditis") returned null, so the talk was drafted with zero
      # guideline context. Two bugs did it - no Cardiovascular keyword matched ("cardi" is not "cardiac"),
      # and the TOPICS fallback compared === against its own sentence-case catalogue. An ungrounded talk
      # looks exactly like a grounded one until a number is wrong, so routing is EXECUTED here, not
      # regex-matched. Also asserts every clinical number in the new entry was read in a primary source.
      - name: Pericardial grounding (routing executed, entry verified at source)
        run: node test_pericardial_grounding.mjs

      # 107 of 768 topics - 14% of the app - were drafted with NO guideline context, silently, for as
      # long as the category names had existed. Found one card at a time through physician review; a loop
      # enumerates them in 30ms. Worse, bare-substring keyword matching produced actively WRONG grounding:
      # "tens" fired inside "hyperTENSive" so hypertensive emergency was grounded on DERMATOLOGY. This
      # walks every catalogue topic in three cases, asserts the CORRECT specialty rather than any
      # guideline, and forbids a catch-all - an unmapped category must ground on nothing, because wrong
      # grounding is far harder to notice than missing grounding.
      - name: Routing coverage (all 768 topics, correct specialty, no catch-all)
        run: node test_routing_coverage.mjs

      # "That would have dropped a reference (7 -> 0)." The model was not deleting them: pruneFakeReferences
      # was, AFTER the merge. Opening a saved talk leaves S.ragChunks empty, and pasted reviewer feedback
      # provokes a prose rewrite that drops the [N] markers - so isRetrieved AND isCited both go false and
      # every reference in the talk is deleted. It only bites the exact workflow Jenni runs: refine a SAVED
      # talk. Refine paths now protect the ids that existed BEFORE the refine; the pruner still applies in
      # full to anything the model ADDED, which is where invention actually happens.
      - name: Refine reference survival (a rewrite must not delete vetted references)
        run: node test_refine_ref_survival.mjs

      # Four review points on an ILD card, split three ways by verification. The review claimed nintedanib
      # is STRONGLY recommended for PPF and pirfenidone conditionally - the 2022 guideline says nintedanib
      # is CONDITIONAL and pirfenidone got no recommendation at all. The card was already right; applying
      # that "correction" would have introduced the error. Separately the corpus WAS wrong: "Group 3: do
      # NOT use PAH drugs" is a blanket the card faithfully repeated, and inhaled treprostinil has been
      # FDA-approved for PH-ILD since 2021 on INCREASE.
      - name: ILD grounding (PPF strengths, the PH-ILD exception, the PANTHER boundary)
        run: node test_ild_grounding.mjs

      # landmark_pmids.json is BUILT from rag/landmark_trials.json. The builder says "do not hand-edit" in
      # its own header and I hand-edited it anyway, adding a trial to the OUTPUT while the source knew
      # nothing about it - the next rebuild would have silently erased it. A comment is not a guard. This
      # recomputes what the builder would emit and compares: a hand-edit fails, a source edit without a
      # rebuild fails, a stale artefact fails.
      - name: Generated artefacts match their source (no hand-edited build output)
        run: node test_generated_artifacts.mjs

      # Nephrology had NOTHING on peritoneal dialysis - no ISPD guideline, zero mentions of peritonitis,
      # dialysate or vancomycin - so every figure in a PD talk came from model memory. Verification also
      # contradicted the review on a DOSE: it gave continuous IP vancomycin as 25-50 mg/L per dwell; ISPD
      # 2022 says 25 mg/L. A maintenance range twice the guideline figure is a dosing error, not a nuance,
      # so the entry states 25 mg/L and names 25-50 as not-from-this-guideline.
      - name: PD peritonitis grounding (ISPD 2022 targets and vancomycin dosing)
        run: node test_pd_peritonitis_grounding.mjs

      # genPodcast called the model with NO opts - no receipt, no stage. Same defect as checkForUpdates,
      # but Audio is the only user-triggered call that runs on a cold-loaded SAVED talk where nothing has
      # minted a receipt, so setting RECEIPTS_REQUIRED would have returned 402 on every saved talk. It also
      # raced the background citation audit: the script could narrate a reference the audit was about to
      # drop, leaving the AUDIO more wrong than the talk.
      - name: Audio integrity (authorised, and not racing the citation audit)
        run: node test_audio_integrity.mjs

      # The entry listed TWO triple regimens for class III/IV lupus nephritis. ACR gives THREE, and the
      # missing one is low-dose cyclophosphamide PLUS belimumab - so a talk presented Euro-Lupus
      # cyclophosphamide as a standalone ALTERNATIVE to triple therapy, when it is one OF the three.
      # An omission producing a wrong FRAME: everything the entry said was true and the shape it implied
      # was wrong. Same species as the ELITE-Symphony adjacency bug.
      - name: Lupus nephritis grounding (all three triple regimens, class V, the 2024 year)
        run: node test_lupus_nephritis_grounding.mjs

      # The wordmark and the lecture title were BOTH 28px/700 Georgia with negative tracking - two
      # competing headlines, and display-poster styling on what is really a document heading. Sizes are
      # asserted as a HIERARCHY rather than as magic numbers, so the scale can be retuned freely and this
      # still catches the two headlines colliding again, or a mobile !important override undoing it.
      - name: Type scale (hierarchy holds, nothing shouts)
        run: node test_type_scale.mjs

      # "When I delete a talk it shows in the library without the drag and drop option." A published talk
      # exists TWICE in the library build - her saved row and a showcase row - and a dedupe filter
      # suppressed the twin only while the talk was in her library. Deleting removed the suppression, so
      # the talk returned as a badged, non-draggable card and read as seed content. Underneath was the
      # worse half: deleting never UNPUBLISHED, leaving a deleted talk readable on her public profile.
      - name: Delete unpublishes (no showcase twin outliving its talk)
        run: node test_delete_unpublish.mjs

      # The kebab had ten items and three were the same action twice. "Share" opened a modal containing
      # copy-link and make-private - the two rows sitting next to it - and "Print overview" called
      # exportTalkPDF, the SAME function as "Export PDF". A talk is public or private; share is not a
      # third state, and printing is implied by having the file.
      - name: Overflow menu (a privacy toggle and a link, nothing duplicated)
        run: node test_overflow_menu.mjs

      # Five review points, split three ways by Jenni's own verification. VERIFIED: CheckMate 067 at four
      # years is 59 vs 22 for TREATMENT-RELATED AEs (not "irAE rates" - different denominator), CheckMate
      # 8HW is 22 vs 14 in MSI-H/dMMR CRC. CONCEPT RIGHT / NUMBERS WITHHELD: there is no universal
      # grade-to-dose steroid grid, so the grid is gone - but the per-organ doses are NOT written in,
      # because removing a wrong grid does not license adding unread numbers. DOWNGRADED: the abatacept +
      # ruxolitinib mortality figure came from a nonrandomised before/after cohort of a whole BUNDLE.
      - name: irAE grounding (no dose grid, labelled trial figures, bundled myocarditis claim)
        run: node test_irae_grounding.mjs

      # Nephrology held NOTHING on acute interstitial nephritis - zero occurrences of "interstitial
      # nephritis", "eosinophil", "proton pump", "IFTA" or "checkpoint". Every number in an AIN card came
      # from memory. The review supplied plenty of numbers and NONE was read against a primary source, so
      # this entry is mostly RESTRICTIONS: the one safe conceptual correction (steroid benefit is
      # CONTESTED, not merely observational-but-favourable) plus each withheld figure named so it cannot
      # be quietly resupplied. The load-bearing assertions here are NEGATIVE - a percentage in this entry
      # means something went wrong.
      - name: AIN grounding (contested steroids, and every figure withheld on purpose)
        run: node test_ain_grounding.mjs

      # The ACS entry was 304 characters and said "DAPT individualized" - nothing on duration,
      # de-escalation or P2Y12 monotherapy, and zero occurrences of "monotherapy" anywhere in
      # Cardiovascular. AND THE CORPUS HOLDS ONLY ONE SOCIETY: there is no ESC document for ACS here at
      # all, so a card citing an ESC prasugrel preference was speaking for a guideline the app never gave
      # it. Guard rails only - the negatives are what matter, especially "no trial outcome is asserted".
      - name: DAPT grounding (one society, no interchangeable monotherapy, no trial outcomes)
        run: node test_dapt_grounding.mjs

      # The Slides view could be EXPORTED but never SAVED, so the artefact most likely to be reused in
      # teaching was the one you had to dig out of Downloads. The risk in adding it was DUPLICATION:
      # saveCurrentVisualToLibrary already carried cloud-vs-local-vs-save-as-new plus a rollback that
      # pulls the visual back out of memory when the write fails (without which a reload loses it - a
      # bug that shipped once). Slides use the SAME path; this asserts there is only one.
      - name: Save slides to library (one persistence path, badged separately)
        run: node test_save_slides.mjs

      # Opening from the library. Two reports, same mistake: the library said one thing and the talk view
      # said another. A Visuals-tab open jumped to the Visual tab, but that is the GENERATED IMAGE tab and
      # it hydrates only entries matching the current image provider - so a saved slide poster (mode
      # "slides") matched nothing and the tab read "No visual attached" for a talk just listed as having
      # one. And sample cards showed no drag handle: correct (no cloud row to order against) but
      # unexplained, and the missing handle shifted those titles left so a correct state looked broken.
      - name: Library open (land on the artefact you came for; say why a card cannot move)
        run: node test_library_open.mjs

      # "RASi + SGLT2i + finerenone backbone for proteinuric CKD (DAPA-CKD, EMPA-KIDNEY, FIDELIO/FIGARO)."
      # Every word true. Three drugs and three trial groups in one breath with NO mapping between them,
      # and zero occurrences of "non-diabetic" anywhere in Nephrology - so a card credited finerenone with
      # the non-diabetic evidence belonging to the SGLT2i trials. Third ADJACENCY failure of the day.
      - name: GFR / CKD backbone (each drug mapped to its own population and trials)
        run: node test_gfr_grounding.mjs

      # HOCM. The entry was one true sentence - "Disopyramide / verapamil for symptoms; mavacamten
      # (EXPLORER-HCM)" - and it produced five separate review findings. The slash made disopyramide and
      # verapamil look interchangeable, hiding that the guideline gives disopyramide only WITH an AV nodal
      # blocker (it is vagolytic and speeds AV conduction). Naming one myosin inhibitor made a class of two
      # look like a class of one after aficamten's Dec 2025 approval. And silence on SRT thresholds and on
      # myectomy-vs-ablation let the deck invent "ablation for higher-risk anatomy", which INVERTS the real
      # split - anatomy is the myectomy argument; ablation is the surgical-RISK argument.
      # One review point is asserted as a NEGATIVE: its "5.7% attributable to drug (7-10% with cofactors)"
      # did not verify. The label reports 7/123 (6%) reversible and apportions no cause.
      - name: HOCM (myosin inhibitors as a class of two, SRT criteria, the myectomy/ASA inversion)
        run: node test_hocm_grounding.mjs

      # CRRT. Not a corpus-WRONG case - a corpus-SILENT one. guidelines.json contained nothing on CRRT,
      # citrate or continuous renal replacement in any specialty, and a reviewed deck still came back
      # "accurate, guideline-concordant, board-ready". That is the model being good, not the grounding
      # working, and nothing about it was reproducible. The entry pins the numbers: 20-25 mL/kg/h
      # delivered, RENAL and ATN both flat, net UF >1.75 (observational, and labelled so), RICH in full
      # including the infection signal it is usually quoted without, the 2026 Delphi reframe of citrate in
      # liver failure, and STARRT-AKI's 90-day dependence RR of 1.74.
      - name: CRRT (dose ceiling, citrate reframe, and the numbers the deck had to invent)
        run: node test_crrt_grounding.mjs

      # Kidney transplant, second pass. The first fixed an ADJACENCY trap (ELITE-Symphony's induction was
      # daclizumab, not basiliximab). This one is STALE + SILENT: KDIGO 2009's induction recommendation was
      # stated as current practice when it predates universal tac/MMF/steroid maintenance; nothing said
      # which KDIGO document covers candidacy (2020) versus immunosuppression (2009), so a talk mixed them;
      # nothing on DGF's surrogate validity, so a deck called it the "dominant modifiable driver"; and
      # nothing separated desensitization from HLA-incompatible transplant from kidney paired donation.
      # Three of the review's numbers are asserted ABSENT - they could not be traced to primary sources.
      - name: Kidney transplant (induction era, which KDIGO, DGF, cPRA, desensitization)
        run: node test_transplant_grounding.mjs

      # Membranous nephropathy. The corpus mentioned MN exactly once - in a list of KDIGO chapters "STILL
      # 2021" - so it recorded that MN had not been updated and said nothing about MN. Cards were written
      # from memory. The load-bearing assertion is the ADJACENCY GUARD: MENTOR compared rituximab with
      # CYCLOSPORINE, while STARMEN and RI-CYCLO (the cyclophosphamide comparisons) favoured or matched
      # cyclophosphamide. Unmapped, those compose into "rituximab beats cyclophosphamide", which no trial
      # here shows - the same shape as the finerenone and daclizumab traps.
      - name: Membranous nephropathy (risk strata, and every trial mapped to its own comparator)
        run: node test_membranous_grounding.mjs

      # PE, held partly out of scope at launch freeze. The entry announced the 2026 A-E categories and then
      # taught management on the RETIRED massive/submassive axis, which reads as current and is not. The
      # 2026 full text is still unread, so reperfusion logic is REMOVED and declared removed rather than
      # guessed at. Two things were fixed instead of withheld: the reduced DOAC doses (checked against the
      # ELIQUIS and XARELTO labels - both say at least SIX months, correcting the review's "3-6"), and the
      # unsourced five-year recurrence figure, which is gone without being quoted.
      - name: PE safety (retired reperfusion axis removed; DOAC prerequisites attached)
        run: node test_pe_safety.mjs

      # BUILD_ID in index.html and build.txt drive the "Refresh for the latest version" pill. Bump one and
      # not the other and the pill either never fires or never stops. Both sat at 2026-08-18-01 across
      # several commits, so nobody was told to refresh - which is how a page loaded before a fix got tested.
      - name: Build stamp (BUILD_ID and build.txt agree)
        run: node test_build_id.mjs

      # Hypereosinophilic syndrome. Corpus-silent AND unroutable: "eosinophil" appeared nowhere in
      # Heme/Onc and no keyword matched, so HES talks were written with no guideline context at all. Both
      # halves fixed - narrow compound routes for hypereosinophil-/eosinophilia only, so eosinophilic
      # oesophagitis keeps its ACG entry and eosinophilic asthma keeps Pulmonary. Two adjacency traps are
      # pinned: mepolizumab 300 mg vs benralizumab 30 mg (both SC q4w, a ten-fold error if crossed), and
      # NATRON's FIP1L1::PDGFRA-NEGATIVE population, without which the trial result teaches a biologic for
      # the patient who should get imatinib. The review's own headline was stale: benralizumab was
      # FDA-approved for HES on 14 May 2026, not "evolving".
      - name: HES (routes at all; dose bound to drug; NATRON bound to its genotype)
        run: node test_hes_grounding.mjs

      # The author is not an audience member. Reaching your own published talk through its share link puts
      # the app in read-only shared mode, so the Visual tab was a dead end - no toggle, no Generate, just
      # "No visual attached to this talk". Correct for a visitor, useless for the person who wrote it. The
      # fix is a DOOR, not an unlock: one tap back to the library row where every control already works.
      # Unlocking generation in shared view would spend an image credit in a view with no Save button.
      - name: Author in shared view (a door back to the copy, not an unlock)
        run: node test_author_shared_view.mjs

      # Pericarditis. The symptom was "only one reference"; the cause was a CORPUS-STARVED entry - 221
      # characters, one sentence about myopericarditis - and a Cardiovascular trial list naming no
      # pericarditis trial at all. ICAP and CORP had verified PMIDs sitting in the index the whole time and
      # were simply never listed as citable, so a talk that refuses to invent citations could only produce
      # one. Distinct from corpus-wrong, corpus-silent and unroutable: the entry existed, routed fine, and
      # had nothing in it. Two adjacency traps pinned, both about EPISODE NUMBER: colchicine 3 months
      # (first) vs 6-12 (recurrence), and ICAP's first-episode figures vs RHAPSODY's colchicine-resistant
      # withdrawal population, whose 74% placebo recurrence is a fact about enrolment.
      - name: Pericarditis (starved entry refilled; trials bound to episode number)
        run: node test_pericarditis_grounding.mjs

      # The composer SUGGESTED proofread on a big paste and left the tap to the user - so pasting a review
      # and pressing send routed it to the surgical editor, the exact failure the hint existed to prevent.
      # The condition is the interesting part: length alone is not intent. A long paste CONTAINING an
      # instruction is still a command and keeps its own path; only a long paste with no explicit verb is
      # read as a document written ABOUT the talk. Get that wrong and every long additive request is hijacked.
      - name: Auto-proofread (long paste, no instruction, and the app says it chose)
        run: node test_auto_proofread.mjs

      # Seven of the physician-confirmed findings were DKA or HHS, and none was a corrupted entry - there
      # was NO hyperglycemic-crises entry at all, so the model recited the 2009 figures from memory. That is
      # where "potassium below 3.3" came from: a real threshold, retired in 2024, wrong in the direction
      # that kills. Asserts the entry routes, reaches BOTH review prompts, and states the flagged rules.
      - name: DKA / HHS grounding (the 2024 consensus reaches both prompts)
        run: node test_dka_grounding.mjs

      # Chrome throttles timers hard in a hidden tab. Observed 2026-08-11: the elapsed counter froze at 46s
      # for six minutes on a job the Worker had already finished, because both the counter and the status
      # poll had stopped. genBackgroundSafe promises the job survives - it does - but the CLIENT stopped
      # noticing. Elapsed is now derived from a timestamp and the poll wakes on visibilitychange. Also
      # guards BUILD_ID against build.txt: it sat six commits stale through the whole trial-grounding change.
      - name: Backgrounded-tab recovery + build stamp
        run: node test_launch_polish.mjs

      # cache_creation_input_tokens was read NOWHERE in worker.js or index.html while the browser path had
      # been sending cache_control since June, so every cached BYOK generation billed ZERO for the 1.25x
      # write premium against the 250 dollar cap. Enabling caching on the Worker without fixing that would
      # have widened an already-open hole. Also asserts only the STABLE SYSTEM BLOCK is marked - guideline
      # context, retrieved sources and trial abstracts change every call and must never carry it.
      - name: Prompt caching (writes are metered, only the stable prefix is cached)
        run: node test_prompt_caching.mjs

      # THE DECISIVE REGRESSION. PEITHOs primary endpoint is 2.6% tenecteplase vs 5.6% placebo; the talk
      # has stated it reversed - implying lysis increased events - in two separate evals, while the correct
      # sentence sat in our own corpus unread. This asserts the full sentence reaches BOTH the writer and
      # the reviewer prompt, against a verbatim /trials fixture. It cannot assert the model uses it
      # correctly; that is what the PE canary is for.
      - name: PEITHO orientation reaches both prompts
        run: node test_peitho_grounding.mjs

      # A specialty can name more trials than one request carries (Cardiovascular resolves 33 against a
      # cap of 12), so the list is ranked before it is cut: explicit mention, then RAG PMID intersection in
      # retrieval order, then curated order. Trial acronyms collide with ordinary English - IMPACT, HOPE,
      # DELIVER, FLOW and POINT are all real trials - so "Impact of heart failure" must not promote IMPACT.
      # Ranking may be imperfect; a trial with no returned abstract may never be named.
      - name: Trial selection (three-tier ranking, evidence-gated naming)
        run: node test_trial_selection.mjs

      # guidelines.json named trials as bare acronyms and the prompt told the model to cite them "by name
      # with their PMID/DOI URL" while nothing supplied the paper: documents has no acronym column and
      # PubMed titles carry none, so PEITHO/DAPA-HF/EMPEROR-Reduced/PROSEVA return zero rows against a
      # corpus holding all four. PEITHO came back with its arms reversed in two separate evals. A trial
      # that cannot be resolved to a verified PMID is now not named to the model at all.
      - name: Landmark trial grounding (resolved or not named)
        run: node test_landmark_grounding.mjs

      # The live check searched and every result said it had not: the Workflow's critique step dropped
      # webSearched, finalize reported draft.webSearched (structurally false — callDraft sends tools:null by
      # design), and the legacy waitUntil critique was passed no tools at all. test_live_check.mjs passed
      # throughout because it pattern-matches the client. This one EXECUTES the workflow and asserts the
      # record it writes; it fails 5/9 against the code as it stood at 5ea4dd5.
      - name: Live-check provenance survives the durable path
        run: node test_live_check_propagation.mjs

      # Three credits disappeared in minutes because Concise/Detailed looked like a display toggle and was
      # a full generation. Any control that can start one must say so and ask first.
      - name: No hidden regeneration (nothing spends a credit silently)
        run: node test_no_hidden_regeneration.mjs

      # The loading card told durable-path users to keep the tab open, which is the opposite of what that
      # path does. The flag was set only after the submit returned and never reset, so the first seconds
      # lied and a stale true could leak into a synchronous run.
      - name: Generation experience (the promise follows the path)
        run: node test_generation_experience.mjs

      # The steps described the product while the screen asked for a topic, a style and references. They
      # now mirror the controls in order, and the hints disappear once a talk has actually been delivered.
      - name: First-run onboarding (steps mirror the controls)
        run: node test_first_run_onboarding.mjs

      # The first screen a new user sees. One ambiguous email field labelled "Sign in or sign up", no
      # password, no reset, no acknowledgement that a link had been sent — and rendered from two copies of
      # the markup that had already drifted. Asserts the distinct states and that no password is stored,
      # logged or left in state.
      - name: Authentication flow (distinct states, Supabase owns credentials)
        run: node test_auth_flow.mjs

      # Every emailed auth link can come back dead — expired, reused, or opened in a browser that never
      # held the PKCE verifier. Supabase reports that in the redirect params and the SDK swallows them, so
      # the user landed on an ordinary signed-out page. An expired RESET link was worse: it still matched
      # the #recovery test and opened a set-a-new-password form with no session to save it to.
      - name: Failed sign-in / reset link recovery
        run: node test_auth_link_recovery.mjs

      # Policy is that refinement is free — it is part of the talk already paid for. All five refinement
      # operations nevertheless consumed a full talk credit, through the legacy user-scoped path that
      # writes no reservation row, so the exactly-once refund machinery could not even see the charge.
      # Observed in production: one refine took talks_used from 6 to 7.
      - name: Refinement is free (and refuses rather than charging)
        run: node test_refine_is_free.mjs

      # The composer used to clear the text, write the outcome to an unrendered S.msgs array, and look
      # exactly like a dead button on refusal or parse failure. Exercise failure, success and double-send.
      - name: Refine submit is visible and preserves failed input
        run: node test_refine_submit_feedback.mjs

      # A POST can start a job and lose its response. The browser then holds a job id and no credential, so
      # a talk it already paid for cannot authorise its own citation audit. Re-submitting the same
      # clientJobId must return the SAME job, receipt and expiry — and never a second credit or Workflow.
      - name: Lost-response recovery (idempotent re-submit)
        run: node test_lost_response_recovery.mjs

      # Mobile is a distinct interaction surface: modal drawer semantics, 44px touch targets, safe-area
      # insets, keyboard clearance, focus restoration, and reduced-motion behavior all regress without
      # changing desktop output. This executes the close transaction and guards the responsive contract.
      - name: Mobile interaction UX (drawer, touch, keyboard, accessibility)
        run: node test_mobile_ux.mjs

      # The mobile drawer scopes to lectures, sorts most-recent, and only reveals the specialty axis on
      # request. Executed in a vm rather than pattern-matched: every one of these assertions was checked by
      # deliberately breaking the behaviour it names, and all ten mutations failed the suite.
      - name: Mobile library filter (lecture scope, most-recent order, specialty disclosure)
        run: node test_library_filter.mjs

      # node --check cannot see scope, so an undeclared identifier is valid syntax until it executes.
      # ROLES was declared inside the profile-edit branch and read by a top-level function: it threw on
      # every call, a bare catch swallowed it, and profiles rendered "resident" instead of "Resident".
      # eslint no-undef parses the inline blocks properly and found it on the first run.
      - name: Inline-script scope (eslint no-undef, what node --check cannot see)
        run: node test_inline_scope.mjs

      # THE TEST SYSTEM ITSELF. Two counting failures in one day, both in the instrument: a local runner
      # built from `ls | head -18` plus `| tail -17` skipped positions 19-22 and reported "35 suites pass"
      # when there were 39, and test_refine_guard.mjs made all 15 of its checks with console.assert, which
      # prints a failure and exits 0 — it could not fail, and every runner counted it as passing. The guard
      # below catches an UNWIRED suite; this one catches a suite that runs and cannot fail.
      - name: CI wiring (counts, discovery, and every suite able to fail)
        run: node test_ci_wiring.mjs

      # THE GUARD ON THE GUARDS. Writing a suite and forgetting to wire it here has happened twice.
      # A test that never runs is worse than no test: it reads as coverage.
      - name: Every test suite on disk is wired into this workflow
        run: |
          missing=0
          for f in test_*.mjs rag/test_*.mjs; do
            [ -e "$f" ] || continue
            if ! grep -qF "node $f" .github/workflows/tests.yml; then
              echo "UNWIRED: $f is on disk but never runs in CI"
              missing=$((missing+1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "$missing suite(s) exist but do not run. Add them above, in the SAME commit."
            exit 1
          fi
          echo "all suites wired"
